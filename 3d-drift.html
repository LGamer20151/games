<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Drift</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1020,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.road{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 25%,rgba(255,255,255,.08)25% 27%,transparent 27% 38%,rgba(255,255,255,.08)38% 40%,transparent 40% 60%,rgba(255,255,255,.08)60% 62%,transparent 62% 75%,rgba(255,255,255,.08)75% 77%,transparent 77%);}.car{position:absolute;bottom:18px;width:66px;height:26px;border-radius:14px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);box-shadow:0 0 14px rgba(34,211,238,.7)}.cone{position:absolute;width:14px;height:14px;background:linear-gradient(135deg,#fbbf24,#f97316);clip-path:polygon(50% 0,100% 100%,0 100%)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>3D Drift</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span></div><div class="arena" id="arena"><div class="road"></div></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');let score=0,best=0,x=50,active=false,loop=null;function addCone(){if(!active)return;const c=document.createElement('div');c.className='cone';c.style.left=(Math.random()*70+15)+'%';c.style.top='-12%';arena.appendChild(c);const move=setInterval(()=>{if(!active){clearInterval(move);return;}const t=parseFloat(c.style.top)||-12;const nt=t+2.1;c.style.top=nt+'%';const car=document.querySelector('.car');const carRect=car.getBoundingClientRect();const cRect=c.getBoundingClientRect();if(Math.abs(carRect.left-cRect.left)<30&&Math.abs(carRect.top-cRect.top)<18){clearInterval(move);c.remove();score=Math.max(0,score-5);scoreEl.textContent=score;}if(nt>110){clearInterval(move);c.remove();score+=10;scoreEl.textContent=score;best=Math.max(best,score);bestEl.textContent=best;}} ,40)}function renderCar(){const car=document.createElement('div');car.className='car';car.style.left=x+'%';arena.appendChild(car)}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')x=Math.max(8,x-5);if(e.key==='ArrowRight')x=Math.min(86,x+5);const car=document.querySelector('.car');if(car)car.style.left=x+'%';});function start(){score=0;best=Number(bestEl.textContent)||0;scoreEl.textContent=score;active=true;arena.querySelectorAll('.cone').forEach(c=>c.remove());x=50;arena.innerHTML='<div class="road"></div>';renderCar();clearInterval(loop);loop=setInterval(addCone,800);document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
