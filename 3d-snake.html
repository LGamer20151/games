<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Snake</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1020,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.board{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;border-radius:16px;padding:8px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.cell{aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.04)}.snake{background:linear-gradient(135deg,#22d3ee,#8b5cf6)}.food{background:linear-gradient(135deg,#fbbf24,#f97316)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>3D Snake</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span></div><div class="board" id="board"></div><button class="button" id="startBtn">Start</button></div><script>const board=document.getElementById('board');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');let score=0,best=0,snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}],dir={x:1,y:0},food={x:8,y:8},active=false,loop=null;function buildBoard(){board.innerHTML='';for(let i=0;i<144;i++){const cell=document.createElement('div');cell.className='cell';board.appendChild(cell)}}function render(){[...board.children].forEach((cell,i)=>{cell.classList.remove('snake','food');const x=i%12,y=Math.floor(i/12);if(snake.some(s=>s.x===x&&s.y===y))cell.classList.add('snake');if(food.x===x&&food.y===y)cell.classList.add('food');})}function placeFood(){food={x:Math.floor(Math.random()*12),y:Math.floor(Math.random()*12)};while(snake.some(s=>s.x===food.x&&s.y===food.y)){food={x:Math.floor(Math.random()*12),y:Math.floor(Math.random()*12)}}}function step(){if(!active)return;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>11||head.y<0||head.y>11||snake.some(s=>s.x===head.x&&s.y===head.y)){active=false;clearInterval(loop);document.getElementById('startBtn').textContent='Restart';return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;best=Math.max(best,score);bestEl.textContent=best;placeFood();}else snake.pop();render()}document.addEventListener('keydown',e=>{if(!active)return;const map={'ArrowLeft':{x:-1,y:0},'ArrowRight':{x:1,y:0},'ArrowUp':{x:0,y:-1},'ArrowDown':{x:0,y:1}};const next=map[e.key];if(next){const opposite=next.x===-dir.x&&next.y===-dir.y; if(!opposite) dir=next;}});function start(){score=0;scoreEl.textContent=score;snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];dir={x:1,y:0};placeFood();active=true;buildBoard();render();clearInterval(loop);loop=setInterval(step,200);document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);buildBoard();render();</script></body></html>
