<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Snake</title>
  <style>
    body { margin:0; background:#0b1020; color:#fff; font-family:Arial,sans-serif; text-align:center; }
    a { color:#f9a8d4; }
    canvas { background:linear-gradient(#0a1224,#090d17); border-radius:12px; width:min(92vw,900px); height:auto; display:block; margin:16px auto 0; }
    #hud { margin-top:14px; font-size:20px; }
    button { margin-top:16px; padding:12px 22px; font-size:18px; background:#f9a8d4; border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>3D Snake</h1>
  <div id="hud">Score: 0</div>
  <canvas id="game" width="900" height="520"></canvas>
  <button onclick="resetGame()">Restart</button>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    let snake = [{ x: 0, y: 0, z: 0.5 }];
    let dir = { x: 1, y: 0 };
    let food = { x: 1.6, y: 0.8, z: 0.2 };
    let score = 0;
    let gameOver = false;

    function resetGame() {
      snake = [{ x: 0, y: 0, z: 0.5 }];
      dir = { x: 1, y: 0 };
      food = { x: 1.6, y: 0.8, z: 0.2 };
      score = 0;
      gameOver = false;
    }

    function randomFood() {
      food = {
        x: (Math.random() * 4 - 2),
        y: (Math.random() * 3 - 1.5),
        z: 0.2 + Math.random() * 1.2
      };
    }

    function update() {
      if (gameOver) return;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y, z: snake[0].z };
      if (Math.abs(head.x) > 2.5 || Math.abs(head.y) > 2 || Math.abs(head.z) > 1.6) gameOver = true;
      for (let i = 1; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) gameOver = true;
      }
      snake.unshift(head);
      if (Math.abs(head.x - food.x) < 0.5 && Math.abs(head.y - food.y) < 0.5 && Math.abs(head.z - food.z) < 0.5) {
        score += 5;
        hud.textContent = 'Score: ' + score;
        randomFood();
      } else {
        snake.pop();
      }
    }

    function project(x, y, z) {
      const scale = 220 / (z + 5);
      return { x: canvas.width / 2 + x * scale, y: 250 + y * scale, s: scale };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#090d17';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const foodP = project(food.x, food.y, food.z);
      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.arc(foodP.x, foodP.y, 12, 0, Math.PI * 2);
      ctx.fill();
      for (let i = 0; i < snake.length; i++) {
        const p = project(snake[i].x, snake[i].y, snake[i].z);
        ctx.fillStyle = i === 0 ? '#f9a8d4' : '#c4b5fd';
        ctx.fillRect(p.x - 10, p.y - 10, 20, 20);
      }
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
      }
    }

    function loop() {
      update();
      draw();
      setTimeout(loop, 150);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') dir = { x: 0, y: -1 };
      if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') dir = { x: 0, y: 1 };
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') dir = { x: -1, y: 0 };
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') dir = { x: 1, y: 0 };
    });

    hud.textContent = 'Score: ' + score;
    resetGame();
    loop();
  </script>
</body>
</html>
