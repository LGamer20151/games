<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skate Sprint</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(700px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #track { position:relative; height:280px; border-radius:18px; border:1px solid var(--line); background:linear-gradient(180deg, rgba(15,23,42,0.92), rgba(10,15,24,0.8)); overflow:hidden; }
    .skater { position:absolute; left:70px; bottom:30px; width:30px; height:30px; border-radius:12px; background:linear-gradient(135deg, var(--accent), #7dd3fc); }
    .cone { position:absolute; width:24px; height:24px; background:linear-gradient(135deg, #fbbf24, #f59e0b); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Skate Sprint</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
    <div id="track"></div>
    <button id="start">Start</button>
  </div>

  <script>
    const track = document.getElementById('track');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start');
    let skater, cones = [], score = 0, started = false, tickId;

    function createSkater() {
      skater = document.createElement('div');
      skater.className = 'skater';
      skater.style.left = '70px';
      skater.style.bottom = '30px';
      track.appendChild(skater);
    }

    function addCone() {
      const cone = document.createElement('div');
      cone.className = 'cone';
      cone.style.left = (track.clientWidth + 10) + 'px';
      cone.style.bottom = '30px';
      track.appendChild(cone);
      cones.push(cone);
    }

    function gameLoop() {
      if (!started) return;
      cones.forEach(cone => {
        const left = Number.parseFloat(cone.style.left) || 0;
        cone.style.left = left - 6 + 'px';
        const skaterLeft = Number.parseFloat(skater.style.left) || 0;
        if (left < skaterLeft + 30 && left + 24 > skaterLeft && Number.parseFloat(cone.style.bottom) === 30) {
          started = false; clearInterval(tickId); alert('Crashed! Score: ' + score); return;
        }
      });
      cones = cones.filter(cone => (Number.parseFloat(cone.style.left) || 0) > -30);
      score += 1; scoreEl.textContent = 'Score: ' + score;
      if (Math.random() < 0.04) addCone();
    }

    document.addEventListener('keydown', (e) => {
      if (!started) return;
      if (e.key === 'ArrowUp') {
        skater.style.bottom = '90px';
        setTimeout(() => skater.style.bottom = '30px', 200);
      }
    });

    startBtn.addEventListener('click', () => {
      track.innerHTML = '';
      createSkater();
      cones = []; score = 0; scoreEl.textContent = 'Score: 0'; statusEl.textContent = 'Running'; started = true;
      clearInterval(tickId); tickId = setInterval(gameLoop, 30);
    });
  </script>
</body>
</html>
