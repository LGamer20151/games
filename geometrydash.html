<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geometry Dash</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050816;color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.runner{position:absolute;left:12%;bottom:18px;width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}.wall{position:absolute;width:18px;height:42px;background:linear-gradient(135deg,#fbbf24,#f97316);right:5%;bottom:18px}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Geometry Dash</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');let score=0,best=0,active=false,jumping=false,runnerY=18;function createRunner(){const r=document.createElement('div');r.className='runner';r.style.bottom='18px';r.style.left='12%';arena.appendChild(r);return r}function addWall(){const w=document.createElement('div');w.className='wall';w.style.left='100%';w.style.bottom='18px';arena.appendChild(w);const move=setInterval(()=>{if(!active){clearInterval(move);return;}let x=parseFloat(w.style.left)||100;x-=2;w.style.left=x+'%';const r=document.querySelector('.runner');const rRect=r.getBoundingClientRect();const wRect=w.getBoundingClientRect();if(Math.abs(rRect.left-wRect.left)<18&&Math.abs(rRect.bottom-wRect.top)<18){score=Math.max(0,score-5);scoreEl.textContent=score;}if(x<-10){clearInterval(move);w.remove();score+=10;scoreEl.textContent=score;best=Math.max(best,score);bestEl.textContent=best;}} ,30)}document.addEventListener('keydown',e=>{if(!active)return;if(e.code==='Space'){const r=document.querySelector('.runner');if(!jumping){jumping=true;r.style.bottom='80px';setTimeout(()=>{r.style.bottom='18px';jumping=false;},500)}}});function start(){score=0;scoreEl.textContent=score;active=true;arena.innerHTML='';createRunner();clearInterval(loop);loop=setInterval(addWall,900);document.getElementById('startBtn').textContent='Running'}let loop=null;document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
