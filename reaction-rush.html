<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Rush</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(640px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #stage { position:relative; height:260px; border-radius:18px; background:linear-gradient(180deg, rgba(15,23,42,0.92), rgba(10,15,24,0.8)); border:1px solid var(--line); }
    .target { position:absolute; width:70px; height:70px; border-radius:18px; background:linear-gradient(135deg, #34d399, #10b981); display:grid; place-items:center; color:#06291f; font-size:1.5rem; font-weight:900; cursor:pointer; }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Reaction Rush</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
    <div id="stage"></div>
    <button id="start">Start</button>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start');
    let score = 0, target = null, running = false, timeoutId;

    function spawnTarget() {
      if (!running) return;
      if (target) target.remove();
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'target';
      const x = Math.random() * (stage.clientWidth - 70);
      const y = Math.random() * (stage.clientHeight - 70);
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      btn.textContent = 'GO';
      btn.addEventListener('click', () => {
        if (!running) return;
        score += 10; scoreEl.textContent = 'Score: ' + score; statusEl.textContent = 'Nice!';
        spawnTarget();
      });
      target = btn;
      stage.appendChild(btn);
      timeoutId = setTimeout(() => {
        if (running && target) {
          statusEl.textContent = 'Too slow!';
          running = false;
          alert('Round over! Final score: ' + score);
        }
      }, 1400);
    }

    startBtn.addEventListener('click', () => {
      clearTimeout(timeoutId); score = 0; running = true; scoreEl.textContent = 'Score: 0'; statusEl.textContent = 'Go!'; spawnTarget();
    });
  </script>
</body>
</html>
