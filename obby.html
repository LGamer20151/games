<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Obby</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.platform{position:absolute;height:14px;border-radius:10px;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}.player{position:absolute;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Obby</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Goal: <strong id="goal">3</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const goalEl=document.getElementById('goal');let score=0,goal=3,playerX=10,playerY=70,active=false;function createPlatforms(){arena.innerHTML='';const platforms=[{x:10,w:25,y:82},{x:42,w:22,y:66},{x:68,w:20,y:50},{x:82,w:14,y:28}];platforms.forEach(p=>{const el=document.createElement('div');el.className='platform';el.style.left=p.x+'%';el.style.width=p.w+'%';el.style.top=p.y+'%';arena.appendChild(el)});const p=document.createElement('div');p.className='player';p.style.left=playerX+'%';p.style.top=playerY+'%';arena.appendChild(p);}document.addEventListener('keydown',e=>{if(!active)return;const p=document.querySelector('.player');let x=parseFloat(p.style.left),y=parseFloat(p.style.top);if(e.key==='ArrowLeft')x=Math.max(0,x-5);if(e.key==='ArrowRight')x=Math.min(92,x+5);if(e.key==='ArrowUp')y=Math.max(0,y-9);if(e.key==='ArrowDown')y=Math.min(82,y+9);p.style.left=x+'%';p.style.top=y+'%';const goals=[{x:82,y:20},{x:10,y:82},{x:42,y:62},{x:68,y:46}];for(const g of goals){if(Math.abs(x-g.x)<4&&Math.abs(y-g.y)<4){score++;scoreEl.textContent=score;if(score>=goal){active=false;document.getElementById('startBtn').textContent='Play Again';}}}});function start(){score=0;scoreEl.textContent=score;goalEl.textContent=goal;playerX=10;playerY=70;active=true;createPlatforms();document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);createPlatforms();</script></body></html>
