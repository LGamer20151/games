<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Obby</title>
  <style>
    body { background:#1e1e2e; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    canvas { background:#11111b; border-radius:8px; display:block; margin:0 auto; }
    a { color:#89b4fa; display:inline-block; margin-top:14px; }
    #info { font-size:20px; margin-top:10px; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Obby</h1>
  <canvas id="game" width="600" height="400"></canvas>
  <div id="info">Reach the green flag!</div>
  <p>A or Left / D or Right: move. W, Up, or Space: jump.</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');

const W = canvas.width, H = canvas.height;
const GRAVITY = 0.5, MOVE = 3, JUMP = -10;

// Platforms: x, y, width, height. The last one holds the goal flag.
const platforms = [
  { x: 0, y: 340, w: 150, h: 60 },
  { x: 190, y: 290, w: 100, h: 20 },
  { x: 330, y: 240, w: 100, h: 20 },
  { x: 470, y: 190, w: 100, h: 20 },
  { x: 620, y: 240, w: 100, h: 20 },
  { x: 770, y: 290, w: 100, h: 20 },
  { x: 920, y: 230, w: 120, h: 20 },
  { x: 1080, y: 170, w: 120, h: 20 },
  { x: 1240, y: 120, w: 160, h: 20 }
];
const goal = { x: 1340, y: 60, w: 10, h: 60 };
const startX = 40, startY = 280;

const keys = {};
let player, won;

function reset() {
  player = { x: startX, y: startY, w: 20, h: 20, vx: 0, vy: 0, onGround: false };
  won = false;
}
reset();

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  if (won) return;

  player.vx = 0;
  if (keys['a'] || keys['arrowleft']) player.vx = -MOVE;
  if (keys['d'] || keys['arrowright']) player.vx = MOVE;
  if ((keys['w'] || keys['arrowup'] || keys[' ']) && player.onGround) {
    player.vy = JUMP;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // Land on platforms only when falling from above
  player.onGround = false;
  for (const p of platforms) {
    const prevBottom = player.y - player.vy + player.h;
    if (overlap(player, p) && player.vy >= 0 && prevBottom <= p.y + 2) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }

  // Keep inside the level horizontally
  if (player.x < 0) player.x = 0;

  // Fell off the course
  if (player.y > H) {
    reset();
    info.textContent = 'You fell! Try again.';
  }

  if (overlap(player, goal)) {
    won = true;
    info.textContent = 'You win! Refresh the page to play again.';
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Camera follows the player
  const camX = Math.max(0, Math.min(player.x - W / 2, 1400 - W));
  ctx.save();
  ctx.translate(-camX, 0);

  ctx.fillStyle = '#89b4fa';
  for (const p of platforms) ctx.fillRect(p.x, p.y, p.w, p.h);

  ctx.fillStyle = '#a6e3a1';
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

  ctx.fillStyle = '#f38ba8';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.restore();
}

window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (['a','d','w','s','arrowleft','arrowright','arrowup','arrowdown',' '].includes(key)) {
    keys[key] = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
