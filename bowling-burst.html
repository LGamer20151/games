<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bowling Burst</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(660px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #lane { position:relative; height:260px; border-radius:18px; border:1px solid var(--line); background:linear-gradient(180deg, rgba(15,23,42,0.92), rgba(10,15,24,0.8)); }
    .pin { position:absolute; width:20px; height:20px; border-radius:50%; background:linear-gradient(135deg, #fbbf24, #f59e0b); }
    .ball { position:absolute; width:36px; height:36px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff, #a78bfa); left:10px; bottom:30px; }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Bowling Burst</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
    <div id="lane"></div>
    <button id="roll">Roll</button>
  </div>

  <script>
    const lane = document.getElementById('lane');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const rollBtn = document.getElementById('roll');
    const ball = document.createElement('div');
    ball.className = 'ball';
    lane.appendChild(ball);
    let score = 0, pins = [];

    function buildPins() {
      lane.querySelectorAll('.pin').forEach(p => p.remove());
      pins = [];
      const positions = [[120, 60], [150, 80], [90, 80], [180, 100], [60, 100], [120, 100], [210, 120], [30, 120], [120, 120]];
      positions.forEach(([x, y]) => {
        const pin = document.createElement('div');
        pin.className = 'pin';
        pin.style.left = x + 'px';
        pin.style.top = y + 'px';
        lane.appendChild(pin);
        pins.push(pin);
      });
    }

    function rollBall() {
      statusEl.textContent = 'Rolling';
      let pos = 10;
      const iv = setInterval(() => {
        pos += 8;
        ball.style.left = pos + 'px';
        pins.forEach(pin => {
          const px = Number.parseFloat(pin.style.left) || 0;
          if (pos > px && pos < px + 20) {
            pin.remove();
            score += 5; scoreEl.textContent = 'Score: ' + score;
            statusEl.textContent = 'Strike!';
          }
        });
        if (pos > lane.clientWidth - 40) {
          clearInterval(iv);
          statusEl.textContent = 'Done';
        }
      }, 30);
    }

    rollBtn.addEventListener('click', () => {
      ball.style.left = '10px';
      buildPins();
      rollBall();
    });

    buildPins();
  </script>
</body>
</html>
