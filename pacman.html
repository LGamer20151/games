<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man Style Maze</title>
  <style>
    body { background:#0d0e12; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    a { color:#89b4fa; }
    #info { font-size:20px; margin:14px 0; min-height:28px; }
    canvas { background:#000; border-radius:8px; max-width:100%; }
    #reset { margin-top:16px; padding:12px 26px; font-size:18px; border:none; border-radius:8px; background:#89b4fa; color:#0d0e12; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Pac-Man Style Maze</h1>
  <div id="info">Score: 0 | Lives: 3</div>
  <canvas id="game" width="420" height="460"></canvas>
  <br>
  <button id="reset">New Game</button>
<script>
const T = 20;
// 1 = wall, 0 = dot, 2 = power pellet, 3 = empty path, 4 = ghost house gate
const MAP = [
  "111111111111111111111",
  "100000000010000000001",
  "120111110010011111021",
  "100000000000000000001",
  "101110101111110101101",
  "100000100010001000001",
  "111110111010101110111",
  "000010100000000010000",
  "111110101111111010111",
  "000000100000000010000",
  "111110101111111010111",
  "000010100000000010000",
  "111110101111111010111",
  "100000000010000000001",
  "101110111010111011101",
  "120010000000000010021",
  "111010101111101010111",
  "100000100010001000001",
  "101111111010111111101",
  "100000000000000000001",
  "111111111111111111111"
];
const COLS = 21, ROWS = 21;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');

let grid, pac, ghosts, dir, nextDir, score, lives, dotsLeft, power, powerTimer, over, won, tick;

function reset() {
  grid = MAP.map(row => row.split('').map(ch => {
    if (ch === '0') return 0;
    if (ch === '2') return 2;
    if (ch === '1') return 1;
    return 3;
  }));
  dotsLeft = 0;
  for (const row of grid) for (const v of row) if (v === 0 || v === 2) dotsLeft++;
  pac = { c: 10, r: 15, x: 10, y: 15 };
  dir = { c: 0, r: 0 };
  nextDir = { c: 0, r: 0 };
  ghosts = [
    { c: 9, r: 9, color: '#f38ba8', dir: { c: 1, r: 0 } },
    { c: 10, r: 9, color: '#89dceb', dir: { c: -1, r: 0 } },
    { c: 11, r: 9, color: '#fab387', dir: { c: 0, r: 1 } }
  ];
  score = 0;
  lives = 3;
  power = 0;
  over = false;
  won = false;
  tick = 0;
  updateInfo();
}

function updateInfo() {
  if (over) return;
  info.textContent = 'Score: ' + score + ' | Lives: ' + lives + ' | Dots left: ' + dotsLeft;
}

function isWall(c, r) {
  if (r < 0 || r >= ROWS) return true;
  if (c < 0) c = COLS - 1;
  if (c >= COLS) c = 0;
  return grid[r][c] === 1;
}

function canMove(c, r, d) {
  return !isWall(c + d.c, r + d.r);
}

function wrap(c) {
  if (c < 0) return COLS - 1;
  if (c >= COLS) return 0;
  return c;
}

function movePac() {
  // Try the queued direction first when we are on a tile center
  if (canMove(pac.c, pac.r, nextDir)) dir = nextDir;
  if (!canMove(pac.c, pac.r, dir)) return;
  pac.c = wrap(pac.c + dir.c);
  pac.r = pac.r + dir.r;
  const v = grid[pac.r][pac.c];
  if (v === 0) { grid[pac.r][pac.c] = 3; score += 10; dotsLeft--; }
  else if (v === 2) { grid[pac.r][pac.c] = 3; score += 50; dotsLeft--; power = 200; }
  if (dotsLeft === 0) { over = true; won = true; info.textContent = 'You cleared the maze! Score: ' + score; }
}

function moveGhosts() {
  for (const g of ghosts) {
    const options = [
      { c: 1, r: 0 }, { c: -1, r: 0 }, { c: 0, r: 1 }, { c: 0, r: -1 }
    ].filter(d => !(d.c === -g.dir.c && d.r === -g.dir.r) && canMove(g.c, g.r, d));
    if (options.length === 0) {
      g.dir = { c: -g.dir.c, r: -g.dir.r };
    } else {
      // Ghosts head toward Pac-Man half the time, otherwise wander
      if (Math.random() < 0.5) {
        options.sort((a, b) => {
          const da = Math.abs(g.c + a.c - pac.c) + Math.abs(g.r + a.r - pac.r);
          const db = Math.abs(g.c + b.c - pac.c) + Math.abs(g.r + b.r - pac.r);
          return da - db;
        });
        g.dir = power > 0 ? options[options.length - 1] : options[0];
      } else {
        g.dir = options[Math.floor(Math.random() * options.length)];
      }
    }
    g.c = wrap(g.c + g.dir.c);
    g.r = g.r + g.dir.r;
  }
}

function checkCollisions() {
  for (const g of ghosts) {
    if (g.c === pac.c && g.r === pac.r) {
      if (power > 0) {
        score += 200;
        g.c = 10; g.r = 9;
      } else {
        lives--;
        if (lives <= 0) {
          over = true;
          info.textContent = 'Game over! Score: ' + score;
          return;
        }
        pac = { c: 10, r: 15 };
        dir = { c: 0, r: 0 };
        nextDir = { c: 0, r: 0 };
        ghosts.forEach((gh, i) => { gh.c = 9 + i; gh.r = 9; });
      }
    }
  }
}

function drawGrid() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const v = grid[r][c];
    const x = c * T, y = r * T;
    if (v === 1) {
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(x + 1, y + 1, T - 2, T - 2);
    } else if (v === 0) {
      ctx.fillStyle = '#f9e2af';
      ctx.beginPath();
      ctx.arc(x + T / 2, y + T / 2, 2.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (v === 2) {
      ctx.fillStyle = '#f9e2af';
      ctx.beginPath();
      ctx.arc(x + T / 2, y + T / 2, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPac() {
  const x = pac.c * T + T / 2, y = pac.r * T + T / 2;
  const mouth = Math.abs(Math.sin(tick * 0.2)) * 0.4;
  let angle = 0;
  if (dir.c === 1) angle = 0;
  else if (dir.c === -1) angle = Math.PI;
  else if (dir.r === -1) angle = -Math.PI / 2;
  else if (dir.r === 1) angle = Math.PI / 2;
  ctx.fillStyle = '#f9e2af';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.arc(x, y, T / 2 - 2, angle + mouth, angle + Math.PI * 2 - mouth);
  ctx.closePath();
  ctx.fill();
}

function drawGhost(g) {
  const x = g.c * T, y = g.r * T;
  ctx.fillStyle = power > 0 ? '#3b82f6' : g.color;
  ctx.beginPath();
  ctx.arc(x + T / 2, y + T / 2, T / 2 - 2, Math.PI, 0);
  ctx.lineTo(x + T - 2, y + T - 2);
  ctx.lineTo(x + 2, y + T - 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + 5, y + 6, 4, 4);
  ctx.fillRect(x + 11, y + 6, 4, 4);
}

function draw() {
  drawGrid();
  drawPac();
  ghosts.forEach(drawGhost);
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(won ? 'You Win!' : 'Game Over', canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'left';
  }
}

function step() {
  if (!over) {
    tick++;
    movePac();
    if (!over) {
      moveGhosts();
      checkCollisions();
    }
    if (power > 0) power--;
    updateInfo();
  }
  draw();
}

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: { c: 0, r: -1 }, KeyW: { c: 0, r: -1 },
    ArrowDown: { c: 0, r: 1 }, KeyS: { c: 0, r: 1 },
    ArrowLeft: { c: -1, r: 0 }, KeyA: { c: -1, r: 0 },
    ArrowRight: { c: 1, r: 0 }, KeyD: { c: 1, r: 0 }
  };
  if (map[e.code]) {
    e.preventDefault();
    nextDir = map[e.code];
  }
});
document.getElementById('reset').addEventListener('click', reset);

reset();
setInterval(step, 150);
</script>
</body>
</html>
