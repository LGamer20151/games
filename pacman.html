<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pac-Man</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.maze{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.cell{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.05)}.pac{background:linear-gradient(135deg,#fbbf24,#f59e0b)}.dot{background:linear-gradient(135deg,#ecfeff,#93c5fd)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Pac-Man</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span></div><div class="maze" id="maze"></div><button class="button" id="startBtn">Start</button></div><script>const maze=document.getElementById('maze');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');let score=0,best=0,x=1,y=1;function render(){maze.innerHTML='';for(let i=0;i<64;i++){const cell=document.createElement('div');cell.className='cell';if(i%8===0||i%8===7||Math.floor(i/8)===0||Math.floor(i/8)===7){cell.style.background='rgba(148,163,184,.22)';}else if((x===i%8&&y===Math.floor(i/8)))cell.classList.add('pac');else if((i%8+y)%3===0)cell.classList.add('dot');maze.appendChild(cell)}}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')x=Math.max(1,x-1);if(e.key==='ArrowRight')x=Math.min(6,x+1);if(e.key==='ArrowUp')y=Math.max(1,y-1);if(e.key==='ArrowDown')y=Math.min(6,y+1);score++;scoreEl.textContent=score;best=Math.max(best,score);bestEl.textContent=best;render();});document.getElementById('startBtn').addEventListener('click',()=>{score=0;scoreEl.textContent=score;render();});render();</script></body></html>
