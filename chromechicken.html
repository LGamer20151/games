<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Chicken</title>
  <style>
    body { background:#0d0e12; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    a { color:#89b4fa; }
    #info { font-size:20px; margin:14px 0; min-height:28px; }
    canvas { background:#f7f7f7; border-radius:8px; max-width:100%; }
    #reset { margin-top:16px; padding:12px 26px; font-size:18px; border:none; border-radius:8px; background:#89b4fa; color:#0d0e12; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Chrome Chicken</h1>
  <div id="info"></div>
  <canvas id="game" width="800" height="300"></canvas>
  <br>
  <button id="reset">Restart</button>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
const W = 800, H = 300, GROUND = 250, GRAV = 0.7, JUMP = -13;

let chicken, obstacles, speed, score, best, over, frame, nextSpawn, keyDown;

function reset() {
  chicken = { x: 70, y: GROUND, vy: 0, w: 34, h: 36, duck: false };
  obstacles = [];
  speed = 6;
  score = 0;
  over = false;
  frame = 0;
  nextSpawn = 80;
  best = Number(localStorage.getItem('chromeChickenBest') || 0);
}

function jump() {
  if (over) { reset(); return; }
  if (chicken.y >= GROUND) chicken.vy = JUMP;
}

function spawn() {
  // Mix small cacti and tall cacti
  const tall = Math.random() < 0.4;
  const h = tall ? 50 : 30;
  obstacles.push({ x: W + 20, y: GROUND + 36 - h, w: tall ? 22 : 18, h: h });
  nextSpawn = frame + 60 + Math.random() * 70 - speed * 3;
}

function update() {
  if (over) return;
  frame++;
  speed = Math.min(16, 6 + frame / 600);
  score = Math.floor(frame / 5);

  chicken.vy += GRAV;
  if (keyDown.fast && chicken.y < GROUND) chicken.vy += 1.2;
  chicken.y += chicken.vy;
  if (chicken.y >= GROUND) { chicken.y = GROUND; chicken.vy = 0; }

  if (frame >= nextSpawn) spawn();
  for (const o of obstacles) o.x -= speed;
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  const cx = chicken.x + 4, cy = chicken.y - 4;
  const cw = chicken.w - 8, ch = chicken.h - 6;
  for (const o of obstacles) {
    if (cx < o.x + o.w && cx + cw > o.x && cy + ch > GROUND + 36 - o.h + 4 && cy < GROUND + 36) {
      over = true;
      if (score > best) {
        best = score;
        localStorage.setItem('chromeChickenBest', best);
      }
      break;
    }
  }
}

function drawChicken() {
  const x = chicken.x, y = chicken.y;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x + 16, y - 16, 14, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f5b041';
  ctx.beginPath(); ctx.moveTo(x + 28, y - 18); ctx.lineTo(x + 36, y - 15); ctx.lineTo(x + 28, y - 12); ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.arc(x + 20, y - 26, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(x + 24, y - 19, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f5b041';
  const legOffset = over ? 0 : (Math.floor(frame / 6) % 2) * 4;
  ctx.fillRect(x + 12, y - 4, 3, 6 + legOffset);
  ctx.fillRect(x + 20, y - 4, 3, 10 - legOffset);
}

function drawCactus(o) {
  ctx.fillStyle = '#2e7d32';
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.fillRect(o.x - 6, o.y + o.h * 0.4, 6, 8);
  ctx.fillRect(o.x + o.w, o.y + o.h * 0.25, 6, 8);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f7f7f7';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#535353';
  ctx.fillRect(0, GROUND + 36, W, 2);

  drawChicken();
  obstacles.forEach(drawCactus);

  ctx.fillStyle = '#535353';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('HI ' + String(best).padStart(5, '0') + '   ' + String(score).padStart(5, '0'), W - 16, 30);
  ctx.textAlign = 'left';

  if (over) {
    ctx.fillStyle = '#535353';
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
    ctx.font = '18px Arial';
    ctx.fillText('Press Space or Restart to play again', W / 2, H / 2 + 20);
    ctx.textAlign = 'left';
  }
  info.textContent = over ? 'Run over' : 'Press Space to jump | Score: ' + score;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

keyDown = { fast: false };
document.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
    e.preventDefault();
    if (!e.repeat) jump();
  }
  if (['ArrowDown', 'KeyS'].includes(e.code)) {
    e.preventDefault();
    keyDown.fast = true;
  }
});
document.addEventListener('keyup', e => {
  if (['ArrowDown', 'KeyS'].includes(e.code)) keyDown.fast = false;
});
document.getElementById('reset').addEventListener('click', reset);

reset();
loop();
</script>
</body>
</html>
