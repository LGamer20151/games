<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chrome Chicken</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#101827,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.chicken{position:absolute;left:12%;bottom:18px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b)}.obstacle{position:absolute;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#f97316,#ef4444)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Chrome Chicken</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Time: <strong id="time">15</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const timeEl=document.getElementById('time');let active=false,score=0,time=15,chickenX=12,loop=null;function addObstacle(){const o=document.createElement('div');o.className='obstacle';o.style.left='100%';o.style.top=(Math.random()*60+12)+'%';arena.appendChild(o);const move=setInterval(()=>{if(!active){clearInterval(move);return;}const x=parseFloat(o.style.left)||100;const next=x-1.8;o.style.left=next+'%';const c=document.querySelector('.chicken');const cRect=c.getBoundingClientRect();const oRect=o.getBoundingClientRect();if(Math.abs(cRect.left-oRect.left)<25&&Math.abs(cRect.top-oRect.top)<22){clearInterval(move);o.remove();score=Math.max(0,score-5);scoreEl.textContent=score;}if(next<-10){clearInterval(move);o.remove();score+=10;scoreEl.textContent=score;}} ,30)}document.addEventListener('keydown',e=>{if(!active)return;if(e.key==='ArrowUp')chickenX=Math.max(8,chickenX-4);if(e.key==='ArrowDown')chickenX=Math.min(82,chickenX+4);const c=document.querySelector('.chicken');if(c)c.style.left=chickenX+'%';});function start(){score=0;time=15;scoreEl.textContent=score;timeEl.textContent=time;active=true;arena.innerHTML='';const c=document.createElement('div');c.className='chicken';c.style.left='12%';c.style.bottom='18px';arena.appendChild(c);chickenX=12;clearInterval(loop);loop=setInterval(()=>{if(!active)return;time--;timeEl.textContent=time;if(time<=0){active=false;clearInterval(loop);document.getElementById('startBtn').textContent='Restart';}},1000);setInterval(addObstacle,700)}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
