<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chess</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.board{display:grid;grid-template-columns:repeat(8,1fr);margin-top:12px;border-radius:14px;overflow:hidden}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:28px}.light{background:rgba(148,163,184,.18)}.dark{background:rgba(15,23,42,.9)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Chess</h2><a href="index.html">← Home</a></div><div class="board" id="board"></div><button class="button" id="startBtn">Start</button></div><script>const board=document.getElementById('board');const pieces=['♙','♟','♖','♜','♘','♞','♗','♝','♕','♛','♔','♚'];function render(){board.innerHTML='';for(let i=0;i<64;i++){const cell=document.createElement('div');cell.className=(i%2===0?'light':'dark')+' cell';const rank=Math.floor(i/8),file=i%8;if((rank+file)%2===0)cell.classList.add('light');else cell.classList.add('dark');if(rank===1)cell.textContent='♙';if(rank===6)cell.textContent='♟';if(rank===0&&(file===0||file===7))cell.textContent='♖';if(rank===0&&(file===1||file===6))cell.textContent='♘';if(rank===0&&(file===2||file===5))cell.textContent='♗';if(rank===0&&(file===3))cell.textContent='♕';if(rank===0&&(file===4))cell.textContent='♔';if(rank===7&&(file===0||file===7))cell.textContent='♜';if(rank===7&&(file===1||file===6))cell.textContent='♞';if(rank===7&&(file===2||file===5))cell.textContent='♝';if(rank===7&&(file===3))cell.textContent='♛';if(rank===7&&(file===4))cell.textContent='♚';board.appendChild(cell)}}render();document.getElementById('startBtn').addEventListener('click',render);</script></body></html>
