<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 Merge</title>
  <style>
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif;
      background:linear-gradient(180deg,#08111b,#101827); color:#e5f3ff;
    }
    .game {
      width:min(90vw,420px); background:rgba(15,23,42,0.9); border:1px solid rgba(148,163,184,0.2);
      border-radius:18px; padding:20px; box-shadow:0 20px 40px rgba(0,0,0,0.35);
    }
    .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    h1 { margin:0; font-size:28px; }
    .score-box {
      background:rgba(30,41,59,0.8); border:1px solid rgba(148,163,184,0.2); border-radius:12px;
      padding:8px 12px; text-align:center; min-width:100px;
    }
    .score-box .label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#cbd5e1; }
    .score-box .value { font-size:22px; font-weight:bold; }
    .board {
      display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; background:rgba(15, 118, 110, 0.18);
      padding:10px; border-radius:14px; border:1px solid rgba(148,163,184,0.12);
    }
    .tile {
      aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:12px;
      font-weight:bold; font-size:clamp(20px, 4vw, 32px); background:#1f2937; color:#e2e8f0;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .empty { opacity:0.5; }
    .controls { display:flex; gap:10px; margin-top:16px; }
    button {
      flex:1; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-size:15px;
      background:linear-gradient(135deg,#22d3ee,#8b5cf6); color:white; padding:11px 10px;
    }
    a { color:#a5f3fc; text-decoration:none; }
  </style>
</head>
<body>
  <div class="game">
    <div class="top">
      <h1>2048 Merge</h1>
      <div class="score-box">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="controls">
      <button id="newgame">New Game</button>
      <button id="menu"><a href="index.html">Menu</a></button>
    </div>
  </div>

  <script>
    const size = 4;
    let board = [];
    let score = 0;

    function emptyBoard() {
      return Array.from({ length: size }, () => Array(size).fill(0));
    }

    function getEmptyCells() {
      const cells = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) cells.push({ r, c });
        }
      }
      return cells;
    }

    function addRandomTile() {
      const empty = getEmptyCells();
      if (!empty.length) return;
      const cell = empty[Math.floor(Math.random() * empty.length)];
      board[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function resetGame() {
      board = emptyBoard();
      score = 0;
      addRandomTile();
      addRandomTile();
      render();
      updateScore();
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    function render() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const tile = document.createElement('div');
          const value = board[r][c];
          tile.className = 'tile' + (value ? '' : ' empty');
          tile.textContent = value || '';
          if (value) {
            const colors = {
              2: '#a5f3fc', 4: '#67e8f9', 8: '#7dd3fc', 16: '#93c5fd', 32: '#c4b5fd',
              64: '#ddd6fe', 128: '#f9a8d4', 256: '#fca5a5', 512: '#fcd34d', 1024: '#fbbf24', 2048: '#fef08a'
            };
            tile.style.background = colors[value] || '#fef3c7';
            tile.style.color = value <= 4 ? '#0f172a' : '#fff';
          }
          boardEl.appendChild(tile);
        }
      }
    }

    function slideLine(line) {
      const filtered = line.filter(v => v !== 0);
      const merged = [];
      for (let i = 0; i < filtered.length; i++) {
        if (filtered[i] === filtered[i + 1]) {
          const mergedValue = filtered[i] * 2;
          merged.push(mergedValue);
          score += mergedValue;
          i++;
        } else {
          merged.push(filtered[i]);
        }
      }
      while (merged.length < size) merged.push(0);
      return merged;
    }

    function move(dir) {
      const oldBoard = JSON.stringify(board);
      const newBoard = emptyBoard();

      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < size; r++) {
          const row = [...board[r]];
          const line = dir === 'left' ? row : row.slice().reverse();
          const shifted = slideLine(line);
          newBoard[r] = dir === 'left' ? shifted : shifted.slice().reverse();
        }
      } else {
        for (let c = 0; c < size; c++) {
          const column = [];
          for (let r = 0; r < size; r++) column.push(board[r][c]);
          const line = dir === 'up' ? column : column.slice().reverse();
          const shifted = slideLine(line);
          const finalLine = dir === 'up' ? shifted : shifted.slice().reverse();
          for (let r = 0; r < size; r++) newBoard[r][c] = finalLine[r];
        }
      }

      board = newBoard;
      if (JSON.stringify(board) !== oldBoard) {
        addRandomTile();
        render();
        updateScore();
      }
    }

    document.addEventListener('keydown', event => {
      const arrowMap = {
        ArrowLeft: 'left',
        ArrowRight: 'right',
        ArrowUp: 'up',
        ArrowDown: 'down'
      };
      const dir = arrowMap[event.key];
      if (dir) {
        event.preventDefault();
        move(dir);
      }
    });

    document.getElementById('newgame').addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
