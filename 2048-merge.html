<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2048 Merge</title>
  <style>
    :root {
      --bg-1: #040b17;
      --bg-2: #101b2e;
      --panel: rgba(13, 20, 33, 0.78);
      --line: rgba(148, 163, 184, 0.18);
      --text: #edf5ff;
      --muted: #b7c8df;
      --gold: #f8d98d;
      --tile-0: rgba(82, 95, 116, 0.72);
      --shadow: rgba(2, 6, 23, 0.58);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 18px 40px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(34,211,238,0.15), transparent 17%),
        radial-gradient(circle at 85% 12%, rgba(167,139,250,0.18), transparent 22%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }
    .game-shell {
      width: min(100%, 560px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 48px var(--shadow);
      backdrop-filter: blur(12px);
      padding: 22px 18px 20px;
    }
    a {
      display: inline-block;
      margin-bottom: 10px;
      color: #a7d8ff;
      text-decoration: none;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.1rem, 4vw, 3rem);
      letter-spacing: -0.06em;
      line-height: 1.05;
      text-shadow: 0 0 22px rgba(125, 211, 252, 0.3);
    }
    #info {
      min-height: 34px;
      margin: 12px 0 16px;
      font-size: clamp(1.08rem, 2vw, 1.45rem);
      font-weight: 700;
      color: var(--gold);
    }
    #board {
      display: grid;
      grid-template-columns: repeat(4, minmax(72px, 1fr));
      gap: 12px;
      justify-content: center;
      margin: 0 auto;
      padding: 12px;
      border-radius: 20px;
      background: rgba(19, 28, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.12);
      box-shadow: inset 0 0 22px rgba(34, 211, 238, 0.04);
    }
    .tile {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      font-weight: 800;
      background: var(--tile-0);
      color: #e8f1ff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 16px rgba(2, 6, 23, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .empty { opacity: 0.62; }
    button {
      margin-top: 18px;
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      font-size: 1.06rem;
      font-weight: 800;
      background: linear-gradient(135deg, #8ec5ff, #dfeeff);
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 12px 18px rgba(142, 197, 255, 0.24);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <a href="index.html">&larr; Back to menu</a>
    <h1>2048 Merge</h1>
    <div id="info"></div>
    <div id="board"></div>
    <button id="btn">New Game</button>
  </div>

  <script>
    const symbols=['A','B','C','D','E','F','G','H'];
    const board=document.getElementById('board'),info=document.getElementById('info');
    let cards,open,lock,moves,matches,timeLeft,timer,over;
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function start(){
      clearInterval(timer);
      const deck=shuffle([...symbols,...symbols]);
      cards=deck.map((s,i)=>({s,id:i,el:null,state:'hidden'}));
      board.innerHTML='';
      cards.forEach(card=>{
        const d=document.createElement('div');
        d.className='tile';
        d.addEventListener('click',()=>flip(card));
        card.el=d;board.appendChild(d);
      });
      open=[];lock=false;moves=0;matches=0;timeLeft=60;over=false;
      timer=setInterval(()=>{
        if(over)return;
        timeLeft--;
        if(timeLeft<=0){timeLeft=0;over=true;clearInterval(timer);render();}
        render();
      },1000);
      render();
    }
    function flip(card){
      if(over||lock||card.state!=='hidden')return;
      card.state='open';open.push(card);
      if(open.length===2){
        moves++;lock=true;
        const [a,b]=open;
        if(a.s===b.s){
          a.state=b.state='done';matches++;open=[];lock=false;
          if(matches===8){over=true;clearInterval(timer);}
        }else{
          setTimeout(()=>{
            a.state=b.state='hidden';open=[];lock=false;render();
          },700);
        }
      }
      render();
    }
    function render(){
      for(const card of cards){
        card.el.className='tile'+(card.state==='open'?' open':card.state==='done'?' done':'');
        card.el.textContent=card.state==='hidden'?'?':card.s;
        if(card.state === 'open') {
          card.el.style.background = 'linear-gradient(135deg, #e1f3ff, #f6fbff)';
          card.el.style.color = '#0f172a';
          card.el.style.boxShadow = '0 0 0 2px rgba(142,197,255,0.28), 0 16px 24px rgba(2,6,23,0.18)';
        } else if(card.state === 'done') {
          card.el.style.background = 'linear-gradient(135deg, #7fe7b2, #9ae6b4)';
          card.el.style.color = '#0f172a';
          card.el.style.boxShadow = '0 0 0 2px rgba(127,231,178,0.25), 0 16px 24px rgba(27,88,64,0.16)';
        } else {
          card.el.style.background = 'linear-gradient(180deg, rgba(75,84,101,0.96), rgba(52,62,77,0.96))';
          card.el.style.color = '#edf5ff';
          card.el.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 16px rgba(2,6,23,0.18)';
        }
      }
      if(matches===8)info.textContent='You won in '+moves+' moves with '+timeLeft+' seconds left!';
      else if(timeLeft===0)info.textContent='Time is up! Matches: '+matches+' of 8';
      else info.textContent='Time: '+timeLeft+'s | Moves: '+moves+' | Pairs: '+matches+'/8';
    }
    document.getElementById('btn').onclick=start;
    start();
  </script>
</body>
</html>
