<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Match</title>
  <style>
    :root {
      --bg-1: #070d1a;
      --bg-2: #101b2f;
      --panel: rgba(14, 20, 32, 0.78);
      --line: rgba(148, 163, 184, 0.14);
      --text: #edf5ff;
      --muted: #a9bad8;
      --card: rgba(75, 84, 101, 0.95);
      --card-hover: rgba(95, 106, 129, 0.98);
      --open: #f4f8ff;
      --done: #7fe7b2;
      --accent: #8ec5ff;
      --gold: #f8d98d;
      --shadow: rgba(2, 6, 23, 0.56);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 20px 40px;
      background:
        radial-gradient(circle at 15% 15%, rgba(34, 211, 238, 0.12), transparent 16%),
        radial-gradient(circle at 85% 10%, rgba(167, 139, 250, 0.14), transparent 22%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .game-shell {
      width: min(100%, 540px);
      background: rgba(12, 17, 28, 0.72);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 18px 38px var(--shadow);
      padding: 22px 20px 18px;
      backdrop-filter: blur(10px);
    }

    a {
      display: inline-block;
      margin-bottom: 10px;
      color: #8ec5ff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
    }

    a:hover { opacity: 0.9; }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.2rem, 4vw, 3.3rem);
      letter-spacing: -0.06em;
      line-height: 1.05;
      text-shadow: 0 0 22px rgba(125, 211, 252, 0.18);
    }

    #info {
      min-height: 34px;
      margin: 12px 0 16px;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 700;
      color: var(--gold);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(4, minmax(72px, 100px));
      gap: 12px;
      justify-content: center;
      margin: 0 auto;
      padding: 12px;
      border-radius: 20px;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .card {
      width: min(18vw, 100px);
      height: min(18vw, 100px);
      max-width: 100px;
      max-height: 100px;
      border: none;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 800;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      user-select: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 18px rgba(2,6,23,0.2);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover:not(.open):not(.done) {
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .card.open {
      background: var(--open);
      color: #0d0e12;
      box-shadow: 0 0 0 2px rgba(142, 197, 255, 0.2), 0 14px 22px rgba(2,6,23,0.25);
    }

    .card.done {
      background: var(--done);
      color: #0d0e12;
      cursor: default;
      box-shadow: 0 0 0 2px rgba(127, 231, 178, 0.25), 0 14px 22px rgba(27, 88, 64, 0.2);
    }

    button {
      margin-top: 20px;
      padding: 14px 26px;
      border: none;
      border-radius: 12px;
      font-size: 1.08rem;
      font-weight: 800;
      background: linear-gradient(135deg, #8ec5ff, #c4d9ff);
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 12px 18px rgba(142, 197, 255, 0.25);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <a href="index.html">&larr; Back to menu</a>
    <h1>Memory Match</h1>
    <div id="info"></div>
    <div id="board"></div>
    <button id="btn">New Game</button>
  </div>

<script>
const symbols=['A','B','C','D','E','F','G','H'];
const board=document.getElementById('board'),info=document.getElementById('info');
let cards,open,lock,moves,matches,timeLeft,timer,over;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  clearInterval(timer);
  const deck=shuffle([...symbols,...symbols]);
  cards=deck.map((s,i)=>({s,id:i,el:null,state:'hidden'}));
  board.innerHTML='';
  cards.forEach(card=>{
    const d=document.createElement('div');
    d.className='card';
    d.addEventListener('click',()=>flip(card));
    card.el=d;board.appendChild(d);
  });
  open=[];lock=false;moves=0;matches=0;timeLeft=60;over=false;
  timer=setInterval(()=>{
    if(over)return;
    timeLeft--;
    if(timeLeft<=0){timeLeft=0;over=true;clearInterval(timer);render();}
    render();
  },1000);
  render();
}
function flip(card){
  if(over||lock||card.state!=='hidden')return;
  card.state='open';open.push(card);
  if(open.length===2){
    moves++;lock=true;
    const [a,b]=open;
    if(a.s===b.s){
      a.state=b.state='done';matches++;open=[];lock=false;
      if(matches===8){over=true;clearInterval(timer);}
    }else{
      setTimeout(()=>{
        a.state=b.state='hidden';open=[];lock=false;render();
      },700);
    }
  }
  render();
}
function render(){
  for(const card of cards){
    card.el.className='card'+(card.state==='open'?' open':card.state==='done'?' done':'');
    card.el.textContent=card.state==='hidden'?'?':card.s;
  }
  if(matches===8)info.textContent='You won in '+moves+' moves with '+timeLeft+' seconds left!';
  else if(timeLeft===0)info.textContent='Time is up! Matches: '+matches+' of 8';
  else info.textContent='Time: '+timeLeft+'s | Moves: '+moves+' | Pairs: '+matches+'/8';
}
document.getElementById('btn').onclick=start;
start();
</script></body></html>
