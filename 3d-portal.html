<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Portal</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.portal{position:absolute;width:36px;height:64px;border-radius:18px;border:4px solid #fbbf24;left:50%;top:30%;transform:translate(-50%,-50%)}.dot{position:absolute;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#34d399,#22d3ee)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>3D Portal</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Goal: <strong id="goal">3</strong></span></div><div class="arena" id="arena"><div class="portal" id="portal"></div></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const goalEl=document.getElementById('goal');let score=0,goal=3,active=false;function makeDot(){const d=document.createElement('div');d.className='dot';d.style.left=(Math.random()*80+10)+'%';d.style.top=(Math.random()*70+10)+'%';arena.appendChild(d);d.addEventListener('click',()=>{if(active){score++;scoreEl.textContent=score;if(score>=goal){active=false;document.getElementById('startBtn').textContent='Play Again';}makeDot();d.remove();}})}function start(){score=0;goal=3;scoreEl.textContent=score;goalEl.textContent=goal;arena.querySelectorAll('.dot').forEach(d=>d.remove());active=true;for(let i=0;i<3;i++)makeDot();document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
