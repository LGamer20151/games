<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Simon Says</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.pad{padding:50px 10px;border:none;border-radius:18px;color:#fff;font-weight:bold;font-size:24px;cursor:pointer;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Simon Says</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Round: <strong id="round">1</strong></span></div><div class="pads" id="pads"><button class="pad">1</button><button class="pad">2</button><button class="pad">3</button><button class="pad">4</button></div><button class="button" id="startBtn">Start</button></div><script>const scoreEl=document.getElementById('score');const roundEl=document.getElementById('round');const pads=[...document.querySelectorAll('.pad')];let sequence=[],player=0,score=0,round=1;function playSequence(){pads.forEach((pad,i)=>{setTimeout(()=>{pad.style.opacity='0.6';setTimeout(()=>pad.style.opacity='1',220);},i*300)})}function nextRound(){sequence.push(Math.floor(Math.random()*4));player=0;round++;roundEl.textContent=round;playSequence();}pads.forEach((pad,index)=>{pad.addEventListener('click',()=>{if(index===sequence[player]){player++;if(player===sequence.length){score+=10;scoreEl.textContent=score;nextRound();}}else{score=Math.max(0,score-5);scoreEl.textContent=score;sequence=[];player=0;}})})document.getElementById('startBtn').addEventListener('click',()=>{score=0;round=1;scoreEl.textContent=score;roundEl.textContent=round;sequence=[];player=0;nextRound();});</script></body></html>
