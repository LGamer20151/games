<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Minesweeper</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.cell{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-weight:bold;cursor:pointer}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Minesweeper</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Mine: <strong id="mine">10</strong></span></div><div class="board" id="board"></div><button class="button" id="startBtn">Start</button></div><script>const board=document.getElementById('board');const scoreEl=document.getElementById('score');const mineEl=document.getElementById('mine');let grid=[],score=0;function seed(){grid=Array.from({length:8},()=>Array(8).fill(0));for(let i=0;i<10;i++){const x=Math.floor(Math.random()*8),y=Math.floor(Math.random()*8);grid[x][y]='M';}for(let x=0;x<8;x++)for(let y=0;y<8;y++){if(grid[x][y]==='M')continue;let count=0;for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<8&&ny>=0&&ny<8&&grid[nx][ny]==='M')count++;}grid[x][y]=count;}render()}function render(){board.innerHTML='';for(let x=0;x<8;x++)for(let y=0;y<8;y++){const cell=document.createElement('button');cell.className='cell';cell.dataset.x=x;cell.dataset.y=y;if(grid[x][y]==='M'){cell.textContent='💣';cell.style.background='rgba(239,68,68,.6)'}else if(grid[x][y]>0){cell.textContent=grid[x][y];cell.style.color='#e2e8f0'}cell.onclick=()=>{if(grid[x][y]==='M'){score=Math.max(0,score-5);scoreEl.textContent=score;cell.style.background='rgba(239,68,68,.9)'}else{score+=10;scoreEl.textContent=score;cell.style.background='rgba(52,211,153,.25)'}};board.appendChild(cell)}}document.getElementById('startBtn').addEventListener('click',()=>{score=0;scoreEl.textContent=score;seed();});seed();</script></body></html>
