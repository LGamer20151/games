<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <style>
    body { background:#0d0e12; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    a { color:#89b4fa; }
    #info { font-size:20px; margin:14px 0; min-height:28px; }
    #board { display:inline-grid; gap:2px; background:#1f2027; padding:4px; border-radius:8px; user-select:none; }
    .cell { width:30px; height:30px; background:#3a3c48; border-radius:4px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:16px; cursor:pointer; }
    .cell.open { background:#23242d; cursor:default; }
    .cell.mine { background:#f38ba8; }
    .n1 { color:#89b4fa; } .n2 { color:#a6e3a1; } .n3 { color:#f38ba8; }
    .n4 { color:#cba6f7; } .n5 { color:#fab387; } .n6 { color:#94e2d5; }
    .n7 { color:#f9e2af; } .n8 { color:#fff; }
    #controls { margin-top:14px; }
    select, button { padding:10px 18px; font-size:16px; border:none; border-radius:8px; background:#89b4fa; color:#0d0e12; font-weight:bold; cursor:pointer; margin:0 4px; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Minesweeper</h1>
  <div id="info">Mines left: 0</div>
  <div id="board"></div>
  <div id="controls">
    <select id="level">
      <option value="easy">Easy (8x8, 10 mines)</option>
      <option value="medium">Medium (10x10, 15 mines)</option>
      <option value="hard">Hard (12x12, 25 mines)</option>
    </select>
    <button id="restart">New Game</button>
  </div>
<script>
const LEVELS = {
  easy:   { size: 8,  mines: 10 },
  medium: { size: 10, mines: 15 },
  hard:   { size: 12, mines: 25 }
};
const boardEl = document.getElementById('board');
const info = document.getElementById('info');
const levelSel = document.getElementById('level');

let size, mineCount, grid, over, won, flagsUsed, openCount;

function newGame() {
  const cfg = LEVELS[levelSel.value];
  size = cfg.size;
  mineCount = cfg.mines;
  over = false;
  won = false;
  flagsUsed = 0;
  openCount = 0;
  grid = [];
  for (let r = 0; r < size; r++) {
    grid.push([]);
    for (let c = 0; c < size; c++) {
      grid[r].push({ mine: false, open: false, flag: false, count: 0 });
    }
  }
  // Place mines randomly
  let placed = 0;
  while (placed < mineCount) {
    const r = Math.floor(Math.random() * size);
    const c = Math.floor(Math.random() * size);
    if (!grid[r][c].mine) {
      grid[r][c].mine = true;
      placed++;
    }
  }
  // Count neighbouring mines for each cell
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    grid[r][c].count = neighbours(r, c).filter(([nr, nc]) => grid[nr][nc].mine).length;
  }
  render();
}

function neighbours(r, c) {
  const out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < size && nc >= 0 && nc < size) out.push([nr, nc]);
  }
  return out;
}

// Opens a cell, and if it has no nearby mines, opens its neighbours too
function reveal(r, c) {
  const cell = grid[r][c];
  if (cell.open || cell.flag) return;
  cell.open = true;
  openCount++;
  if (cell.count === 0 && !cell.mine) {
    for (const [nr, nc] of neighbours(r, c)) reveal(nr, nc);
  }
}

function checkWin() {
  const safe = size * size - mineCount;
  if (openCount === safe) {
    over = true;
    won = true;
    info.textContent = 'You cleared the field! Well done.';
    revealAll();
  }
}

function revealAll() {
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    if (grid[r][c].mine) grid[r][c].open = true;
  }
  render();
}

function onLeft(r, c) {
  if (over) return;
  const cell = grid[r][c];
  if (cell.open || cell.flag) return;
  if (cell.mine) {
    cell.exploded = true;
    over = true;
    info.textContent = 'Boom! You hit a mine.';
    revealAll();
    return;
  }
  reveal(r, c);
  render();
  checkWin();
}

function onRight(r, c) {
  if (over) return;
  const cell = grid[r][c];
  if (cell.open) return;
  if (!cell.flag && flagsUsed >= mineCount) return;
  cell.flag = !cell.flag;
  flagsUsed += cell.flag ? 1 : -1;
  render();
}

function render() {
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = 'repeat(' + size + ', 30px)';
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    const cell = grid[r][c];
    const el = document.createElement('div');
    el.className = 'cell';
    if (cell.open) {
      el.classList.add('open');
      if (cell.mine) {
        el.textContent = '*';
        el.classList.add('mine');
      } else if (cell.count > 0) {
        el.textContent = cell.count;
        el.classList.add('n' + cell.count);
      }
    } else if (cell.flag) {
      el.textContent = 'F';
      el.style.color = '#f9e2af';
    }
    el.addEventListener('click', () => onLeft(r, c));
    el.addEventListener('contextmenu', e => { e.preventDefault(); onRight(r, c); });
    boardEl.appendChild(el);
  }
  if (!over) info.textContent = 'Mines left: ' + (mineCount - flagsUsed);
}

document.getElementById('restart').addEventListener('click', newGame);
levelSel.addEventListener('change', newGame);
newGame();
</script>
</body>
</html>
