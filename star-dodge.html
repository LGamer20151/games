<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Dodge</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(680px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #board { position:relative; height:300px; border-radius:18px; border:1px solid var(--line); background:linear-gradient(180deg, rgba(15,23,42,0.92), rgba(10,15,24,0.8)); overflow:hidden; }
    .ship, .asteroid { position:absolute; border-radius:50%; }
    .ship { width:26px; height:26px; background:linear-gradient(135deg, var(--accent), #7dd3fc); }
    .asteroid { width:18px; height:18px; background:linear-gradient(135deg, #fbbf24, #f97316); }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Star Dodge</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
    <div id="board"></div>
    <button id="start">Start</button>
  </div>

  <script>
    const board = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start');
    let ship, asteroids = [], score = 0, started = false, tickId, spawnId;

    function setShip(x) {
      ship = { x, y: board.clientHeight - 30, el: document.createElement('div') };
      ship.el.className = 'ship';
      ship.el.style.left = x + 'px';
      ship.el.style.top = ship.y + 'px';
      board.appendChild(ship.el);
    }

    function addAsteroid() {
      const a = { x: Math.random() * (board.clientWidth - 18), y: -20, el: document.createElement('div') };
      a.el.className = 'asteroid';
      a.el.style.left = a.x + 'px';
      a.el.style.top = a.y + 'px';
      board.appendChild(a.el);
      asteroids.push(a);
    }

    function moveShip(dir) {
      if (!started) return;
      ship.x += dir * 24;
      ship.x = Math.min(Math.max(ship.x, 0), board.clientWidth - 26);
      ship.el.style.left = ship.x + 'px';
    }

    function gameLoop() {
      if (!started) return;
      asteroids.forEach(a => {
        a.y += 4;
        a.el.style.top = a.y + 'px';
        if (a.x + 18 > ship.x && a.x < ship.x + 26 && a.y + 18 > ship.y && a.y < ship.y + 26) {
          started = false;
          clearInterval(tickId); clearInterval(spawnId); statusEl.textContent = 'Crash!';
          alert('Game over! Score: ' + score);
        }
      });
      score += 1; scoreEl.textContent = 'Score: ' + score;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') moveShip(-1);
      if (e.key === 'ArrowRight') moveShip(1);
    });

    startBtn.addEventListener('click', () => {
      board.innerHTML = '';
      setShip((board.clientWidth - 26) / 2);
      asteroids = [];
      score = 0; scoreEl.textContent = 'Score: 0'; statusEl.textContent = 'Playing';
      started = true;
      clearInterval(tickId); clearInterval(spawnId);
      tickId = setInterval(gameLoop, 35);
      spawnId = setInterval(addAsteroid, 700);
    });
  </script>
</body>
</html>
