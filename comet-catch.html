<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comet Catch</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(700px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #sky { position:relative; height:330px; border-radius:18px; background:linear-gradient(180deg, rgba(15,23,42,0.92), rgba(10,15,24,0.8)); border:1px solid var(--line); overflow:hidden; }
    .comet { position:absolute; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle, #fef3c7, #f59e0b 60%); cursor:pointer; }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Comet Catch</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="timer">Time: 20</span></div>
    <div id="sky"></div>
    <button id="start">Start</button>
  </div>

  <script>
    const sky = document.getElementById('sky');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const startBtn = document.getElementById('start');
    let score = 0, timeLeft = 20, started = false, comets = [], timerId;

    function createComet() {
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'comet';
      const x = Math.random() * (sky.clientWidth - 18);
      c.style.left = x + 'px';
      c.style.top = '-18px';
      c.onclick = () => {
        if (!started) return;
        score += 10; scoreEl.textContent = 'Score: ' + score; c.remove();
        comets = comets.filter(item => item !== c);
      };
      sky.appendChild(c);
      comets.push(c);
    }

    function updateComets() {
      if (!started) return;
      comets.forEach(c => {
        const y = Number.parseFloat(c.style.top) || 0;
        c.style.top = y + 4 + 'px';
        if (y > sky.clientHeight) {
          c.remove();
        }
      });
      comets = comets.filter(c => c.isConnected);
      if (Math.random() < 0.12) createComet();
    }

    function startGame() {
      score = 0; timeLeft = 20; started = true; sky.innerHTML = ''; scoreEl.textContent = 'Score: 0'; timerEl.textContent = 'Time: 20';
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (!started) return;
        timeLeft -= 1;
        timerEl.textContent = 'Time: ' + timeLeft;
        if (timeLeft <= 0) {
          started = false; clearInterval(timerId); alert('Time up! Final score: ' + score);
        }
      }, 1000);
      setInterval(updateComets, 32);
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
