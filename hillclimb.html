<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hill Climb</title>
  <style>
    body { background:#0d0e12; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    a { color:#89b4fa; }
    #info { font-size:20px; margin:14px 0; min-height:28px; }
    canvas { background:#87ceeb; border-radius:8px; max-width:100%; }
    #reset { margin-top:16px; padding:12px 26px; font-size:18px; border:none; border-radius:8px; background:#89b4fa; color:#0d0e12; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Hill Climb</h1>
  <div id="info"></div>
  <canvas id="game" width="800" height="400"></canvas>
  <br>
  <button id="reset">Restart</button>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
const W = 800, H = 400, CAR_SX = 200;
const keys = {};
let x, y, vx, vy, ang, av, fuel, over, reason;

// Bumpy terrain built from overlapping sine waves
function groundY(wx) {
  return 260 - 50 * Math.sin(wx * 0.008) - 25 * Math.sin(wx * 0.027) - 10 * Math.sin(wx * 0.09);
}

function reset() {
  x = 100;
  y = groundY(x);
  vx = 0; vy = 0; ang = 0; av = 0;
  fuel = 100;
  over = false;
  reason = '';
}

function distance() {
  return Math.max(0, Math.floor((x - 100) / 10));
}

function endRun(msg) {
  over = true;
  reason = msg;
  const best = Math.max(distance(), Number(localStorage.getItem('hillclimbBest') || 0));
  localStorage.setItem('hillclimbBest', best);
}

function update() {
  if (over) return;
  const g = groundY(x);
  const slope = (groundY(x + 6) - groundY(x - 6)) / 12;
  const gas = keys.ArrowRight || keys.KeyD;
  const brake = keys.ArrowLeft || keys.KeyA;
  const grounded = y >= g - 0.5;

  if (grounded) {
    y = g; vy = 0; av = 0;
    if (gas && fuel > 0) { vx += 0.09; fuel -= 0.06; }
    if (brake) vx -= 0.12;
    vx -= slope * 0.5;   // uphill slows you down
    vx *= 0.985;
    ang += (Math.atan(slope) - ang) * 0.25;
    if (fuel <= 0 && Math.abs(vx) < 0.05) endRun('Out of fuel!');
  } else {
    vy += 0.35;
    y += vy;
    if (keys.ArrowUp || keys.KeyW) av += 0.004;   // tilt forward
    if (keys.ArrowDown || keys.KeyS) av -= 0.004; // tilt back
    ang += av;
    av *= 0.98;
    if (y >= groundY(x)) {
      // Landing: crash if the car lands far from its wheels-down angle
      const target = Math.atan((groundY(x + 6) - groundY(x - 6)) / 12);
      const d = Math.abs(((ang - target + Math.PI) % (2 * Math.PI)) - Math.PI);
      y = groundY(x);
      if (d > 1.2) endRun('Crashed on landing!');
    }
  }

  x += vx;
  if (y < 0) y = 0;
}

function drawTerrain(cx) {
  ctx.fillStyle = '#5b8c3a';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 4) {
    ctx.lineTo(sx, groundY(sx + cx));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawCar() {
  ctx.save();
  ctx.translate(CAR_SX, y - 10);
  ctx.rotate(ang);
  ctx.fillStyle = '#f38ba8';
  ctx.fillRect(-26, -12, 52, 16);
  ctx.fillStyle = '#eba0ac';
  ctx.fillRect(-12, -24, 24, 12);
  ctx.fillStyle = '#1c1d24';
  ctx.beginPath(); ctx.arc(-16, 10, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(16, 10, 10, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  const cx = x - CAR_SX;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(0, 0, W, H);
  drawTerrain(cx);
  drawCar();

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '20px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('Distance: ' + distance() + ' m', 16, 30);
  ctx.textAlign = 'right';
  ctx.fillText('Best: ' + localStorage.getItem('hillclimbBest') || 0, W - 16, 30);

  // Fuel bar
  ctx.fillStyle = '#1c1d24';
  ctx.fillRect(16, 44, 160, 14);
  ctx.fillStyle = fuel > 25 ? '#a6e3a1' : '#f38ba8';
  ctx.fillRect(16, 44, 160 * Math.max(0, fuel) / 100, 14);

  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px Arial';
    ctx.fillText(reason, W / 2, H / 2 - 10);
    ctx.font = '20px Arial';
    ctx.fillText('Distance: ' + distance() + ' m. Press R or Restart to try again.', W / 2, H / 2 + 26);
  }
  info.textContent = over ? 'Run over' : 'Hold Right to go, Left to brake';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

const controls = ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'];
document.addEventListener('keydown', e => {
  if (controls.includes(e.code)) { e.preventDefault(); keys[e.code] = true; }
  if (e.code === 'KeyR') reset();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
document.getElementById('reset').addEventListener('click', reset);

reset();
loop();
</script>
</body>
</html>
