<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Orbit</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#050816,#020617);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:320px;overflow:hidden;border-radius:16px;background:radial-gradient(circle,#101827,#050816);border:1px solid rgba(148,163,184,.2)}.planet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 0 16px rgba(251,191,36,.8)}.orbit{position:absolute;width:120px;height:120px;border:2px solid rgba(34,211,238,.6);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.ship{position:absolute;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#8b5cf6);box-shadow:0 0 12px rgba(34,211,238,.7)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>3D Orbit</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Time: <strong id="time">20</strong></span></div><div class="arena" id="arena"><div class="planet"></div><div class="orbit"></div></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const timeEl=document.getElementById('time');let score=0,time=20,active=false,ship=null,loop=null;function spawnShip(){if(ship)ship.remove();ship=document.createElement('div');ship.className='ship';const angle=Math.random()*Math.PI*2;const x=50+Math.cos(angle)*28;const y=50+Math.sin(angle)*28;ship.style.left=x+'%';ship.style.top=y+'%';arena.appendChild(ship);ship.onclick=()=>{if(active){score+=10;scoreEl.textContent=score;spawnShip();}}}function tick(){if(!active)return;time--;timeEl.textContent=time;if(time<=0){active=false;clearInterval(loop);document.getElementById('startBtn').textContent='Play Again';}}function start(){score=0;time=20;scoreEl.textContent=score;timeEl.textContent=time;active=true;spawnShip();clearInterval(loop);loop=setInterval(tick,1000);document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
