<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Orbit</title>
  <style>
    body { margin:0; background:#0a1019; color:#fff; font-family:Arial,sans-serif; text-align:center; }
    a { color:#bca0ff; }
    canvas { background:radial-gradient(circle at center, #171b32, #070b13 60%); border-radius:12px; width:min(92vw,900px); height:auto; display:block; margin:16px auto 0; }
    #hud { margin-top:14px; font-size:20px; }
    button { margin-top:16px; padding:12px 22px; font-size:18px; background:#bca0ff; border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>3D Orbit</h1>
  <div id="hud">Score: 0</div>
  <canvas id="game" width="900" height="520"></canvas>
  <button onclick="resetGame()">Restart</button>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    let ship = { x: 0, y: 0 };
    let orbs = [];
    let score = 0;
    let gameOver = false;

    function resetGame() {
      ship = { x: 0, y: 0 };
      orbs = [];
      score = 0;
      gameOver = false;
      for (let i = 0; i < 18; i++) {
        orbs.push({ angle: Math.random() * Math.PI * 2, orbit: 1 + i * 0.18, speed: 0.7 + Math.random() * 0.8, radius: 12 + Math.random() * 12 });
      }
    }

    function update(dt) {
      if (gameOver) return;
      score += dt * 35;
      hud.textContent = 'Score: ' + Math.floor(score);
      for (const orb of orbs) orb.angle += orb.speed * dt;
      for (const orb of orbs) {
        const dx = Math.cos(orb.angle) * orb.orbit;
        const dy = Math.sin(orb.angle) * orb.orbit;
        if (Math.abs(dx - ship.x) < 0.6 && Math.abs(dy - ship.y) < 0.6) gameOver = true;
      }
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#060d18';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.arc(canvas.width/2, canvas.height/2 + 20, 150, 0, Math.PI * 2);
      ctx.stroke();
      for (const orb of orbs) {
        const x = canvas.width/2 + Math.cos(orb.angle) * (orb.orbit * 120);
        const y = canvas.height/2 + 20 + Math.sin(orb.angle) * (orb.orbit * 80);
        ctx.fillStyle = '#9bc6ff';
        ctx.beginPath();
        ctx.arc(x, y, orb.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      const shipX = canvas.width/2 + ship.x * 120;
      const shipY = canvas.height/2 + 20 + ship.y * 80;
      ctx.fillStyle = '#f5d0fe';
      ctx.fillRect(shipX - 14, shipY - 14, 28, 28);
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 34px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Orbit Lost!', canvas.width/2, canvas.height/2);
      }
    }

    function loop(ts) {
      if (!loop.last) loop.last = ts;
      const dt = Math.min((ts - loop.last) / 1000, 0.03);
      loop.last = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') ship.x -= 0.18;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') ship.x += 0.18;
      if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') ship.y -= 0.18;
      if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') ship.y += 0.18;
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
