<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasure Hunt</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(650px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
    .tile { aspect-ratio:1; border:none; border-radius:16px; background:linear-gradient(180deg, rgba(75,84,101,0.96), rgba(52,62,77,0.96)); color:white; font-weight:900; cursor:pointer; }
    .found { background:linear-gradient(135deg, #fbbf24, #f59e0b); color:#251700; }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Treasure Hunt</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="status">Search</span></div>
    <div id="grid"></div>
    <button id="reset">New Hunt</button>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');
    const size = 16;
    let treasureIndex = 0, score = 0;

    function placeTreasure() {
      treasureIndex = Math.floor(Math.random() * size);
      grid.innerHTML = '';
      for (let i = 0; i < size; i++) {
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        tile.textContent = '?';
        tile.onclick = () => {
          if (i === treasureIndex) {
            tile.classList.add('found');
            tile.textContent = '💎';
            score += 20; scoreEl.textContent = 'Score: ' + score; statusEl.textContent = 'Found it!';
          } else {
            tile.textContent = 'X';
            statusEl.textContent = 'Miss';
          }
        };
        grid.appendChild(tile);
      }
    }

    resetBtn.addEventListener('click', placeTreasure);
    placeTreasure();
  </script>
</body>
</html>
