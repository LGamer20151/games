<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arua</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.player{position:absolute;left:50%;bottom:16px;width:50px;height:18px;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}.orb{position:absolute;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Arua</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Rounds: <strong id="round">1</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const roundEl=document.getElementById('round');let score=0,round=1,playerX=50,active=false,loop=null;function makeOrb(){const o=document.createElement('div');o.className='orb';o.style.left=(Math.random()*84+8)+'%';o.style.top='-8%';arena.appendChild(o);const move=setInterval(()=>{if(!active){clearInterval(move);return;}const top=parseFloat(o.style.top)||-8;const next=top+2.5;o.style.top=next+'%';const p=document.querySelector('.player');const pRect=p.getBoundingClientRect();const oRect=o.getBoundingClientRect();if(Math.abs(pRect.left-oRect.left)<36&&Math.abs(pRect.top-oRect.top)<20){clearInterval(move);o.remove();score+=10;scoreEl.textContent=score;round++;roundEl.textContent=round;}} ,40)}document.addEventListener('keydown',e=>{if(!active)return;if(e.key==='ArrowLeft')playerX=Math.max(10,playerX-6);if(e.key==='ArrowRight')playerX=Math.min(90,playerX+6);const p=document.querySelector('.player');if(p)p.style.left=playerX+'%';});function start(){score=0;round=1;scoreEl.textContent=score;roundEl.textContent=round;active=true;arena.innerHTML='';const p=document.createElement('div');p.className='player';p.style.left='50%';arena.appendChild(p);playerX=50;clearInterval(loop);loop=setInterval(makeOrb,800);document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
