<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arua</title>
  <style>
    body { background:#1e1e2e; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    canvas { background:#11111b; border-radius:8px; display:block; margin:0 auto; cursor:pointer; }
    a { color:#89b4fa; display:inline-block; margin-top:14px; }
    #score { font-size:22px; margin-top:10px; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Arua</h1>
  <canvas id="game" width="600" height="500"></canvas>
  <div id="score">Arua: 0</div>
  <p>Bounce the brain off the two kiwis to collect Arua. Space or click restarts after a game over.</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const W = canvas.width, H = canvas.height;
const KIWI_R = 220;     // size of each kiwi
const KIWI_Y = H - 120; // height of both kiwi centers (raise or lower this)
const BRAIN_R = 14;
const GRAVITY = 0.25;

// Both kiwis sit at the same height, centered on the left and right edges
const kiwis = [
  { x: 0, y: KIWI_Y, r: KIWI_R },
  { x: W, y: KIWI_Y, r: KIWI_R }
];

let brain, arua, gameOver, contact;

function reset() {
  // Small ball (brain) starts on the left side, middle height
  brain = { x: BRAIN_R, y: H / 2, vx: 1, vy: 0, r: BRAIN_R };
  arua = 0;
  gameOver = false;
  contact = [false, false];
  scoreEl.textContent = 'Arua: 0';
}

function update() {
  if (gameOver) return;

  brain.vy += GRAVITY;
  brain.x += brain.vx;
  brain.y += brain.vy;

  // Bounce off the side walls and the ceiling
  if (brain.x < brain.r) { brain.x = brain.r; brain.vx = Math.abs(brain.vx); }
  if (brain.x > W - brain.r) { brain.x = W - brain.r; brain.vx = -Math.abs(brain.vx); }
  if (brain.y < brain.r) { brain.y = brain.r; brain.vy = Math.abs(brain.vy); }

  // Bounce off each kiwi
  for (let i = 0; i < kiwis.length; i++) {
    const k = kiwis[i];
    const dx = brain.x - k.x, dy = brain.y - k.y;
    const d = Math.hypot(dx, dy);
    const minDist = k.r + brain.r;

    if (d < minDist) {
      if (!contact[i]) {
        contact[i] = true;
        arua += 1;
        scoreEl.textContent = 'Arua: ' + arua;
      }

      const nx = dx / d, ny = dy / d;
      brain.x = k.x + nx * minDist;
      brain.y = k.y + ny * minDist;

      const dot = brain.vx * nx + brain.vy * ny;
      if (dot < 0) {
        brain.vx -= 1.8 * dot * nx;
        brain.vy -= 1.8 * dot * ny;
      }
    } else {
      contact[i] = false;
    }
  }

  // Fell through the bottom of the screen
  if (brain.y > H + brain.r) {
    gameOver = true;
  }
}

function drawKiwi(k) {
  ctx.save();
  // Only draw the part of the kiwi inside the canvas
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();

  // Brown skin
  ctx.fillStyle = '#6d3a4a';
  ctx.beginPath();
  ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2);
  ctx.fill();

  // Green flesh
  ctx.fillStyle = '#9be564';
  ctx.beginPath();
  ctx.arc(k.x, k.y, k.r - 14, 0, Math.PI * 2);
  ctx.fill();

  // Pale center star
  ctx.strokeStyle = '#f5ffd6';
  ctx.lineWidth = 9;
  for (let a = 0; a < 8; a++) {
    const ang = (a * Math.PI) / 4;
    ctx.beginPath();
    ctx.moveTo(k.x, k.y);
    ctx.lineTo(k.x + Math.cos(ang) * (k.r - 40), k.y + Math.sin(ang) * (k.r - 40));
    ctx.stroke();
  }

  // Seeds around the edge
  ctx.fillStyle = '#1e1e2e';
  for (let a = 0; a < 16; a++) {
    const ang = (a * Math.PI) / 8;
    const rad = k.r * 0.75;
    ctx.beginPath();
    ctx.ellipse(k.x + Math.cos(ang) * rad, k.y + Math.sin(ang) * rad, 6, 12, ang, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBrain(b) {
  ctx.fillStyle = '#f5a9c8';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#c95a8a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(b.x - 4, b.y - 2, 4, 0, Math.PI * 2);
  ctx.moveTo(b.x + 3, b.y - 4);
  ctx.arc(b.x + 3, b.y - 2, 4, 0, Math.PI * 2);
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (const k of kiwis) drawKiwi(k);
  drawBrain(brain);

  if (gameOver) {
    ctx.fillStyle = 'rgba(17,17,27,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', W / 2, H / 2 - 20);
    ctx.font = '22px Arial';
    ctx.fillText('You collected ' + arua + ' Arua', W / 2, H / 2 + 15);
    ctx.font = '16px Arial';
    ctx.fillText('Press Space or click to play again', W / 2, H / 2 + 50);
  }
}

window.addEventListener('keydown', e => {
  if (e.key === ' ') {
    e.preventDefault();
    if (gameOver) reset();
  }
});
canvas.addEventListener('click', () => {
  if (gameOver) reset();
});

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
