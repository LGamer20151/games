<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Ragdoll Sim</title>
<style>body{background:#0d0e12;color:#fff;font-family:Arial,sans-serif;text-align:center;margin:0;padding:20px}a{color:#89b4fa}canvas{background:#111;border-radius:8px;max-width:100%;cursor:grab;touch-action:none}#info{color:#a1a1aa;font-size:15px;margin:10px 0}button{margin-top:12px;padding:10px 22px;font-size:16px;border:none;border-radius:8px;background:#89b4fa;color:#0d0e12;font-weight:bold;cursor:pointer}</style></head><body>
<a href="index.html">&larr; Back to menu</a><h1>Ragdoll Sim</h1><div id="info">Drag the ragdoll and release to throw it. Press R to reset.</div>
<canvas id="c" width="640" height="420"></canvas><br><button id="btn">Reset</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=640,H=420,G=0.5,FRIC=0.99,BOUNCE=0.4,ITER=6;
let pts,links,grabbed=null,mouse={x:0,y:0,px:0,py:0};
function reset(){
  const cx=W/2,cy=120;
  // joints: 0 head,1 neck,2 chest,3 hip,4 lHand,5 rHand,6 lFoot,7 rFoot
  const pos=[[cx,cy-40],[cx,cy-25],[cx,cy],[cx,cy+30],[cx-28,cy+8],[cx+28,cy+8],[cx-14,cy+60],[cx+14,cy+60]];
  pts=pos.map(([px,py])=>({x:px,y:py,ox:px,oy:py}));
  links=[[0,1,25],[1,2,25],[2,3,30],[2,4,30],[2,5,30],[3,6,32],[3,7,32]];
  // stiffness of body link to keep it from folding into itself
}
function step(){
  for(const p of pts){
    if(p===grabbed)continue;
    const vx=(p.x-p.ox)*FRIC, vy=(p.y-p.oy)*FRIC;
    p.ox=p.x;p.oy=p.y;
    p.x+=vx;p.y+=vy+G;
  }
  if(grabbed){grabbed.x=mouse.x;grabbed.y=mouse.y;grabbed.ox=mouse.px;grabbed.oy=mouse.py;}
  for(let it=0;it<ITER;it++){
    for(const [a,b,len] of links){
      const pa=pts[a],pb=pts[b];
      const dx=pb.x-pa.x,dy=pb.y-pa.y;
      const d=Math.hypot(dx,dy)||0.0001;
      const diff=(d-len)/d;
      const wa=pa===grabbed?0:0.5,wb=pb===grabbed?0:0.5;
      if(pa!==grabbed){pa.x+=dx*diff*wa;pa.y+=dy*diff*wa;}
      if(pb!==grabbed){pb.x-=dx*diff*wb;pb.y-=dy*diff*wb;}
    }
    for(const p of pts){
      if(p.x<8){p.x=8;}
      if(p.x>W-8){p.x=W-8;}
      if(p.y>H-8){p.y=H-8;}
      if(p.y<8){p.y=8;}
    }
  }
}
function draw(){
  x.fillStyle='#111';x.fillRect(0,0,W,H);
  x.fillStyle='#2a2b35';x.fillRect(0,H-8,W,8);
  x.strokeStyle='#fff';x.lineWidth=4;x.lineCap='round';
  for(const [a,b] of links){
    x.beginPath();x.moveTo(pts[a].x,pts[a].y);x.lineTo(pts[b].x,pts[b].y);x.stroke();
  }
  x.fillStyle='#f9e2af';x.beginPath();x.arc(pts[0].x,pts[0].y,10,0,Math.PI*2);x.fill();
}
function loop(){step();draw();requestAnimationFrame(loop);}
function getPos(e){
  const r=c.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};
}
function pick(p){
  let best=null,bd=28;
  for(const q of pts){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q;}}
  return best;
}
function down(e){const p=getPos(e);grabbed=pick(p);mouse={x:p.x,y:p.y,px:p.x,py:p.y};}
function move(e){
  if(!grabbed)return;
  const p=getPos(e);
  mouse.px=mouse.x;mouse.py=mouse.y;mouse.x=p.x;mouse.y=p.y;
}
function up(){
  if(grabbed){grabbed.ox=grabbed.x-(mouse.x-mouse.px)*0.5;grabbed.oy=grabbed.y-(mouse.y-mouse.py)*0.5;}
  grabbed=null;
}
c.addEventListener('mousedown',down);
c.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
c.addEventListener('touchstart',e=>{e.preventDefault();down(e);},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
c.addEventListener('touchend',up);
document.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')reset();});
document.getElementById('btn').onclick=reset;
reset();loop();
</script></body></html>
