<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ragdoll Sim</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.head{position:absolute;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316)}.body{position:absolute;width:14px;height:42px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Ragdoll Sim</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>State: <strong id="state">Idle</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const stateEl=document.getElementById('state');let score=0;function spawn(){arena.innerHTML='';const head=document.createElement('div');head.className='head';head.style.left='48%';head.style.top='28%';arena.appendChild(head);const body=document.createElement('div');body.className='body';body.style.left='48.8%';body.style.top='46%';arena.appendChild(body);score++;scoreEl.textContent=score;stateEl.textContent='Wiggle';}document.getElementById('startBtn').addEventListener('click',spawn);spawn();</script></body></html>
