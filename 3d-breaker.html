<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Breaker</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#101827,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:340px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.paddle{position:absolute;left:50%;bottom:15px;width:110px;height:12px;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}.ball{position:absolute;width:12px;height:12px;border-radius:50%;background:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.9)}.brick{position:absolute;width:52px;height:18px;border-radius:8px;background:linear-gradient(135deg,#34d399,#22d3ee)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>3D Breaker</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Lives: <strong id="lives">3</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const livesEl=document.getElementById('lives');const startBtn=document.getElementById('startBtn');let paddleX=42,ballX=50,ballY=56,vx=1.1,vy=-1.3,score=0,lives=3,bricks=[],active=false,loop=null;function makePaddle(){const p=document.createElement('div');p.className='paddle';p.style.left=paddleX+'%';arena.appendChild(p);return p}function makeBall(){const b=document.createElement('div');b.className='ball';b.style.left=ballX+'%';b.style.top=ballY+'%';arena.appendChild(b);return b}function makeBricks(){bricks=[];arena.querySelectorAll('.brick').forEach(el=>el.remove());for(let y=0;y<4;y++){for(let x=0;x<6;x++){const b=document.createElement('div');b.className='brick';b.style.left=(10+x*15)+'%';b.style.top=(12+y*16)+'%';arena.appendChild(b);bricks.push({el:b,x:10+x*15,y:12+y*16})}}}function moveBall(){const ball=document.querySelector('.ball');const paddle=document.querySelector('.paddle');if(!ball||!paddle||!active)return;ballX+=vx;ballY+=vy;ball.style.left=ballX+'%';ball.style.top=ballY+'%';if(ballX<3||ballX>96)vx*=-1;if(ballY<4)vy*=-1;const paddleRect=paddle.getBoundingClientRect();const ballRect=ball.getBoundingClientRect();if(ballY>86&&Math.abs(paddleRect.left-ballRect.left)<80&&Math.abs(paddleRect.top-ballRect.top)<20){vy=-Math.abs(vy)-0.08;vx+=(ballX-(paddleX+50))*0.03;}if(ballY>96){lives--;livesEl.textContent=lives;if(lives<=0){active=false;clearInterval(loop);startBtn.textContent='Restart';return;}ballX=50;ballY=56;vx=1.1;vy=-1.3;}for(const brick of bricks){const rect=brick.el.getBoundingClientRect();if(Math.abs(rect.left-ballRect.left)<26&&Math.abs(rect.top-ballRect.top)<18){brick.el.remove();bricks.splice(bricks.indexOf(brick),1);score+=10;scoreEl.textContent=score;vy*=-1;break}}if(bricks.length===0){score+=30;scoreEl.textContent=score;makeBricks();}}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')paddleX=Math.max(6,paddleX-5);if(e.key==='ArrowRight')paddleX=Math.min(78,paddleX+5);const p=document.querySelector('.paddle');if(p)p.style.left=paddleX+'%';});function start(){score=0;lives=3;scoreEl.textContent=score;livesEl.textContent=lives;active=true;arena.innerHTML='';paddleX=42;ballX=50;ballY=56;vx=1.1;vy=-1.3;makePaddle();makeBall();makeBricks();clearInterval(loop);loop=setInterval(moveBall,30);startBtn.textContent='Running'}startBtn.addEventListener('click',start);</script></body></html>
