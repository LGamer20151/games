<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <style>
    :root {
      --bg-1: #050816;
      --bg-2: #0f172a;
      --panel: rgba(15, 23, 42, 0.78);
      --line: rgba(148, 163, 184, 0.2);
      --text: #edf6ff;
      --muted: #b8c8e4;
      --gold: #f9d976;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 18px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(34,211,238,0.18), transparent 18%),
        radial-gradient(circle at 85% 12%, rgba(167,139,250,0.18), transparent 22%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }
    .game-shell {
      width: min(100%, 520px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 50px rgba(2,6,23,0.55);
      backdrop-filter: blur(12px);
      padding: 18px 18px 20px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .back-link {
      color: #cfe8ff;
      text-decoration: none;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.7rem);
      letter-spacing: -0.06em;
      line-height: 1;
      text-shadow: 0 0 22px rgba(34,211,238,0.32);
    }
    #score {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(249,217,118,0.4);
    }
    canvas {
      width: min(100%, 440px);
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid rgba(148,163,184,0.18);
      background: linear-gradient(180deg, rgba(8,11,18,0.96), rgba(15,29,38,0.95));
      box-shadow: inset 0 0 26px rgba(34,211,238,0.08), 0 10px 20px rgba(2,6,23,0.28);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <a class="back-link" href="index.html">&larr; Back to menu</a>
      <div id="score">Score: 0</div>
    </div>
    <h1>Snake</h1>
    <canvas id="board" width="440" height="440"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const SIZE = 22;
    const COLS = canvas.width / SIZE;
    const ROWS = canvas.height / SIZE;
    let snake, dir, nextDir, food, score, gameOver, moveTimer;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      placeFood();
      scoreEl.textContent = 'Score: 0';
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function step() {
      if (gameOver) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
      const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf) {
        gameOver = true;
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = 'Score: ' + score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function drawFood() {
      const px = food.x * SIZE + SIZE / 2;
      const py = food.y * SIZE + SIZE / 2;
      ctx.save();
      ctx.translate(px, py);
      ctx.fillStyle = '#ff6b6b';
      ctx.shadowColor = 'rgba(255,107,107,0.6)';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, SIZE * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSegment(seg, prevSeg, isHead = false) {
      const px = seg.x * SIZE + SIZE / 2;
      const py = seg.y * SIZE + SIZE / 2;
      const dx = prevSeg ? prevSeg.x - seg.x : 0;
      const dy = prevSeg ? prevSeg.y - seg.y : 0;
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(angle);
      ctx.fillStyle = isHead ? '#a7f3d0' : '#7ee8ac';
      ctx.strokeStyle = isHead ? '#d1fae5' : '#d9f99d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, SIZE * 0.72, SIZE * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (isHead) {
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(SIZE * 0.18, -SIZE * 0.12, 2.5, 0, Math.PI * 2);
        ctx.arc(SIZE * 0.18, SIZE * 0.12, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(SIZE * 0.26, 0, SIZE * 0.18, 0.2, Math.PI - 0.2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(148, 163, 184, 0.05)';
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          ctx.fillRect(x * SIZE, y * SIZE, SIZE - 1, SIZE - 1);
        }
      }

      drawFood();

      for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const prev = i === 0 ? snake[1] : snake[i - 1];
        drawSegment(seg, prev, i === 0);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
      }
    }

    function handleKey(event) {
      const key = event.key.toLowerCase();
      const map = {
        arrowup: { x: 0, y: -1 },
        w: { x: 0, y: -1 },
        arrowdown: { x: 0, y: 1 },
        s: { x: 0, y: 1 },
        arrowleft: { x: -1, y: 0 },
        a: { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 },
        d: { x: 1, y: 0 }
      };

      if (!map[key]) return;
      event.preventDefault();

      const wanted = map[key];
      const isReverse = wanted.x === -dir.x && wanted.y === -dir.y;
      if (!isReverse) {
        nextDir = wanted;
      }
    }

    document.addEventListener('keydown', handleKey);

    function loop() {
      step();
      draw();
      if (!gameOver) {
        moveTimer = setTimeout(loop, 120);
      }
    }

    reset();
    draw();
    moveTimer = setTimeout(loop, 120);
  </script>
</body>
</html>
