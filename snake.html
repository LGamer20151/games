<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <style>
    body { background:#1e1e2e; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    canvas { background:#11111b; border-radius:8px; display:block; margin:0 auto; }
    a { color:#89b4fa; display:inline-block; margin-top:14px; }
    #score { font-size:22px; margin-top:10px; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Snake</h1>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="score">Score: 0</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const SIZE = 20;
const COLS = canvas.width / SIZE;
const ROWS = canvas.height / SIZE;

let snake, dir, nextDir, food, score, gameOver;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  gameOver = false;
  placeFood();
  scoreEl.textContent = 'Score: 0';
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  if (gameOver) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) {
    gameOver = true;
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Score: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#f38ba8';
  ctx.fillRect(food.x * SIZE + 2, food.y * SIZE + 2, SIZE - 4, SIZE - 4);

  ctx.fillStyle = '#a6e3a1';
  for (const s of snake) {
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  }

  // Face on the head
  const head = snake[0];
  const cx = head.x * SIZE + SIZE / 2;
  const cy = head.y * SIZE + SIZE / 2;
  const ex = dir.x * 4, ey = dir.y * 4;
  const px = -dir.y * 4, py = dir.x * 4;

  ctx.fillStyle = '#11111b';
  ctx.beginPath();
  ctx.arc(cx + ex + px, cy + ey + py, 2, 0, Math.PI * 2);
  ctx.arc(cx + ex - px, cy + ey - py, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#11111b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx + ex * 0.8, cy + ey * 0.8, 3, 0, Math.PI);
  ctx.stroke();

  if (gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
    ctx.font = '16px Arial';
    ctx.fillText('Press Space to play again', canvas.width / 2, canvas.height / 2 + 30);
  }
}

const moves = {
  arrowup: { x: 0, y: -1 },    w: { x: 0, y: -1 },
  arrowdown: { x: 0, y: 1 },   s: { x: 0, y: 1 },
  arrowleft: { x: -1, y: 0 },  a: { x: -1, y: 0 },
  arrowright: { x: 1, y: 0 },  d: { x: 1, y: 0 }
};

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (moves[key]) {
    const d = moves[key];
    // Prevent reversing directly into the snake's body
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    e.preventDefault();
  }
  if (e.key === ' ' && gameOver) reset();
});

reset();
setInterval(() => { step(); draw(); }, 120);
</script>
</body>
</html>
