<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Brick Breaker</title>
<style>body{background:#0d0e12;color:#fff;font-family:Arial,sans-serif;text-align:center;margin:0;padding:20px}a{color:#89b4fa}canvas{background:#111;border-radius:8px;max-width:100%;cursor:none}#info{font-size:20px;margin:12px 0;min-height:28px}button{margin-top:12px;padding:10px 22px;font-size:16px;border:none;border-radius:8px;background:#89b4fa;color:#0d0e12;font-weight:bold;cursor:pointer}</style></head><body>
<a href="index.html">&larr; Back to menu</a><h1>Brick Breaker</h1><div id="info"></div>
<canvas id="c" width="480" height="360"></canvas><br><button id="btn">Restart</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),info=document.getElementById('info');
const W=480,H=360,COLS=8,ROWS=5,BW=54,BH=18,PW=80,PY=H-24;
const colors=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db'];
let paddle,ball,bricks,score,lives,over,won,keys={l:false,r:false};
function reset(){
  paddle={x:W/2-PW/2,w:PW,h:12};
  ball={x:W/2,y:PY-10,r:7,dx:3,dy:-3,stuck:true};
  bricks=[];
  for(let r=0;r<ROWS;r++)for(let k=0;k<COLS;k++)bricks.push({x:k*(BW+6)+10,y:r*(BH+6)+40,alive:true,c:colors[r]});
  score=0;lives=3;over=false;won=false;
}
function launch(){
  if(over||won){reset();return;}
  if(ball.stuck){ball.stuck=false;ball.dy=-3;ball.dx=(Math.random()<0.5?-1:1)*3;}
}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();paddle.x=(e.clientX-r.left)*W/r.width-paddle.w/2;});
c.addEventListener('click',launch);
document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){keys.l=true;e.preventDefault();}
  if(e.code==='ArrowRight'){keys.r=true;e.preventDefault();}
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)launch();}
});
document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.l=false;if(e.code==='ArrowRight')keys.r=false;});
document.getElementById('btn').onclick=reset;
function update(){
  if(over||won)return;
  if(keys.l)paddle.x-=7;
  if(keys.r)paddle.x+=7;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=PY-10;return;}
  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x-ball.r<0){ball.x=ball.r;ball.dx=-ball.dx;}
  if(ball.x+ball.r>W){ball.x=W-ball.r;ball.dx=-ball.dx;}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.dy=-ball.dy;}
  if(ball.dy>0&&ball.y+ball.r>=PY&&ball.y+ball.r<=PY+paddle.h+8&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){
    ball.dy=-Math.abs(ball.dy);
    ball.dx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*4;
  }
  if(ball.y-ball.r>H){
    lives--;
    if(lives<=0)over=true;else ball.stuck=true;
  }
  for(const b of bricks){
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+BW&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+BH){
      b.alive=false;score+=10;ball.dy=-ball.dy;break;
    }
  }
  if(bricks.every(b=>!b.alive))won=true;
}
function draw(){
  x.fillStyle='#111';x.fillRect(0,0,W,H);
  for(const b of bricks)if(b.alive){x.fillStyle=b.c;x.fillRect(b.x,b.y,BW,BH);}
  x.fillStyle='#89b4fa';x.fillRect(paddle.x,PY,paddle.w,paddle.h);
  x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();
  x.font='16px Arial';x.textAlign='left';x.fillText('Score: '+score,10,24);
  x.textAlign='right';x.fillText('Lives: '+lives,W-10,24);
  if(over||won){
    x.textAlign='center';x.font='bold 28px Arial';
    x.fillText(won?'You cleared the wall!':'Game over',W/2,H/2);
    x.font='16px Arial';x.fillText('Press Space or Restart to play again',W/2,H/2+30);
  }
  info.textContent=over?'Run over. Final score: '+score:won?'Wall cleared!':'Score: '+score;
}
function loop(){update();draw();requestAnimationFrame(loop);}
reset();loop();
</script></body></html>
