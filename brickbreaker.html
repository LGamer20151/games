<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brick Breaker</title>
  <style>
    :root {
      --bg-1: #050816;
      --bg-2: #0f172a;
      --panel: rgba(15, 23, 42, 0.8);
      --line: rgba(148, 163, 184, 0.2);
      --text: #edf6ff;
      --muted: #b8c8e4;
      --gold: #f9d976;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 18px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 15%, rgba(34, 211, 238, 0.16), transparent 18%),
        radial-gradient(circle at 80% 12%, rgba(167, 139, 250, 0.18), transparent 22%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
    }

    .game-shell {
      width: min(100%, 620px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 50px rgba(2, 6, 23, 0.55);
      backdrop-filter: blur(12px);
      padding: 18px 18px 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .back-link {
      color: #cfe8ff;
      text-decoration: none;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: -0.06em;
      line-height: 1;
      text-shadow: 0 0 20px rgba(125, 211, 252, 0.28);
    }

    #info {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(249, 217, 118, 0.36);
    }

    canvas {
      width: min(100%, 540px);
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: linear-gradient(180deg, rgba(11, 17, 29, 0.94), rgba(7, 11, 18, 0.96));
      box-shadow: inset 0 0 28px rgba(34, 211, 238, 0.08), 0 12px 22px rgba(2,6,23,0.26);
      cursor: none;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #8ec5ff, #d7ebff);
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 12px 18px rgba(142, 197, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <a class="back-link" href="index.html">&larr; Back to menu</a>
      <div id="info">Score: 0</div>
    </div>
    <h1>Brick Breaker</h1>
    <canvas id="c" width="520" height="390"></canvas>
    <div class="controls"><button id="btn">Restart</button></div>
  </div>

  <script>
    const c = document.getElementById('c');
    const x = c.getContext('2d');
    const info = document.getElementById('info');
    const W = 520, H = 390;
    const COLS = 8, ROWS = 5, BW = 54, BH = 18, PW = 92, PY = H - 24;
    const colors = ['#fb7185', '#f59e0b', '#facc15', '#34d399', '#60a5fa'];
    let paddle, ball, bricks, score, lives, over, won, keys = {l:false, r:false};

    function reset(){
      paddle = { x: W/2 - PW/2, w: PW, h: 12 };
      ball = { x: W/2, y: PY - 10, r: 7, dx: 3, dy: -3, stuck: true };
      bricks = [];
      for (let r = 0; r < ROWS; r++) {
        for (let k = 0; k < COLS; k++) {
          bricks.push({ x: k * (BW + 6) + 10, y: r * (BH + 6) + 42, alive: true, c: colors[r] });
        }
      }
      score = 0; lives = 3; over = false; won = false;
    }

    function launch(){
      if (over || won) { reset(); return; }
      if (ball.stuck) {
        ball.stuck = false;
        ball.dy = -3.5;
        ball.dx = (Math.random() < 0.5 ? -1 : 1) * 3.2;
      }
    }

    c.addEventListener('mousemove', e => {
      const r = c.getBoundingClientRect();
      paddle.x = (e.clientX - r.left) * W / r.width - paddle.w / 2;
    });
    c.addEventListener('click', launch);
    document.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft') { keys.l = true; e.preventDefault(); }
      if (e.code === 'ArrowRight') { keys.r = true; e.preventDefault(); }
      if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) launch(); }
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft') keys.l = false;
      if (e.code === 'ArrowRight') keys.r = false;
    });
    document.getElementById('btn').onclick = reset;

    function update(){
      if (over || won) return;
      if (keys.l) paddle.x -= 8;
      if (keys.r) paddle.x += 8;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

      if (ball.stuck) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = PY - 10;
        return;
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = -ball.dx; }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -ball.dx; }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = -ball.dy; }

      if (ball.dy > 0 && ball.y + ball.r >= PY && ball.y + ball.r <= PY + paddle.h + 8 && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
        ball.dy = -Math.abs(ball.dy);
        ball.dx = ((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)) * 5;
      }

      if (ball.y - ball.r > H) {
        lives--;
        if (lives <= 0) over = true; else ball.stuck = true;
      }

      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW && ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
          b.alive = false; score += 10; ball.dy = -ball.dy; break;
        }
      }

      if (bricks.every(b => !b.alive)) won = true;
    }

    function drawBackground(){
      const bg = x.createRadialGradient(W * 0.5, 90, 20, W * 0.5, H * 0.5, W * 0.8);
      bg.addColorStop(0, 'rgba(34, 211, 238, 0.14)');
      bg.addColorStop(1, 'rgba(15, 23, 42, 0.96)');
      x.fillStyle = bg;
      x.fillRect(0, 0, W, H);

      x.fillStyle = 'rgba(148, 163, 184, 0.08)';
      for (let i = 0; i < 18; i++) {
        x.fillRect(i * 30, 0, 1, H);
      }
    }

    function draw(){
      drawBackground();

      for (const b of bricks) {
        if (!b.alive) continue;
        x.fillStyle = b.c;
        x.shadowColor = b.c;
        x.shadowBlur = 12;
        x.fillRect(b.x, b.y, BW, BH);
        x.shadowBlur = 0;
        x.fillStyle = 'rgba(255,255,255,0.18)';
        x.fillRect(b.x + 3, b.y + 3, BW - 6, 4);
      }

      x.fillStyle = '#8ec5ff';
      x.shadowColor = 'rgba(142, 197, 255, 0.8)';
      x.shadowBlur = 16;
      x.fillRect(paddle.x, PY, paddle.w, paddle.h);
      x.shadowBlur = 0;

      x.fillStyle = '#f8fafc';
      x.beginPath();
      x.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      x.fill();

      x.shadowColor = 'rgba(248, 250, 252, 0.9)';
      x.shadowBlur = 18;
      x.beginPath();
      x.arc(ball.x, ball.y, ball.r * 0.7, 0, Math.PI * 2);
      x.fill();
      x.shadowBlur = 0;

      x.fillStyle = '#e2e8f0';
      x.font = '16px Arial';
      x.textAlign = 'left';
      x.fillText('Score: ' + score, 14, 28);
      x.textAlign = 'right';
      x.fillText('Lives: ' + lives, W - 14, 28);

      if (over || won) {
        x.fillStyle = 'rgba(15, 23, 42, 0.42)';
        x.fillRect(0, 0, W, H);
        x.textAlign = 'center';
        x.font = 'bold 30px Arial';
        x.fillStyle = '#ffffff';
        x.fillText(won ? 'You cleared the wall!' : 'Game over', W / 2, H / 2);
        x.font = '16px Arial';
        x.fillText('Press Space or Restart to play again', W / 2, H / 2 + 30);
      }

      info.textContent = over ? 'Run over. Final score: ' + score : won ? 'Wall cleared!' : 'Score: ' + score;
    }

    function loop(){ update(); draw(); requestAnimationFrame(loop); }
    reset(); loop();
  </script>
</body>
</html>
