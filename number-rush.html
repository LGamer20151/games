<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Rush</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(620px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #problem { font-size:2.2rem; text-align:center; margin:16px 0; font-weight:900; }
    input { width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:rgba(15,23,42,0.7); color:white; font-size:1.1rem; }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Number Rush</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
    <div id="problem"></div>
    <input id="answer" type="number" placeholder="Type your answer" />
    <button id="submit">Submit</button>
  </div>

  <script>
    const problemEl = document.getElementById('problem');
    const answerEl = document.getElementById('answer');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit');
    let score = 0, answer = 0;

    function generateQuestion() {
      const a = Math.floor(Math.random() * 12) + 2;
      const b = Math.floor(Math.random() * 12) + 1;
      const ops = ['+', '-', '*'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      if (op === '+') answer = a + b;
      if (op === '-') answer = a - b;
      if (op === '*') answer = a * b;
      problemEl.textContent = `${a} ${op} ${b} = ?`;
      answerEl.value = '';
      answerEl.focus();
    }

    submitBtn.addEventListener('click', () => {
      const user = Number(answerEl.value);
      if (user === answer) {
        score += 10; scoreEl.textContent = 'Score: ' + score; statusEl.textContent = 'Correct!';
        generateQuestion();
      } else {
        statusEl.textContent = 'Wrong answer';
      }
    });

    generateQuestion();
  </script>
</body>
</html>
