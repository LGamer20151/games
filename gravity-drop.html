<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gravity Drop</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.ball{position:absolute;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316)}.block{position:absolute;width:70px;height:18px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Gravity Drop</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');let score=0,best=0,active=false,ball=null;function makeBall(){ball=document.createElement('div');ball.className='ball';ball.style.left='50%';ball.style.top='10%';arena.appendChild(ball)}function addBlock(){const b=document.createElement('div');b.className='block';b.style.left=(Math.random()*72+12)+'%';b.style.top='100%';arena.appendChild(b);const fall=setInterval(()=>{if(!active){clearInterval(fall);return;}const t=parseFloat(b.style.top)||100;const next=t+1.8;b.style.top=next+'%';const bRect=b.getBoundingClientRect();const ballRect=ball.getBoundingClientRect();if(Math.abs(bRect.left-ballRect.left)<40&&Math.abs(bRect.top-ballRect.top)<18){score=Math.max(0,score-5);scoreEl.textContent=score;}if(next>120){clearInterval(fall);b.remove();score+=10;scoreEl.textContent=score;best=Math.max(best,score);bestEl.textContent=best;}} ,40)}document.addEventListener('keydown',e=>{if(!active)return;if(e.key==='ArrowLeft')ball.style.left=Math.max(8,parseFloat(ball.style.left)-6)+'%';if(e.key==='ArrowRight')ball.style.left=Math.min(92,parseFloat(ball.style.left)+6)+'%';});function start(){score=0;scoreEl.textContent=score;best=Number(bestEl.textContent)||0;active=true;arena.innerHTML='';makeBall();clearInterval(loop);loop=setInterval(addBlock,1200);document.getElementById('startBtn').textContent='Running'}let loop=null;document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
