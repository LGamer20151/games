<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Drop</title>
  <style>
    body {
      margin:0; font-family:Arial,sans-serif; background:linear-gradient(180deg,#0a1020,#111827);
      color:#ebf7ff; display:grid; place-items:center; min-height:100vh;
    }
    .panel {
      background:rgba(15,23,42,0.9); border:1px solid rgba(148,163,184,0.2); border-radius:18px;
      box-shadow:0 20px 40px rgba(0,0,0,0.35); padding:18px; width:min(92vw, 620px);
    }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    h1 { margin:0; font-size:26px; }
    .status { font-weight:bold; font-size:18px; }
    canvas {
      width:100%; height:auto; display:block; border-radius:14px; border:1px solid rgba(148,163,184,0.18);
      background:linear-gradient(180deg,#0b1120,#132238);
    }
    .controls { display:flex; justify-content:space-between; gap:10px; margin-top:12px; }
    button {
      flex:1; border:none; border-radius:10px; cursor:pointer; background:linear-gradient(135deg,#22d3ee,#8b5cf6);
      color:#fff; padding:12px; font-weight:bold; font-size:16px;
    }
    a { color:#bae6fd; text-decoration:none; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="top">
      <h1>Gravity Drop</h1>
      <div class="status" id="score">Score: 0</div>
    </div>
    <canvas id="game" width="560" height="600"></canvas>
    <div class="controls">
      <button id="restart">Restart</button>
      <button><a href="index.html">Menu</a></button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    let score = 0;
    let gameOver = false;
    let player = { x: canvas.width / 2, y: canvas.height - 30, w: 110, h: 18, speed: 520 };
    let drops = [];
    let lastSpawn = 0;
    let lastTime = 0;

    function resetGame() {
      score = 0;
      gameOver = false;
      player.x = canvas.width / 2 - player.w / 2;
      drops = [];
      lastSpawn = 0;
      scoreEl.textContent = 'Score: 0';
    }

    function spawnDrop() {
      const radius = 14 + Math.random() * 12;
      drops.push({
        x: Math.random() * (canvas.width - radius * 2) + radius,
        y: -radius,
        r: radius,
        speed: 210 + Math.random() * 160,
        color: ['#67e8f9', '#c084fc', '#fbbf24', '#fca5a5'][Math.floor(Math.random() * 4)]
      });
    }

    function update(dt) {
      if (gameOver) return;
      const left = keys['ArrowLeft'] || keys['a'];
      const right = keys['ArrowRight'] || keys['d'];
      if (left) player.x -= player.speed * dt;
      if (right) player.x += player.speed * dt;
      player.x = Math.max(0, Math.min(player.x, canvas.width - player.w));

      lastSpawn += dt;
      if (lastSpawn > 0.75) {
        lastSpawn = 0;
        spawnDrop();
      }

      for (let i = drops.length - 1; i >= 0; i--) {
        const drop = drops[i];
        drop.y += drop.speed * dt;

        if (drop.y + drop.r > canvas.height - player.h && drop.x + drop.r > player.x && drop.x - drop.r < player.x + player.w) {
          score += 10;
          drops.splice(i, 1);
          scoreEl.textContent = 'Score: ' + score;
          continue;
        }

        if (drop.y - drop.r > canvas.height) {
          gameOver = true;
          break;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < canvas.width; i += 32) {
        ctx.strokeStyle = 'rgba(148,163,184,0.08)';
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }

      const p = player;
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#bfdbfe';
      ctx.fillRect(p.x + 10, p.y - 8, p.w - 20, 8);

      for (const drop of drops) {
        ctx.beginPath();
        ctx.fillStyle = drop.color;
        ctx.arc(drop.x, drop.y, drop.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 38px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Missed!', canvas.width / 2, canvas.height / 2);
      }
    }

    const keys = {};
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowleft' || k === 'a') keys['ArrowLeft'] = true;
      if (k === 'arrowright' || k === 'd') keys['ArrowRight'] = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowleft' || k === 'a') keys['ArrowLeft'] = false;
      if (k === 'arrowright' || k === 'd') keys['ArrowRight'] = false;
    });

    function loop(ts) {
      if (!lastTime) lastTime = ts;
      const dt = Math.min((ts - lastTime) / 1000, 0.032);
      lastTime = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById('restart').addEventListener('click', resetGame);
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
