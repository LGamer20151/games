<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <style>
    :root {
      --bg-1: #050b18;
      --bg-2: #0d1528;
      --panel: rgba(16, 22, 35, 0.8);
      --panel-strong: rgba(21, 30, 46, 0.96);
      --line: rgba(148, 163, 184, 0.14);
      --text: #edf5ff;
      --muted: #a9bad8;
      --green: #8de6a4;
      --food: #ff8fb3;
      --head: #7dd3fc;
      --accent: #c4b5fd;
      --gold: #f8d98d;
      --shadow: rgba(2, 6, 23, 0.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 20px 40px;
      background:
        radial-gradient(circle at 15% 15%, rgba(34, 211, 238, 0.15), transparent 18%),
        radial-gradient(circle at 85% 10%, rgba(192, 132, 252, 0.14), transparent 24%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .game-shell {
      width: min(100%, 520px);
      background: rgba(12, 18, 30, 0.7);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 22px 20px 18px;
      box-shadow: 0 18px 38px var(--shadow);
      backdrop-filter: blur(10px);
    }

    a {
      display: inline-block;
      margin: 0 0 12px;
      color: #8ec5ff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
    }

    a:hover { opacity: 0.9; }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.2rem, 4vw, 3.3rem);
      letter-spacing: -0.06em;
      line-height: 1;
      text-shadow: 0 0 20px rgba(125, 211, 252, 0.18);
    }

    canvas {
      display: block;
      width: min(100%, 400px);
      height: auto;
      margin: 0 auto;
      background: linear-gradient(180deg, #0d1420, #111b2b);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 16px 28px rgba(2,6,23,0.35);
    }

    #score {
      margin-top: 20px;
      font-size: clamp(1.25rem, 2.5vw, 1.8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--gold);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <a href="index.html">&larr; Back to menu</a>
    <h1>Snake</h1>
    <canvas id="board" width="400" height="400"></canvas>
    <div id="score">Score: 0</div>
  </div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const SIZE = 20;
const COLS = canvas.width / SIZE;
const ROWS = canvas.height / SIZE;

let snake, dir, nextDir, food, score, gameOver;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  gameOver = false;
  placeFood();
  scoreEl.textContent = 'Score: 0';
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  if (gameOver) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) {
    gameOver = true;
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Score: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#f38ba8';
  ctx.fillRect(food.x * SIZE + 2, food.y * SIZE + 2, SIZE - 4, SIZE - 4);

  ctx.fillStyle = '#a6e3a1';
  for (const s of snake) {
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  }

  const head = snake[0];
  const cx = head.x * SIZE + SIZE / 2;
  const cy = head.y * SIZE + SIZE / 2;
  const ex = dir.x * 4, ey = dir.y * 4;
  const px = -dir.y * 4, py = dir.x * 4;

  ctx.fillStyle = '#11111b';
  ctx.beginPath();
  ctx.arc(cx + ex + px, cy + ey + py, 2, 0, Math.PI * 2);
  ctx.arc(cx + ex - px, cy + ey - py, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#11111b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx + ex * 0.8, cy + ey * 0.8, 3, 0, Math.PI);
  ctx.stroke();

  if (gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
    ctx.font = '16px Arial';
    ctx.fillText('Press Space to play again', canvas.width / 2, canvas.height / 2 + 30);
  }
}

const moves = {
  arrowup: { x: 0, y: -1 },    w: { x: 0, y: -1 },
  arrowdown: { x: 0, y: 1 },   s: { x: 0, y: 1 },
  arrowleft: { x: -1, y: 0 },  a: { x: -1, y: 0 },
  arrowright: { x: 1, y: 0 },  d: { x: 1, y: 0 }
};

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (moves[key]) {
    const d = moves[key];
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    e.preventDefault();
  }
  if (e.key === ' ' && gameOver) reset();
});

reset();
setInterval(() => { step(); draw(); }, 120);
</script>
</body>
</html>
