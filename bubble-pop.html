<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Pop</title>
  <style>
    :root {
      --bg: #07111f; --panel: rgba(15,23,42,0.88); --line: rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; --good:#34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text);
      background: radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%);
    }
    .panel { width:min(760px,92vw); padding:26px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; gap:12px; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #arena { position:relative; height:360px; border-radius:18px; background:linear-gradient(180deg, rgba(10,20,30,0.92), rgba(15,23,42,0.68)); border:1px solid var(--line); overflow:hidden; }
    .bubble { position:absolute; width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,255,255,0.5); cursor:pointer; display:grid; place-items:center; font-size: 0.8rem; font-weight: 700; color:#04111d; }
    .bubble:hover { transform:scale(1.05); }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Bubble Pop</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="timer">Time: 20</span></div>
    <div id="arena"></div>
    <button id="start">Start Game</button>
  </div>

  <script>
    const arena = document.getElementById('arena');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const startBtn = document.getElementById('start');
    let score = 0, timeLeft = 20, timerId = null, started = false;

    function makeBubble() {
      const bubble = document.createElement('button');
      bubble.type = 'button';
      const size = 28 + Math.random() * 34;
      const x = Math.random() * (arena.clientWidth - size);
      const y = Math.random() * (arena.clientHeight - size);
      const hue = 180 + Math.random() * 120;
      bubble.className = 'bubble';
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = x + 'px';
      bubble.style.top = y + 'px';
      bubble.style.background = `radial-gradient(circle at 30% 30%, hsla(${hue}, 100%, 90%, 1), hsla(${hue}, 90%, 62%, 1))`;
      bubble.textContent = '+';
      bubble.addEventListener('click', () => {
        if (!started) return;
        score += 10;
        scoreEl.textContent = 'Score: ' + score;
        bubble.remove();
        makeBubble();
      });
      arena.appendChild(bubble);
    }

    function updateHUD() {
      scoreEl.textContent = 'Score: ' + score;
      timerEl.textContent = 'Time: ' + timeLeft;
    }

    function resetBoard() {
      arena.innerHTML = '';
      for (let i = 0; i < 9; i++) makeBubble();
      updateHUD();
    }

    function endGame() {
      started = false;
      clearInterval(timerId);
      const result = document.createElement('div');
      result.style.cssText = 'position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,0.38); font-size:2rem; font-weight:800;';
      result.textContent = 'Final score: ' + score;
      arena.appendChild(result);
    }

    function startGame() {
      score = 0; timeLeft = 20; started = true;
      resetBoard();
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          timeLeft = 0;
          updateHUD();
          endGame();
          return;
        }
        updateHUD();
      }, 1000);
    }

    startBtn.addEventListener('click', startGame);
    resetBoard();
  </script>
</body>
</html>
