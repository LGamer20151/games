<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Escape Room</title>
  <style>
    body { background:#1e1e2e; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    canvas { background:#11111b; border-radius:8px; display:block; margin:0 auto; cursor:pointer; }
    a { color:#89b4fa; display:inline-block; margin-top:14px; }
    #clue { font-size:18px; margin-top:12px; min-height:28px; color:#f9e2af; }
    #status { font-size:16px; margin-top:6px; color:#a6adc8; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Escape Room</h1>
  <canvas id="room" width="600" height="500"></canvas>
  <div id="clue"></div>
  <div id="status">Step 1 of 4</div>
  <p>Click the objects in the room. Solve each puzzle to unlock the next step and escape.</p>

<script>
const canvas = document.getElementById('room');
const ctx = canvas.getContext('2d');
const clueEl = document.getElementById('clue');
const statusEl = document.getElementById('status');

const W = canvas.width, H = canvas.height;

// Game state
let step = 1;          // 1 to 4, then 5 = escaped
let message = '';
let flashTimer = 0;
let win = false;

// Step 1: color lock (press the panel in the right order)
const COLORS = ['#e74c3c', '#2ecc71', '#3498db', '#f1c40f'];
const COLOR_NAMES = ['red', 'green', 'blue', 'yellow'];
const COLOR_ANSWER = [2, 0, 3, 1]; // blue, red, yellow, green
let colorInput = [];

// Step 2: number code on the wall (4 digits)
const WALL_CODE = '7425';
let codeInput = '';

// Step 3: sliding tiles (1 to 8, blank at index 8)
let tiles = [1, 2, 3, 4, 5, 6, 7, 8, 0];

// Step 4: key puzzle (click the key 3 times to take it, then the door)
let hasKey = false;

// Clickable regions
const panelBox = { x: 60, y: 300, w: 200, h: 120 };
const wallBox = { x: 330, y: 80, w: 220, h: 100 };
const puzzleBox = { x: 40, y: 80, w: 0, h: 0 };
const exitBox = { x: 470, y: 260, w: 100, h: 180 };
const keyBox = { x: 330, y: 380, w: 80, h: 50 };
const tileBox = { x: 210, y: 200, w: 180, h: 180 };

function setClue(text) {
  clueEl.textContent = text;
}

function updateStatus() {
  if (win) statusEl.textContent = 'You escaped!';
  else statusEl.textContent = 'Step ' + step + ' of 4';
}

function inside(box, x, y) {
  return x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h;
}

function reset() {
  step = 1;
  message = '';
  win = false;
  colorInput = [];
  codeInput = '';
  tiles = [1, 2, 3, 4, 5, 6, 7, 8, 0];
  shuffleTiles();
  hasKey = false;
  setClue('Step 1: The panel needs a color order. The wall says: "Red is not first. Blue leads."');
  updateStatus();
}

function shuffleTiles() {
  // Shuffle by making random legal moves so the puzzle is always solvable
  for (let i = 0; i < 200; i++) {
    const blank = tiles.indexOf(0);
    const neighbors = [];
    const r = Math.floor(blank / 3), c = blank % 3;
    if (r > 0) neighbors.push(blank - 3);
    if (r < 2) neighbors.push(blank + 3);
    if (c > 0) neighbors.push(blank - 1);
    if (c < 2) neighbors.push(blank + 1);
    const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
    [tiles[blank], tiles[pick]] = [tiles[pick], tiles[blank]];
  }
}

function isSolved() {
  for (let i = 0; i < 8; i++) if (tiles[i] !== i + 1) return false;
  return tiles[8] === 0;
}

function handleColorClick(index) {
  if (step !== 1) return;
  colorInput.push(index);
  const pos = colorInput.length - 1;
  if (colorInput[pos] !== COLOR_ANSWER[pos]) {
    colorInput = [];
    setClue('Wrong order. The panel resets. Try again.');
    return;
  }
  if (colorInput.length === COLOR_ANSWER.length) {
    step = 2;
    setClue('The panel clicks open. A number code is scratched on the wall. Click the wall to enter a code.');
    updateStatus();
  }
}

function handleWallClick() {
  if (step === 1) {
    setClue('The wall says: "Red is not first. Blue leads." Press the panel colors in order.');
  } else if (step === 2) {
    const entered = prompt('Enter the 4-digit code from the wall:');
    if (entered === null) return;
    if (entered.trim() === WALL_CODE) {
      step = 3;
      setClue('Correct! A sliding picture puzzle is on the table. Click a tile next to the blank space to slide it.');
      updateStatus();
    } else {
      setClue('That code is wrong. Look closer at the wall.');
    }
  }
}

function handleTileClick(mx, my) {
  if (step !== 3) return;
  const col = Math.floor((mx - tileBox.x) / (tileBox.w / 3));
  const row = Math.floor((my - tileBox.y) / (tileBox.h / 3));
  if (col < 0 || col > 2 || row < 0 || row > 2) return;
  const idx = row * 3 + col;
  const blank = tiles.indexOf(0);
  const br = Math.floor(blank / 3), bc = blank % 3;
  const adjacent = (Math.abs(br - row) + Math.abs(bc - col)) === 1;
  if (adjacent) {
    [tiles[blank], tiles[idx]] = [tiles[idx], tiles[blank]];
    if (isSolved()) {
      step = 4;
      setClue('The picture slides into place and a small brass key falls out. Click the key to take it.');
      updateStatus();
    }
  }
}

function handleKeyClick() {
  if (step === 4 && !hasKey) {
    hasKey = true;
    setClue('You have the key. Click the exit door to escape.');
  }
}

function handleExitClick() {
  if (step === 4 && hasKey) {
    win = true;
    setClue('The door unlocks. You escaped the room!');
    updateStatus();
  } else if (step === 4) {
    setClue('The door is locked. Find the key first.');
  } else {
    setClue('The exit door is locked tight. Solve the puzzles first.');
  }
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  const y = (e.clientY - rect.top) * (H / rect.height);

  if (win) { reset(); return; }

  if (inside(panelBox, x, y)) {
    const idx = Math.min(3, Math.floor((x - panelBox.x) / (panelBox.w / 4)));
    handleColorClick(idx);
  } else if (inside(wallBox, x, y)) {
    handleWallClick();
  } else if (inside(tileBox, x, y)) {
    handleTileClick(x, y);
  } else if (inside(keyBox, x, y)) {
    handleKeyClick();
  } else if (inside(exitBox, x, y)) {
    handleExitClick();
  }
});

function drawRoom() {
  // Walls and floor
  ctx.fillStyle = '#2a2a3c';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#3b3b50';
  ctx.fillRect(0, H - 60, W, 60);

  // Wall code scratch
  ctx.fillStyle = '#4a4a62';
  ctx.fillRect(wallBox.x, wallBox.y, wallBox.w, wallBox.h);
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '16px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(step === 1 ? 'Writing on the wall' : 'Code scratched here', wallBox.x + wallBox.w / 2, wallBox.y + 30);
  ctx.font = 'bold 22px Arial';
  ctx.fillText(step >= 2 ? '7 4 2 5' : '? ? ? ?', wallBox.x + wallBox.w / 2, wallBox.y + 70);

  // Color panel
  ctx.fillStyle = '#313244';
  ctx.fillRect(panelBox.x, panelBox.y, panelBox.w, panelBox.h);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = COLORS[i];
    ctx.beginPath();
    ctx.arc(panelBox.x + (i + 0.5) * (panelBox.w / 4), panelBox.y + panelBox.h / 2, 18, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '14px Arial';
  ctx.fillText('Color lock', panelBox.x + panelBox.w / 2, panelBox.y - 8);

  // Sliding tile puzzle
  ctx.fillStyle = '#45475a';
  ctx.fillRect(tileBox.x - 4, tileBox.y - 4, tileBox.w + 8, tileBox.h + 8);
  const cell = tileBox.w / 3;
  for (let i = 0; i < 9; i++) {
    const r = Math.floor(i / 3), c = i % 3;
    const x = tileBox.x + c * cell, y = tileBox.y + r * cell;
    if (tiles[i] === 0) {
      ctx.fillStyle = '#1e1e2e';
    } else {
      ctx.fillStyle = '#89b4fa';
    }
    ctx.fillRect(x + 2, y + 2, cell - 4, cell - 4);
    if (tiles[i] !== 0) {
      ctx.fillStyle = '#11111b';
      ctx.font = 'bold 26px Arial';
      ctx.fillText(tiles[i], x + cell / 2, y + cell / 2 + 9);
    }
  }
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '14px Arial';
  ctx.fillText('Picture puzzle', tileBox.x + tileBox.w / 2, tileBox.y - 12);

  // Exit door
  ctx.fillStyle = win ? '#a6e3a1' : '#6c3f2a';
  ctx.fillRect(exitBox.x, exitBox.y, exitBox.w, exitBox.h);
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '14px Arial';
  ctx.fillText('EXIT', exitBox.x + exitBox.w / 2, exitBox.y + 20);
  ctx.beginPath();
  ctx.arc(exitBox.x + exitBox.w - 18, exitBox.y + exitBox.h / 2, 6, 0, Math.PI * 2);
  ctx.fill();

  // Key (hidden until step 4)
  if (step >= 4 && !hasKey) {
    ctx.fillStyle = '#f9e2af';
    ctx.fillRect(keyBox.x, keyBox.y, keyBox.w, keyBox.h);
    ctx.fillStyle = '#11111b';
    ctx.font = '14px Arial';
    ctx.fillText('Key', keyBox.x + keyBox.w / 2, keyBox.y + 30);
  }

  // Inventory
  if (hasKey) {
    ctx.fillStyle = '#f9e2af';
    ctx.font = '16px Arial';
    ctx.fillText('Inventory: brass key', 120, H - 20);
  }
}

function drawEnding() {
  ctx.fillStyle = 'rgba(17,17,27,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#a6e3a1';
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('You Escaped!', W / 2, H / 2 - 10);
  ctx.fillStyle = '#fff';
  ctx.font = '18px Arial';
  ctx.fillText('Click to play again', W / 2, H / 2 + 30);
}

function draw() {
  ctx.textAlign = 'center';
  drawRoom();
  if (win) drawEnding();
}

function loop() {
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
