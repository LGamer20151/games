<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Escape</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.maze{position:relative;height:320px;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2);overflow:hidden}.wall{position:absolute;background:rgba(148,163,184,.4)}.player{position:absolute;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}.exit{position:absolute;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#34d399,#22c55e)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Escape</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Goal: <strong id="goal">1</strong></span></div><div class="maze" id="maze"></div><button class="button" id="startBtn">Start</button></div><script>const maze=document.getElementById('maze');const scoreEl=document.getElementById('score');const goalEl=document.getElementById('goal');let playerX=10,playerY=10,score=0,goal=1;function build(){maze.innerHTML='';const walls=[{x:20,y:0,w:10,h:60},{x:20,y:60,w:50,h:10},{x:45,y:0,w:10,h:40},{x:60,y:35,w:10,h:50},{x:30,y:20,w:10,h:40},{x:0,y:80,w:100,h:10}];walls.forEach(w=>{const wall=document.createElement('div');wall.className='wall';wall.style.left=w.x+'%';wall.style.top=w.y+'%';wall.style.width=w.w+'%';wall.style.height=w.h+'%';maze.appendChild(w)});const exit=document.createElement('div');exit.className='exit';exit.style.left='82%';exit.style.top='12%';maze.appendChild(exit);const p=document.createElement('div');p.className='player';p.style.left='10%';p.style.top='10%';maze.appendChild(p);}document.addEventListener('keydown',e=>{const p=document.querySelector('.player');if(!p)return;let x=parseFloat(p.style.left);let y=parseFloat(p.style.top);if(e.key==='ArrowLeft')x=Math.max(0,x-4);if(e.key==='ArrowRight')x=Math.min(90,x+4);if(e.key==='ArrowUp')y=Math.max(0,y-4);if(e.key==='ArrowDown')y=Math.min(80,y+4);p.style.left=x+'%';p.style.top=y+'%';const exit=document.querySelector('.exit');const ex=parseFloat(exit.style.left);const ey=parseFloat(exit.style.top);if(Math.abs(x-ex)<8&&Math.abs(y-ey)<8){score++;scoreEl.textContent=score;build();}});function start(){score=0;scoreEl.textContent=score;goalEl.textContent=goal;build();document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);build();</script></body></html>
