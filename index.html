<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Arcade Driving Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; user-select: none; pointer-events: none; }
        .stat-box { margin-bottom: 12px; padding: 6px 12px; background: rgba(0, 0, 0, 0.6); border-left: 4px solid #00f3ff; border-radius: 0 4px 4px 0; }
        .label { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8af8ff; margin-bottom: 2px; }
        .value { font-size: 24px; font-weight: bold; font-family: monospace; }
        #nitro-bar { width: 120px; height: 10px; background: #333; margin-top: 4px; border-radius: 5px; overflow: hidden; }
        #nitro-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.1s linear; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="ui">
        <div class="stat-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
        <div class="stat-box"><div class="label">Time</div><div class="value" id="time">0.00s</div></div>
        <div class="stat-box"><div class="label">Speed</div><div class="value" id="speed">0 km/h</div></div>
        <div class="stat-box">
            <div class="label">Nitro (SHIFT)</div>
            <div id="nitro-bar"><div id="nitro-fill"></div></div>
        </div>
    </div>

    <script>
        // --- Core Engine Initialize Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e14);
        scene.fog = new THREE.FogExp2(0x0a0e14, 0.007);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Lights Setup ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 100, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Environment Track Layout ---
        const trackGroup = [];
        
        // Ground Grid Floor Plane
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x11141a, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(1000, 100, 0x00f3ff, 0x172230);
        grid.position.y = 0.01;
        scene.add(grid);

        // Ramp Geometry Builder
        function createObstacleRamp(w, h, d, x, y, z, rotX, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.x = rotX;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            trackGroup.push(mesh);
        }

        // Stunt Prototyping World Elements
        createObstacleRamp(20, 2, 40, 0, 0.2, -60, 0.15, 0xff0055);
        createObstacleRamp(30, 2, 60, -40, 3, -120, -0.05, 0x00f3ff);

        // --- Car Construction Rig ---
        const car = new THREE.Group();
        car.position.set(0, 0.5, 0);
        scene.add(car);

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.2, metalness: 0.5 });
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 4), bodyMat);
        chassis.position.y = 0.4;
        chassis.castShadow = true;
        car.add(chassis);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 2), new THREE.MeshStandardMaterial({ color: 0x1a233a }));
        cabin.position.set(0, 0.85, -0.2);
        car.add(cabin);

        // Wheels Setup Layout
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 24).rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222, roughness: 0.9 });
        const wheels = [];
        const offsets = [{x:-1, z:1.2}, {x:1, z:1.2}, {x:-1, z:-1.2}, {x:1, z:-1.2}];

        offsets.forEach(offset => {
            const wMesh = new THREE.Mesh(wheelGeo, wheelMat);
            wMesh.position.set(offset.x, 0.4, offset.z);
            wMesh.castShadow = true;
            car.add(wMesh);
            wheels.push(wMesh);
        });

        // --- Controls Matrix Logic ---
        const keys = { w: false, s: false, a: false, d: false, shift: false };
        window.addEventListener('keydown', (e) => handleKey(e, true));
        window.addEventListener('keyup', (e) => handleKey(e, false));

        function handleKey(e, isDown) {
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') keys.w = isDown;
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') keys.s = isDown;
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.a = isDown;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.d = isDown;
            if (e.key === 'Shift') keys.shift = isDown;
        }

        // --- Physics Vector Mechanics ---
        let currentSpeed = 0;
        let nitroReserve = 100;
        let gameScore = 0;
        const velocity = new THREE.Vector3();
        const clock = new THREE.Clock();

        const uiScore = document.getElementById('score');
        const uiTime = document.getElementById('time');
        const uiSpeed = document.getElementById('speed');
        const uiNitro = document.getElementById('nitro-fill');

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            const dt = Math.min(clock.getDelta(), 0.1);
            let targetMaxSpeed = 50;

            // Handle Nitro Booster Boost
            if (keys.shift && nitroReserve > 0 && keys.w) {
                targetMaxSpeed = 90;
                nitroReserve -= dt * 35;
                bodyMat.color.setHex(0xff0055); // Change accent styling on boost
            } else {
                nitroReserve = Math.min(100, nitroReserve + dt * 10);
                bodyMat.color.setHex(0x00f3ff);
            }

            // Engine Handling Dynamics
            if (keys.w) currentSpeed = THREE.MathUtils.lerp(currentSpeed, targetMaxSpeed, dt * 2.5);
            else if (keys.s) currentSpeed = THREE.MathUtils.lerp(currentSpeed, -20, dt * 4);
            else currentSpeed = THREE.MathUtils.lerp(currentSpeed, 0, dt * 1.5);

            // Steer Turning Matrices
            if (keys.a) car.rotation.y += (currentSpeed / targetMaxSpeed) * 2.2 * dt;
            if (keys.d) car.rotation.y -= (currentSpeed / targetMaxSpeed) * 2.2 * dt;

            // Animate local space vectors
            const heading = new THREE.Vector3(0, 0, 1).applyQuaternion(car.quaternion);
            velocity.x = heading.x * currentSpeed;
            velocity.z = heading.z * currentSpeed;

            // Dynamic Surface Checking 
            let surfaceY = 0;
            const originVec = new THREE.Vector3(car.position.x, car.position.y + 3, car.position.z);
            const downRay = new THREE.Raycaster(originVec, new THREE.Vector3(0, -1, 0));
            const hitDetect = downRay.intersectObjects(trackGroup);

            if (hitDetect.length > 0 && hitDetect[0].distance <= 3.1) {
                surfaceY = (car.position.y + 3) - hitDetect[0].distance;
                car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, hitDetect[0].object.rotation.x, dt * 8);
            } else {
                car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, 0, dt * 2);
            }

            // Apply Translation
            if (car.position.y > surfaceY) {
                velocity.y -= 25 * dt; // Gravity Drop
            } else {
                velocity.y = 0;
                car.position.y = surfaceY;
            }

            car.position.addScaledVector(velocity, dt);

            // Visual Wheel Spin updates
            wheels.forEach(w => w.rotation.x += (currentSpeed * dt) / 0.4);

            // Update UI Engine Readouts
            uiTime.textContent = `${clock.getElapsedTime().toFixed(2)}s`;
            uiSpeed.textContent = `${Math.abs(Math.round(currentSpeed * 3))} km/h`;
            uiNitro.style.width = `${nitroReserve}%`;
            
            if (Math.abs(currentSpeed) > 5) {
                gameScore += Math.floor(Math.abs(currentSpeed) * dt * 0.2);
                uiScore.textContent = gameScore;
            }

            // Elastic Dynamic Chase Camera Follow System Rig
            const relativeCam = new THREE.Vector3(0, 2.5, -6.5).applyQuaternion(car.quaternion);
            camera.position.lerp(car.position.clone().add(relativeCam), dt * 7);
            camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 0.6, 0)));

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        gameLoop();
    </script>
</body>
</html>
