<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocked Arcade Hub</title>
  <style>
    /* Global Reset & Base Styling */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #0b0c10; color: #c5c6c7; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* Top Navigation Header */
    header { background-color: #1f2833; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 10; width: 100%; border-bottom: 2px solid #66fcf1; }
    .header-container { max-width: 1300px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; }
    .logo { font-size: 1.8rem; font-weight: 800; color: #66fcf1; text-transform: uppercase; cursor: pointer; text-shadow: 0 0 10px rgba(102, 252, 241, 0.3); }
    
    /* Search Bar Layout */
    .search-wrapper { position: relative; width: 100%; max-width: 400px; }
    .search-input { width: 100%; padding: 12px 20px; background-color: #0b0c10; border: 2px solid #45f3ff33; border-radius: 30px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
    .search-input:focus { border-color: #66fcf1; box-shadow: 0 0 10px rgba(102, 252, 241, 0.2); }

    /* Category Navigation */
    .categories { width: 100%; max-width: 1300px; margin: 25px auto 10px auto; padding: 0 20px; display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: #1f2833; border: 1px solid #45f3ff22; color: #c5c6c7; padding: 8px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .cat-btn:hover { border-color: #66fcf1; color: #66fcf1; }
    .cat-btn.active { background: #66fcf1; color: #0b0c10; border-color: #66fcf1; box-shadow: 0 0 15px rgba(102, 252, 241, 0.4); }

    /* Core Website Layout Viewports */
    main { flex: 1; max-width: 1300px; width: 100%; margin: 0 auto; padding: 20px; position: relative; }
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* GRID VIEW: Game Grid & Cards */
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .game-card { background: #1f2833; border-radius: 12px; overflow: hidden; border: 1px solid #2a3542; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; display: flex; flex-direction: column; position: relative; }
    .game-card:hover { transform: translateY(-5px); border-color: #66fcf1; box-shadow: 0 5px 20px rgba(102, 252, 241, 0.15); }
    .card-thumb { width: 100%; aspect-ratio: 16/10; background: linear-gradient(135deg, #121824, #0b0c10); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; transition: transform 0.3s; position: relative; }
    .game-card:hover .card-thumb { transform: scale(1.05); }
    .card-info { padding: 12px; display: flex; flex-direction: column; gap: 4px; background: #1f2833; z-index: 2; flex-grow: 1; }
    .card-title { font-size: 1rem; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-tag { font-size: 0.75rem; color: #66fcf1; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }

    /* THEATER VIEW: Game Player Arena */
    .player-area { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    .player-controls { display: flex; justify-content: space-between; align-items: center; background: #1f2833; padding: 12px 20px; border-radius: 8px; border: 1px solid #2a3542; }
    .back-btn { background: none; border: 1px solid #66fcf1; color: #66fcf1; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
    .back-btn:hover { background: #66fcf1; color: #0b0c10; box-shadow: 0 0 10px rgba(102, 252, 241, 0.3); }
    #playerTitle { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .fullscreen-btn { background: #66fcf1; color: #0b0c10; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .fullscreen-btn:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(102, 252, 241, 0.4); }
    
    /* Responsive Responsive Scaling Box for Canvas & Iframes */
    .game-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid #1f2833; }
    .game-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    /* Empty Grid Notification styling */
    .no-results { text-align: center; padding: 60px 20px; grid-column: 1 / -1; font-size: 1.2rem; color: #858688; }
  </style>
</head>

    </div>
  </header>
