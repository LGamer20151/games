<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Terrain Editor</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 1px solid #21262d;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 20px; }
        .ui-panel {
            margin: 10px 0;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }
        #inventory { color: #ff9800; }
        #status { color: #8b949e; }
        canvas {
            background-color: #74b9ff; /* Sky color */
            border: 2px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <header>
        <h1>Terrain Matrix Simulation Workspace</h1>
    </header>

    <div class="ui-panel">
        <div>Active Block: <span id="inventory">DIRT</span> (Press 'Q' to swap)</div>
        <div id="status">A/D = Move | SPACE = Jump | LEFT CLICK = Mine | RIGHT CLICK = Place</div>
    </div>

    <canvas id="gameCanvas" width="720" height="416"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const invDisplay = document.getElementById('inventory');

        // Prevent browser right-click menu popping up on the screen canvas
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        const blockSize = 32;
        const gravity = 0.4;

        // Player Variable definitions
        let player = {
            x: 100, y: 100,
            vx: 0, vy: 0,
            w: 20, h: 28,
            onGround: false
        };

        // Key states tracker
        let keys = {};
        let activeBlockType = 1; // 1 = Dirt, 2 = Stone, 3 = WoodPlanks
        const blockNames = { 1: "DIRT", 2: "STONE", 3: "WOOD PLANKS" };

        // Generate map grid matrix arrays
        const mapCols = 23; // 726 / 32
        const mapRows = 13; // 416 / 32
        let grid = [];

        function initMap() {
            for (let r = 0; r < mapRows; r++) {
                grid[r] = [];
                for (let c = 0; c < mapCols; c++) {
                    if (r > 8) {
                        grid[r][c] = 2; // Deep stone layer layers
                    } else if (r >= 6) {
                        grid[r][c] = 1; // Dirt surface layers
                    } else {
                        grid[r][c] = 0; // Empty air space
                    }
                }
            }
        }

        // Keyboard interaction events
        window.addEventListener('keydown', function(e) {
            keys[e.code] = true;
            if (e.code === 'KeyQ') {
                activeBlockType = activeBlockType === 3 ? 1 : activeBlockType + 1;
                invDisplay.innerText = blockNames[activeBlockType];
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Click interaction triggers
        canvas.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const mX = e.clientX - rect.left;
            const mY = e.clientY - rect.top;

            // Figure out exactly which row/col array position was clicked
            let col = Math.floor(mX / blockSize);
            let row = Math.floor(mY / blockSize);

            if (row >= 0 && row < mapRows && col >= 0 && col < mapCols) {
                if (e.button === 0) {
                    // Left Click: Mine block away to Air (0)
                    grid[row][col] = 0;
                } else if (e.button === 2) {
                    // Right Click: Place current block item if it is empty air space
                    if (grid[row][col] === 0) {
                        grid[row][col] = activeBlockType;
                    }
                }
            }
        });

        // Box bounding collider checks
        function checkCollision(x, y) {
            let left = Math.floor(x / blockSize);
            let right = Math.floor((x + player.w) / blockSize);
            let top = Math.floor(y / blockSize);
            let bottom = Math.floor((y + player.h) / blockSize);

            if (left < 0 || right >= mapCols || top < 0 || bottom >= mapRows) return true;

            for (let r = top; r <= bottom; r++) {
                for (let c = left; c <= right; c++) {
                    if (grid[r][c] > 0) return true; // Collides with any solid block
                }
            }
            return false;
        }

        // Logic processing engines loop updates
        function update() {
            // Horizontal Velocity movement checks
            player.vx = 0;
            if (keys['KeyA']) player.vx = -3;
            if (keys['KeyD']) player.vx = 3;

            // X Axis move and resolve hits
            player.x += player.vx;
            if (checkCollision(player.x, player.y)) {
                player.x -= player.vx;
            }

            // Y Axis Apply Gravity calculations
            player.vy += gravity;
            player.y += player.vy;
            player.onGround = false;

            if (checkCollision(player.x, player.y)) {
                player.y -= player.vy;
                if (player.vy > 0) {
                    player.onGround = true;
                }
                player.vy = 0;
            }

            // Jump Mechanic trigger handler
            if (keys['Space'] && player.onGround) {
                player.vy = -6.5;
                player.onGround = false;
            }
        }

        // Display Painter Screen Engine loop loops
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Render Map Blocks from Grid Array Matrix configurations
            for (let r = 0; r < mapRows; r++) {
                for (let c = 0; c < mapCols; c++) {
                    let type = grid[r][c];
                    if (type === 1) {
                        // Dirt block styling colors
                        ctx.fillStyle = '#8b5a2b';
                        ctx.fillRect(c * blockSize, r * blockSize, blockSize, blockSize);
                        ctx.fillStyle = '#2ecc71'; // Grass top rim
                        ctx.fillRect(c * blockSize, r * blockSize, blockSize, 6);
                    } else if (type === 2) {
                        // Stone block colors styling
                        ctx.fillStyle = '#7f8c8d';
                        ctx.fillRect(c * blockSize, r * blockSize, blockSize, blockSize);
                    } else if (type === 3) {
                        // Wood Plank styled colors
                        ctx.fillStyle = '#d35400';
                        ctx.fillRect(c * blockSize, r * blockSize, blockSize, blockSize);
                    }
                    
                    if (type > 0) {
                        ctx.strokeStyle = '#1a242f';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(c * blockSize, r * blockSize, blockSize, blockSize);
                    }
                }
            }

            // 2. Render Player Character Model Entity
            ctx.fillStyle = '#3498db'; // Red/Blue character color profile
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Silly detail eyes accent lines
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 12, player.y + 4, 6, 6);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initMap();
        gameLoop();
    </script>
</body>
</html>
