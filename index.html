<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <style>
    :root {
      --bg: #030914;
      --bg2: #0b1730;
      --panel: rgba(13, 22, 37, 0.82);
      --line: rgba(128, 217, 255, 0.45);
      --cyan: #7ee9ff;
      --blue: #77a9ff;
      --green: #9ef7c8;
      --text: #ebf7ff;
      --muted: rgba(235, 247, 255, 0.7);
      --shadow: rgba(94, 156, 255, 0.16);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, rgba(76, 126, 214, 0.28), transparent 34%), linear-gradient(180deg, var(--bg) 0%, #050b17 100%);
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 250px;
      background: rgba(9, 16, 27, 0.9);
      border-right: 1px solid var(--line);
      padding: 24px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      font-size: 24px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 18px;
      text-align: center;
    }
    .search-wrap { margin-bottom: 18px; }
    .search-wrap input {
      width: 100%;
      background: rgba(13, 22, 37, 0.9);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-wrap input:focus {
      border-color: rgba(126, 233, 255, 0.75);
      box-shadow: 0 0 18px rgba(118, 192, 255, 0.18);
    }
    .search-wrap input::placeholder { color: rgba(235, 247, 255, 0.5); }
    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    .nav-btn {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(15, 25, 41, 0.7);
      color: var(--text);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .nav-btn:hover,
    .nav-btn.active {
      background: linear-gradient(180deg, rgba(104, 169, 255, 0.22), rgba(70, 109, 204, 0.18));
      border-color: rgba(126, 233, 255, 0.7);
      box-shadow: 0 0 18px rgba(118, 192, 255, 0.18);
      color: var(--cyan);
      transform: translateX(2px);
    }
    .content { flex: 1; padding: 40px 28px 70px; }
    .hero { text-align: center; margin-bottom: 28px; }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(36px, 5vw, 72px);
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 12px;
    }
    .count {
      font-size: 12px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .game-card {
      display: block;
      position: relative;
      min-height: 240px;
      padding: 0;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(18, 31, 51, 0.95), rgba(9, 18, 30, 0.9));
      border: 1px solid var(--line);
      box-shadow: 0 0 18px var(--shadow);
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      overflow: hidden;
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 24px rgba(126, 233, 255, 0.18);
      border-color: rgba(126, 233, 255, 0.75);
    }
    .game-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--green));
      opacity: 0.9;
      z-index: 2;
    }
    .game-thumb {
      position: relative;
      height: 150px;
      display: flex;
      align-items: end;
      justify-content: flex-start;
      padding: 16px;
      border-bottom: 1px solid rgba(126, 233, 255, 0.18);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }
    .game-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 8, 14, 0.12), rgba(5, 7, 14, 0.8));
    }
    .game-thumb span {
      position: relative;
      z-index: 1;
      font-size: 18px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 1px;
      color: white;
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
      max-width: 80%;
    }
    .game-card-content {
      position: relative;
      padding: 18px 18px 16px;
      z-index: 1;
    }
    .game-card .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(126, 233, 255, 0.08);
      border: 1px solid rgba(126, 233, 255, 0.28);
      color: var(--cyan);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 700;
    }
    .game-card h2 {
      margin: 0 0 10px;
      font-size: clamp(20px, 2vw, 28px);
      letter-spacing: 1px;
    }
    .game-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }
    .play {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-size: 11px;
    }
    .play::after { content: "→"; font-size: 16px; }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px 12px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(9, 16, 27, 0.48);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
      .nav-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Game Hub</div>
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Search games..." aria-label="Search games" />
      </div>
      <div class="nav-group" id="navGroup"></div>
    </aside>
    <main class="content">
      <div class="hero">
        <h1>Pick a game</h1>
        <p class="subtitle">Choose your challenge</p>
      </div>
      <div class="count" id="gameCount">0 Games</div>
      <div class="grid" id="gameGrid"></div>
    </main>
  </div>
  <script>
    const genreStyles = {
      Shooter: { bg1: '#1d4ed8', bg2: '#7c3aed', accent: '#facc15', emoji: '🎯', scene: 'enemy' },
      Puzzle: { bg1: '#0ea5e9', bg2: '#22c55e', accent: '#fef3c7', emoji: '🧩', scene: 'tiles' },
      AI: { bg1: '#0f172a', bg2: '#14b8a6', accent: '#7dd3fc', emoji: '🤖', scene: 'circuit' },
      Action: { bg1: '#ef4444', bg2: '#f59e0b', accent: '#fef2f2', emoji: '⚡', scene: 'burst' },
      Skill: { bg1: '#16a34a', bg2: '#22d3ee', accent: '#dcfce7', emoji: '🏆', scene: 'balance' },
      Arcade: { bg1: '#ec4899', bg2: '#f59e0b', accent: '#fef9c3', emoji: '🕹️', scene: 'arcade' },
      Reflex: { bg1: '#7c3aed', bg2: '#06b6d4', accent: '#ddd6fe', emoji: '⚡', scene: 'speed' },
      Avoid: { bg1: '#f43f5e', bg2: '#fb7185', accent: '#fee2e2', emoji: '🛡️', scene: 'dodge' },
      Racing: { bg1: '#0f172a', bg2: '#60a5fa', accent: '#dbeafe', emoji: '🏎️', scene: 'track' },
      Adventure: { bg1: '#15803d', bg2: '#84cc16', accent: '#dcfce7', emoji: '🗺️', scene: 'journey' },
      Rhythm: { bg1: '#a21caf', bg2: '#ec4899', accent: '#f5d0fe', emoji: '🎵', scene: 'beat' },
      Physics: { bg1: '#1d4ed8', bg2: '#67e8f9', accent: '#dbeafe', emoji: '🧲', scene: 'gravity' },
      Driving: { bg1: '#2dd4bf', bg2: '#2563eb', accent: '#ecfeff', emoji: '🚗', scene: 'road' },
      Sports: { bg1: '#16a34a', bg2: '#65a30d', accent: '#f0fdf4', emoji: '🏀', scene: 'arena' },
      Logic: { bg1: '#0891b2', bg2: '#a78bfa', accent: '#ecfeff', emoji: '🧠', scene: 'logic' },
      Memory: { bg1: '#f59e0b', bg2: '#f97316', accent: '#fef3c7', emoji: '🧠', scene: 'memory' },
      Classic: { bg1: '#b91c1c', bg2: '#f97316', accent: '#ffe4e6', emoji: '👾', scene: 'classic' },
      Strategy: { bg1: '#2563eb', bg2: '#10b981', accent: '#ecfeff', emoji: '♟️', scene: 'board' },
      Drawing: { bg1: '#f59e0b', bg2: '#fb7185', accent: '#fff7ed', emoji: '🎨', scene: 'art' },
      Simulation: { bg1: '#6d28d9', bg2: '#a78bfa', accent: '#f3e8ff', emoji: '🧪', scene: 'lab' },
      Speed: { bg1: '#f97316', bg2: '#ef4444', accent: '#ffedd5', emoji: '⚡', scene: 'speed' },
      Platformer: { bg1: '#0ea5e9', bg2: '#34d399', accent: '#ecfeff', emoji: '🦘', scene: 'jump' },
      Chance: { bg1: '#d946ef', bg2: '#f59e0b', accent: '#fdf4ff', emoji: '🎲', scene: 'chance' },
      Word: { bg1: '#22c55e', bg2: '#14b8a6', accent: '#f0fdf4', emoji: '🔤', scene: 'letters' },
      Default: { bg1: '#0b1730', bg2: '#7ee9ff', accent: '#dbeafe', emoji: '🎮', scene: 'default' }
    };

    function createGameThumbnail(name, genre) {
      const style = genreStyles[genre] || genreStyles.Default;
      const initials = name
        .split(/\s|[-_]/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0]?.toUpperCase() || "")
        .join("") || "G";

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${style.bg1}"/>
              <stop offset="100%" stop-color="${style.bg2}"/>
            </linearGradient>
            <radialGradient id="glow" cx="50%" cy="30%" r="60%">
              <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </radialGradient>
          </defs>

          <rect width="800" height="500" fill="url(#bg)"/>
          <circle cx="640" cy="110" r="150" fill="url(#glow)" opacity="0.6"/>
          <circle cx="180" cy="380" r="170" fill="rgba(255,255,255,0.08)"/>
          <path d="M0 345 L160 250 L260 315 L400 200 L520 315 L670 200 L800 300 V500 H0Z" fill="rgba(0,0,0,0.15)"/>
          <path d="M0 390 L130 310 L220 350 L360 270 L490 360 L620 270 L800 360 V500 H0Z" fill="rgba(0,0,0,0.22)"/>

          <rect x="62" y="62" width="146" height="42" rx="21" fill="rgba(255,255,255,0.18)"/>
          <text x="88" y="90" font-size="22" font-weight="700" fill="white" font-family="Arial, Helvetica, sans-serif">${style.emoji}</text>
          <text x="120" y="90" font-size="22" font-weight="700" fill="white" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">${genre.toUpperCase()}</text>

          <g transform="translate(540 150)">
            <rect x="0" y="0" width="150" height="110" rx="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.24)"/>
            <circle cx="42" cy="36" r="18" fill="${style.accent}" opacity="0.9"/>
            <rect x="75" y="24" width="48" height="12" rx="6" fill="${style.accent}" opacity="0.8"/>
            <rect x="75" y="48" width="56" height="12" rx="6" fill="${style.accent}" opacity="0.5"/>
            <rect x="18" y="78" width="110" height="12" rx="6" fill="${style.accent}" opacity="0.35"/>
          </g>

          <g transform="translate(80 118)">
            <circle cx="140" cy="170" r="92" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)"/>
            <text x="140" y="188" text-anchor="middle" font-size="96" font-weight="800" fill="rgba(255,255,255,0.95)" font-family="Arial, Helvetica, sans-serif">${initials}</text>
          </g>

          <text x="75" y="390" font-size="56" font-weight="900" fill="rgba(255,255,255,0.96)" font-family="Arial, Helvetica, sans-serif">${name}</text>
        </svg>
      `;

      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    const games = [
      { name: "Galatrix", file: "galatrix.html", genre: "Shooter" },
      { name: "2048 Merge", file: "2048-merge.html", genre: "Puzzle" },
      { name: "AI Escape", file: "ai-escape.html", genre: "AI" },
      { name: "Arua", file: "arua.html", genre: "Action" },
      { name: "Balance Beam", file: "balance-beam.html", genre: "Skill" },
      { name: "Bowling Burst", file: "bowling-burst.html", genre: "Arcade" },
      { name: "Brick Breaker", file: "brickbreaker.html", genre: "Arcade" },
      { name: "Bubble Pop", file: "bubble-pop.html", genre: "Arcade" },
      { name: "Catapult", file: "catapult.html", genre: "Skill" },
      { name: "Chess", file: "chess.html", genre: "Strategy" },
      { name: "Chrome Chicken", file: "chromechicken.html", genre: "Arcade" },
      { name: "Color Switch", file: "color-switch.html", genre: "Reflex" },
      { name: "Comet Catch", file: "comet-catch.html", genre: "Arcade" },
      { name: "Dodge Grid", file: "dodge-grid.html", genre: "Avoid" },
      { name: "Drift Boss", file: "drift-boss.html", genre: "Racing" },
      { name: "Escape", file: "escape.html", genre: "Adventure" },
      { name: "Flappy Duck", file: "flappy-duck.html", genre: "Arcade" },
      { name: "Geometry Dash", file: "geometrydash.html", genre: "Rhythm" },
      { name: "Gravity Drop", file: "gravity-drop.html", genre: "Physics" },
      { name: "Gravity Sandbox", file: "gravity-sandbox.html", genre: "Physics" },
      { name: "Hill Climb", file: "hillclimb.html", genre: "Driving" },
      { name: "Hoop Hustle", file: "hoop-hustle.html", genre: "Sports" },
      { name: "Lights Out", file: "lights-out.html", genre: "Puzzle" },
      { name: "Line Slicer", file: "line-slicer.html", genre: "Arcade" },
      { name: "Memory Match", file: "memorymatch.html", genre: "Memory" },
      { name: "Minesweeper", file: "minesweeper.html", genre: "Logic" },
      { name: "Motorcycle Rave", file: "motorcyclerave.html", genre: "Racing" },
      { name: "Number Rush", file: "number-rush.html", genre: "Speed" },
      { name: "Obby", file: "obby.html", genre: "Platformer" },
      { name: "Orbit Catcher", file: "orbit-catcher.html", genre: "Arcade" },
      { name: "Pacman", file: "pacman.html", genre: "Classic" },
      { name: "Parking", file: "parking.html", genre: "Driving" },
      { name: "Pattern Lock", file: "pattern-lock.html", genre: "Puzzle" },
      { name: "Plinko", file: "plinko.html", genre: "Chance" },
      { name: "Precision Aim", file: "precision-aim.html", genre: "Shooter" },
      { name: "Quick Draw", file: "https://quickdraw.withgoogle.com/", genre: "Drawing" },
      { name: "Ragdoll Sim", file: "ragdollsim.html", genre: "Simulation" },
      { name: "Reaction Rush", file: "reaction-rush.html", genre: "Reflex" },
      { name: "Rhythm Rush", file: "rhythm-rush.html", genre: "Rhythm" },
      { name: "Simon Says", file: "simonsays.html", genre: "Memory" },
      { name: "Skate Sprint", file: "skate-sprint.html", genre: "Sports" },
      { name: "Sliding Puzzle", file: "slidingpuzzle.html", genre: "Puzzle" },
      { name: "Snake.io", file: "snake.io.html", genre: "Classic" },
      { name: "Soccer Swoop", file: "soccer-swoop.html", genre: "Sports" },
      { name: "Space Shooter", file: "spaceshooter.html", genre: "Shooter" },
      { name: "Spot the Difference", file: "spotthedifference.html", genre: "Puzzle" },
      { name: "Star Dodge", file: "star-dodge.html", genre: "Avoid" },
      { name: "Target Trick", file: "target-trick.html", genre: "Shooter" },
      { name: "Tic Tac Toe", file: "tictactoe.html", genre: "Puzzle" },
      { name: "Tile Hop", file: "tile-hop.html", genre: "Rhythm" },
      { name: "Treasure Hunt", file: "treasure-hunt.html", genre: "Adventure" },
      { name: "Whack a Mole", file: "whackamole.html", genre: "Arcade" },
      { name: "Word Scramble", file: "word-scramble.html", genre: "Word" },
      { name: "Wordle Infinite", file: "wordleinfinite.html", genre: "Word" }
    ];

    const gameGrid = document.getElementById("gameGrid");
    const navGroup = document.getElementById("navGroup");
    const gameCount = document.getElementById("gameCount");
    const searchInput = document.getElementById("searchInput");
    let activeCategory = "all";
    const categories = ["all", ...Array.from(new Set(games.map(game => game.genre)))];

    function renderNav() {
      navGroup.innerHTML = "";
      categories.forEach(category => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `nav-btn ${activeCategory === category ? "active" : ""}`;
        btn.textContent = category === "all" ? "Home" : category;
        btn.dataset.category = category;
        btn.addEventListener("click", () => {
          activeCategory = category;
          renderNav();
          renderGames();
        });
        navGroup.appendChild(btn);
      });
    }

    function getFilteredGames() {
      const searchTerm = searchInput.value.trim().toLowerCase();
      return games.filter(game => {
        const matchesCategory = activeCategory === "all" || game.genre === activeCategory;
        const matchesSearch = !searchTerm || game.name.toLowerCase().includes(searchTerm) || game.genre.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });
    }

    function renderGames() {
      const filtered = getFilteredGames();
      gameGrid.innerHTML = "";
      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No games match your search";
        gameGrid.appendChild(empty);
        gameCount.textContent = "0 Games";
        return;
      }

      filtered.forEach((game, index) => {
        const card = document.createElement("a");
        card.href = game.file;
        card.className = "game-card";
        card.setAttribute("aria-label", `Play ${game.name}`);
        if (game.file.startsWith("http")) {
          card.target = "_blank";
          card.rel = "noopener noreferrer";
        }

        const thumb = createGameThumbnail(game.name, game.genre);

        card.innerHTML = `
          <div class="game-thumb" style="background-image: url('${thumb}')">
            <span>${game.name}</span>
          </div>
          <div class="game-card-content">
            <div class="badge">${game.genre}</div>
            <h2>${game.name}</h2>
            <p>${activeCategory === "all" ? `Game ${index + 1}` : game.genre}</p>
            <div class="play">Play now</div>
          </div>
        `;
        gameGrid.appendChild(card);
      });
      gameCount.textContent = `${filtered.length} Games`;
    }

    searchInput.addEventListener("input", renderGames);
    renderNav();
    renderGames();
  </script>
</body>
</html>
