<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Workspace Module</title>
    <style>
        body { 
            background-color: #0b0f17; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid #24292f;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
        }
        #hud-keys { color: #f1c40f; }
        #hud-status { color: #2ecc71; margin-left: 15px; }
        canvas {
            background-color: #1e272c;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>2D Stickman Parkour Simulation</h1>
    </header>

    <div class="ui-panel">
        Keys Collected: <span id="hud-keys">0</span> / 1 | A/D or Arrows = Move | W/Up = Jump | S/Down = Slide <span id="hud-status"></span>
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const keysDisplay = document.getElementById('hud-keys');
        const statusDisplay = document.getElementById('hud-status');

        const gravity = 0.35;
        const friction = 0.85;

        let player = {
            x: 80,
            y: 200,
            vx: 0,
            vy: 0,
            width: 16,
            height: 38,
            speed: 4,
            jumpForce: 8.5,
            grounded: false,
            sliding: false,
            slideTimer: 0
        };

        let hasKey = false;
        let isLevelComplete = false;

        // Custom Static Platform Collision Boundaries
        let platforms = [
            { x: 0, y: 350, w: 250, h: 50 },
            { x: 320, y: 290, w: 140, h: 20 },
            { x: 520, y: 230, w: 180, h: 170 }
        ];

        let spikes = [
            { x: 250, y: 380, w: 70, h: 20 }
        ];

        let goldenKey = { x: 390, y: 240, w: 15, h: 15, collected: false };
        let ancientGate = { x: 620, y: 150, w: 20, h: 80, open: false };
        let goalPortal = { x: 660, y: 180, w: 20, h: 50 };

        let inputKeys = {};
        window.addEventListener('keydown', e => inputKeys[e.code] = true);
        window.addEventListener('keyup', e => inputKeys[e.code] = false);

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.w &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.h &&
                   obj1.y + obj1.height > obj2.y;
        }

        function update() {
            if (isLevelComplete) return;

            // Slide Logic (S Key or Down Arrow)
            if ((inputKeys['KeyS'] || inputKeys['ArrowDown']) && player.grounded && !player.sliding) {
                player.sliding = true;
                player.slideTimer = 25;
                player.height = 18; // Lower hitbox footprint
                player.y += 20;
            }

            if (player.sliding) {
                player.slideTimer--;
                if (inputKeys['KeyA'] || inputKeys['ArrowLeft']) player.vx -= 0.6;
                if (inputKeys['KeyD'] || inputKeys['ArrowRight']) player.vx += 0.6;
                
                if (player.slideTimer <= 0) {
                    player.sliding = false;
                    player.height = 38;
                    player.y -= 20;
                }
            } else {
                // Horizontal Movement Input Mapping
                if (inputKeys['KeyA'] || inputKeys['ArrowLeft']) player.vx -= 0.5;
                if (inputKeys['KeyD'] || inputKeys['ArrowRight']) player.vx += 0.5;
            }

            // Jump Action
            if ((inputKeys['KeyW'] || inputKeys['ArrowUp']) && player.grounded && !player.sliding) {
                player.vy = -player.jumpForce;
                player.grounded = false;
            }

            // Apply Basic Drag/Gravity Physics Vectors
            player.vx *= friction;
            player.vy += gravity;

            player.x += player.vx;
            
            // X Axis Platform Collision Intersections
            platforms.forEach(p => {
                if (checkCollision(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.width;
                    if (player.vx < 0) player.x = p.x + p.w;
                }
            });

            // Handle closed Gate boundaries
            if (!ancientGate.open && checkCollision(player, ancientGate)) {
                if (player.vx > 0) player.x = ancientGate.x - player.width;
            }

            player.y += player.vy;
            player.grounded = false;

            // Y Axis Platform Collision Intersections
            platforms.forEach(p => {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            });

            // Spikes Trap Core Intersection Hits
            spikes.forEach(s => {
                let hitBox = { x: player.x, y: player.y, width: player.width, height: player.height };
                if (checkCollision(hitBox, s)) {
                    resetPlayer();
                }
            });

            // Golden Key Pickup Vector Checking
            if (!goldenKey.collected) {
                let coinBox = { x: player.x, y: player.y, width: player.width, height: player.height };
                let targetKey = { x: goldenKey.x, y: goldenKey.y, width: goldenKey.w, height: goldenKey.h };
                if (checkCollision(coinBox, targetKey)) {
                    goldenKey.collected = true;
                    hasKey = true;
                    keysDisplay.innerText = "1";
                    statusDisplay.innerText = "ANCIENT GATE UNLOCKED!";
                }
            }

            // Unlocking Gate Event Checks
            if (hasKey && Math.abs(player.x - ancientGate.x) < 40) {
                ancientGate.open = true;
            }

            // Goal Completed Level Validation Check
            let finalGoal = { x: goalPortal.x, y: goalPortal.y, width: goalPortal.w, height: goalPortal.h };
            if (checkCollision(player, finalGoal)) {
                isLevelComplete = true;
                statusDisplay.innerText = "VICTORY! SQUIGGLE PORTAL REACHED!";
            }

            // Screen Border Bottom Fall Pit Fail
            if (player.y > canvas.height) {
                resetPlayer();
            }
        }

        function resetPlayer() {
            player.x = 80;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;
            player.sliding = false;
            player.height = 38;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Safe Environment Platforms
            ctx.fillStyle = '#2c3e50';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // 2. Draw Danger Spike Obstacles
            ctx.fillStyle = '#e74c3c';
            spikes.forEach(s => {
                ctx.fillRect(s.x, s.y, s.w, s.h);
            });

            // 3. Draw Golden Key Entity
            if (!goldenKey.collected) {
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(goldenKey.x, goldenKey.y, goldenKey.w, goldenKey.h);
            }

            // 4. Draw Interactive Lock Gate Structure
            if (!ancientGate.open) {
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(ancientGate.x, ancientGate.y, ancientGate.w, ancientGate.h);
            }

            // 5. Draw Goal Finish Squiggle Region
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(goalPortal.x, goalPortal.y, goalPortal.w, goalPortal.h);

            // 6. Paint Animated Vector Stickman Entity
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;

            let centerX = player.x + player.width / 2;
            let headY = player.y + 6;

            if (player.sliding) {
                // Modified Sliding Geometry Profiles
                ctx.beginPath();
                ctx.arc(player.x + 12, player.y + 6, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff'; ctx.fill();
                ctx.beginPath();
                ctx.moveTo(player.x + 12, player.y + 6);
                ctx.lineTo(player.x, player.y + 12);
                ctx.stroke();
            } else {
                // Standing/Jumping Classical Stick Skeleton Vector Layouts
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(centerX, headY, 5, 0, Math.PI * 2);
                ctx.fill();

                // Spine/Torso Line
                ctx.beginPath();
                ctx.moveTo(centerX, headY + 5);
                ctx.lineTo(centerX, headY + 20);

                // Arm Lines
                ctx.moveTo(centerX, headY + 8);
                ctx.lineTo(centerX - 10, headY + 14);
                ctx.moveTo(centerX, headY + 8);
                ctx.lineTo(centerX + 10, headY + 14);
