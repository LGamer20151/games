<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Simulation Matrix</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 1px solid #21262d;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 20px; }
        .ui-panel {
            margin: 10px 0;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .stats-bar { display: flex; gap: 30px; font-size: 16px; }
        #hearts { color: #ff2a2a; }
        #inventory { color: #ff9800; }
        #status { color: #8b949e; font-size: 13px; }
        canvas {
            background-color: #27ae60; /* Grass green world background */
            border: 2px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <header>
        <h1>Top-Down Adventure Simulation Matrix</h1>
    </header>

    <div class="ui-panel">
        <div class="stats-bar">
            <div>Health: <span id="hearts">❤❤❤❤❤</span></div>
            <div>Hotbar: <span id="inventory">OAK PLANKS</span> (Press 'Q' to cycle)</div>
        </div>
        <div id="status">W/A/S/D = Walk | LEFT CLICK = Mine | RIGHT CLICK = Place | Defend against the red Zombie Mobs!</div>
    </div>

    <canvas id="gameCanvas" width="768" height="480"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const invDisplay = document.getElementById('inventory');
        const heartsDisplay = document.getElementById('hearts');

        // Block right-clicks from throwing standard popups
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        const tileSize = 32;
        const cols = 24; // 768 / 32
        const rows = 15; // 480 / 32

        // Player configuration profile
        let player = {
            x: 120, y: 120,
            w: 22, h: 22,
            speed: 3,
            health: 5,
            damageCooldown: 0
        };

        // Grid contents tracking matrix array
        // 0=Grass, 1=Water, 2=Log, 3=Leaves, 4=Planks, 5=Stone, 6=Village Floor, 7=Village Wall
        let grid = [];
        const blockNames = { 4: "OAK PLANKS", 5: "STONE", 1: "WATER" };
        let activeSelection = 4;

        // Interactive entities array list (Wandering Zombies)
        let mobs = [
            { x: 500, y: 100, w: 22, h: 22, speed: 1.2, type: 'zombie' },
            { x: 600, y: 350, w: 22, h: 22, speed: 0.9, type: 'zombie' }
        ];

        let keys = {};
        window.addEventListener('keydown', function(e) {
            keys[e.code] = true;
            if (e.code === 'KeyQ') {
                if (activeSelection === 4) activeSelection = 5;
                else if (activeSelection === 5) activeSelection = 1;
                else activeSelection = 4;
                invDisplay.innerText = blockNames[activeSelection];
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Map layout populator scripts
        function initWorld() {
            for (let r = 0; r < rows; r++) {
                grid[r] = [];
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = 0; // Natural grass cover baseline
                    if (Math.random() < 0.03) grid[r][c] = 5; // Rock nodes
                }
            }

            // Spawn standard tree configurations
            spawnTree(2, 4);
            spawnTree(10, 3);

            // Procedurally assemble a small Villager House cluster structure (Village)
            buildVillageHouse(4, 12);
            buildVillageHouse(4, 18);
        }

        function spawnTree(rootR, rootC) {
            if (rootR >= 2 && rootR < rows && rootC >= 1 && rootC < cols - 1) {
                grid[rootR][rootC] = 2; // Trunk wood
                grid[rootR-1][rootC] = 2;
                grid[rootR-1][rootC-1] = 3; // Leaf canopy structures
                grid[rootR-1][rootC+1] = 3;
                grid[rootR-2][rootC] = 3;
            }
        }

        function buildVillageHouse(startR, startC) {
            // Generates floor tiles and surrounding wooden security boundaries (Villages)
            for (let r = startR; r < startR + 4; r++) {
                for (let c = startC; c < startC + 4; c++) {
                    if (r >= 0 && r < rows && c >= 0 && c < cols) {
                        if (r === startR || r === startR + 3 || c === startC || c === startC + 4 - 1) {
                            // Leave a single gap tile open to act as a front doorway
                            if (!(r === startR + 3 && c === startC + 1)) {
                                grid[r][c] = 7; // Cobblestone/Wall block structure
                            } else {
                                grid[r][c] = 6; // Inside wood pathway plank floor
                            }
                        } else {
                            grid[r][c] = 6; // Inside wood pathway floor
                        }
                    }
                }
            }
        }

        // Action block positioning tools click detectors
        canvas.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let c = Math.floor(clickX / tileSize);
            let r = Math.floor(clickY / tileSize);

            if (r >= 0 && r < rows && c >= 0 && c < cols) {
                if (e.button === 0) {
                    grid[r][c] = 0; // Mine block away back to standard grass
                } else if (e.button === 2) {
                    if (grid[r][c] === 0) {
                        grid[r][c] = activeSelection; // Paste block
                    }
                }
            }
        });

        // Bounding collision checks locator
        function hitsSolidBlock(x, y, w, h) {
            let left = Math.floor(x / tileSize);
            let right = Math.floor((x + w) / tileSize);
            let top = Math.floor(y / tileSize);
            let bottom = Math.floor((y + h) / tileSize);

            if (left < 0 || right >= cols || top < 0 || bottom >= rows) return true;

            for (let r = top; r <= bottom; r++) {
                for (let c = left; c <= right; c++) {
                    // Block type 1 (water), 2 (log), 3 (leaves), 4 (planks), 5 (stone), and 7 (village walls) block movement pathing
                    if (grid[r][c] === 1 || grid[r][c] === 2 || grid[r][c] === 3 || grid[r][c] === 4 || grid[r][c] === 5 || grid[r][c] === 7) {
                        return true;
                    }
                }
            }
            return false;
        }

        // Processing calculations engine loop loops
        function update() {
            if (player.health <= 0) return;

            let nextX = player.x;
            let nextY = player.y;

            if (keys['KeyW']) nextY -= player.speed;
            if (keys['KeyS']) nextY += player.speed;
            if (!hitsSolidBlock(player.x, nextY, player.w, player.h)) player.y = nextY;

            if (keys['KeyA']) nextX -= player.speed;
            if (keys['KeyD']) nextX += player.speed;
            if (!hitsSolidBlock(nextX, player.y, player.w, player.h)) player.x = nextX;

            if (player.damageCooldown > 0) player.damageCooldown--;

            // Zombie Mob Tracking AI (Aggressively pursues player player coordinate spaces)
            mobs.forEach(mob => {
                let dx = player.x - mob.x;
                let dy = player.y - mob.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 0) {
                    let moveX = (dx / distance) * mob.speed;
                    let moveY = (dy / distance) * mob.speed;

                    if (!hitsSolidBlock(mob.x + moveX, mob.y, mob.w, mob.h)) mob.x += moveX;
                    if (!hitsSolidBlock(mob.x, mob.y + moveY, mob.w, mob.h)) mob.y += moveY;
                }

                // Check collision directly with player model to deduct health hearts
                if (Math.abs(player.x - mob.x) < 20 && Math.abs(player.y - mob.y) < 20) {
                    if (player.damageCooldown === 0) {
                        player.health--;
                        player.damageCooldown = 40; // Temporary hit invincibility ticks
                        
                        // Redraw hearts indicator text string
                        let str = "";
                        for(let h=0; h<player.health; h++) str += "❤";
                        if(str === "") str = "GAME OVER";
                        heartsDisplay.innerText = str;
                    }
                }
            });
        }

        // Screen layout graphics drawer scripts
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Map Tiles from Grid Array configurations
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let type = grid[r][c];
                    
                    if (type === 1) ctx.fillStyle = '#2980b9';      // Water
