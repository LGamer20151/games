<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Physics Workspace</title>
    <style>
        body { 
            background-color: #0b0f17; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid #24292f;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
        }
        #hud { color: #ff9800; }
        #checkpoint-msg { color: #2ecc71; margin-left: 15px; display: none; }
        canvas {
            background-color: #74b9ff;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>Vector Bike Trials Simulation Matrix</h1>
    </header>

    <div class="ui-panel">
        Time: <span id="hud">0.0s</span> | W = Gas | S = Brake | A/D = Balance & Flips <span id="checkpoint-msg">CHECKPOINT!</span>
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hudDisplay = document.getElementById('hud');
        const cpMsg = document.getElementById('checkpoint-msg');

        const gravity = 0.16;
        const groundY = 330;

        let timeElapsed = 0;
        let isAlive = true;
        let isVictory = false;

        let bike = {
            x: 80,
            y: 200,
            vx: 0,
            vy: 0,
            angle: 0,
            rotVel: 0,
            radius: 14,
            speed: 0.20,
            onGround: false
        };

        let lastCheckpoint = { x: 80, y: 160 };
        let checkpoints = [
            { x: 400, hit: false },
            { x: 800, hit: false }
        ];

        let terrainPoints = [];
        function initTerrain() {
            terrainPoints = [];
            for (let x = 0; x <= 1500; x += 25) {
                let y = groundY + Math.sin(x * 0.012) * 35;
                if (x > 300 && x < 450) {
                    y -= (x - 300) * 0.5;
                }
                if (x >= 450 && x <= 600) {
                    y = groundY - 75;
                }
                if (x > 700 && x < 850) {
                    y += Math.sin((x - 700) * 0.04) * 50;
                }
                if (x >= 900 && x < 980) {
                    y = 500;
                }
                terrainPoints.push({ x: x, y: y });
            }
        }

        function getGroundHeight(xX) {
            for (let i = 0; i < terrainPoints.length - 1; i++) {
                if (xX >= terrainPoints[i].x && xX <= terrainPoints[i+1].x) {
                    let ratio = (xX - terrainPoints[i].x) / (terrainPoints[i+1].x - terrainPoints[i].x);
                    return terrainPoints[i].y + ratio * (terrainPoints[i+1].y - terrainPoints[i].y);
                }
            }
            return groundY;
        }

        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (!isAlive || isVictory) {
                if (keys['Space']) resetToCheckpoint();
                return;
            }

            timeElapsed += 1/60;
            hudDisplay.innerText = timeElapsed.toFixed(1) + "s";

            if (keys['KeyW'] || keys['ArrowUp']) {
                bike.vx += Math.cos(bike.angle) * bike.speed;
                bike.vy += Math.sin(bike.angle) * bike.speed;
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                bike.vx *= 0.90;
            }
            if (keys['KeyA'] || keys['ArrowLeft']) bike.rotVel -= 0.006;
            if (keys['KeyD'] || keys['ArrowRight']) bike.rotVel += 0.006;

            bike.rotVel *= 0.93;
            bike.angle += bike.rotVel;

            bike.vy += gravity;
            bike.vx *= 0.985;

            bike.x += bike.vx;
            bike.y += bike.vy;

            let currentFloorY = getGroundHeight(bike.x);
            if (bike.y + bike.radius >= currentFloorY) {
                bike.y = currentFloorY - bike.radius;
                bike.vy = 0;
                bike.onGround = true;

                let nextFloorX = bike.x + 15;
                let groundSlopeAngle = Math.atan2(getGroundHeight(nextFloorX) - currentFloorY, 15);
                bike.angle = bike.angle * 0.72 + groundSlopeAngle * 0.28;
            } else {
                bike.onGround = false;
            }

            checkpoints.forEach(cp => {
                if (!cp.hit && bike.x >= cp.x) {
                    cp.hit = true;
                    lastCheckpoint.x = cp.x;
                    lastCheckpoint.y = getGroundHeight(cp.x) - 30;
                    cpMsg.style.display = 'inline';
                    setTimeout(() => cpMsg.style.display = 'none', 1500);
                }
            });

            let normalizedAngle = Math.abs((bike.angle + Math.PI) % (Math.PI * 2) - Math.PI);
            if (bike.onGround && normalizedAngle > 1.4) {
                isAlive = false;
            }

            if (bike.y > 420) {
                isAlive = false;
            }

            if (bike.x >= 1250) {
                isVictory = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let cameraX = bike.x - 180;
            if (cameraX < 0) cameraX = 0;
            ctx.translate(-cameraX, 0);

            checkpoints.forEach(cp => {
                ctx.fillStyle = cp.hit ? '#2ecc71' : '#e74c3c';
                ctx.fillRect(cp.x, getGroundHeight(cp.x) - 40, 15, 10);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(cp.x, getGroundHeight(cp.x)); ctx.lineTo(cp.x, getGroundHeight(cp.x) - 40); ctx.stroke();
            });

            ctx.fillStyle = '#ffcc00'; ctx.fillRect(1250, 80, 16, 280);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText("FINISH", 1242, 70);

            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            if (terrainPoints.length > 0) {
                ctx.moveTo(terrainPoints[0].x, 400); // Fixed bracket error here
                terrainPoints.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(terrainPoints[terrainPoints.length-1].x, 400);
            }
            ctx.closePath(); ctx.fill();

            ctx.strokeStyle = '#d35400'; ctx.lineWidth = 4;
            ctx.beginPath();
            terrainPoints.forEach((p, index) => {
                if (index === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            ctx.save();
            ctx.translate(bike.x, bike.y);
            ctx.rotate(bike.angle);

            ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(-16, 4); ctx.lineTo(16, 4); ctx.lineTo(0, -10); ctx.closePath(); ctx.stroke();

            ctx.fillStyle = '#111'; ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(-16, 5, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(16, 5, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#2c3e50'; ctx.beginPath(); ctx.arc(0, -15, 6, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            ctx.restore();

            if (!isAlive) {
                ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0,0,700,400);
                ctx.fillStyle = '#ff2a2a'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("CRASHED", 350, 170);
                ctx.font = '16px sans-serif'; ctx.fillStyle = '#fff';
                ctx.fillText("Press SPACEBAR to reload checkpoint", 350, 210);
            } else if (isVictory) {
                ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0,0,700,400);
                ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("STAGE CLEAR!", 350, 170);
                ctx.font = '16px sans-serif'; ctx.fillStyle = '#fff';
                ctx.fillText("Finished in " + timeElapsed.toFixed(1) + "s! Space to restart", 350, 210);
            }
        }

        function resetToCheckpoint() {
            bike.x = lastCheckpoint.x;
            bike.y = lastCheckpoint.y;
            bike.vx = 0; bike.vy = 0; bike.angle = 0; bike.rotVel = 0;
            isAlive = true;
            if(isVictory) {
                timeElapsed = 0; isVictory = false;
                checkpoints.forEach(cp => cp.hit = false);
                lastCheckpoint = { x: 80, y: 160 };
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initTerrain();
        loop();
    </script>
</body>
</html>
