<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Madalin Sandbox</title>
    <style>
        body { 
            background-color: #0b0f17; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid #24292f;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
        }
        #hud-score { color: #f1c40f; }
        canvas {
            background-color: #000;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>3D Madalin Stunt Driving Sandbox</h1>
    </header>

    <div class="ui-panel">
        Coins Collected: <span id="hud-score">0</span> / 6 | WASD / Arrows = Drive | Shift = Nitro | R = Reset Car Position
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('hud-score');

        // Pseudo-3D Camera & FOV parameters
        const fov = 300;
        const cx = 350;
        const cy = 250;

        // 3D Sports Car Physics Profile
        let car = {
            x: 0,
            y: 0,
            z: 100,
            vx: 0,
            vz: 0,
            angle: 0,
            speed: 0,
            maxSpeed: 10,
            accel: 0.15,
            friction: 0.97,
            turnSpeed: 0.04
        };

        // 3D Objects Matrix Configuration (World Space Coordinates)
        let coins = [
            {x: -150, z: 400, collected: false},
            {x: 150, z: 400, collected: false},
            {x: 0, z: 600, collected: false},
            {x: -300, z: 800, collected: false},
            {x: 300, z: 800, collected: false},
            {x: 0, z: 1000, collected: false}
        ];

        // 3D Stunt Obstacle Loops & Ramps Vertices
        let loops = [
            {x: -100, z: 500, size: 40, color: '#bdc3c7'},
            {x: 100, z: 700, size: 50, color: '#95a5a6'},
            {x: -200, z: 900, size: 60, color: '#7f8c8d'}
        ];

        let score = 0;
        let keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            let currentAccel = car.accel;
            let currentMaxSpeed = car.maxSpeed;
            
            // Nitro Trigger
            if (keys['ShiftLeft'] || keys['ShiftRight']) {
                currentAccel = car.accel * 1.8;
                currentMaxSpeed = car.maxSpeed * 1.6;
            }

            // Drive inputs
            if (keys['KeyW'] || keys['ArrowUp']) {
                if (car.speed < currentMaxSpeed) car.speed += currentAccel;
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                if (car.speed > -currentMaxSpeed / 2) car.speed -= currentAccel;
            } else {
                car.speed *= car.friction;
            }

            // Steering Vectors
            if (Math.abs(car.speed) > 0.1) {
                let reverseTurn = car.speed < 0 ? -1 : 1;
                if (keys['KeyA'] || keys['ArrowLeft']) car.angle -= car.turnSpeed * reverseTurn;
                if (keys['KeyD'] || keys['ArrowRight']) car.angle += car.turnSpeed * reverseTurn;
            }

            // Coordinate Updates
            car.vx = Math.sin(car.angle) * car.speed;
            car.vz = Math.cos(car.angle) * car.speed;
            car.x += car.vx;
            car.z += car.vz;

            // Sandbox Arena Boundary Constraints
            if (car.x < -600) { car.x = -600; car.speed *= -0.3; }
            if (car.x > 600) { car.x = 600; car.speed *= -0.3; }
            if (car.z < 50) { car.z = 50; car.speed *= -0.3; }
            if (car.z > 1400) { car.z = 1400; car.speed *= -0.3; }

            // Manual Position Recovery Reset
            if (keys['KeyR']) {
                car.x = 0; car.z = 100; car.speed = 0; car.angle = 0;
            }

            // 3D Intersection Coin Collection Verification
            coins.forEach(coin => {
                if (!coin.collected) {
                    let dx = car.x - coin.x;
                    let dz = car.z - coin.z;
                    if (Math.sqrt(dx*dx + dz*dz) < 35) {
                        coin.collected = true;
                        score++;
                        scoreDisplay.innerText = score;
                    }
                }
            });
        }

        function project3D(x, y, z) {
            // Transform World space positions relative to active Camera placement vectors
            let relX = x - car.x;
            let relZ = z - car.z;

            // Rotate coordinate system opposite of Car direction angle to form Viewport Camera Matrices
            let cos = Math.cos(-car.angle);
            let sin = Math.sin(-car.angle);
            
            let rotX = relX * cos - relZ * sin;
            let rotZ = relX * sin + relZ * cos;

            // Perspective division processing calculations
            if (rotZ <= 5) return null; // Behind view clip plane limit

            let scale = fov / rotZ;
            return {
                x: cx + rotX * scale,
                y: cy + y * scale,
                size: scale
            };
        }

        function draw() {
            // Draw sky and floor horizon backdrop panels
            ctx.fillStyle = '#1a2436'; ctx.fillRect(0, 0, 700, 200);
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, 200, 700, 200);

            // Draw Horizon Boundary Grid strip
            ctx.strokeStyle = '#34495e'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, 200); ctx.lineTo(700, 200); ctx.stroke();

            // Build dynamic sorted rendering element queues list array
            let renderQueue = [];

            // A. Populate 3D Coins elements inside sorting indexes
            coins.forEach((coin, idx) => {
                if (!coin.collected) {
                    let proj = project3D(coin.x, 30, coin.z);
                    if (proj) {
                        renderQueue.push({ z: coin.z - car.z, type: 'coin', p: proj });
                    }
                }
            });

            // B. Populate 3D Loop track objects inside rendering queues
            loops.forEach(loop => {
                let proj = project3D(loop.x, 40, loop.z);
                if (proj) {
                    renderQueue.push({ z: loop.z - car.z, type: 'loop', p: proj, orig: loop });
                }
            });

            // Sort arrays from furthest elements to closest ones (Painters Depth Rendering Order)
            renderQueue.sort((a, b) => b.z - a.z);

            // Execute final screen projection geometry painters
            renderQueue.forEach(obj => {
                let p = obj.p;
                if (obj.type === 'coin') {
                    let r = Math.max(2, 6 * p.size * 0.05);
                    ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
                } 
                else if (obj.type === 'loop') {
                    let size = obj.orig.size * p.size * 0.05;
                    ctx.strokeStyle = obj.orig.color; ctx.lineWidth = Math.max(2, p.size * 0.15);
                    ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill();
                }
            });

            // 5. Draw First-Person Cockpit Dashboard / Hood View Overlay Accent
            ctx.fillStyle = '#ff2a2a'; 
            ctx.beginPath();
            ctx.moveTo(150, 400); ctx.lineTo(250, 330); ctx.lineTo(450, 330); ctx.lineTo(550, 400);
            ctx.closePath(); ctx.fill();

            // Carbon trim lines dashboard detail lines
            ctx.strokeStyle = '#111'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(250, 330); ctx.lineTo(450, 330); ctx.stroke();

            // Nitro fire indicator overlay indicators flashing panel
            if ((keys['ShiftLeft'] || keys['ShiftRight']) && Math.abs(car.speed) > 1) {
                ctx.fillStyle = '#ff9800';
                ctx.fillRect(280, 345, 140, 15);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.fillText("NITRO INJECTION ACTIVE", 350, 357);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
