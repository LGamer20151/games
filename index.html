<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Math Workspace</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid #21262d;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
        #score { color: #58a6ff; }
        #status { color: #8b949e; font-size: 14px; margin-top: 5px; text-align: center;}
        canvas {
            background-color: #000000;
            border: 2px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>Web-Based Probability Engine</h1>
    </header>

    <div class="ui-panel">
        Balance: $<span id="score">100</span>
        <div id="status">Press SPACEBAR to Drop Ball ($10)</div>
    </div>

    <canvas id="plinkoCanvas" width="480" height="420"></canvas>

    <script>
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const statusDisplay = document.getElementById('status');

        // Game State Engine Variables
        let score = 100;
        let state = 1; // 1 = Waiting, 0 = Ball Falling
        let ballX = 0;
        let ballY = 20;
        let ballVX = 0;
        let ballVY = 0;
        const gravity = 0.25;
        const friction = 0.99;

        // HIGH-DENSITY GRID GENERATOR (Fills the entire frame layout)
        const pegs = [];
        const rows = 11;
        const cols = 13;
        const startY = 60;
        const rowSpacing = 28;
        const pegSpacing = 36;

        for (let r = 0; r < rows; r++) {
            let y = startY + r * rowSpacing;
            // Shift every second row slightly sideways for a perfect zigzag mesh pattern
            let offsetX = (r % 2 === 0) ? 0 : pegSpacing / 2;
            let startX = 24 - offsetX;

            for (let c = 0; c <= cols; c++) {
                let x = startX + c * pegSpacing;
                // Only add the dot if it fits nicely inside the screen boundaries
                if (x > 15 && x < 465) {
                    pegs.push({ x: x, y: y });
                }
            }
        }

        // Expanded Prize Slots (Includes high risk/reward on outer edges)
        const buckets = [
            { startX: 0, endX: 80, color: '#ff2a2a', label: '0.1x', mult: 0.1 },    // Dangerous Edges
            { startX: 80, endX: 160, color: '#404040', label: '0.5x', mult: 0.5 },   
            { startX: 160, endX: 210, color: '#FF8000', label: '1x', mult: 1 },    
            { startX: 210, endX: 270, color: '#00FF00', label: '3x', mult: 3 },    // BUFFED THE CENTER SLOT TO 3X!
            { startX: 270, endX: 320, color: '#FF8000', label: '1x', mult: 1 },    
            { startX: 320, endX: 400, color: '#404040', label: '0.5x', mult: 0.5 },   
            { startX: 400, endX: 480, color: '#ff2a2a', label: '0.1x', mult: 0.1 }     
        ];

        // Trigger Ball Drops
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && state === 1) {
                if (score >= 10) {
                    score -= 10;
                    scoreDisplay.innerText = score;
                    statusDisplay.innerText = "Analyzing dense node collisions...";
                    
                    // Allows dropping across a wider top entry point
                    ballX = 240 + (Math.random() * 60 - 30); 
                    ballY = 20;
                    ballVX = 0;
                    ballVY = 0;
                    state = 0; 
                } else {
                    statusDisplay.innerText = "Insufficient funds! Refresh tab to restart.";
                }
            }
        });

        // Math Physics Processing Loop
        function gameLoop() {
            if (state === 0) {
                ballVY += gravity;
                ballVX *= friction;
                ballX += ballVX;
                ballY += ballVY;

                // Collision math loop for the entire grid array
                pegs.forEach(peg => {
                    let dx = ballX - peg.x;
                    let dy = ballY - peg.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 11) { 
                        ballVY = -2.0; // Bounces up from hit pins
                        ballVX = (Math.random() * 2.6 - 1.3) + (dx * 0.28); 
                    }
                });

                // Screen border limits
                if (ballX < 10) { ballX = 10; ballVX *= -0.5; }
                if (ballX > 470) { ballX = 470; ballVX *= -0.5; }

                // Landing logic at the bottom row (Y value)
                if (ballY >= 370) {
                    for (let i = 0; i < buckets.length; i++) {
                        if (ballX >= buckets[i].startX && ballX < buckets[i].endX) {
                            let winnings = 10 * buckets[i].mult;
                            score += winnings;
                            scoreDisplay.innerText = score;
                            statusDisplay.innerText = `Landed in ${buckets[i].label} slot! (+$${winnings}). Press SPACEBAR to play again.`;
                            break;
                        }
                    }
                    state = 1; 
                }
            }

            // Graphic Painter Render Loops
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw prize collection boxes
            buckets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.startX, 370, b.endX - b.startX, 50);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(b.label, b.startX + (b.endX - b.startX) / 2, 400);
            });

            // Draw peg nodes array pattern
            ctx.fillStyle = "#ffffff";
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Plinko active matrix ball
            if (state === 0) {
                ctx.fillStyle = "#ff00ff";
                ctx.beginPath();
                ctx.arc(ballX, ballY, 7, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
