<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Physics Workspace</title>
    <style>
        body { 
            background-color: #0b0f17; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid #24292f;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
        }
        #hud { color: #ff9800; }
        canvas {
            background-color: #1a233a;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>Vector Bike Trials Simulation Matrix</h1>
    </header>

    <div class="ui-panel">
        Time: <span id="hud">0.0s</span> | W = Gas | S = Brake | A/D = Lean & Backflip / Frontflip
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hudDisplay = document.getElementById('hud');

        const gravity = 0.16;
        const groundY = 330;

        let timeElapsed = 0;
        let isAlive = true;
        let isVictory = false;

        let bike = {
            x: 80,
            y: 200,
            vx: 0,
            vy: 0,
            angle: 0,
            rotVel: 0,
            radius: 14,
            speed: 0.18,
            maxSpeed: 5.5,
            onGround: false
        };

        let terrainPoints = [];
        function initTerrain() {
            terrainPoints = [];
            for (let x = 0; x <= 1400; x += 25) {
                let y = groundY + Math.sin(x * 0.015) * 45 + Math.cos(x * 0.04) * 12;
                if (x > 500 && x < 620) {
                    y -= (x - 500) * 0.65;
                }
                if (x >= 620 && x < 680) {
                    y = 500;
                }
                terrainPoints.push({ x: x, y: y });
            }
        }

        function getGroundHeight(xX) {
            for (let i = 0; i < terrainPoints.length - 1; i++) {
                if (xX >= terrainPoints[i].x && xX <= terrainPoints[i+1].x) {
                    let ratio = (xX - terrainPoints[i].x) / (terrainPoints[i+1].x - terrainPoints[i].x);
                    return terrainPoints[i].y + ratio * (terrainPoints[i+1].y - terrainPoints[i].y);
                }
            }
            return groundY;
        }

        let keys = {};
        window.addEventListener('keydown', function(e) {
            keys[e.code] = true;
        });
        window.addEventListener('keyup', function(e) {
            keys[e.code] = false;
        });

        function update() {
            if (!isAlive || isVictory) {
                if (keys['KeyR'] || keys['Space']) resetGame();
                return;
            }

            timeElapsed += 1/60;
            hudDisplay.innerText = timeElapsed.toFixed(1) + "s";

            if (keys['KeyW']) {
                bike.vx += Math.cos(bike.angle) * bike.speed;
                bike.vy += Math.sin(bike.angle) * bike.speed;
            }
            if (keys['KeyS']) {
                bike.vx *= 0.92;
            }

            if (keys['KeyA']) bike.rotVel -= 0.005;
            if (keys['KeyD']) bike.rotVel += 0.005;

            bike.rotVel *= 0.94;
            bike.angle += bike.rotVel;

            bike.vy += gravity;
            bike.vx *= 0.99;

            bike.x += bike.vx;
            bike.y += bike.vy;

            let currentFloorY = getGroundHeight(bike.x);
            if (bike.y + bike.radius >= currentFloorY) {
                bike.y = currentFloorY - bike.radius;
                bike.vy = 0;
                bike.onGround = true;

                let nextFloorX = bike.x + 15;
                let groundSlopeAngle = Math.atan2(getGroundHeight(nextFloorX) - currentFloorY, 15);
                bike.angle = bike.angle * 0.75 + groundSlopeAngle * 0.25;
            } else {
                bike.onGround = false;
            }

            let normalizedAngle = Math.abs((bike.angle + Math.PI) % (Math.PI * 2) - Math.PI);
            if (bike.onGround && normalizedAngle > 1.35) {
                isAlive = false;
                hudDisplay.innerText = "CRASHED! Press SPACE to Restart.";
            }

            if (bike.y > 420) {
                isAlive = false;
                hudDisplay.innerText = "WASTED! Fell into the pit. Press SPACE to Restart.";
            }

            if (bike.x >= 1100) {
                isVictory = true;
                hudDisplay.innerText = "VICTORY! Finished in: " + timeElapsed.toFixed(1) + "s. Press SPACE to play again!";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let cameraX = bike.x - 180;
            if (cameraX < 0) cameraX = 0;
            ctx.translate(-cameraX, 0);

            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(1100, 100, 15, 250);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText("FINISH ARCH", 1070, 90);

            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            if (terrainPoints.length > 0) {
                ctx.moveTo(terrainPoints[0].x, 400);
                terrainPoints.forEach(function(p) {
                    ctx.lineTo(p.x, p.y);
                });
                ctx.lineTo(terrainPoints[terrainPoints.length-1].x, 400);
            }
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 4;
            ctx.beginPath();
            terrainPoints.forEach(function(p, index) {
                if (index === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            ctx.save();
            ctx.translate(bike.x, bike.y);
            ctx.rotate(bike.angle);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-16, 5);
            ctx.lineTo(16, 5);
            ctx.lineTo(0, -12);
            ctx.closePath();
            ctx.stroke();

            ctx.fillStyle = '#111';
            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(-16, 6, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(16, 6, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#e74c3c';
            ctx.beginPath(); ctx.arc(0, -16, 6, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
            ctx.restore();

            if (!isAlive) {
                ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0,0,700,400);
                ctx.fillStyle = '#ff2a2a'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("DRIVER CRASHED", 350, 180);
                ctx.font = '16px sans-serif'; ctx.fillStyle = '#fff';
                ctx.fillText("Press SPACEBAR to Respawn", 350, 220);
            } else if (isVictory) {
                ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0,0,700,400);
                ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("STAGE COMPLETED!", 350, 180);
                ctx.font = '16px sans-serif'; ctx.fillStyle = '#fff';
                ctx.fillText("Press SPACEBAR to play again", 350, 220);
            }
        }

        function resetGame() {
            bike.x = 80; bike.y = 160; bike.vx = 0; bike.vy = 0; bike.angle = 0; bike.rotVel = 0;
            timeElapsed = 0; isAlive = true; isVictory = false;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initTerrain();
        loop();
    </script>
</body>
</html>
