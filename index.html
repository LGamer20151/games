<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Plinko // Vector Core</title>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        h1 {
            margin-bottom: 5px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #f59e0b;
        }
        canvas {
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #334155;
            cursor: pointer;
        }
        .instructions {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <h1>ARCADE PLINKO</h1>
    <div id="score-board">SCORE: <span id="score-val">0</span></div>
    
    <canvas id="plinkoCanvas" width="600" height="700"></canvas>
    
    <div class="instructions">
        💡 <strong>How to Play:</strong> Move your mouse over the top board area and <strong>click anywhere</strong> to drop a ball! Watch it bounce through the pegs into a scoring slot.
    </div>

    <script>
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-val');

        let score = 0;
        const gravity = 0.2;
        const bounce = 0.55; // Bounciness factor

        // Game Arrays
        const balls = [];
        const pegs = [];
        const buckets = [];
        const effects = [];

        // Setup Score Buckets at bottom
        const bucketCounts = 9;
        const bucketWidth = canvas.width / bucketCounts;
        const bucketScores =;
        const bucketColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#22c55e', '#eab308', '#f97316', '#ef4444'];

        for (let i = 0; i < bucketCounts; i++) {
            buckets.push({
                x: i * bucketWidth,
                y: canvas.height - 50,
                w: bucketWidth,
                h: 50,
                score: bucketScores[i],
                color: bucketColors[i],
                flash: 0
            });
        }

        // Setup Triangle Grid of Pegs
        const rows = 10;
        const startY = 120;
        const rowSpacing = 45;
        const pegSpacing = 45;

        for (let r = 0; r < rows; r++) {
            const pegsInRow = r + 3; 
            const rowWidth = (pegsInRow - 1) * pegSpacing;
            const startX = (canvas.width - rowWidth) / 2;

            for (let p = 0; p < pegsInRow; p++) {
                pegs.push({
                    x: startX + (p * pegSpacing),
                    y: startY + (r * rowSpacing),
                    radius: 5,
                    pulse: 0
                });
            }
        }

        // Mouse Tracker for visual aid
        let mouseX = canvas.width / 2;
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        // Drop Ball on Click
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Restrict spawning to the top clear zone
            if (clickY < 80) {
                balls.push({
                    x: clickX,
                    y: clickY,
                    vx: (Math.random() - 0.5) * 1.5, // slight initial random sway
                    vy: 2,
                    radius: 9,
                    color: '#38bdf8'
                });
            }
        });

        // Spawn scoring text particle effect
        function spawnEffect(x, y, text, color) {
            effects.push({ x, y, text, color, alpha: 1, vy: -1 });
        }

        // Game Loop
        function update() {
            // Update Balls Physics
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.vy += gravity;
                b.x += b.vx;
                b.y += b.vy;

                // Wall Collisions
                if (b.x - b.radius < 0) {
                    b.x = b.radius;
                    b.vx *= -bounce;
                } else if (b.x + b.radius > canvas.width) {
                    b.x = canvas.width - b.radius;
                    b.vx *= -bounce;
                }

                // Peg Collisions
                pegs.forEach(peg => {
                    let dx = b.x - peg.x;
                    let dy = b.y - peg.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let minDist = b.radius + peg.radius;

                    if (dist < minDist) {
                        // Push out of overlapping peg
                        let overlap = minDist - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;

                        b.x += nx * overlap;
                        b.y += ny * overlap;

                        // Calculate bounce vector
                        let dotProduct = b.vx * nx + b.vy * ny;
                        b.vx = (b.vx - 2 * dotProduct * nx) * bounce;
                        b.vy = (b.vy - 2 * dotProduct * ny) * bounce;

                        // Add small friction/chaos randomness to avoid stuck paths
                        b.vx += (Math.random() - 0.5) * 0.4;

                        peg.pulse = 8; // trigger flash animation
                    }
                });

                // Check Bucket / Slot Landing
                if (b.y + b.radius >= canvas.height - 45) {
                    // Determine which bucket it fell into
                    for (let j = 0; j < buckets.length; j++) {
                        let bucket = buckets[j];
                        if (b.x >= bucket.x && b.x <= bucket.x + bucket.w) {
                            score += bucket.score;
                            scoreDisplay.textContent = score;
                            bucket.flash = 15; // Flash effect
                            spawnEffect(bucket.x + bucket.w/2, bucket.y - 10, `+${bucket.score}`, bucket.color);
                            break;
                        }
                    }
                    balls.splice(i, 1); // Delete ball
                }
            }

            // Decay visual animations
            pegs.forEach(p => { if (p.pulse > 0) p.pulse--; });
            buckets.forEach(b => { if (b.flash > 0) b.flash--; });
            for (let i = effects.length - 1; i >= 0; i--) {
                effects[i].y += effects[i].vy;
                effects[i].alpha -= 0.02;
                if (effects[i].alpha <= 0) effects.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Top Spawn Guideline Tracker
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(mouseX, 0);
            ctx.lineTo(mouseX, 80);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Top Zone border
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 80);
            ctx.lineTo(canvas.width, 80);
            ctx.stroke();

            // Draw Pegs
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.radius + (peg.pulse * 0.4), 0, Math.PI * 2);
                ctx.fillStyle = peg.pulse > 0 ? '#f43f5e' : '#94a3b8';
                ctx.shadowBlur = peg.pulse > 0 ? 15 : 0;
                ctx.shadowColor = '#f43f5e';
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Draw Score Slots / Buckets
            buckets.forEach(bucket => {
                ctx.fillStyle = bucket.flash > 0 ? '#ffffff' : bucket.color;
                ctx.fillRect(bucket.x + 2, bucket.y, bucket.w - 4, bucket.h);

                // Slot Dividers
                ctx.fillStyle = '#475569';
                ctx.fillRect(bucket.x, bucket.y - 15, 4, bucket.h + 15);

                // Score Values text
                ctx.fillStyle = bucket.flash > 0 ? '#000000' : '#0f172a';
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(bucket.score, bucket.x + bucket.w / 2, bucket.y + 32);
            });

            // Draw Balls
            balls.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Draw Floating Floating Text Effects
            effects.forEach(eff => {
                ctx.fillStyle = eff.color;
                ctx.globalAlpha = eff.alpha;
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(eff.text, eff.x, eff.y);
                ctx.globalAlpha = 1.0;
            });
        }

        function loop() {
            update();
            draw();
