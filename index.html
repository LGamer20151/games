<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Unblocked Games Site</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #fff; padding: 40px 20px; }
    header { max-width: 1200px; margin: 0 auto 40px auto; text-align: center; }
    h1 { font-size: 2.5rem; color: #00f2fe; margin-bottom: 10px; }
    p { color: #aaa; }
    
    /* Responsive Game Grid */
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
    
    /* Game Card Styling */
    .game-card { background: #1a1a1e; border-radius: 12px; overflow: hidden; text-decoration: none; color: #fff; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #2a2a30; display: block; }
    .game-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0, 242, 254, 0.2); border-color: #00f2fe; }
    .thumbnail { width: 100%; aspect-ratio: 16/10; background: #25252b; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .info { padding: 15px; }
    .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
    .category { font-size: 0.8rem; color: #00f2fe; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>
</head>
<body>

  <header>
    <h1>Unblocked Arcade</h1>
    <p>Select a game to start playing instantly</p>
  </header>

  <!-- The container where JavaScript will inject your games -->
  <main class="game-grid" id="gameGrid"></main>

  <script>
    // 🗂️ CENTRAL GAME INDEX: Add or edit games here
    const gameIndex = [
      {
        id: "egg-helix",
        title: "Egg Helix",
        url: "https://amazonaws.com",
        emoji: "🥚", // Fallback icon if you don't have a thumbnail image file yet
        category: "Arcade"
      },
      {
        id: "cluster-rush",
        title: "Cluster Rush",
        url: "https://amazonaws.com", // Example placeholder link
        emoji: "🚚",
        category: "Skill / 3D"
      }
    ];

    // Function to render the game cards to the homepage grid
    function loadGames() {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = gameIndex.map(game => `
        <a href="egghelix.html?game=${game.id}" class="game-card">
          <div class="thumbnail">${game.emoji}</div>
          <div class="info">
            <div class="category">${game.category}</div>
            <div class="title">${game.title}</div>
          </div>
        </a>
      `).join('');
    }

    // Run the loop when the page opens
    window.onload = loadGames;
  </script>

</body>
</html>
