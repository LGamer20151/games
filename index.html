<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Math Workspace</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { text-align: center; padding: 20px; border-bottom: 1px solid #21262d; width: 100%; background: #161b22; }
        h1 { margin: 0; color: #58a6ff; font-size: 24px; }
        p { margin: 5px 0 0 0; color: #8b949e; font-size: 14px; }
        .arcade-container { display: flex; justify-content: center; gap: 20px; margin: 40px 0; }
        .game-card { border: 1px solid #30363d; padding: 20px; border-radius: 6px; background: #161b22; width: 240px; text-align: center; }
        .game-card h3 { margin-top: 0; color: #ff7b72; }
        .play-btn { display: inline-block; background: #238636; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 6px; margin-top: 15px; }
        .game-frame-container { display: none; width: 640px; height: 480px; border: 2px solid #30363d; border-radius: 6px; margin-top: 20px; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <header>
        <h1>Web-Based Probability Engine</h1>
        <p>Statistical drop simulations and vector mapping.</p>
    </header>
    <div class="arcade-container" id="selection-screen">
        <div class="game-card">
            <h3>Pen Plinko v1.0</h3>
            <p>Physics calculation matrix with 2x prize zone node routing.</p>
            <a href="#" class="play-btn" onclick="launchGame('plinko.html')">RUN SIMULATION</a>
        </div>
    </div>
    <div class="game-frame-container" id="game-window">
        <iframe id="arcade-core" src=""></iframe>
    </div>
    <script>
        function launchGame(fileUrl) {
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-window').style.display = 'block';
            document.getElementById('arcade-core').src = fileUrl;
        }
    </script>
</body>
</html>
