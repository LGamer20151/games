<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunset Moto Trials</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #120813;
      color: #fff7ed;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .top-bar {
      width: 900px;
      max-width: 96vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .level-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .lvl-btn {
      background: #27132a;
      color: #fdba74;
      border: 1px solid #581c4f;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .lvl-btn.active {
      background: #f97316;
      color: #fff;
      border-color: #fb923c;
    }
    canvas {
      background: #1a0b1c;
      border: 2px solid #581c4f;
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(249, 115, 22, 0.25);
      max-width: 96vw;
      max-height: 80vh;
    }
    .controls {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .controls span { color: #fb923c; font-weight: 700; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-weight:800; font-size:1.1rem; color:#fb923c;">🔥 SUNSET MOTO TRIALS</div>
    <div class="level-pills" id="levelBar"></div>
  </div>

  <canvas id="game" width="900" height="480"></canvas>

  <div class="controls">
    <span>W / UP</span> Gas &nbsp;•&nbsp;
    <span>S / DOWN</span> Brake &nbsp;•&nbsp;
    <span>A / D</span> or <span>LEFT / RIGHT</span> Mid-Air Flips &nbsp;•&nbsp;
    <span>R</span> Quick Restart
  </div>

  <script>
    window.onerror = function(message, source, lineno) {
      const c = document.getElementById('game');
      if (c) {
        const x = c.getContext('2d');
        x.fillStyle = '#ef4444';
        x.font = 'bold 16px monospace';
        x.fillText('Error on line ' + lineno + ': ' + message, 20, 40);
      }
    };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const LEVELS = [
      { name: '1. Canyon', len: 4200, top: '#1e1b4b', bot: '#be185d', sun: '#fde047', fill: '#2e1026', line: '#f97316', a1: 62, a2: 26, haz: 4, rmp: 3 },
      { name: '2. Dunes',  len: 5200, top: '#2c0b0e', bot: '#c2410c', sun: '#fb923c', fill: '#3b120e', line: '#facc15', a1: 78, a2: 34, haz: 7, rmp: 5 },
      { name: '3. Lava',   len: 6200, top: '#18060a', bot: '#991b1b', sun: '#ef4444', fill: '#24090d', line: '#fb7185', a1: 90, a2: 40, haz: 10, rmp: 6 },
      { name: '4. Ridge',  len: 7200, top: '#0f172a', bot: '#6d28d9', sun: '#c084fc', fill: '#1e1b4b', line: '#38bdf8', a1: 100, a2: 45, haz: 13, rmp: 8 },
      { name: '5. Inferno',len: 8500, top: '#09090b', bot: '#b91c1c', sun: '#fef08a', fill: '#1f070a', line: '#f59e0b', a1: 110, a2: 50, haz: 16, rmp: 10 }
    ];

    let lvlIdx = 0, dist = 0, speed = 0, bikeY = 320, vy = 0, angle = 0;
    let airRot = 0, flips = 0, score = 0, startTime = 0, elapsed = 0;
    let state = 'PLAYING', msg = '';
    let barrels = [], ramps = [], coins = [], parts = [];
    const keys = {};

    function lt(a, b) { return a - b < 0; }
    function gt(a, b) { return a - b > 0; }

    window.addEventListener('keydown', function(e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
      if (e.code === 'KeyR') loadLevel(lvlIdx);
      if (e.code === 'Space') {
        if (state === 'CRASHED') loadLevel(lvlIdx);
        else if (state === 'WON') loadLevel((lvlIdx + 1) % LEVELS.length);
      }
    });
    window.addEventListener('keyup', function(e) { keys[e.code] = false; });
    canvas.addEventListener('click', function() {
      if (state === 'CRASHED') loadLevel(lvlIdx);
      else if (state === 'WON') loadLevel((lvlIdx + 1) % LEVELS.length);
    });

    function terrainY(x) {
      const L = LEVELS[lvlIdx];
      if (lt(x, 350)) return 335;
      const t = x - 350;
      return 335 - Math.sin(t * 0.0052) * L.a1 - Math.cos(t * 0.0125) * L.a2;
    }

    function renderButtons() {
      const bar = document.getElementById('levelBar');
      bar.innerHTML = '';
      LEVELS.forEach(function(L, i) {
        const b = document.createElement('button');
        b.className = 'lvl-btn' + (i === lvlIdx ? ' active' : '');
        b.textContent = L.name;
        b.onclick = function() { loadLevel(i); };
        bar.appendChild(b);
      });
    }

    function loadLevel(i) {
      lvlIdx = i;
      renderButtons();
      const L = LEVELS[i];
      dist = 0; speed = 0; bikeY = terrainY(220) - 17; vy = 0; angle = 0;
      airRot = 0; flips = 0; score = 0; startTime = performance.now(); elapsed = 0;
      state = 'PLAYING'; msg = ''; parts = [];

      ramps = [];
      const rStep = (L.len - 900) / L.rmp;
      for (let k = 0; lt(k, L.rmp); k++) {
        const rx = 650 + k * rStep;
        ramps.push({ x: rx, y: terrainY(rx) });
      }

      barrels = [];
      const hStep = (L.len - 1000) / L.haz;
      for (let k = 0; lt(k, L.haz); k++) {
        const hx = 880 + k * hStep;
        const nearRamp = ramps.some(function(r) { return lt(Math.abs(r.x - hx), 170); });
        if (!nearRamp) {
          barrels.push({ x: hx, y: terrainY(hx), dead: false });
        }
      }

      coins = [];
      for (let cx = 500; lt(cx, L.len - 200); cx += 260) {
        coins.push({ x: cx, y: terrainY(cx) - 42, got: false });
      }
    }

    function boom(x, y, col) {
      for (let k = 0; lt(k, 20); k++) {
        const a = Math.random() * Math.PI * 2;
        const s = 2 + Math.random() * 6;
        parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, col: col, sz: 5 });
      }
    }

    function update() {
      parts.forEach(function(p) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.03; });
      parts = parts.filter(function(p) { return gt(p.life, 0); });
      if (state !== 'PLAYING') return;

      const L = LEVELS[lvlIdx];
      const bx = 220;
      elapsed = (performance.now() - startTime) / 1000;

      if (keys['ArrowUp'] || keys['KeyW']) speed = Math.min(12, speed + 0.24);
      else if (keys['ArrowDown'] || keys['KeyS']) speed = Math.max(0, speed - 0.3);
      else speed = Math.max(0, speed - 0.07);

      dist += speed;
      score += speed * 0.05;

      if (!lt(dist + bx, L.len)) {
        state = 'WON';
        score += Math.max(0, Math.floor((60 - elapsed) * 20));
        boom(bx, bikeY, '#fde047');
        return;
      }

      const gy = terrainY(dist + bx);
      const ngy = terrainY(dist + bx + 12);
      const slope = Math.atan2(ngy - gy, 12);

      vy += 0.48;
      bikeY += vy;

      if (!lt(bikeY, gy - 17)) {
        let norm = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        if (gt(norm, Math.PI)) norm -= Math.PI * 2;

        if (gt(Math.abs(norm - slope), 1.18)) {
          state = 'CRASHED';
          msg = 'Bad Landing! Keep your tires aligned with the ground.';
          boom(bx, bikeY, '#f97316');
          return;
        }
        if (gt(flips, 0)) { score += flips * 300; flips = 0; }
        bikeY = gy - 17;
        vy = (ngy - gy) * (speed / 12);
        angle = slope;
        airRot = 0;
        if (gt(speed, 2) && lt(Math.random(), 0.5)) {
          parts.push({ x: bx - 20, y: bikeY + 12, vx: -2.5, vy: -0.5, life: 0.7, col: '#fb923c', sz: 3.5 });
        }
      } else {
        if (keys['ArrowLeft'] || keys['KeyA']) { angle -= 0.095; airRot -= 0.095; }
        if (keys['ArrowRight'] || keys['KeyD']) { angle += 0.095; airRot += 0.095; }
        if (!lt(Math.abs(airRot), Math.PI * 1.8)) { flips++; airRot = 0; }
      }

      ramps.forEach(function(r) {
        const sx = r.x - dist;
        if (lt(Math.abs(sx - bx), 28) && lt(Math.abs(bikeY - (r.y - 18)), 24)) {
          vy = -12.5;
          speed = Math.max(speed, 11.5);
        }
      });

      barrels.forEach(function(b) {
        const sx = b.x - dist;
        if (!b.dead && lt(Math.abs(sx - bx), 24) && lt(Math.abs(bikeY - (b.y - 16)), 24)) {
          b.dead = true;
          state = 'CRASHED';
          msg = 'Boom! You hit an explosive fuel barrel.';
          boom(bx, bikeY, '#ef4444');
        }
      });

      coins.forEach(function(c) {
        const sx = c.x - dist;
        if (!c.got && lt(Math.hypot(sx - bx, c.y - bikeY), 34)) {
          c.got = true;
          score += 50;
        }
      });
    }

    function draw() {
      const L = LEVELS[lvlIdx];
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, L.top);
      g.addColorStop(1, L.bot);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = L.sun;
      ctx.beginPath();
      ctx.arc(680, 145, 65, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = L.fill;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let sx = 0; !gt(sx, canvas.width); sx += 8) ctx.lineTo(sx, terrainY(dist + sx));
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = L.line;
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let sx = 0; !gt(sx, canvas.width); sx += 8) {
        const sy = terrainY(dist + sx);
        if (sx === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();

      ramps.forEach(function(r) {
        const sx = r.x - dist;
        if (lt(sx, -60) || gt(sx, canvas.width + 60)) return;
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
