<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Driving Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .nitro-bar {
            width: 150px;
            height: 15px;
            background: #333;
            border: 2px solid white;
            margin-top: 5px;
            border-radius: 5px;
            overflow: hidden;
        }
        #nitro-fill {
            width: 100%;
            height: 100%;
            background: #ff3333;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Speed: <span id="speed-text">0</span> km/h</div>
        <div>Hold SHIFT for Nitro!</div>
        <div class="nitro-bar"><div id="nitro-fill"></div></div>
    </div>

    <!-- Load Three.js Library -->
    <script src="https://cloudflare.com"></script>

    <script>
        // --- 1. SETUP THREE.JS SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0b0ff); // Sky blue color
        scene.fog = new THREE.FogExp2(0xa0b0ff, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. CREATE TRACK / GROUND ---
        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x228b22 }); // Grass Green
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Add a long grey road asphalt track
        const roadGeo = new THREE.PlaneGeometry(40, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01; // slightly above grass to prevent flickering
        road.receiveShadow = true;
        scene.add(road);

        // --- 4. CREATE RAMPS & OBSTACLES ---
        const obstacles = [];

        function createRamp(x, z, width, height, length) {
            const rampGroup = new THREE.Group();
            
            const rampGeo = new THREE.BoxGeometry(width, height, length);
            const rampMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
            const rampMesh = new THREE.Mesh(rampGeo, rampMat);
            rampMesh.castShadow = true;
            rampMesh.receiveShadow = true;
            
            rampGroup.add(rampMesh);
            rampGroup.position.set(x, height / 2, z);
            
            // Tilt the structure forward to make it an incline ramp
            rampGroup.rotation.x = -0.2; 
            
            scene.add(rampGroup);
            
            // Store physical boundary properties for simple collision detection
            obstacles.push({
                mesh: rampGroup,
                x: x, z: z,
                w: width, h: height, l: length,
                isRamp: true,
                angle: 0.2
            });
        }

        // Place down several test ramps down the road track
        createRamp(0, -100, 15, 6, 30);
        createRamp(-8, -250, 10, 8, 35);
        createRamp(8, -400, 12, 10, 40);

        // --- 5. CREATE CAR (3D Player Character) ---
        const car = new THREE.Group();

        // Car Body Box Shape
        const bodyGeo = new THREE.BoxGeometry(2.2, 1, 4.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0077ff });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.6;
        carBody.castShadow = true;
        car.add(carBody);

        // Car Cabin Glass Top Box
        const cabinGeo = new THREE.BoxGeometry(1.8, 0.7, 2.2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const carCabin = new THREE.Mesh(cabinGeo, cabinMat);
        carCabin.position.set(0, 1.3, -0.3);
        car.add(carCabin);

        // Helper function to quickly attach simple cylinder wheels
        function createWheel(x, y, z) {
            const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(x, y, z);
            wheel.castShadow = true;
            car.add(wheel);
        }
        createWheel(1.2, 0.4, 1.5);   // Back Right
        createWheel(-1.2, 0.4, 1.5);  // Back Left
        createWheel(1.2, 0.4, -1.5);  // Front Right
        createWheel(-1.2, 0.4, -1.5); // Front Left

        car.position.set(0, 0, 50); // Set starting location
        scene.add(car);

        // --- 6. DRIVING PHYSICS VARIABLES ---
        let speed = 0;
        const maxSpeed = 1.2;
        const maxNitroSpeed = 2.2;
        const acceleration = 0.015;
        const braking = 0.03;
        const friction = 0.006;
        const turnSpeed = 0.025;
        
        let carVelocityY = 0;
        let isGrounded = true;
        const gravity = -0.012;

        // --- 7. KEYBOARD CONTROLS ---
        const keys = { w: false, a: false, s: false, d: false, Shift: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

        // --- 8. MAIN ANIMATION & REFRESH LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Determine active movement parameters
            const moveUp = keys.w || keys.ArrowUp;
            const moveDown = keys.s || keys.ArrowDown;
            const turnLeft = keys.a || keys.ArrowLeft;
            const turnRight = keys.d || keys.ArrowRight;
            const nitroActive = keys.Shift;

            let currentMaxSpeed = nitroActive ? maxNitroSpeed : maxSpeed;

            // Visual effect feedback during active nitro boost
            if (nitroActive && speed > 0.1) {
                bodyMat.color.setHex(0xff1111); // Turns red hot
                document.getElementById('nitro-fill').style.width = '30%'; // simple visual consumption indicator simulation
            } else {
                bodyMat.color.setHex(0x0077ff); // Default sleek blue
                document.getElementById('nitro-fill').style.width = '100%';
            }

            // Acceleration Logic
            if (moveUp && isGrounded) {
                speed = Math.min(speed + acceleration, currentMaxSpeed);
            } else if (moveDown && isGrounded) {
                speed = Math.max(speed - braking, -maxSpeed / 2); // Reverse speed limit
            } else {
                // Apply natural friction coasting when no keys are held
                if (speed > 0) speed = Math.max(speed - friction, 0);
                if (speed < 0) speed = Math.min(speed + friction, 0);
            }

            // Steering Logic (Only works while moving)
            if (Math.abs(speed) > 0.05) {
                const directionModifier = speed > 0 ? 1 : -1;
                if (turnLeft) car.rotation.y += turnSpeed * directionModifier * (Math.abs(speed) + 0.2);
                if (turnRight) car.rotation.y -= turnSpeed * directionModifier * (Math.abs(speed) + 0.2);
            }

            // Translate Speed Vector onto relative Angular Heading
            car.position.x -= Math.sin(car.rotation.y) * speed;
            car.position.z -= Math.cos(car.rotation.y) * speed;

            // --- 9. VERTICAL GRAVITY & COLLISION HANDLING ---
            carVelocityY += gravity;
            car.position.y += carVelocityY;

            // Check floor level ground limit fallback bounds
            if (car.position.y <= 0) {
                car.position.y = 0;
                carVelocityY = 0;
                isGrounded = true;
            }

            // Simple Box Ramp Checking Logic loop
            obstacles.forEach(ramp => {
                // Relative calculation spacing metrics offsets
                const dx = car.position.x - ramp.x;
                const dz = car.position.z - ramp.z;

                if (Math.abs(dx) < ramp.w / 2 + 1 && Math.abs(dz) < ramp.l / 2 + 2) {
                    // Car is inside layout platform footprint boundaries
                    const positionRatioOnRamp = (ramp.l / 2 - dz) / ramp.l; // position scaling from start to crest edge
                    const targetHeight = Math.max(0, positionRatioOnRamp * ramp.h * 1.1);

                    if (car.position.y <= targetHeight) {
                        car.position.y = targetHeight;
                        carVelocityY = speed * 0.12; // Launches physics momentum forward upwards
                        isGrounded = true;
                    }
