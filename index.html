<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    body { background:#1e1e2e; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:40px 20px; }

    .menu { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
    .card { background:#313244; border-radius:10px; padding:24px; width:200px; text-decoration:none; color:#fff; transition:transform 0.2s; }

    .card h2 { margin:0 0 8px; color:#89b4fa; }
    .card p { margin:0; color:#a6adc8; font-size:14px; }
  </style>
</head>
<body>
  <h1>My Game Site</h1>
  <div class="menu">
    <a class="card" href="plinko.html">
      <h2>Plinko</h2>
      <p>Drop discs and win points.</p>
    </a>
    <a class="card" href="snake.html">
      <h2>Snake</h2>
      <p>Eat food and grow longer.</p>
    </a>
    <a class="card" href="drift.html">
      <h2>Drift Boss</h2>
      <p>Slide around corners and rack up points.</p>
    </a>
  </div>

</html>
