<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocked Arcade Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0b0c10; color: #c5c6c7; min-height: 100vh; padding: 40px 20px; }
    header { max-width: 1200px; margin: 0 auto 40px auto; text-align: center; }
    h1 { font-size: 2.5rem; color: #66fcf1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    p { color: #858688; }
    
    /* Game Grid Layout */
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
    
    /* Game Card Styling */
    .game-card { background: #1f2833; border-radius: 12px; overflow: hidden; text-decoration: none; color: #fff; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; border: 1px solid #2a3542; display: block; }
    .game-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(102, 252, 241, 0.2); border-color: #66fcf1; }
    .thumbnail { width: 100%; aspect-ratio: 16/10; background: linear-gradient(135deg, #121824, #0b0c10); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; }
    .info { padding: 15px; }
    .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; color: #fff; }
    .category { font-size: 0.8rem; color: #66fcf1; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>Unblocked Arcade Hub</h1>
    <p>Select a game to start playing instantly</p>
  </header>

  <main class="game-grid">
    <!-- Egg Helix Card -->
    <a href="egghelix.html" class="game-card">
      <div class="thumbnail">🥚</div>
      <div class="info">
        <div class="category">Arcade</div>
        <div class="title">Egg Helix</div>
      </div>
    </a>

    <!-- Madalin Stunt Cars Pro Card -->
    <a href="madalinstuntcars.html" class="game-card">
      <div class="thumbnail">🏎️</div>
      <div class="info">
        <div class="category">Driving / 3D</div>
        <div class="title">Madalin Stunt Cars Pro</div>
      </div>
    </a>

    <!-- NEW: Snaker.io Card -->
    <a href="snaker.html" class="game-card">
      <div class="thumbnail">🐍</div>
      <div class="info">
        <div class="category">.io Games / Action</div>
        <div class="title">Snaker.io</div>
      </div>
    </a>
  </main>

</body>
</html>
