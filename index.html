// --- PLINKO GAME ENGINE ---
// Save this as plinko.js or paste it inside a <script> tag on your webpage.

class PlinkoGame {
    constructor(canvasId, options = {}) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        
        // Configuration options
        this.rows = options.rows || 8;
        this.pegRadius = options.pegRadius || 5;
        this.ballRadius = options.ballRadius || 8;
        this.gravity = options.gravity || 0.2;
        this.bounce = options.bounce || 0.5; // Elasticity of pegs
        this.friction = options.friction || 0.99; // Air resistance
        
        // Multipliers/Scores for buckets at the bottom
        this.multipliers = options.multipliers || [10, 5, 2, 0.5, 0.2, 0.5, 2, 5, 10];
        
        // State arrays
        this.pegs = [];
        this.balls = [];
        this.buckets = [];
        
        // Dynamic scaling
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Event listener for user drop
        this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
        
        // Setup initial board
        this.initBoard();
        
        // Start animation loop
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
    }

    resize() {
        // Adjust bounds dynamically based on container size
        this.width = this.canvas.parentElement ? this.canvas.parentElement.clientWidth : 600;
        this.height = options.height || 600;
        
        // Account for high-DPI displays
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.canvas.style.width = `${this.width}px`;
        this.canvas.style.height = `${this.height}px`;
        this.ctx.scale(dpr, dpr);
        
        // Re-initialize layouts on resize to keep proportions intact
        this.initBoard();
    }

    initBoard() {
        this.pegs = [];
        this.buckets = [];
        
        const startY = 80;
        const spacingY = (this.height - 150) / this.rows;
        
        // Generate triangle peg board grid
        for (let r = 0; r < this.rows; r++) {
            const pegCount = r + 3; // Top row has 3 pegs, adding 1 each row down
            const spacingX = this.width / (pegCount + 1);
            
            for (let i = 0; i < pegCount; i++) {
                const x = spacingX * (i + 1);
                const y = startY + (r * spacingY);
                this.pegs.push({ x, y, radius: this.pegRadius, active: false, timer: 0 });
            }
        }
        
        // Generate score buckets at the bottom
        const bucketCount = this.multipliers.length;
        const bucketWidth = this.width / bucketCount;
        const bucketY = this.height - 40;
        
        for (let i = 0; i < bucketCount; i++) {
            this.buckets.push({
                x: i * bucketWidth,
                y: bucketY,
                width: bucketWidth,
                height: 40,
                multiplier: this.multipliers[i],
                label: `${this.multipliers[i]}x`
            });
        }
    }

    dropBall(startX) {
        // Enforce boundary logic so user cannot drop outside the game field
        const safeX = Math.max(this.ballRadius, Math.min(this.width - this.ballRadius, startX));
        
        this.balls.push({
            x: safeX,
            y: 20,
            vx: (Math.random() - 0.5) * 0.5, // Tiny structural variance to guarantee physics divergence
            vy: 1,
            radius: this.ballRadius,
            color: `hsl(${Math.random() * 360}, 85%, 60%)` // Distinct random vibrant ball colors
        });
    }

    handleCanvasClick(e) {
        const rect = this.canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        this.dropBall(clickX);
    }

    updatePhysics() {
        // Clean out balls that exit frame bottom
        this.balls = this.balls.filter(ball => {
            // Apply environment constants
            ball.vy += this.gravity;
            ball.vx *= this.friction;
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            // Wall collisions (side bounces)
            if (ball.x < ball.radius) {
                ball.x = ball.radius;
                ball.vx *= -this.bounce;
            } else if (ball.x > this.width - ball.radius) {
                ball.x = this.width - ball.radius;
                ball.vx *= -this.bounce;
            }
            
            // Peg interaction physics resolution
            this.pegs.forEach(peg => {
                const dx = ball.x - peg.x;
                const dy = ball.y - peg.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDist = ball.radius + peg.radius;
                
                if (distance < minDist) {
                    // Normalize contact vector
                    const nx = dx / distance;
                    const ny = dy / distance;
                    
                    // Reposition ball outside peg bound boundary overlap
                    ball.x = peg.x + nx * minDist;
                    ball.y = peg.y + ny * minDist;
                    
                    // Vector dot-product reflection logic
                    const dotProduct = ball.vx * nx + ball.vy * ny;
                    ball.vx = (ball.vx - 2 * dotProduct * nx) * this.bounce;
                    ball.vy = (ball.vy - 2 * dotProduct * ny) * this.bounce;
                    
                    // Activate structural visual pop trigger on peg
                    peg.active = true;
                    peg.timer = 8; 
                }
            });
            
            // Check landing event inside target slots
            if (ball.y >= this.height - 40) {
                this.buckets.forEach(bucket => {
                    if (ball.x >= bucket.x && ball.x <= bucket.x + bucket.width) {
                        this.onBallScore(bucket.multiplier);
                    }
                });
                return false; // Safely strip instance out of rendering queue
            }
            return true;
        });
        
        // Degrade glowing peg frame step state animations
        this.pegs.forEach(peg => {
            if (peg.active) {
                peg.timer--;
                if (peg.timer <= 0) peg.active = false;
            }
        });
    }

    onBallScore(multiplier) {
        // Dispatches event downstream. Listen to this from your core website script.
        const event = new CustomEvent('plinkoScore', { detail: { multiplier } });
        window.dispatchEvent(event);
    }

    draw() {
        this.ctx.clearRect(0, 0, this.width, this.height);
        
        // 1. Draw Pegs
        this.pegs.forEach(peg => {
            this.ctx.beginPath();
            this.ctx.arc(peg.x, peg.y, peg.active ? peg.radius * 1.4 : peg.radius, 0, Math.PI * 2);
            this.ctx.fillStyle = peg.active ? '#ff007f' : '#4a5568';
            this.ctx.shadowBlur = peg.active ? 15 : 0;
            this.ctx.shadowColor = '#ff007f';
            this.ctx.fill();
            this.ctx.closePath();
        });
        this.ctx.shadowBlur = 0; // Reset canvas glow states
        
        // 2. Draw Buckets (Score zones)
        this.buckets.forEach((bucket, idx) => {
            this.ctx.fillStyle = idx % 2 === 0 ? '#1a202c' : '#2d3748';
            this.ctx.fillRect(bucket.x, bucket.y, bucket.width, bucket.height);
            
            // Border divider lines
            this.ctx.strokeStyle = '#4a5568';
            this.ctx.lineWidth = 1;
            this.ctx.strokeRect(bucket.x, bucket.y, bucket.width, bucket.height);
            
            // Text Label inside bucket slots
            this.ctx.fillStyle = '#e2e8f0';
            this.ctx.font = 'bold 12px sans-serif';
            this.ctx.textAlign = 'center';
            this.ctx.fillText(bucket.label, bucket.x + bucket.width / 2, bucket.y + 24);
        });
        
        // 3. Draw active balls
        this.balls.forEach(ball => {
            this.ctx.beginPath();
            this.ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            this.ctx.fillStyle = ball.color;
            this.ctx.fill();
            this.ctx.closePath();
        });
    }

    animate() {
        this.updatePhysics();
        this.draw();
        requestAnimationFrame(this.animate);
    }
}
