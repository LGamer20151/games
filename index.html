<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Workspace Module</title>
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 16px;
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        h1 { 
            margin: 0; 
            color: #38bdf8; 
            font-size: 24px; 
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 800;
        }
        .ui-panel {
            margin: 16px 0;
            font-size: 15px;
            font-weight: 600;
            background: rgba(30, 41, 59, 0.7);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        #hud-keys { color: #fbbf24; font-weight: 800; }
        #hud-status { color: #4ade80; font-weight: 700; animation: pulse 1.5s infinite; }
        canvas {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255,255,255,0.1);
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Stickman Parkour V2 // Vector Core</h1>
    </header>

    <div class="ui-panel">
        <div>Keys: <span id="hud-keys">0 / 1</span></div>
        <div>A/D or ◄/► = Run | W or ▲ = Jump | S or ▼ = Slide</div>
        <div id="hud-status">FIND THE KEY</div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const keysDisplay = document.getElementById('hud-keys');
        const statusDisplay = document.getElementById('hud-status');

        const gravity = 0.38;
        const friction = 0.84;

        let player = {
            x: 70, y: 300, vx: 0, vy: 0,
            width: 18, height: 44,
            speed: 0.6, maxSpeed: 4.8, jumpForce: 10,
            grounded: false, sliding: false, slideTimer: 0, facing: 1, animFrame: 0
        };

        let hasKey = false;
        let isLevelComplete = false;

        // Modern Geometric Platform Data Configuration
        let platforms = [
            { x: 0, y: 380, w: 260, h: 70, color: '#334155', topColor: '#0ea5e9' },
            { x: 340, y: 310, w: 160, h: 25, color: '#475569', topColor: '#38bdf8' },
            { x: 560, y: 240, w: 240, h: 210, color: '#334155', topColor: '#0ea5e9' }
        ];

        // Animated neon hazard spike profiles 
        let spikes = [
            { x: 260, y: 430, w: 80, h: 20 }
        ];

        let goldenKey = { x: 420, y: 260, w: 16, h: 16, collected: false, pulse: 0 };
        let ancientGate = { x: 650, y: 140, w: 16, h: 100, open: false, opacity: 1 };
        let goalPortal = { x: 720, y: 170, w: 35, h: 70, angle: 0 };

        let inputKeys = {};
        window.addEventListener('keydown', e => { inputKeys[e.code] = true; });
        window.addEventListener('keyup', e => { inputKeys[e.code] = false; });

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.w &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.h &&
                   obj1.y + obj1.height > obj2.y;
        }

        function update() {
            if (isLevelComplete) return;

            goldenKey.pulse += 0.05;
            goalPortal.angle += 0.02;

            // Fluid Sliding Logic Mechanics
            if ((inputKeys['KeyS'] || inputKeys['ArrowDown']) && player.grounded && !player.sliding) {
                player.sliding = true;
                player.slideTimer = 28;
                player.height = 22; 
                player.y += 22;
                player.vx += player.facing * 3.5; // Instant slide velocity kick
            }

            if (player.sliding) {
                player.slideTimer--;
                player.vx *= 0.95; // Custom high-speed slide friction
                if (player.slideTimer <= 0) {
                    player.sliding = false;
                    player.height = 44;
                    player.y -= 22;
                }
            } else {
                // Running Calculations
                if (inputKeys['KeyA'] || inputKeys['ArrowLeft']) {
                    if (player.vx > -player.maxSpeed) player.vx -= player.speed;
                    player.facing = -1;
                }
                if (inputKeys['KeyD'] || inputKeys['ArrowRight']) {
                    if (player.vx < player.maxSpeed) player.vx += player.speed;
                    player.facing = 1;
                }
            }

            // High-Performance Jumping Triggers
            if ((inputKeys['KeyW'] || inputKeys['ArrowUp']) && player.grounded && !player.sliding) {
                player.vy = -player.jumpForce;
                player.grounded = false;
            }

            player.vx *= friction;
            player.vy += gravity;

            // X-Axis Platform Intersection Bounds
            player.x += player.vx;
            platforms.forEach(p => {
                if (checkCollision(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.width;
                    if (player.vx < 0) player.x = p.x + p.w;
                }
            });

            if (!ancientGate.open && checkCollision(player, ancientGate)) {
                if (player.vx > 0) player.x = ancientGate.x - player.width;
            }

            // Y-Axis Platform Intersection Bounds
            player.y += player.vy;
            player.grounded = false;
            platforms.forEach(p => {
                if (checkCollision(player, p)) {
                    if (player.vy > 0) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            });

            // Tracking Running Animation Frames
            if (player.grounded && Math.abs(player.vx) > 0.5) {
                player.animFrame += 0.22;
            } else if (!player.grounded) {
                player.animFrame = 1.5; // Dynamic mid-air vector stance
            } else {
                player.animFrame = 0;
            }

            // Spike Obstacle Hazards Checks
            spikes.forEach(s => {
                if (checkCollision(player, s)) resetPlayer();
            });

            // Golden Key Collector Bounds
            if (!goldenKey.collected && checkCollision(player, {x: goldenKey.x, y: goldenKey.y, w: goldenKey.w, h: goldenKey.h})) {
                goldenKey.collected = true;
                hasKey = true;
                keysDisplay.innerText = "1 / 1";
                statusDisplay.innerText = "GATE MECHANISM ENGAGED";
                statusDisplay.style.color = '#38bdf8';
            }

            // Smooth Gate Dissolve Animations
            if (hasKey && Math.abs(player.x - ancientGate.x) < 70) {
                ancientGate.open = true;
            }
            if (ancientGate.open && ancientGate.opacity > 0) {
                ancientGate.opacity -= 0.05;
            }

            // Portal Level Complete Checks
            if (checkCollision(player, {x: goalPortal.x, y: goalPortal.y, w: goalPortal.w, h: goalPortal.h})) {
                isLevelComplete = true;
                statusDisplay.innerText = "MISSION OBJECTIVE ACCOMPLISHED";
                statusDisplay.style.color = '#4ade80';
            }

            if (player.y > canvas.height) resetPlayer();
        }

        function resetPlayer() {
            player.x = 70; player.y = 300; player.vx = 0; player.vy = 0;
            player.sliding = false; player.height = 44;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Modern Geometric Platforms
            platforms.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = p.topColor;
                ctx.fillRect(p.x, p.y, p.w, 4); // Neon top lip accent line
            });

            // 2. Draw Glow Hazard Spikes
            ctx.fillStyle = '#ef4444';
            spikes.forEach(s => {
                ctx.beginPath();
                for (let i = 0; i < s.w; i += 10) {
                    ctx.moveTo(s.x + i, s.y);
                    ctx.lineTo(s.x + i + 5, s.y - 12);
                    ctx.lineTo(s.x + i + 10, s.y);
                }
                ctx.fill();
            });

            // 3. Draw Floating Golden Key
            if (!goldenKey.collected) {
                ctx.save();
                let hoverY = Math.sin(goldenKey.pulse) * 4;
                ctx.translate(goldenKey.x + 8, goldenKey.y + 8 + hoverY);
                ctx.fillStyle = '#fbbf24';
