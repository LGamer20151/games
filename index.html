<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nova Moto</title>
<style>
  body { margin:0; background:#0b132b; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; user-select:none; }
  #hud { width:800px; max-width:95vw; display:flex; justify-content:space-between; padding:10px 16px; background:#1c2541; border:2px solid #3a86ff; border-bottom:none; box-sizing:border-box; font-weight:bold; }
  span { color:#6fffe9; }
  canvas { background:#111d3a; border:2px solid #3a86ff; width:800px; max-width:95vw; display:block; }
  .row { margin-top:10px; display:flex; gap:8px; }
  button { background:#1c2541; color:#6fffe9; border:1px solid #3a86ff; padding:10px 16px; border-radius:6px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<div id="hud"><div>🏍️ NOVA MOTO</div><div>Dist: <span id="d">0m</span></div><div>Flips: <span id="f">0</span></div><div>Best: <span id="b">0m</span></div></div>
<canvas id="c" width="800" height="450"></canvas>
<div class="row">
  <button onmousedown="k.l=1" onmouseup="k.l=0" ontouchstart="k.l=1" ontouchend="k.l=0">↺ Lean Back</button>
  <button onmousedown="k.r=1" onmouseup="k.r=0" ontouchstart="k.r=1" ontouchend="k.r=0">↻ Lean Fwd</button>
  <button onmousedown="k.b=1" onmouseup="k.b=0" ontouchstart="k.b=1" ontouchend="k.b=0">Brake</button>
  <button onmousedown="k.g=1" onmouseup="k.g=0" ontouchstart="k.g=1" ontouchend="k.g=0">Gas</button>
</div>
<script>
const c = document.getElementById("c"), x = c.getContext("2d");
const k = {g:0, b:0, l:0, r:0};
let best = +localStorage.getItem("nmBest") || 0, bike, cam = 0;
document.getElementById("b").textContent = best + "m";

onkeydown = e => {
  if ("ArrowUp,ArrowDown,ArrowLeft,ArrowRight".includes(e.key)) e.preventDefault();
  if (e.key=="ArrowUp"||e.key=="w") k.g=1;
  if (e.key=="ArrowDown"||e.key=="s") k.b=1;
  if (e.key=="ArrowLeft"||e.key=="a") k.l=1;
  if (e.key=="ArrowRight"||e.key=="d") k.r=1;
  if (e.key=="r"||e.key=="R") reset();
};
onkeyup = e => {
  if (e.key=="ArrowUp"||e.key=="w") k.g=0;
  if (e.key=="ArrowDown"||e.key=="s") k.b=0;
  if (e.key=="ArrowLeft"||e.key=="a") k.l=0;
  if (e.key=="ArrowRight"||e.key=="d") k.r=0;
};

const hill = p => p < 300 ? 340 : 330 + Math.sin(p*0.0045)*65 + Math.sin(p*0.011)*30;
const reset = () => { bike = {x:120, y:300, vx:0, vy:0, a:0, av:0, g:0, rot:0, flips:0, dead:0}; document.getElementById("f").textContent=0; };
reset();
c.onclick = () => { if (bike.dead) reset(); };

setInterval(() => {
  if (!bike.dead) {
    if (bike.g) { if (k.g) bike.vx+=0.35; if (k.b) bike.vx-=0.3; bike.vx*=0.985; }
    bike.vx = Math.max(-4, Math.min(16, bike.vx));
    bike.av = (bike.av + (k.r - k.l) * (bike.g ? 0.004 : 0.007)) * 0.92;
    bike.a += bike.av; bike.vy += 0.42; bike.x += bike.vx; bike.y += bike.vy;
    if (bike.x < 60) { bike.x = 60; bike.vx = 0; }

    let gy = hill(bike.x), sl = Math.atan2(hill(bike.x+4)-hill(bike.x-4), 8);
    if (bike.y + 22 >= gy) {
      let na = ((bike.a % 6.283) + 6.283) % 6.283;
      if (na > 1.9 && na < 4.3) bike.dead = 1;
      if (!bike.g && !bike.dead) {
        let fl = Math.floor(Math.abs(bike.rot) / 5.5);
        if (fl > 0) { bike.flips += fl; document.getElementById("f").textContent = bike.flips; }
      }
      bike.y = gy - 22; bike.vy = 0; bike.g = 1; bike.rot = 0;
      bike.a += (sl - bike.a) * 0.25; bike.vx += Math.sin(sl) * 0.22;
    } else { bike.g = 0; bike.rot += bike.av; }

    cam = bike.x - 200;
    let m = Math.max(0, Math.floor((bike.x - 120) / 15));
    document.getElementById("d").textContent = m + "m";
    if (m > best) { best = m; document.getElementById("b").textContent = best + "m"; localStorage.setItem("nmBest", best); }
  }

  x.clearRect(0, 0, 800, 450);
  x.beginPath(); x.moveTo(0, 450);
  for (let i = 0; i <= 800; i += 8) x.lineTo(i, hill(i + cam));
  x.lineTo(800, 450); x.fillStyle = "#1d3557"; x.fill();
  x.strokeStyle = "#6fffe9"; x.lineWidth = 4; x.stroke();

  x.save(); x.translate(bike.x - cam, bike.y); x.rotate(bike.a);
  [-22, 22].forEach(w => { x.beginPath(); x.arc(w, 10, 13, 0, 6.29); x.fillStyle="#111"; x.fill(); x.stroke(); });
  x.strokeStyle = "#3a86ff"; x.lineWidth = 5; x.beginPath(); x.moveTo(-22,10); x.lineTo(-4,-6); x.lineTo(14,-6); x.lineTo(22,10); x.stroke();
  x.strokeStyle = "#fff"; x.lineWidth = 4; x.beginPath(); x.moveTo(-6,-6); x.lineTo(-10,-24); x.lineTo(8,-14); x.stroke();
  x.beginPath(); x.arc(-10,-31,7,0,6.29); x.fillStyle="#ff006e"; x.fill();
  x.restore();

  if (bike.dead) {
    x.fillStyle = "rgba(11,19,43,0.8)"; x.fillRect(0,0,800,450);
    x.fillStyle = "#ff006e"; x.font = "bold 40px sans-serif"; x.textAlign = "center";
    x.fillText("WIPEOUT! Click or Press R", 400, 225);
  }
}, 16);
</script>
</body>
</html>
