<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Arcade Driving Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stat {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 6px;
            border-left: 4px solid #00ffcc;
        }
        .nitro-container {
            width: 150px;
            height: 12px;
            background: #333;
            border: 2px solid white;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }
        #nitro-fill {
            width: 100%;
            height: 100%;
            background: #ff3333;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat" style="border-left-color: #00ffcc;">Score: <span id="score-text" style="color: #00ffcc;">0</span></div>
        <div class="stat" style="border-left-color: #ffcc00;">Time: <span id="timer-text" style="color: #ffcc00;">0.00</span>s</div>
        <div class="stat" style="border-left-color: #ff0055;">Speed: <span id="speed-text">0</span> km/h</div>
        <div class="stat" style="border-left-color: #ffaa00;">
            <div>Nitro (SHIFT)</div>
            <div class="nitro-container"><div id="nitro-fill"></div></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        // --- GAME VARIABLES ---
        let speed = 0;
        let position = 0;
        let playerX = 0;
        let score = 0;
        let startTime = Date.now();

        // Road Geometry definition parameters
        const trackLength = 8000;
        const roadWidth = 2000;
        const cameraHeight = 1000;
        const cameraDepth = 0.8;

        // Build a continuous track structure of segments
        const segments = [];
        for (let i = 0; i < trackLength; i++) {
            let curve = 0;
            let hill = 0;

            // Generate turns periodically down the track
            if (i > 300 && i < 700) curve = 2.5;
            if (i > 1000 && i < 1400) curve = -3;
            
            // Build custom steep launch hills (Ramps!)
            if (i > 500 && i < 540) hill = Math.sin((i - 500) / 40 * Math.PI) * 1200;
            if (i > 1200 && i < 1240) hill = Math.sin((i - 1200) / 40 * Math.PI) * 1500;
            if (i > i > 2000 && i < 2040) hill = Math.sin((i - 2000) / 40 * Math.PI) * 1800;

            segments.push({
                index: i,
                p1: { world: { x: 0, y: (i > 500 && i < 540 ? hill : i > 1200 && i < 1240 ? hill : 0), z: i * 200 }, screen: { x: 0, y: 0, w: 0 } },
                p2: { world: { x: 0, y: 0, z: (i + 1) * 200 }, screen: { x: 0, y: 0, w: 0 } },
                curve: curve,
                color: Math.floor(i / 3) % 2 ? { road: '#3a3a3e', grass: '#101216', rumble: '#00ffcc' } : { road: '#333336', grass: '#0b0c0f', rumble: '#ffffff' }
            });
        }
        
        // Link segment heights together smoothly
        for(let i=1; i<trackLength; i++) {
            segments[i-1].p2.world.y = segments[i].p1.world.y;
        }

        // --- KEY LISTENERS ---
        const keys = { w: false, a: false, s: false, d: false, Shift: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener("keydown", (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { if (e.key in keys) keys[e.key] = false; });

        // Projecting 3D coordinates onto flat 2D Canvas viewport screen space
        function project(p, cameraX, cameraY, cameraZ) {
            p.camera = {
                x: p.world.x - cameraX,
                y: p.world.y - cameraY,
                z: p.world.z - cameraZ
            };
            const scale = cameraDepth / (p.camera.z / cameraHeight);
            p.screen.x = Math.round((canvas.width / 2) + (scale * p.camera.x  * canvas.width / 2));
            p.screen.y = Math.round((canvas.height / 2) - (scale * p.camera.y * canvas.height / 2));
            p.screen.w = Math.round(scale * roadWidth * canvas.width / 2);
        }

        // --- RENDERING & GAME ANIMATION SYSTEM ---
        function loop() {
            requestAnimationFrame(loop);

            // Update running clocks
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById('timer-text').innerText = elapsed;

            const moveForward = keys.w || keys.ArrowUp;
            const moveBackward = keys.s || keys.ArrowDown;
            const turnLeft = keys.a || keys.ArrowLeft;
            const turnRight = keys.d || keys.ArrowRight;
            const nitro = keys.Shift;

            // Physics execution speeds
            let maxSpd = nitro ? 240 : 140;
            if (moveForward) {
                speed = Math.min(speed + (nitro ? 3 : 1.5), maxSpd);
            } else if (moveBackward) {
                speed = Math.max(speed - 4, -40);
            } else {
                speed = Math.max(speed - 0.8, 0);
            }

            // Steer adjustments updates
            if (speed > 1) {
                if (turnLeft) playerX -= 0.04 * (speed / 100);
                if (turnRight) playerX += 0.04 * (speed / 100);
            }

            // Continuous movement loops updates
            position += speed * 5;
            if (position >= trackLength * 200) position -= trackLength * 200;

            const startSeg = Math.floor(position / 200);
            const currentSegment = segments[startSeg];
            
            // Turn tracking calculations updates
            playerX = playerX - (speed / 150) * 0.01 * currentSegment.curve;

            // Simple point increments systems based on high speeds
            if (speed > 10) {
                score += nitro ? 3 : 1;
                document.getElementById('score-text').innerText = score;
            }

            // Update UI widgets indicators graphics layouts values
            document.getElementById('speed-text').innerText = Math.round(speed * 1.5);
            document.getElementById('nitro-fill').style.width = nitro && speed > 50 ? '30%' : '100%';

            // Clear Background
            ctx.fillStyle = "#0a0c16";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Sky Horizon Stars background effect
            ctx.fillStyle = "#1e223a";
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

            // --- DRAW SYSTEM SEGMENTS ---
            let maxy = canvas.height;
            let xOffset = 0;
            let curveTotal = 0;

            // Render from back-to-front perspective depths lines segments loop
            for (let n = 0; n < 120; n++) {
                const seg = segments[(startSeg + n) % trackLength];
                const looped = (startSeg + n) >= trackLength;
                
                project(seg.p1, playerX * roadWidth - xOffset, cameraHeight + currentSegment.p1.world.y, position - (looped ? trackLength * 200 : 0));
                
                xOffset += curveTotal;
                curveTotal += seg.curve;

                if (seg.p1.camera.z <= cameraDepth || seg.p1.screen.y >= maxy) continue;

                if (n > 0) {
                    const prev = segments[(startSeg + n - 1) % trackLength];
                    if (prev.p1.screen.y <= seg.p1.screen.y) continue;

                    // Draw Grass polygon borders side fields
                    ctx.fillStyle = seg.color.grass;
                    ctx.beginPath();
                    ctx.moveTo(0, prev.p1.screen.y);
                    ctx.lineTo(0, seg.p1.screen.y);
                    ctx.lineTo(canvas.width, seg.p1.screen.y);
                    ctx.lineTo(canvas.width, prev.p1.screen.y);
                    ctx.fill();

                    // Draw Asphalt Center Road Layout
                    ctx.fillStyle = seg.color.road;
                    ctx.beginPath();
                    ctx.moveTo(prev.p1.screen.x - prev.p1.screen.w, prev.p1.screen.y);
                    ctx.lineTo(seg.p1.screen.x - seg.p1.screen.w, seg.p1.screen.y);
                    ctx.lineTo(seg.p1.screen.x + seg.p1.screen.w, seg.p1.screen.y);
                    ctx.lineTo(prev.p1.screen.x + prev.p1.screen.w, prev.p1.screen.y);
                    ctx.fill();

                    // Draw Side Rumble strips edges indicators
                    ctx.fillStyle = seg.color.rumble;
                    const w1 = prev.p1.screen.w * 0.1;
                    const w2 = seg.p1.screen.w * 0.1;
                    
                    // Left Rumble
                    ctx.beginPath();
                    ctx.moveTo(prev.p1.screen.x - prev.p1.screen.w, prev.p1.screen.y);
                    ctx.lineTo(seg.p1.screen.x - seg.p1.screen.w, seg.p1.screen.y);
                    ctx.lineTo(seg.p1.screen.x - seg.p1.screen.w + w2, seg.p1.screen.y);
