<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stunt Car Playground</title>
    <style>
        /* Force the document to take up the full screen size */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #050505; 
            font-family: sans-serif; 
        }
        /* Lock the canvas to full screen windows */
        #gameCanvas { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            display: block;
            z-index: 1;
        }
        /* Push the UI over the top of the canvas layout */
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            text-shadow: 1px 1px 3px black; 
            pointer-events: none; 
            z-index: 10; 
        }
        #speedometer { font-size: 32px; font-weight: bold; font-family: monospace; }
        #controls { margin-top: 10px; font-size: 14px; opacity: 0.8; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="ui">
        <div id="speedometer">000 KM/H</div>
        <div id="controls">WASD / Arrows to Drive | Space to Brake | R to Reset</div>
    </div>

    <!-- Explicitly declaring the canvas template element here -->
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- Core WebGL Engine Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0b0d0);
        scene.fog = new THREE.FogExp2(0xa0b0d0, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Link directly to our hardcoded canvas element
        const canvasContainer = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvasContainer, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        // --- Environmental Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- Physics Track Environment Boundary Surfaces ---
        const gravity = -18.0;
        const obstacles = [];

        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        const grid = new THREE.GridHelper(1000, 100, 0x444444, 0x333333);
        grid.position.y = 0.01;
        scene.add(grid);

        function createRamp(w, h, d, x, y, z, rotX, color = 0xdd3333) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.x = rotX;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            obstacles.push(mesh);
            return mesh;
        }

        // Stunt Arena Obstacles
        createRamp(20, 2, 40, 0, 0.5, -60, 0.15); 
        createRamp(25, 2, 30, 40, -1, -40, 0.3, 0xffaa00); 
        createRamp(30, 2, 80, -50, 5, -80, -0.05, 0x3388ff); 

        // --- Compound Vehicle Structural Rig ---
        const car = new THREE.Group();
        car.position.set(0, 1, 0);
        scene.add(car);

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.2, metalness: 0.8 });
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 4), bodyMat);
        chassis.position.y = 0.4;
        chassis.castShadow = true;
        car.add(chassis);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 2), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 }));
        cabin.position.set(0, 0.85, -0.2);
        cabin.castShadow = true;
        car.add(cabin);

        const wing = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 0.5), bodyMat);
        wing.position.set(0, 0.2, 2.1);
        car.add(wing);

        // Wheels System Grid Layout
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 24).rotateZ(Math.PI / 2);

        const wheels = [];
        const wheelPositions = [
            { x: -1, y: 0.3, z: 1.2, isFront: true },   
            { x: 1, y: 0.3, z: 1.2, isFront: true },    
            { x: -1, y: 0.3, z: -1.2, isFront: false }, 
            { x: 1, y: 0.3, z: -1.2, isFront: false }   
        ];

        wheelPositions.forEach(pos => {
            const pivot = new THREE.Group();
            pivot.position.set(pos.x, pos.y, pos.z);
            
            const wheelMesh = new THREE.Mesh(wheelGeo, wheelMat);
            wheelMesh.castShadow = true;
            pivot.add(wheelMesh);
            
            car.add(pivot);
            wheels.push({ pivot: pivot, mesh: wheelMesh, isFront: pos.isFront });
        });

        // --- Keyboard Input Handling Matrix ---
        const keys = { Forward: false, Backward: false, Left: false, Right: false, Brake: false };
        
        const parseKeys = (e, status) => {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': keys.Forward = status; break;
                case 'KeyS': case 'ArrowDown': keys.Backward = status; break;
                case 'KeyA': case 'ArrowLeft': keys.Left = status; break;
                case 'KeyD': case 'ArrowRight': keys.Right = status; break;
                case 'Space': keys.Brake = status; break;
                case 'KeyR': if(status) resetCar(); break;
            }
        };

        window.addEventListener('keydown', (e) => parseKeys(e, true));
        window.addEventListener('keyup', (e) => parseKeys(e, false));

        function resetCar() {
            car.position.set(0, 2, 0);
            car.rotation.set(0, 0, 0);
            speed = 0;
            velocity.set(0,0,0);
        }

        // --- Physics Quantities & Vector States ---
        let speed = 0;
        const maxSpeed = 65;
        const acceleration = 35;
        const friction = 0.98;
        const brakeDecel = 0.85;
        let steeringAngle = 0;
        const maxSteer = 0.5;
        
        const velocity = new THREE.Vector3();
        const clock = new THREE.Clock();
        const speedometerEl = document.getElementById('speedometer');

        // --- Main Simulation Loop Execution Block ---
        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            // Handle Input Vector Translations
            if (keys.Forward) {
                speed += acceleration * dt;
                if (speed > maxSpeed) speed = maxSpeed;
            } else if (keys.Backward) {
                speed -= acceleration * dt;
                if (speed < -maxSpeed / 2) speed = -maxSpeed / 2;
            } else {
                speed *= friction;
            }

            if (keys.Brake) speed *= brakeDecel;

            if (keys.Left) {
                steeringAngle = THREE.MathUtils.lerp(steeringAngle, maxSteer, dt * 10);
            } else if (keys.Right) {
                steeringAngle = THREE.MathUtils.lerp(steeringAngle, -maxSteer, dt * 10);
            } else {
                steeringAngle = THREE.MathUtils.lerp(steeringAngle, 0, dt * 10);
            }

            // Safe Wheel Transformation Loops
            wheels.forEach(w => {
                if (w.isFront) {
                    w.pivot.rotation.y = steeringAngle;
                }
                w.mesh.rotation.x += (speed * dt) / 0.4;
            });

            if (car.position.y <= 0.1 || car.isOnRamp) {
                car.rotation.y += steeringAngle * (speed / maxSpeed) * dt * 2.5;
            }

            const forwardDir = new THREE.Vector3(0, 0, 1).applyQuaternion(car.quaternion);
            velocity.x = forwardDir.x * speed;
            velocity.z = forwardDir.z * speed;

            // Surface Checking Mechanics
            let groundHeight = 0;
            car.isOnRamp = false;
            
            const carRay = new THREE.Raycaster(
                new THREE.Vector3(car.position.x, car.position.y + 2, car.position.z),
                new THREE.Vector3(0, -1, 0)
            );
            
            const intersections = carRay.intersectObjects(obstacles);

            if (intersections.length > 0 && intersections.distance <= 2.1) {
                groundHeight = (car.position.y + 2) - intersections.distance;
                car.isOnRamp = true;
                if(intersections.object.rotation.x !== 0) {
                    car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, intersections.object.rotation.x, dt * 5);
                }
            } else {
                car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, 0, dt * 2);
            }

            if (car.position.y > groundHeight) {
                velocity.y += gravity * dt;
            } else {
                velocity.y = 0;
                car.position.y = groundHeight;
