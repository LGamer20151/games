<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Math Workspace</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid #21262d;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
        #score { color: #58a6ff; }
        #status { color: #8b949e; font-size: 14px; margin-top: 5px; text-align: center;}
        canvas {
            background-color: #000000;
            border: 2px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>Web-Based Probability Engine</h1>
    </header>

    <div class="ui-panel">
        Balance: $<span id="score">100</span>
        <div id="status">Press SPACEBAR to Drop Ball ($10)</div>
    </div>

    <!-- The Plinko Screen -->
    <canvas id="plinkoCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const statusDisplay = document.getElementById('status');

        // Game State Variables
        let score = 100;
        let state = 1; // 1 = Waiting, 0 = Ball Falling
        let ballX = 0;
        let ballY = 60;
        let ballVX = 0;
        let ballVY = 0;
        const gravity = 0.2;
        const friction = 0.99;

        // Peg Layout Coordinates (Same logic as Scratch version)
        const pegs = [
            {x: 240, y: 120}, // Row 1
            {x: 210, y: 170}, {x: 270, y: 170}, // Row 2
            {x: 180, y: 220}, {x: 240, y: 220}, {x: 300, y: 220}, // Row 3
            {x: 150, y: 270}, {x: 210, y: 270}, {x: 270, y: 270}, {x: 330, y: 270} // Row 4
        ];

        // Multiplier Bucket Zones
        const buckets = [
            { startX: 0, endX: 170, color: '#404040', label: '0.5x', mult: 0.5 },   // Left Edge
            { startX: 170, endX: 210, color: '#FF8000', label: '1x', mult: 1 },    // Outer Left
            { startX: 210, endX: 270, color: '#00FF00', label: '2x', mult: 2 },    // THE MONEY SPOT
            { startX: 270, endX: 310, color: '#FF8000', label: '1x', mult: 1 },    // Outer Right
            { startX: 310, endX: 480, color: '#404040', label: '0.5x', mult: 0.5 }   // Right Edge
        ];

        // Keyboard Controls
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && state === 1) {
                if (score >= 10) {
                    score -= 10;
                    scoreDisplay.innerText = score;
                    statusDisplay.innerText = "Simulating drop path...";
                    
                    // Drop ball with slight random offset at the top
                    ballX = 240 + (Math.random() * 20 - 10);
                    ballY = 60;
                    ballVX = 0;
                    ballVY = 0;
                    state = 0; // Lock inputs
                } else {
                    statusDisplay.innerText = "Out of funds! Refresh page to reset.";
                }
            }
        });

        // Main Engine Loop (Equivalent to Scratch's Forever loop)
        function gameLoop() {
            // Physics Calculations
            if (state === 0) {
                ballVY += gravity;
                ballVX *= friction;
                ballX += ballVX;
                ballY += ballVY;

                // Check collisions against each peg
                pegs.forEach(peg => {
                    let dx = ballX - peg.x;
                    let dy = ballY - peg.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 12) { // Hitbox detection
                        ballVY = -2.5; // Bounce up
                        ballVX = (Math.random() * 4 - 2) + (dx * 0.2); // Random scatter deflection
                    }
                });

                // Wall bounds checks
                if (ballX < 10) { ballX = 10; ballVX *= -0.5; }
                if (ballX > 470) { ballX = 470; ballVX *= -0.5; }

                // Check landing at the bottom row (Y value)
                if (ballY >= 350) {
                    // Check which bucket zone the ball landed in
                    for (let i = 0; i < buckets.length; i++) {
                        if (ballX >= buckets[i].startX && ballX < buckets[i].endX) {
                            let winnings = 10 * buckets[i].mult;
                            score += winnings;
                            scoreDisplay.innerText = score;
                            statusDisplay.innerText = `Landed in ${buckets[i].label} slot! (+ $${winnings}). Press SPACE to drop again.`;
                            break;
                        }
                    }
                    state = 1; // Unlock drop mechanics
                }
            }

            // Canvas Drawing Logic (Equivalent to Scratch's Render Game Custom Block)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Prize Buckets
            buckets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.startX, 350, b.endX - b.startX, 50);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(b.label, b.startX + (b.endX - b.startX) / 2, 380);
            });

            // 2. Draw Pegs
            ctx.fillStyle = "#ffffff";
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Draw Pink Plinko Ball
            if (state === 0) {
                ctx.fillStyle = "#ff00ff";
                ctx.beginPath();
                ctx.arc(ballX, ballY, 7, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start the engine
        gameLoop();
    </script>
</body>
</html>
