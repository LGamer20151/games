<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Physics Workspace</title>
    <style>
        body { 
            background-color: #0b0f17; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid #24292f;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
        }
        #hud { color: #ff9800; }
        #level-indicator { color: #2ecc71; margin-right: 15px; }
        canvas {
            background-color: #1a233a;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>Vector Bike Trials Simulation Matrix</h1>
    </header>

    <div class="ui-panel">
        <span id="level-indicator">STAGE: 1</span>Time: <span id="hud">0.0s</span> | W = Gas | S = Brake | A/D = Lean & Flips
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hudDisplay = document.getElementById('hud');
        const lvlDisplay = document.getElementById('level-indicator');

        const gravity = 0.16;
        const groundY = 330;

        let timeElapsed = 0;
        let isAlive = true;
        let isVictory = false;
        let currentLevel = 1;

        let bike = {
            x: 80,
            y: 200,
            vx: 0,
            vy: 0,
            angle: 0,
            rotVel: 0,
            radius: 14,
            speed: 0.18,
            maxSpeed: 5.5,
            onGround: false
        };

        let terrainPoints = [];

        // Dynamic Level Terrain Generation
        function initTerrain(levelNum) {
            terrainPoints = [];
            lvlDisplay.innerText = "STAGE: " + levelNum;

            for (let x = 0; x <= 1400; x += 25) {
                let y = groundY;

                if (levelNum === 1) {
                    // Level 1: Standard Bumpy Trail Route
                    y = groundY + Math.sin(x * 0.015) * 45 + Math.cos(x * 0.04) * 12;
                    if (x > 500 && x < 620) y -= (x - 500) * 0.65; // Ramp up at finish
                } 
                else if (levelNum === 2) {
                    // Level 2: The Deep Death Valley Pit
                    y = groundY + Math.sin(x * 0.01) * 20;
                    if (x > 450 && x < 550) y -= (x - 450) * 0.7; // Fast jump ramp
                    if (x >= 550 && x < 660) y = 550;             // Huge gap trap pit!
                    if (x >= 660 && x < 750) y = groundY + 40;     // Lower landing zone
                } 
                else if (levelNum === 3) {
                    // Level 3: Double Complex Launch Modifiers
                    y = groundY;
                    if (x > 300 && x < 400) y -= (x - 300) * 0.8; // Ramp 1
                    if (x >= 400 && x < 480) y = 500;             // Gap 1
                    if (x >= 480 && x < 650) y = groundY - 50;     // Elevated upper terrace
                    if (x >= 650 && x < 750) y = 550;             // Gap 2
                }

                terrainPoints.push({ x: x, y: y });
            }
        }

        function getGroundHeight(xX) {
            for (let i = 0; i < terrainPoints.length - 1; i++) {
                if (xX >= terrainPoints[i].x && xX <= terrainPoints[i+1].x) {
                    let ratio = (xX - terrainPoints[i].x) / (terrainPoints[i+1].x - terrainPoints[i].x);
                    return terrainPoints[i].y + ratio * (terrainPoints[i+1].y - terrainPoints[i].y);
                }
            }
            return groundY;
        }

        let keys = {};
        window.addEventListener('keydown', function(e) { keys[e.code] = true; });
        window.addEventListener('keyup', function(e) { keys[e.code] = false; });

        function update() {
            if (!isAlive || isVictory) {
                if (keys['Space']) {
                    if (isVictory) {
                        // Advance stages or restart loop on completion
                        currentLevel = currentLevel >= 3 ? 1 : currentLevel + 1;
                    }
                    resetGame();
                }
                return;
            }

            timeElapsed += 1/60;
            hudDisplay.innerText = timeElapsed.toFixed(1) + "s";

            if (keys['KeyW']) {
                bike.vx += Math.cos(bike.angle) * bike.speed;
                bike.vy += Math.sin(bike.angle) * bike.speed;
            }
            if (keys['KeyS']) {
                bike.vx *= 0.92;
            }

            if (keys['KeyA']) bike.rotVel -= 0.005;
            if (keys['KeyD']) bike.rotVel += 0.005;

            bike.rotVel *= 0.94;
            bike.angle += bike.rotVel;

            bike.vy += gravity;
            bike.vx *= 0.99;

            bike.x += bike.vx;
            bike.y += bike.vy;

            let currentFloorY = getGroundHeight(bike.x);
            if (bike.y + bike.radius >= currentFloorY) {
                bike.y = currentFloorY - bike.radius;
                bike.vy = 0;
                bike.onGround = true;

                let nextFloorX = bike.x + 15;
                let groundSlopeAngle = Math.atan2(getGroundHeight(nextFloorX) - currentFloorY, 15);
                bike.angle = bike.angle * 0.75 + groundSlopeAngle * 0.25;
            } else {
                bike.onGround = false;
            }

            let normalizedAngle = Math.abs((bike.angle + Math.PI) % (Math.PI * 2) - Math.PI);
            if (bike.onGround && normalizedAngle > 1.35) {
                isAlive = false;
                hudDisplay.innerText = "CRASHED! Press SPACE to Restart.";
            }

            if (bike.y > 420) {
                isAlive = false;
                hudDisplay.innerText = "WASTED! Fell into a pit. Press SPACE to Restart.";
            }

            if (bike.x >= 1100) {
                isVictory = true;
                hudDisplay.innerText = "STAGE COMPLETED! Press SPACE for Next Level.";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let cameraX = bike.x - 180;
            if (cameraX < 0) cameraX = 0;
            ctx.translate(-cameraX, 0);

            // Draw Checkered Banner Finish Line
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(1100, 50, 15, 300);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText("GOAL FINISH", 1070, 40);

            // Background Terrain Dirt
            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            if (terrainPoints.length > 0) {
                ctx.moveTo(terrainPoints[0].x, 400);
                terrainPoints.forEach(function(p) { ctx.lineTo(p.x, p.y); });
                ctx.lineTo(terrainPoints[terrainPoints.length-1].x, 400);
            }
            ctx.closePath();
            ctx.fill();

            // Track Driving Lane Surface Edge Accent (Green neon)
            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 4;
            ctx.beginPath();
            terrainPoints.forEach(function(p, index) {
                if (index === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            // Bike Character Assembly
            ctx.save();
            ctx.translate(bike.x, bike.y);
            ctx.rotate(bike.angle);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-16, 5);
            ctx.lineTo(16, 5);
            ctx.lineTo(0, -12);
            ctx.closePath();
            ctx.stroke();

            ctx.fillStyle = '#111';
            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(-16, 6, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(16, 6, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#e74c3c';
            ctx.beginPath(); ctx.arc(0, -16, 6, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
            ctx.restore();

            // HUD Screens Display Overlay Text boxes
            if (!isAlive) {
                ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0,0,700,400);
                ctx.fillStyle = '#ff2a2a'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText("DRIVER CRASHED", 350, 180);
                ctx.font = '16px sans-serif'; ctx.fillStyle = '#fff';
                ctx.fillText("Press SPACEBAR to Try Stage Again", 350, 220);
            } else if (isVictory) {
                ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0,0,700,400);
                ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(currentLevel === 3 ? "ALL STAGES COMPLETED!" : "STAGE PASSED!", 350, 180);
                ctx.font = '16px sans-serif'; ctx.fillStyle = '#fff';
                ctx.fillText("Press SPACEBAR to Load Next Track", 350, 220);
            }
        }

        function resetGame() {
            bike.x = 80; bike.y = 160; bike.vx = 0; bike.vy = 0; bike.angle = 0; bike.rotVel = 0;
            timeElapsed = 0; isAlive = true; isVictory = false;
