<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Moto Stunt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060a14;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      background: radial-gradient(circle at 50% 20%, #111c36 0%, #060a14 85%);
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 212, 255, 0.15);
      max-width: 96vw;
      max-height: 88vh;
    }
    .controls {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 0.3px;
    }
    span { color: #00d4ff; font-weight: 700; }
  </style>
</head>
<body>

  <canvas id="game" width="900" height="500"></canvas>
  <div class="controls">
    <span>W / UP</span> Gas &nbsp;•&nbsp;
    <span>S / DOWN</span> Brake &nbsp;•&nbsp;
    <span>A / D</span> or <span>LEFT / RIGHT</span> Mid-Air Flips &nbsp;•&nbsp;
    <span>SHIFT</span> Nitro Boost
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let dist = 0;
    let speed = 6;
    let bikeY = 280;
    let vy = 0;
    let angle = 0;
    let airRotation = 0;
    let flips = 0;
    let score = 0;
    let bestScore = Number(localStorage.getItem('cyber_moto_best') || 0);
    let nitro = 100;
    let gameOver = false;
    let crashMsg = '';
    let particles = [];
    let coins = [];

    const keys = {};
    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      keys[e.code] = true;
      if (gameOver && e.code === 'Space') resetGame();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    canvas.addEventListener('click', () => { if (gameOver) resetGame(); });

    function terrainY(x) {
      return 355
        - Math.sin(x * 0.0055) * 75
        - Math.cos(x * 0.013) * 38
        - Math.sin(x * 0.024) * 14;
    }

    function spawnCoinCluster(startX) {
      for (let i = 0; i < 4; i++) {
        const cx = startX + i * 42;
        coins.push({ x: cx, y: terrainY(cx) - 42, collected: false });
      }
    }

    function resetGame() {
      dist = 0;
      speed = 6;
      bikeY = terrainY(220) - 18;
      vy = 0;
      angle = 0;
      airRotation = 0;
      flips = 0;
      score = 0;
      nitro = 100;
      gameOver = false;
      crashMsg = '';
      particles = [];
      coins = [];
      for (let x = 700; x < 3500; x += 650) spawnCoinCluster(x);
    }

    function addExhaust(x, y, isNitro) {
      particles.push({
        x, y,
        vx: -2 - Math.random() * 2,
        vy: (Math.random() - 0.5) * 1.5,
        life: 1,
        color: isNitro ? '#00d4ff' : '#64748b',
        size: isNitro ? 6 : 4
      });
    }

    function update() {
      if (gameOver) return;

      const bx = 220;
      const boosting = (keys['ShiftLeft'] || keys['ShiftRight']) && nitro > 1;

      if (boosting) {
        nitro = Math.max(0, nitro - 0.55);
        speed = Math.min(14.5, speed + 0.25);
      } else {
        nitro = Math.min(100, nitro + 0.14);
        if (keys['ArrowUp'] || keys['KeyW']) speed = Math.min(10.5, speed + 0.15);
        else if (keys['ArrowDown'] || keys['KeyS']) speed = Math.max(3, speed - 0.22);
        else speed = Math.max(6, speed - 0.04);
      }

      dist += speed;
      score += speed * (boosting ? 0.12 : 0.06);

      // Spawn future coins
      if (coins.length < 16) {
        const lastX = coins.length ? coins[coins.length - 1].x : dist + 800;
        spawnCoinCluster(lastX + 550 + Math.random() * 300);
      }

      const groundY = terrainY(dist + bx);
      const nextGroundY = terrainY(dist + bx + 12);
      const slope = Math.atan2(nextGroundY - groundY, 12);

      vy += 0.46;
      bikeY += vy;

      const onGround = bikeY >= groundY - 17;

      if (onGround) {
        let normAngle = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        if (normAngle > Math.PI) normAngle -= Math.PI * 2;

        if (Math.abs(normAngle - slope) > 1.15) {
          gameOver = true;
          crashMsg = 'Wipeout! Land with your tires aligned to the slope.';
          if (Math.floor(score) > bestScore) {
            bestScore = Math.floor(score);
            localStorage.setItem('cyber_moto_best', bestScore);
          }
          return;
        }

        if (flips > 0) {
          score += flips * 250;
          nitro = Math.min(100, nitro + flips * 35);
          flips = 0;
        }

        bikeY = groundY - 17;
        vy = (nextGroundY - groundY) * (speed / 12);
        angle = slope;
        airRotation = 0;

        if (Math.random() < 0.65) addExhaust(bx - 22, bikeY + 8, boosting);
      } else {
        if (keys['ArrowLeft'] || keys['KeyA']) { angle -= 0.095; airRotation -= 0.095; }
        if (keys['ArrowRight'] || keys['KeyD']) { angle += 0.095; airRotation += 0.095; }

        if (Math.abs(airRotation) >= Math.PI * 1.8) {
          flips++;
          airRotation = 0;
        }
        if (boosting) addExhaust(bx - 20, bikeY + 6, true);
      }

      // Coin pickups
      coins.forEach(c => {
        const screenX = c.x - dist;
        if (!c.collected && Math.hypot(screenX - bx, c.y - bikeY) < 34) {
          c.collected = true;
          score += 50;
          nitro = Math.min(100, nitro + 12);
        }
      });
      coins = coins.filter(c => !c.collected && c.x - dist > -60);

      // Exhaust particles
      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
      particles = particles.filter(p => p.life > 0);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background grid lines
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.45)';
      ctx.lineWidth = 1;
      const gridOffset = dist % 60;
      for (let gx = -gridOffset; gx < canvas.width; gx += 60) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
      }

      // Terrain fill
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let sx = 0; sx <= canvas.width; sx += 8) ctx.lineTo(sx, terrainY(dist + sx));
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();
      ctx.fill();

      // Neon track surface
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let sx = 0; sx <= canvas.width; sx += 8) {
        const sy = terrainY(dist + sx);
        if (sx === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.stroke();

      // Coins
      coins.forEach(c => {
        const sx = c.x - dist;
        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.arc(sx, c.y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Exhaust particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Motorcycle & Rider
      const bx = 220;
      ctx.save();
      ctx.translate(bx, bikeY);
      ctx.rotate(angle);

      // Rear & Front Tires
      ctx.fillStyle = '#060a14';
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(-20, 11, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(20, 11, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // Bike Frame
      ctx.fillStyle = '#00d4ff';
      ctx.beginPath();
      ctx.moveTo(-22, 6);
      ctx.lineTo(-6, -8);
      ctx.lineTo(16, -6);
      ctx.lineTo(22, 8);
      ctx.closePath();
      ctx.fill();

      // Rider Torso & Helmet
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(-8, -20); ctx.lineTo(8, -12); ctx.stroke();
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath(); ctx.arc(-6, -26, 7.5, 0, Math.PI * 2); ctx.fill();

      ctx.restore();

      // HUD
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`SCORE: ${Math.floor(score)}`, 22, 34);
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(`BEST: ${Math.max(bestScore, Math.floor(score))}`, 22, 56);

      // Nitro Bar
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(canvas.width - 190, 20, 165, 16);
      ctx.fillStyle = '#00d4ff';
      ctx.fillRect(canvas.width - 190, 20, 165 * (nitro / 100), 16);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('NITRO', canvas.width - 190, 50);

      if (flips > 0 && !gameOver) {
        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`FLIP x${flips} (+${flips * 250})`, canvas.width / 2, 55);
        ctx.textAlign = 'left';
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(6, 10, 20, 0.82)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CRASHED!', canvas.width / 2, 215);
        ctx.fillStyle = '#f43f5e';
        ctx.font = '18px sans-serif';
        ctx.fillText(crashMsg, canvas.width / 2, 252);
        ctx.fillStyle = '#00d4ff';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('Press SPACE or Click to Ride Again', canvas.width / 2, 295);
        ctx.textAlign = 'left';
      }
    }

    function loop() {
      update();
      draw();
