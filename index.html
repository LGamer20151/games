<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Stunt Car Playground</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000000; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffff; text-shadow: 0 0 5px #00ffff; pointer-events: none; z-index: 10; }
        #speedometer { font-size: 32px; font-weight: bold; font-family: monospace; }
        #controls { margin-top: 10px; font-size: 14px; opacity: 0.8; color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="ui">
        <div id="speedometer">000 KM/H</div>
        <div id="controls">WASD / Arrows to Drive | Space to Brake | R to Reset</div>
    </div>

    <script>
        // --- Core Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Pitch black sky background

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Physics & Track Entities ---
        const gravity = -18.0;
        const obstacles = [];

        // Ground Floor - Grid uses MeshBasicMaterial so it glows without needing light
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshBasicMaterial({ color: 0x050505 }); // Dark dark grey floor
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
        
        // Vibrant glowing grid overlay
        const grid = new THREE.GridHelper(1000, 100, 0xff00ff, 0x004444);
        grid.position.y = 0.01;
        scene.add(grid);

        // Neon Glow Ramp Builder
        function createNeonRamp(w, h, d, x, y, z, rotX, neonColor) {
            const geo = new THREE.BoxGeometry(w, h, d);
            // MeshBasicMaterial guarantees the color shows up even with no lights
            const mat = new THREE.MeshBasicMaterial({ color: 0x111111 }); 
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.x = rotX;
            scene.add(mesh);

            // Add bright wireframe outlines to make the ramps visible
            const wireframeGeo = new THREE.EdgesGeometry(geo);
            const wireframeMat = new THREE.LineBasicMaterial({ color: neonColor, linewidth: 2 });
            const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
            mesh.add(wireframe);

            obstacles.push(mesh);
            return mesh;
        }

        // Stunt Infrastructure (Glowing Ramps)
        createNeonRamp(20, 2, 40, 0, 0.5, -60, 0.15, 0x00ffff); // Cyan Ramp
        createNeonRamp(25, 2, 30, 40, -1, -40, 0.3, 0xffff00);  // Yellow Ramp
        createNeonRamp(30, 2, 80, -50, 5, -80, -0.05, 0xff00ff); // Magenta Platform

        // --- Neon Cyberpunk Vehicle Setup ---
        const car = new THREE.Group();
        car.position.set(0, 1, 0);
        scene.add(car);

        // Car Body (Bright Glowing Chassis Outline)
        const carChassisGeo = new THREE.BoxGeometry(1.8, 0.6, 4);
        const carBodyMesh = new THREE.Mesh(carChassisGeo, new THREE.MeshBasicMaterial({ color: 0x222222 }));
        carBodyMesh.position.y = 0.4;
        car.add(carBodyMesh);

        const bodyWireframeGeo = new THREE.EdgesGeometry(carChassisGeo);
        const bodyWireframeMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 }); // Neon Cyan Car
        const bodyWireframe = new THREE.LineSegments(bodyWireframeGeo, bodyWireframeMat);
        carBodyMesh.add(bodyWireframe);

        // Glowing Wheels Setup
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16).rotateZ(Math.PI / 2);
        const wheelWireGeo = new THREE.EdgesGeometry(wheelGeo);
        const wheelWireMat = new THREE.LineBasicMaterial({ color: 0xff00ff }); // Magenta Wheels
        const wheels = [];
        
        const wheelPositions = [
            { x: -1, y: 0.3, z: 1.2, isFront: true },   
            { x: 1, y: 0.3, z: 1.2, isFront: true },    
            { x: -1, y: 0.3, z: -1.2, isFront: false }, 
            { x: 1, y: 0.3, z: -1.2, isFront: false }   
        ];

        wheelPositions.forEach(pos => {
            const pivot = new THREE.Group();
            pivot.position.set(pos.x, pos.y, pos.z);
            
            const wheelMesh = new THREE.Mesh(wheelGeo, new THREE.MeshBasicMaterial({ color: 0x111111 }));
            const wheelWire = new THREE.LineSegments(wheelWireGeo, wheelWireMat);
            wheelMesh.add(wheelWire);
            
            pivot.add(wheelMesh);
            car.add(pivot);
            wheels.push({ pivot: pivot, mesh: wheelMesh, isFront: pos.isFront });
        });

        // --- Keyboard Controls Matrix ---
        const keys = { Forward: false, Backward: false, Left: false, Right: false, Brake: false };
        
        const parseKeys = (e, status) => {
            switch (e.code) {
                case 'KeyW': case 'ArrowUp': keys.Forward = status; break;
                case 'KeyS': case 'ArrowDown': keys.Backward = status; break;
                case 'KeyA': case 'ArrowLeft': keys.Left = status; break;
                case 'KeyD': case 'ArrowRight': keys.Right = status; break;
                case 'Space': keys.Brake = status; break;
                case 'KeyR': if(status) resetCar(); break;
            }
        };

        window.addEventListener('keydown', (e) => parseKeys(e, true));
        window.addEventListener('keyup', (e) => parseKeys(e, false));

        function resetCar() {
            car.position.set(0, 2, 0);
            car.rotation.set(0, 0, 0);
            speed = 0;
            velocity.set(0,0,0);
        }

        // --- Game Physics Logic Loop ---
        let speed = 0;
        const maxSpeed = 65;
        const acceleration = 35;
        const friction = 0.98;
        const brakeDecel = 0.85;
        let steeringAngle = 0;
        const maxSteer = 0.5;
        
        const velocity = new THREE.Vector3();
        const clock = new THREE.Clock();
        const speedometerEl = document.getElementById('speedometer');

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            if (keys.Forward) {
                speed += acceleration * dt;
                if (speed > maxSpeed) speed = maxSpeed;
            } else if (keys.Backward) {
                speed -= acceleration * dt;
                if (speed < -maxSpeed / 2) speed = -maxSpeed / 2;
            } else {
                speed *= friction;
            }

            if (keys.Brake) speed *= brakeDecel;

            if (keys.Left) {
                steeringAngle = THREE.MathUtils.lerp(steeringAngle, maxSteer, dt * 10);
            } else if (keys.Right) {
                steeringAngle = THREE.MathUtils.lerp(steeringAngle, -maxSteer, dt * 10);
            } else {
                steeringAngle = THREE.MathUtils.lerp(steeringAngle, 0, dt * 10);
            }

            wheels.forEach(w => {
                if (w.isFront) w.pivot.rotation.y = steeringAngle;
                w.mesh.rotation.x += (speed * dt) / 0.4;
            });

            if (car.position.y <= 0.1 || car.isOnRamp) {
                car.rotation.y += steeringAngle * (speed / maxSpeed) * dt * 2.5;
            }

            const forwardDir = new THREE.Vector3(0, 0, 1).applyQuaternion(car.quaternion);
            velocity.x = forwardDir.x * speed;
            velocity.z = forwardDir.z * speed;

            let groundHeight = 0;
            car.isOnRamp = false;
            
            const carRay = new THREE.Raycaster(
                new THREE.Vector3(car.position.x, car.position.y + 2, car.position.z),
                new THREE.Vector3(0, -1, 0)
            );
            
            const intersections = carRay.intersectObjects(obstacles);

            if (intersections.length > 0 && intersections.distance <= 2.1) {
                groundHeight = (car.position.y + 2) - intersections.distance;
                car.isOnRamp = true;
                if(intersections.object.rotation.x !== 0) {
                    car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, intersections.object.rotation.x, dt * 5);
                }
            } else {
                car.rotation.x = THREE.MathUtils.lerp(car.rotation.x, 0, dt * 2);
            }

            if (car.position.y > groundHeight) {
                velocity.y += gravity * dt;
            } else {
                velocity.y = 0;
                car.position.y = groundHeight;
            }

            car.position.addScaledVector(velocity, dt);

            if (car.position.y < -30) resetCar();

            // Camera System Follow Setup
            const targetCamOffset = new THREE.Vector3(0, 3, -7).applyQuaternion(car.quaternion);
            const targetCamPos = car.position.clone().add(targetCamOffset);
            camera.position.lerp(targetCamPos, dt * 6);
            
            const lookAtTarget = car.position.clone().add(new THREE.Vector3(0, 0.8, 0));
            camera.lookAt(lookAtTarget);

            // Dashboard Metrics Readout
            const displaySpeed = Math.abs(Math.round(speed * 3.6));
            speedometerEl.textContent = `${displaySpeed.toString().padStart(3, '0')} KM/H`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
