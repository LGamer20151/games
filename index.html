<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Moto Stunt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b132b;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #hud {
      width: 800px;
      max-width: 95vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1c2541;
      border: 2px solid #3a86ff;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      font-weight: bold;
    }
    .stat { color: #6fffe9; font-size: 1.1rem; }
    canvas {
      background: linear-gradient(to bottom, #0b132b 0%, #1c2541 75%, #273459 100%);
      border: 2px solid #3a86ff;
      border-radius: 0 0 10px 10px;
      width: 800px;
      max-width: 95vw;
      height: auto;
      display: block;
    }
    #controls-hint {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #a8b2d1;
      text-align: center;
    }
    #touch-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      background: #1c2541;
      color: #6fffe9;
      border: 1px solid #3a86ff;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:active { background: #3a86ff; color: #fff; }
  </style>
</head>
<body>

  <div id="hud">
    <div>🏍️ NOVA MOTO</div>
    <div>Distance: <span id="dist" class="stat">0m</span></div>
    <div>Flips: <span id="flips" class="stat">0</span></div>
    <div>Best: <span id="best" class="stat">0m</span></div>
  </div>

  <canvas id="game" width="800" height="450"></canvas>

  <div id="controls-hint">
    <b>W / Up</b>: Gas &nbsp;|&nbsp; <b>S / Down</b>: Brake &nbsp;|&nbsp;
    <b>A / Left</b>: Lean Back &nbsp;|&nbsp; <b>D / Right</b>: Lean Forward &nbsp;|&nbsp; <b>R</b>: Restart
  </div>

  <div id="touch-controls">
    <button class="btn" id="btnBack">↺ Lean Back</button>
    <button class="btn" id="btnFwd">↻ Lean Fwd</button>
    <button class="btn" id="btnBrake">Brake</button>
    <button class="btn" id="btnGas">Gas ⛽</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const distEl = document.getElementById("dist");
    const flipsEl = document.getElementById("flips");
    const bestEl = document.getElementById("best");

    let bestScore = Number(localStorage.getItem("novaMotoBest") || 0);
    bestEl.textContent = bestScore + "m";

    // Input state
    const keys = { gas: false, brake: false, left: false, right: false };

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keys.gas = true;
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keys.brake = true;
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      if (e.key === "r" || e.key === "R") resetGame();
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keys.gas = false;
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keys.brake = false;
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    });

    // Touch / Button bindings
    function bindBtn(id, prop) {
      const el = document.getElementById(id);
      el.addEventListener("mousedown", () => keys[prop] = true);
      el.addEventListener("mouseup", () => keys[prop] = false);
      el.addEventListener("mouseleave", () => keys[prop] = false);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[prop] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[prop] = false; });
    }
    bindBtn("btnGas", "gas");
    bindBtn("btnBrake", "brake");
    bindBtn("btnBack", "left");
    bindBtn("btnFwd", "right");

    // Terrain generator (smooth procedural hills that get steeper over distance)
    function getTerrainHeight(x) {
      if (x < 300) return 340; // Flat starting runway
      const difficulty = Math.min(2.2, 1 + (x - 300) / 18000);
      const h1 = Math.sin(x * 0.0045) * 55 * difficulty;
      const h2 = Math.sin(x * 0.011 + 1.5) * 28 * difficulty;
      const h3 = Math.cos(x * 0.002) * 40;
      return 330 + h1 + h2 + h3;
    }

    function getTerrainSlope(x) {
      const dx = 4;
      return Math.atan2(getTerrainHeight(x + dx) - getTerrainHeight(x - dx), dx * 2);
    }

    // Bike state
    let bike = {};
    let cameraX = 0;

    function resetGame() {
      bike = {
        x: 120,
        y: 300,
        vx: 0,
        vy: 0,
        angle: 0,
        angVel: 0,
        grounded: false,
        airRotation: 0,
        flips: 0,
        crashed: false
      };
      cameraX = 0;
      flipsEl.textContent = "0";
    }

    resetGame();

    function update() {
      if (bike.crashed) return;

      const gravity = 0.42;
      const wheelOffset = 22;

      // Acceleration & braking
      if (bike.grounded) {
        if (keys.gas) bike.vx += 0.32;
        if (keys.brake) bike.vx -= 0.28;
        bike.vx *= 0.985; // Ground friction
      } else {
        bike.vx *= 0.996; // Air drag
      }

      // Clamp max speed
      bike.vx = Math.max(-4, Math.min(16, bike.vx));

      // Rotation / Lean controls
      const spinPower = bike.grounded ? 0.004 : 0.0065;
      if (keys.left) bike.angVel -= spinPower;
      if (keys.right) bike.angVel += spinPower;
      bike.angVel *= 0.92;
      bike.angle += bike.angVel;

      // Apply gravity & velocity
      bike.vy += gravity;
      bike.x += bike.vx;
      bike.y += bike.vy;

      // Prevent reversing off left edge
      if (bike.x < 60) {
        bike.x = 60;
        bike.vx = 0;
      }

      // Ground collision check
      const groundY = getTerrainHeight(bike.x);
      const slope = getTerrainSlope(bike.x);

      if (bike.y + wheelOffset >= groundY) {
        // Check if landing upside down (crash condition)
        let normAngle = ((bike.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        if (normAngle > Math.PI * 0.62 && normAngle < Math.PI * 1.38) {
          bike.crashed = true;
        }

        // Count completed flips on clean landing
        if (!bike.grounded && !bike.crashed) {
          const completedFlips = Math.floor(Math.abs(bike.airRotation) / (Math.PI * 1.75));
          if (completedFlips > 0) {
            bike.flips += completedFlips;
            flipsEl.textContent = bike.flips;
          }
        }

        bike.y = groundY - wheelOffset;
        bike.vy = 0;
        bike.grounded = true;
        bike.airRotation = 0;

        // Align bike smoothly to hill slope
        const angleDiff = slope - bike.angle;
        bike.angle += angleDiff * 0.25;

        // Slope physics boost/drag
        bike.vx += Math.sin(slope) * 0.22;
      } else {
        if (bike.grounded) bike.airRotation = 0;
        bike.grounded = false;
        bike.airRotation += bike.angVel;
      }

      // Update camera & score
      cameraX = bike.x - 200;
      const meters = Math.max(0, Math.floor((bike.x - 120) / 15));
      distEl.textContent = meters + "m";

      if (meters > bestScore) {
        bestScore = meters;
        bestEl.textContent = bestScore + "m";
        localStorage.setItem("novaMotoBest", bestScore);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw background stars/grid lines
      ctx.strokeStyle = "rgba(58, 134, 255, 0.12)";
      ctx.lineWidth = 1;
      const gridOffset = -(cameraX * 0.5) % 80;
      for (let gx = gridOffset; gx < canvas.width; gx += 80) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
      }

      // Draw Terrain
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let sx = 0; sx <= canvas.width; sx += 6) {
        const worldX = sx + cameraX;
        ctx.lineTo(sx, getTerrainHeight(worldX));
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, 220, 0, canvas.height);
      grad.addColorStop(0, "#1d3557");
      grad.addColorStop(1, "#0b132b");
      ctx.fillStyle = grad;
      ctx.fill();

      // Neon ground top edge
      ctx.beginPath();
      for (let sx = 0; sx <= canvas.width; sx += 6) {
        const worldX = sx + cameraX;
        const wy = getTerrainHeight(worldX);
        if (sx === 0) ctx.moveTo(sx, wy);
        else ctx.lineTo(sx, wy);
      }
      ctx.strokeStyle = "#6fffe9";
      ctx.lineWidth = 4;
      ctx.stroke();

      // Draw Motorcycle & Rider
      ctx.save();
      ctx.translate(bike.x - cameraX, bike.y);
      ctx.rotate(bike.angle);

      // Rear & Front Wheels
      const drawWheel = (wx, wy) => {
        ctx.beginPath();
        ctx.arc(wx, wy, 13, 0, Math.PI * 2);
        ctx.fillStyle = "#111";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#6fffe9";
        ctx.stroke();
      };
      drawWheel(-22, 10);
      drawWheel(22, 10);

      // Bike Frame
      ctx.strokeStyle = "#3a86ff";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-22, 10);
      ctx.lineTo(-4, -6);
      ctx.lineTo(14, -6);
      ctx.lineTo(22, 10);
      ctx.stroke();

      // Rider Body & Helmet
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.beginPath();
