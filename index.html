<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <style>
    :root {
      --bg: #030914;
      --bg2: #0b1730;
      --panel: rgba(13, 22, 37, 0.82);
      --line: rgba(128, 217, 255, 0.45);
      --cyan: #7ee9ff;
      --blue: #77a9ff;
      --green: #9ef7c8;
      --text: #ebf7ff;
      --muted: rgba(235, 247, 255, 0.7);
      --shadow: rgba(94, 156, 255, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(76, 126, 214, 0.28), transparent 34%),
        linear-gradient(180deg, var(--bg) 0%, #050b17 100%);
    }

    .shell {
      max-width: 1260px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(10, 19, 31, 0.65);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 22px var(--shadow);
    }

    .brand {
      font-size: clamp(18px, 2vw, 28px);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 700;
    }

    .count {
      font-size: 12px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 72px);
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .game-card {
      display: block;
      position: relative;
      min-height: 180px;
      padding: 18px 18px 16px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(18, 31, 51, 0.95), rgba(9, 18, 30, 0.9));
      border: 1px solid var(--line);
      box-shadow: 0 0 18px var(--shadow);
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      overflow: hidden;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 24px rgba(126, 233, 255, 0.18);
      border-color: rgba(126, 233, 255, 0.75);
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--green));
      opacity: 0.9;
    }

    .game-card .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(126, 233, 255, 0.08);
      border: 1px solid rgba(126, 233, 255, 0.28);
      color: var(--cyan);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 700;
    }

    .game-card h2 {
      margin: 0 0 10px;
      font-size: clamp(20px, 2vw, 28px);
      letter-spacing: 1px;
    }

    .game-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .play {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-size: 11px;
    }

    .play::after {
      content: "→";
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">Game Hub</div>
      <div class="count" id="gameCount">0 Games</div>
    </div>

    <div class="hero">
      <h1>Pick a game</h1>
      <p class="subtitle">Choose your challenge</p>
    </div>

    <div class="grid" id="gameGrid"></div>
  </div>

  <script>
    const games = [
      { name: "Galatrix", file: "galatrix.html", genre: "Orbit Defense" },
      { name: "2048 Merge", file: "2048-merge.html", genre: "Puzzle" },
      { name: "3D Asteroids", file: "3d-asteroids.html", genre: "3D" },
      { name: "3D Bounce", file: "3d-bounce.html", genre: "3D" },
      { name: "3D Breaker", file: "3d-breaker.html", genre: "3D" },
      { name: "3D Drift", file: "3d-drift.html", genre: "3D" },
      { name: "3D Orbit", file: "3d-orbit.html", genre: "3D" },
      { name: "3D Pillar", file: "3d-pillar.html", genre: "3D" },
      { name: "3D Portal", file: "3d-portal.html", genre: "3D" },
      { name: "3D Runner", file: "3d-runner.html", genre: "3D" },
      { name: "3D Snake", file: "3d-snake.html", genre: "3D" },
      { name: "3D Target", file: "3d-target.html", genre: "3D" },
      { name: "Arua", file: "arua.html", genre: "Action" },
      { name: "Balance Beam", file: "balance-beam.html", genre: "Skill" },
      { name: "Bowling Burst", file: "bowling-burst.html", genre: "Arcade" },
      { name: "Brick Breaker", file: "brickbreaker.html", genre: "Arcade" },
      { name: "Bubble Pop", file: "bubble-pop.html", genre: "Arcade" },
      { name: "Catapult", file: "catapult.html", genre: "Skill" },
      { name: "Chess", file: "chess.html", genre: "Strategy" },
      { name: "Chrome Chicken", file: "chromechicken.html", genre: "Arcade" },
      { name: "Color Switch", file: "color-switch.html", genre: "Reflex" },
      { name: "Comet Catch", file: "comet-catch.html", genre: "Arcade" },
      { name: "Dodge Grid", file: "dodge-grid.html", genre: "Avoid" },
      { name: "Drift Boss", file: "drift-boss.html", genre: "Racing" },
      { name: "Escape", file: "escape.html", genre: "Adventure" },
      { name: "Flappy Duck", file: "flappy-duck.html", genre: "Arcade" },
      { name: "Geometry Dash", file: "geometrydash.html", genre: "Rhythm" },
      { name: "Gravity Drop", file: "gravity-drop.html", genre: "Physics" },
      { name: "Gravity Sandbox", file: "gravity-sandbox.html", genre: "Physics" },
      { name: "Hill Climb", file: "hillclimb.html", genre: "Driving" },
      { name: "Hoop Hustle", file: "hoop-hustle.html", genre: "Sports" },
      { name: "Lights Out", file: "lights-out.html", genre: "Puzzle" },
      { name: "Line Slicer", file: "line-slicer.html", genre: "Arcade" },
      { name: "Memory Match", file: "memorymatch.html", genre: "Memory" },
      { name: "Minesweeper", file: "minesweeper.html", genre: "Logic" },
      { name: "Motorcycle Rave", file: "motorcyclerave.html", genre: "Racing" },
      { name: "Number Rush", file: "number-rush.html", genre: "Speed" },
      { name: "Obby", file: "obby.html", genre: "Platformer" },
      { name: "Orbit Catcher", file: "orbit-catcher.html", genre: "Arcade" },
      { name: "Pacman", file: "pacman.html", genre: "Classic" },
      { name: "Parking", file: "parking.html", genre: "Driving" },
      { name: "Pattern Lock", file: "pattern-lock.html", genre: "Puzzle" },
      { name: "Plinko", file: "plinko.html", genre: "Chance" },
      { name: "Precision Aim", file: "precision-aim.html", genre: "Shooter" },
      { name: "Ragdoll Sim", file: "ragdollsim.html", genre: "Simulation" },
      { name: "Reaction Rush", file: "reaction-rush.html", genre: "Reflex" },
      { name: "Rhythm Rush", file: "rhythm-rush.html", genre: "Rhythm" },
      { name: "Simon Says", file: "simonsays.html", genre: "Memory" },
      { name: "Skate Sprint", file: "skate-sprint.html", genre: "Sports" },
      { name: "Sliding Puzzle", file: "slidingpuzzle.html", genre: "Puzzle" },
      { name: "Snake", file: "snake.html", genre: "Classic" },
      { name: "Soccer Swoop", file: "soccer-swoop.html", genre: "Sports" },
      { name: "Space Shooter", file: "spaceshooter.html", genre: "Shooter" },
      { name: "Spot the Difference", file: "spotthedifference.html", genre: "Puzzle" },
      { name: "Star Dodge", file: "star-dodge.html", genre: "Avoid" },
      { name: "Target Trick", file: "target-trick.html", genre: "Shooter" },
      { name: "Tic Tac Toe", file: "tictactoe.html", genre: "Puzzle" },
      { name: "Tile Hop", file: "tile-hop.html", genre: "Rhythm" },
      { name: "Treasure Hunt", file: "treasure-hunt.html", genre: "Adventure" },
      { name: "Whack a Mole", file: "whackamole.html", genre: "Arcade" },
      { name: "Word Scramble", file: "word-scramble.html", genre: "Word" },
      { name: "Wordle Infinite", file: "wordleinfinite.html", genre: "Word" }
    ];

    const grid = document.getElementById("gameGrid");
    const count = document.getElementById("gameCount");

    games.forEach((game, index) => {
      const card = document.createElement("a");
      card.href = game.file;
      card.className = "game-card";
      card.setAttribute("aria-label", `Play ${game.name}`);
      card.innerHTML = `
        <div class="badge">${game.genre}</div>
        <h2>${game.name}</h2>
        <p>Game ${index + 1}</p>
        <div class="play">Play now</div>
      `;
      grid.appendChild(card);
    });

    count.textContent = `${games.length} Games`;
  </script>
</body>
</html>
