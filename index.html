<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Physics Sandbox</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid #21262d;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 15px 0;
            font-size: 16px;
            font-weight: bold;
        }
        #score-val { color: #58a6ff; }
        #status { color: #8b949e; font-size: 14px; margin-top: 5px; text-align: center;}
        canvas {
            background-color: #1a233a;
            border: 2px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vector Velocity Sandbox</h1>
    </header>

    <div class="ui-panel">
        Targets Eliminated: <span id="score-val">0</span> / 3
        <div id="status">Click and Drag the Yellow Duck to Launch! Press 'R' to Reset.</div>
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-val');
        const statusDisplay = document.getElementById('status');

        const gravity = 0.25;
        const groundY = 360;
        const slingX = 130;
        const slingY = 260;
        const maxPull = 80;

        let score = 0;
        let isDragging = false;
        let mouseX = 0;
        let mouseY = 0;

        let duck = {
            x: slingX,
            y: slingY,
            vx: 0,
            vy: 0,
            radius: 15,
            isLaunched: false,
            onGround: false
        };

        let entities = [];

        function initGame() {
            score = 0;
            scoreDisplay.innerText = score;
            statusDisplay.innerText = "Click and Drag the Yellow Duck to Launch! Press 'R' to Reset.";
            
            duck.x = slingX;
            duck.y = slingY;
            duck.vx = 0;
            duck.vy = 0;
            duck.isLaunched = false;
            duck.onGround = false;

            entities = [
                { x: 480, y: groundY - 80, w: 20, h: 80, type: 'structure', hp: 2 },
                { x: 560, y: groundY - 80, w: 20, h: 80, type: 'structure', hp: 2 },
                { x: 470, y: groundY - 100, w: 120, h: 20, type: 'structure', hp: 2 },
                { x: 510, y: groundY - 180, w: 20, h: 80, type: 'structure', hp: 2 },
                { x: 520, y: groundY - 30, r: 16, type: 'enemy', alive: true },
                { x: 520, y: groundY - 130, r: 14, type: 'enemy', alive: true },
                { x: 620, y: groundY - 25, r: 18, type: 'enemy', alive: true }
            ];
        }

        canvas.addEventListener('mousedown', function(e) {
            if (duck.isLaunched) return;
            const rect = canvas.getBoundingClientRect();
            const mX = e.clientX - rect.left;
            const mY = e.clientY - rect.top;
            let dx = mX - duck.x;
            let dy = mY - duck.y;
            if (Math.sqrt(dx * dx + dy * dy) < 30) {
                isDragging = true;
            }
        });

        canvas.addEventListener('mousemove', function(e) {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            if (isDragging) {
                let dx = mouseX - slingX;
                let dy = mouseY - slingY;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > maxPull) {
                    let angle = Math.atan2(dy, dx);
                    duck.x = slingX + Math.cos(angle) * maxPull;
                    duck.y = slingY + Math.sin(angle) * maxPull;
                } else {
                    duck.x = mouseX;
                    duck.y = mouseY;
                }
            }
        });

        window.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                duck.isLaunched = true;
                duck.vx = (slingX - duck.x) * 0.16;
                duck.vy = (slingY - duck.y) * 0.16;
                statusDisplay.innerText = "Duck tracking outbound physics vector...";
            }
        });

        window.addEventListener('keydown', function(e) {
            if (e.key === 'r' || e.key === 'R') {
                initGame();
            }
        });

        function checkBallBoxCollision(ball, box) {
            let closestX = Math.max(box.x, Math.min(ball.x, box.x + box.w));
            let closestY = Math.max(box.y, Math.min(ball.y, box.y + box.h));
            let dx = ball.x - closestX;
            let dy = ball.y - closestY;
            let distance = Math.sqrt(dx * dx + dy * dy);
            return distance < ball.radius;
        }

        function update() {
            if (duck.isLaunched && !duck.onGround) {
                duck.vy += gravity;
                duck.x += duck.vx;
                duck.y += duck.vy;

                if (duck.x > canvas.width + 100 || duck.x < -100) {
                    duck.onGround = true;
                    statusDisplay.innerText = "Duck went out of bounds! Press 'R' to load next shot.";
                }

                if (duck.y + duck.radius >= groundY) {
                    duck.y = groundY - duck.radius;
                    duck.vx *= 0.5;
                    duck.vy = 0;
                    if (Math.abs(duck.vx) < 0.2) {
                        duck.onGround = true;
                        statusDisplay.innerText = "Shot concluded. Press 'R' to load the next duck.";
                    }
                }

                entities.forEach(function(ent) {
                    if (ent.type === 'structure' && ent.hp > 0) {
                        if (checkBallBoxCollision(duck, ent)) {
                            ent.hp -= 1;
                            duck.vx *= -0.4;
                            duck.vy *= 0.5;
                        }
                    } else if (ent.type === 'enemy' && ent.alive) {
                        let dx = duck.x - ent.x;
                        let dy = duck.y - ent.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < (duck.radius + ent.r)) {
                            ent.alive = false;
                            score++;
                            scoreDisplay.innerText = score;
                            if (score >= 3) {
                                statusDisplay.innerText = "VICTORY! All targets cleared. Press 'R' to play again!";
                            }
                        }
                    }
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4a3319';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, groundY, canvas.width, 10);

            ctx.strokeStyle = '#6e4720';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(slingX, slingY);
            ctx.lineTo(slingX, groundY);
            ctx.stroke();

            if (isDragging) {
                ctx.strokeStyle = '#e67e22';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(slingX - 10, slingY);
                ctx.lineTo(duck.x, duck.y);
                ctx.moveTo(slingX + 10, slingY);
                ctx.lineTo(duck.x, duck.y);
                ctx.stroke();
            }

            entities.forEach(function(ent) {
                if (ent.type === 'structure' && ent.hp > 0) {
                    ctx.fillStyle = ent.hp === 2 ? '#c0392b' : '#e74c3c';
                    ctx.fillRect(ent.x, ent.y, ent.w, ent.h);
                    ctx.strokeStyle = '#1a1a1a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(ent.x, ent.y, ent.w, ent.h);
                } else if (ent.type === 'enemy' && ent.alive) {
                    ctx.fillStyle = '#2ecc71';
                    ctx.beginPath();
                    ctx.arc(ent.x, ent.y, ent.r, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ent.x - 5, ent.y - 3, 4, 0, Math.PI * 2);
                    ctx.arc(ent.x + 5, ent.y - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(ent.x - 5, ent.y - 3, 1.5, 0, Math.PI * 2);
                    ctx.arc(ent.x + 5, ent.y - 3, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(duck.x, duck.y, duck.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e67e22';
            ctx.beginPath();
            ctx.moveTo(duck.x + 10, duck.y - 4);
            ctx.lineTo(duck.x + 22, duck.y);
            ctx.lineTo(duck.x + 10, duck.y + 4);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
