<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Parkour</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1015; font-family: sans-serif; }
  canvas { display: block; }
  #hud { position: absolute; top: 15px; left: 15px; color: #fff; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; }
  #win { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
         color: #00ffcc; font-size: 40px; font-weight: bold; background: rgba(0,0,0,0.9);
         padding: 30px 60px; border: 2px solid #00ffcc; border-radius: 10px; text-align: center; }
</style>
</head>
<body>
<div id="hud">STAGE 1: Neon Trial<br>A/D or Arrows: Move | W/Space/Up: Jump (double jump) | R: Reset</div>
<div id="win">STAGE CLEARED!<br><span style="font-size:20px;color:#fff">Press R to play again</span></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const winScreen = document.getElementById('win');
let W, H;

const GRAVITY = 0.5, FRICTION = 0.85, RUN = 0.7, MAX_SPEED = 6, JUMP = -11;
const keys = {};
const player = { x: 100, y: 0, vx: 0, vy: 0, w: 20, h: 48, grounded: false, canDouble: true };
let platforms = [], goal = {}, won = false;

function layout() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  platforms = [
    { x: 0, y: H - 80, w: 400, h: 80, color: '#2d313f' },
    { x: 460, y: H - 160, w: 120, h: 20, color: '#00f3ff' },
    { x: 650, y: H - 250, w: 120, h: 20, color: '#00f3ff' },
    { x: 840, y: H - 200, w: 140, h: 20, color: '#ff0055' },
    { x: 1050, y: H - 300, w: 120, h: 20, color: '#00f3ff' },
    { x: 1250, y: H - 400, w: Math.max(200, W - 1250 + 100), h: 400, color: '#2d313f' }
  ];
  goal = { x: W - 150, y: H - 500, w: 30, h: 100 };
}

function reset() {
  layout();
  Object.assign(player, { x: 100, y: H - 200, vx: 0, vy: 0, grounded: false, canDouble: true });
  won = false;
  winScreen.style.display = 'none';
}

function jump() {
  if (won) return;
  if (player.grounded) {
    player.vy = JUMP;
    player.grounded = false;
  } else if (player.canDouble) {
    player.vy = JUMP * 0.85;
    player.canDouble = false;
  }
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || k === 'w') { e.preventDefault(); jump(); }
  if (k === 'r') reset();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('resize', reset);

function update() {
  if (!won) {
    if (keys['a'] || keys['arrowleft']) player.vx -= RUN;
    if (keys['d'] || keys['arrowright']) player.vx += RUN;
    player.vx *= FRICTION;
    player.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, player.vx));
    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;
    for (const p of platforms) {
      const overlapX = player.x + player.w > p.x && player.x < p.x + p.w;
      const prevBottom = player.y + player.h - player.vy;
      if (overlapX && player.vy >= 0 && prevBottom <= p.y && player.y + player.h >= p.y) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.canDouble = true;
      }
    }

    if (player.x < 0) player.x = 0;
    if (player.y > H + 200) reset();

    if (player.x + player.w > goal.x && player.y + player.h > goal.y) {
      won = true;
      winScreen.style.display = 'block';
    }
  }
}

function draw() {
  ctx.fillStyle = '#0f1015';
  ctx.fillRect(0, 0, W, H);

  for (const p of platforms) {
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = p.color === '#2d313f' ? 0 : 15;
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#00ffcc';
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 20;
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
  ctx.shadowBlur = 0;

  const x = player.x + player.w / 2, top = player.y, hip = player.y + 30, bottom = player.y + player.h;
  const legSwing = Math.abs(player.vx) > 0.5 && player.grounded ? Math.sin(Date.now() / 60) * 8 : 0;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, top + 8, 8, 0, Math.PI * 2);
  ctx.moveTo(x, top + 16); ctx.lineTo(x, hip);
  ctx.moveTo(x, top + 22); ctx.lineTo(x - 10, top + 30);
  ctx.moveTo(x, top + 22); ctx.lineTo(x + 10, top + 30);
  ctx.moveTo(x, hip); ctx.lineTo(x - 8 + legSwing, bottom);
  ctx.moveTo(x, hip); ctx.lineTo(x + 8 - legSwing, bottom);
  ctx.stroke();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
