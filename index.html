<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreezeNova – Moto & Stunt Bike Games</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --bg-panel: #131c31;
      --bg-card: #19243d;
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.35);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #263554;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-main);
    }

    .logo span { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

    .search-box { flex: 1; max-width: 440px; }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .categories {
      background: var(--bg-panel);
      padding: 12px 24px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .cat-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--accent);
      color: #05101f;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }

    .section-title {
      font-size: 1.25rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 20px;
      background: var(--accent);
      border-radius: 2px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.18);
    }

    .thumb {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      position: relative;
    }

    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(11, 17, 32, 0.85);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--accent);
    }

    .card-info { padding: 12px; }
    .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .card-meta { font-size: 0.78rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    #player-view { display: none; }

    .player-wrapper {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .canvas-stage {
      width: 100%;
      height: 500px;
      background: #060a14;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      background: #090f1e;
      border: 2px solid var(--border);
      border-radius: 8px;
      max-width: 100%;
      max-height: 100%;
    }

    .player-bar {
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--border);
    }

    .player-controls { display: flex; gap: 10px; }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); color: #05101f; border-color: var(--accent); }
    .btn-primary:hover { color: #05101f; opacity: 0.9; }

    .game-details {
      padding: 20px;
      background: var(--bg-card);
      border-radius: 12px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" onclick="showHome()">🏍️ FREEZE<span>NOVA</span> MOTO</a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search moto & dirt bike games..." oninput="renderGrid()" />
    </div>
    <button class="btn btn-primary" onclick="playRandom()">🎲 Random Moto Game</button>
  </header>

  <nav class="categories">
    <button class="cat-btn active" onclick="setCategory('All', this)">All Moto Games</button>
    <button class="cat-btn" onclick="setCategory('Stunt Trials', this)">Stunt & Trials</button>
    <button class="cat-btn" onclick="setCategory('Traffic Rider', this)">Traffic & Highway</button>
    <button class="cat-btn" onclick="setCategory('Supercross', this)">Dirt Bike & Supercross</button>
  </nav>

  <main>
    <section id="player-view">
      <div class="player-wrapper">
        <div class="canvas-stage" id="canvasStage">
          <canvas id="gameCanvas" width="760" height="440"></canvas>
        </div>
        <div class="player-bar">
          <div>
            <h2 id="activeTitle">Moto Game</h2>
            <small id="activeControls" style="color: var(--text-muted);">Controls</small>
          </div>
          <div class="player-controls">
            <button class="btn" onclick="likeGame()">👍 <span id="likeCount">218</span></button>
            <button class="btn" onclick="restartCurrent()">🔄 Restart</button>
            <button class="btn btn-primary" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button class="btn" onclick="showHome()">✖ Back to Moto Hub</button>
          </div>
        </div>
      </div>

      <div class="game-details">
        <h3>Game Overview</h3>
        <p id="activeDesc" style="color: var(--text-muted); margin-top: 6px;"></p>
      </div>
    </section>

    <section id="catalog-view">
      <h2 class="section-title" id="gridHeading">All Moto & Dirt Bike Games</h2>
      <div class="game-grid" id="gameGrid"></div>
    </section>
  </main>

  <footer>
    FreezeNova Moto Edition • HTML5 Stunt & Racing Portal
  </footer>
