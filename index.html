<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliding Puzzle - Quick Play Arcade</title>
  <style>
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { background:#0d0e12; color:#fff; font-family:Arial, sans-serif; margin:0; line-height:1.5; }
    .layout { display:flex; min-height:100vh; }
    .sidebar { width:250px; flex-shrink:0; border-right:1px solid #1f2027; padding:14px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .sidebar a { display:flex; align-items:center; gap:16px; padding:13px 22px; color:#e5e5ea; text-decoration:none; font-size:17px; }
    .sidebar a:hover { background:#1c1d24; }
    .sidebar a.home { color:#a1a1aa; }
    .dot { width:14px; height:14px; border-radius:50%; background:#fff; flex-shrink:0; }
    .divider { height:1px; background:#1f2027; margin:10px 0; }
    .content { flex:1; min-width:0; display:flex; flex-direction:column; }
    header { padding:40px 30px 24px; border-bottom:1px solid #1f2027; }
    header h1 { font-size:36px; margin:0 0 8px; }
    header p { color:#a1a1aa; font-size:16px; max-width:640px; margin:0; }
    main { padding:30px; max-width:900px; flex-grow:1; display:flex; flex-direction:column; align-items:flex-start; }
    .game-container { background:#1c1d24; padding:24px; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
    .board { display:grid; grid-template-columns:repeat(4, 80px); grid-template-rows:repeat(4, 80px); gap:8px; background:#0d0e12; padding:12px; border-radius:12px; }
    .tile { background:#2a2b35; color:#fff; font-size:24px; font-weight:bold; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; user-select:none; transition:background 0.15s ease, transform 0.15s ease; }
    .tile:hover { background:#3a3b45; }
    .tile.empty { background:transparent; cursor:default; }
    .controls { display:flex; gap:16px; align-items:center; width:100%; justify-content:space-between; }
    .btn { background:#f9e2af; color:#0d0e12; border:none; padding:10px 20px; font-size:15px; font-weight:bold; border-radius:8px; cursor:pointer; transition:opacity 0.15s ease; }
    .btn:hover { opacity:0.9; }
    .stats-panel { font-size:15px; color:#a1a1aa; }
    footer { text-align:center; padding:22px; color:#6e6e78; font-size:14px; border-top:1px solid #1f2027; margin-top:auto; }
    @media (max-width:760px) {
      .layout { flex-direction:column; }
      .sidebar { width:100%; height:auto; position:static; border-right:none; border-bottom:1px solid #1f2027; }
      .sidebar nav { display:flex; flex-wrap:wrap; }
      .sidebar a { padding:10px 14px; font-size:15px; }
      .divider { display:none; }
      header h1 { font-size:28px; }
      main { padding:20px; align-items:center; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <a class="home" href="index.html"><span class="dot"></span>Home</a>
        <div class="divider"></div>
        <a href="index.html#arcade"><span class="dot"></span>Arcade</a>
        <a href="index.html#driving"><span class="dot"></span>Driving</a>
        <a href="index.html#classic"><span class="dot"></span>Classic</a>
        <a href="index.html#physics"><span class="dot"></span>Physics</a>
        <a href="index.html#puzzle"><span class="dot"></span>Puzzle and Strategy</a>
      </nav>
    </aside>

    <div class="content">
      <header>
        <h1>Sliding Puzzle</h1>
        <p>Order the numbered tiles from 1 to 15 by sliding them into the empty space. Think ahead to solve it in the fewest moves.</p>
      </header>

      <main>
        <div class="game-container">
          <div class="controls">
            <button class="btn" id="shuffleBtn">Shuffle Game</button>
            <div class="stats-panel">Moves: <span id="moveCount">0</span></div>
          </div>
          <div class="board" id="puzzleBoard"></div>
        </div>
      </main>

      <footer>
        <p>&copy; 2026 Quick Play Arcade. Hosted on GitHub Pages.</p>
      </footer>
    </div>
  </div>

  <script>
    const board = document.getElementById('puzzleBoard');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const moveCountElem = document.getElementById('moveCount');

    let tiles = [];
    let emptyIndex = 15;
    let moves = 0;

    function initGame() {
      tiles = Array.from({length: 15}, (_, i) => i + 1);
      tiles.push(""); // Empty slot
      moves = 0;
      moveCountElem.textContent = moves;
      shuffleTiles();
      renderBoard();
    }

    function shuffleTiles() {
      // Simple valid shuffle by making random moves
      for (let i = 0; i < 100; i++) {
        const validMoves = getValidMoves(emptyIndex);
        const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
        swap(emptyIndex, randomMove);
        emptyIndex = randomMove;
      }
      moves = 0;
      moveCountElem.textContent = moves;
    }

    function getValidMoves(idx) {
      const row = Math.floor(idx / 4);
      const col = idx % 4;
      const valid = [];
      if (row > 0) valid.push(idx - 4);
      if (row < 3) valid.push(idx + 4);
      if (col > 0) valid.push(idx - 1);
      if (col < 3) valid.push(idx + 1);
      return valid;
    }

    function swap(i, j) {
      const temp = tiles[i];
      tiles[i] = tiles[j];
      tiles[j] = temp;
    }

    function renderBoard() {
      board.innerHTML = "";
      tiles.forEach((tile, index) => {
        const tileDiv = document.createElement('div');
        tileDiv.classList.add('tile');
        if (tile === "") {
          tileDiv.classList.add('empty');
        } else {
          tileDiv.textContent = tile;
          tileDiv.addEventListener('click', () => handleTileClick(index));
        }
        board.appendChild(tileDiv);
      });
    }

    function handleTileClick(index) {
      const validMoves = getValidMoves(emptyIndex);
      if (validMoves.includes(index)) {
        swap(index, emptyIndex);
        emptyIndex = index;
        moves++;
        moveCountElem.textContent = moves;
        renderBoard();
        checkWin();
      }
    }

    function checkWin() {
      const winningOrder = Array.from({length: 15}, (_, i) => i + 1);
      winningOrder.push("");
      const hasWon = tiles.every((val, i) => val === winningOrder[i]);
      if (hasWon && moves > 0) {
        setTimeout(() => {
          alert('Congratulations! You solved the puzzle in ' + moves + ' moves.');
        }, 100);
      }
    }

    shuffleBtn.addEventListener('click', initGame);

    initGame();
  </script>
</body>
</html>
