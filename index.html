<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Moto</title>
<style>
  body {
    margin: 0;
    background: #05010d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: "Courier New", monospace;
    color: #0ff;
    overflow: hidden;
  }
  canvas {
    border: 2px solid #0ff;
    box-shadow: 0 0 20px #0ff, inset 0 0 20px #f0f;
    background: #0a0020;
  }
  #info {
    margin-bottom: 10px;
    text-shadow: 0 0 8px #0ff;
  }
</style>
</head>
<body>
<div id="info">SCORE: 0 | PRESS SPACE OR TAP TO JUMP</div>
<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

const GROUND = 330;
const GRAVITY = 0.8;
const JUMP_POWER = -15;

let bike = { x: 100, y: GROUND - 30, w: 50, h: 30, vy: 0, onGround: true };
let obstacles = [];
let speed = 6;
let score = 0;
let frame = 0;
let gameOver = false;
let gridOffset = 0;

function jump() {
  if (gameOver) {
    resetGame();
    return;
  }
  if (bike.onGround) {
    bike.vy = JUMP_POWER;
    bike.onGround = false;
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  jump();
});
canvas.addEventListener("mousedown", jump);

function resetGame() {
  bike.y = GROUND - bike.h;
  bike.vy = 0;
  bike.onGround = true;
  obstacles = [];
  speed = 6;
  score = 0;
  frame = 0;
  gameOver = false;
}

function spawnObstacle() {
  const type = Math.random() < 0.5 ? "block" : "spike";
  const h = type === "block" ? 40 + Math.random() * 30 : 30;
  obstacles.push({ x: canvas.width, y: GROUND - h, w: 30 + Math.random() * 20, h: h, type: type });
}

function drawGrid() {
  ctx.strokeStyle = "rgba(255, 0, 255, 0.35)";
  ctx.lineWidth = 1;
  for (let x = -gridOffset % 40; x < canvas.width; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND);
    ctx.lineTo(canvas.width / 2 + (x - canvas.width / 2) * 3, canvas.height);
    ctx.stroke();
  }
  for (let y = GROUND + 20; y < canvas.height; y += 20) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawBike() {
  ctx.save();
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#0ff";
  ctx.beginPath();
  ctx.arc(bike.x + 10, bike.y + bike.h, 12, 0, Math.PI * 2);
  ctx.arc(bike.x + bike.w - 10, bike.y + bike.h, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f0f";
  ctx.fillRect(bike.x, bike.y, bike.w, bike.h - 8);
  ctx.fillStyle = "#fff";
  ctx.fillRect(bike.x + bike.w - 8, bike.y + 4, 8, 6);
  ctx.restore();
}

function drawObstacle(o) {
  ctx.save();
  ctx.shadowColor = "#f0f";
  ctx.shadowBlur = 12;
  ctx.fillStyle = o.type === "block" ? "#f0f" : "#ff0";
  if (o.type === "block") {
    ctx.fillRect(o.x, o.y, o.w, o.h);
  } else {
    ctx.beginPath();
    ctx.moveTo(o.x, GROUND);
    ctx.lineTo(o.x + o.w / 2, o.y);
    ctx.lineTo(o.x + o.w, GROUND);
    ctx.fill();
  }
  ctx.restore();
}

function collides(a, o) {
  return a.x < o.x + o.w && a.x + a.w > o.x && a.y < o.y + o.h && a.y + a.h > o.y;
}

function update() {
  if (gameOver) return;
  frame++;
  gridOffset += speed;

  bike.vy += GRAVITY;
  bike.y += bike.vy;
  if (bike.y >= GROUND - bike.h) {
    bike.y = GROUND - bike.h;
    bike.vy = 0;
    bike.onGround = true;
  }

  if (frame % Math.max(60 - Math.floor(score / 5), 35) === 0) spawnObstacle();

  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x + o.w > 0);

  for (const o of obstacles) {
    if (collides(bike, o)) {
      gameOver = true;
      break;
    }
  }

  if (frame % 6 === 0) score++;
  speed = 6 + Math.floor(score / 100);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, "#05010d");
  sky.addColorStop(1, "#2a0050");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, GROUND);

  ctx.fillStyle = "#0a0020";
  ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);

  ctx.strokeStyle = "#0ff";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(canvas.width, GROUND);
  ctx.stroke();
  ctx.shadowBlur = 0;

  drawGrid();
  obstacles.forEach(drawObstacle);
  drawBike();

  info.textContent = `SCORE: ${score} | ${gameOver ? "GAME OVER - PRESS SPACE TO RESTART" : "PRESS SPACE OR TAP TO JUMP"}`;

  if (gameOver) {
    ctx.save();
    ctx.fillStyle = "#f0f";
    ctx.shadowColor = "#f0f";
    ctx.shadowBlur = 20;
    ctx.font = "bold 40px Courier New";
    ctx.textAlign = "center";
    ctx.fillText("SYSTEM FAILURE", canvas.width / 2, canvas.height / 2);
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
