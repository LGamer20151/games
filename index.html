<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Workspace Module</title>
    <style>
        body { 
            background-color: #0b0f17; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid #24292f;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
        }
        #hud-score { color: #f1c40f; }
        canvas {
            background-color: #2c3e50;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>3D Madalin Stunt Driving Matrix</h1>
    </header>

    <div class="ui-panel">
        Coins Collected: <span id="hud-score">0</span> / 5 | WASD / Arrows = Drive | SHIFT = Nitro | Space = Handbrake | R = Reset
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('hud-score');

        // Car Physics Variables
        let car = {
            x: 120, y: 240,
            vx: 0, vy: 0,
            angle: 0,
            speed: 0,
            maxSpeed: 7,
            accel: 0.12,
            friction: 0.96,
            turnSpeed: 0.045
        };

        let coins = [
            { x: 350, y: 120, collected: false },
            { x: 550, y: 150, collected: false },
            { x: 200, y: 320, collected: false },
            { x: 500, y: 300, collected: false },
            { x: 450, y: 220, collected: false }
        ];

        let ramps = [
            { x: 300, y: 180, w: 80, h: 40, angle: -0.2 }
        ];

        let score = 0;
        let keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            // Nitro Boost
            let currentAccel = car.accel;
            let currentMaxSpeed = car.maxSpeed;
            if (keys['ShiftLeft'] || keys['ShiftRight']) {
                currentAccel = car.accel * 1.8;
                currentMaxSpeed = car.maxSpeed * 1.5;
            }

            // Drive Controls
            if (keys['KeyW'] || keys['ArrowUp']) {
                if (car.speed < currentMaxSpeed) car.speed += currentAccel;
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                if (car.speed > -currentMaxSpeed / 2) car.speed -= currentAccel;
            } else {
                car.speed *= car.friction;
            }

            // Handbrake Stop
            if (keys['Space']) {
                car.speed *= 0.85;
            }

            // Steering Logic
            if (Math.abs(car.speed) > 0.2) {
                let reverseTurn = car.speed < 0 ? -1 : 1;
                if (keys['KeyA'] || keys['ArrowLeft']) car.angle -= car.turnSpeed * reverseTurn;
                if (keys['KeyD'] || keys['ArrowRight']) car.angle += car.turnSpeed * reverseTurn;
            }

            // Map Vectors Movement
            car.vx = Math.cos(car.angle) * car.speed;
            car.vy = Math.sin(car.angle) * car.speed;
            car.x += car.vx;
            car.y += car.vy;

            // Screen Border Hard Limits
            if (car.x < 20) { car.x = 20; car.speed *= -0.4; }
            if (car.x > 680) { car.x = 680; car.speed *= -0.4; }
            if (car.y < 20) { car.y = 20; car.speed *= -0.4; }
            if (car.y > 380) { car.y = 380; car.speed *= -0.4; }

            // Manual Car Reset Trigger
            if (keys['KeyR']) {
                car.x = 120; car.y = 240; car.speed = 0; car.angle = 0;
            }

            // Collectible Blue Coin Intersections
            coins.forEach(coin => {
                if (!coin.collected) {
                    let dx = car.x - coin.x;
                    let dy = car.y - coin.y;
                    if (Math.sqrt(dx*dx + dy*dy) < 22) {
                        coin.collected = true;
                        score++;
                        scoreDisplay.innerText = score;
                    }
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Arena Boundary Edges
            ctx.strokeStyle = '#30363d'; ctx.lineWidth = 8;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            // 2. Draw Stunt Obstacle Ramps
            ramps.forEach(r => {
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(r.x, r.y, r.w, r.h);
                ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 2;
                ctx.strokeRect(r.x, r.y, r.w, r.h);
            });

            // 3. Draw Blue Target Rewards Coins
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#58a6ff';
                    ctx.beginPath(); ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
                }
            });

            // 4. Render Sports Car Chassis Model
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);

            // Base Body Shell
            ctx.fillStyle = '#ff2a2a';
            ctx.fillRect(-22, -12, 44, 24);

            // Cockpit Windshield Frame
            ctx.fillStyle = '#111';
            ctx.fillRect(-6, -9, 16, 18);
            ctx.fillStyle = '#a5d6a7'; // Windows glass highlight tint
            ctx.fillRect(-2, -7, 10, 14);

            // Headlights Nodes
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(18, -10, 4, 4);
            ctx.fillRect(18, 6, 4, 4);

            // Rear Nitro Exhaust Flame (Only active when boosting)
            if ((keys['ShiftLeft'] || keys['ShiftRight']) && Math.abs(car.speed) > 1) {
                ctx.fillStyle = '#ff9800';
                ctx.beginPath();
                ctx.moveTo(-22, -4); ctx.lineTo(-38, 0); ctx.lineTo(-22, 4);
                ctx.fill();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
