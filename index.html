<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stunt Cars</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
  canvas { display: block; }
  #hud { position: absolute; top: 12px; left: 12px; color: #fff; font-weight: bold;
         text-shadow: 2px 2px 4px #000; pointer-events: none; line-height: 1.5; }
</style>
</head>
<body>
<div id="hud"></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (k === 'r') reset();
  if (k === 'i') car.engineOn = !car.engineOn;
  if (k === 'h') car.lights = !car.lights;
  if (k === 'c') camMode = (camMode + 1) % 2;
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const car = { x: 0, y: 0, z: 0, angle: 0, speed: 0, nitro: 100, engineOn: true, lights: false, coins: 0 };
let camMode = 0;
let coins = [];
let ramps = [];
let startTime = 0;

function reset() {
  car.x = 0; car.y = 0; car.z = 0; car.angle = 0; car.speed = 0; car.nitro = 100; car.coins = 0;
  startTime = performance.now();
  coins = [];
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    coins.push({ x: Math.cos(a) * 400, z: Math.sin(a) * 400, taken: false });
  }
  ramps = [{ x: 0, z: 200, angle: 0 }, { x: 250, z: -150, angle: 1.2 }];
}
reset();

function update(dt) {
  const accel = (keys['w'] || keys['arrowup'] ? 0.25 : 0) - (keys['s'] || keys['arrowdown'] ? 0.2 : 0);
  let boost = 1;
  if (keys['shift'] && car.nitro > 0 && accel > 0) { boost = 1.6; car.nitro = Math.max(0, car.nitro - 0.6); }
  if (car.engineOn) car.speed += accel * boost * dt;
  car.speed *= keys[' '] ? 0.9 : 0.985;
  car.speed = Math.max(-8, Math.min(30 * boost, car.speed));
  const turn = (keys['a'] || keys['arrowleft'] ? 1 : 0) - (keys['d'] || keys['arrowright'] ? 1 : 0);
  car.angle += turn * 0.03 * Math.min(1, Math.abs(car.speed) / 5) * Math.sign(car.speed || 1);
  car.x += Math.sin(car.angle) * car.speed;
  car.z += Math.cos(car.angle) * car.speed;
  car.nitro = Math.min(100, car.nitro + 0.05);

  for (const c of coins) {
    if (!c.taken && Math.hypot(c.x - car.x, c.z - car.z) < 30) { c.taken = true; car.coins++; }
  }
  for (const r of ramps) {
    if (Math.hypot(r.x - car.x, r.z - car.z) < 40 && car.speed > 6) car.y = Math.max(car.y, 20 + car.speed * 2);
  }
  car.y = Math.max(0, car.y - 1.5);
}

function project(x, y, z) {
  const camDist = camMode === 0 ? 220 : 120;
  const cx = car.x - Math.sin(car.angle) * camDist;
  const cz = car.z - Math.cos(car.angle) * camDist;
  const dx = x - cx, dz = z - cz;
  const depth = dz + 0.001;
  const scale = 500 / depth;
  return { sx: W / 2 + dx * scale, sy: H / 2 - (y - (camMode === 0 ? 80 : 40)) * scale, s: scale, d: depth };
}

function drawGround() {
  ctx.fillStyle = '#3a7d44';
  ctx.fillRect(0, H / 2, W, H / 2);
  ctx.fillStyle = '#c9a66b';
  ctx.beginPath();
  ctx.moveTo(W / 2 - 60, H); ctx.lineTo(W / 2 + 60, H); ctx.lineTo(W / 2 + 10, H / 2); ctx.lineTo(W / 2 - 10, H / 2);
  ctx.fill();
}

function drawBox(x, y, z, w, h, d, color) {
  const p = project(x, y, z);
  if (p.d <= 1) return;
  ctx.fillStyle = color;
  ctx.fillRect(p.sx - w * p.s / 2, p.sy - h * p.s, w * p.s, h * p.s);
}

function draw() {
  ctx.fillStyle = '#87ceeb';
  ctx.fillRect(0, 0, W, H);
  drawGround();

  for (const r of ramps) {
    const p = project(r.x, 0, r.z);
    if (p.d > 1) {
      ctx.fillStyle = '#ff6b00';
      ctx.beginPath();
      ctx.moveTo(p.sx - 40 * p.s / 10, p.sy);
      ctx.lineTo(p.sx + 40 * p.s / 10, p.sy);
      ctx.lineTo(p.sx, p.sy - 30 * p.s / 10);
      ctx.fill();
    }
  }

  for (const c of coins) {
    if (c.taken) continue;
    const p = project(c.x, 15, c.z);
    if (p.d > 1) {
      ctx.fillStyle = '#1e90ff';
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, 6 * p.s / 10 + 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const carColor = car.lights ? (Math.floor(Date.now() / 250) % 2 ? '#ff0000' : '#0044ff') : '#e63946';
  ctx.fillStyle = carColor;
  ctx.fillRect(W / 2 - 40, H - 120 - car.y * 0.2, 80, 36);
  ctx.fillStyle = '#222';
  ctx.fillRect(W / 2 - 30, H - 140 - car.y * 0.2, 60, 22);
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(W / 2 - 28, H - 84 - car.y * 0.2, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W / 2 + 28, H - 84 - car.y * 0.2, 10, 0, Math.PI * 2); ctx.fill();

  const secs = ((performance.now() - startTime) / 1000).toFixed(1);
  hud.innerHTML = `Coins: ${car.coins}/${coins.length} | Time: ${secs}s | Speed: ${Math.round(Math.abs(car.speed) * 12)} km/h<br>` +
    `Nitro: ${Math.round(car.nitro)}% | Engine: ${car.engineOn ? 'ON' : 'OFF'} | Lights: ${car.lights ? 'ON' : 'OFF'}<br>` +
    `WASD/Arrows: Drive | Space: Handbrake | Shift: Nitro | C: Camera | R: Reset | I: Engine | H: Lights`;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(2, (now - last) / 16.67);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
