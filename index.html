<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Math Workspace</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid #21262d;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
        #score { color: #58a6ff; }
        #status { color: #8b949e; font-size: 14px; margin-top: 5px; text-align: center;}
        canvas {
            background-color: #000000;
            border: 2px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>Web-Based Probability Engine</h1>
    </header>

    <div class="ui-panel">
        Balance: $<span id="score">100</span>
        <div id="status">Press SPACEBAR to Drop Ball ($10)</div>
    </div>

    <canvas id="plinkoCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const statusDisplay = document.getElementById('status');

        // Game State Engine Variables
        let score = 100;
        let state = 1; // 1 = Waiting, 0 = Ball Falling
        let ballX = 0;
        let ballY = 40;
        let ballVX = 0;
        let ballVY = 0;
        const gravity = 0.25;
        const friction = 0.99;

        // AUTOMATIC PEG GENERATOR (Creates a 7-row triangle grid)
        const pegs = [];
        const startY = 90;     // Top row starting height
        const rowSpacing = 35; // Vertical space between rows
        const pegSpacing = 40; // Horizontal space between pegs

        for (let row = 1; row <= 7; row++) {
            let y = startY + (row - 1) * rowSpacing;
            // Center the row horizontally
            let startX = 240 - ((row - 1) * pegSpacing) / 2;
            
            for (let i = 0; i < row; i++) {
                let x = startX + i * pegSpacing;
                pegs.push({ x: x, y: y });
            }
        }

        // Prize Slot Routing Configurations
        const buckets = [
            { startX: 0, endX: 120, color: '#404040', label: '0.5x', mult: 0.5 },   
            { startX: 120, endX: 200, color: '#FF8000', label: '1x', mult: 1 },    
            { startX: 200, endX: 280, color: '#00FF00', label: '2x', mult: 2 },    // THE 2X MONEY SPOT
            { startX: 280, endX: 360, color: '#FF8000', label: '1x', mult: 1 },    
            { startX: 360, endX: 480, color: '#404040', label: '0.5x', mult: 0.5 }   
        ];

        // Trigger Ball Drops
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && state === 1) {
                if (score >= 10) {
                    score -= 10;
                    scoreDisplay.innerText = score;
                    statusDisplay.innerText = "Processing vector simulation paths...";
                    
                    ballX = 240 + (Math.random() * 10 - 5); // Tight center drop
                    ballY = 40;
                    ballVX = 0;
                    ballVY = 0;
                    state = 0; 
                } else {
                    statusDisplay.innerText = "Insufficient funds. Refresh tab to restart.";
                }
            }
        });

        // Math Physics Processing Loop
        function gameLoop() {
            if (state === 0) {
                ballVY += gravity;
                ballVX *= friction;
                ballX += ballVX;
                ballY += ballVY;

                // Geometric deflection calculations
                pegs.forEach(peg => {
                    let dx = ballX - peg.x;
                    let dy = ballY - peg.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 11) { // Hitbox detection radius
                        ballVY = -2.2; // Bounce velocity
                        ballVX = (Math.random() * 3 - 1.5) + (dx * 0.25); // Scatter physics
                    }
                });

                // Screen border limits
                if (ballX < 10) { ballX = 10; ballVX *= -0.5; }
                if (ballX > 470) { ballX = 470; ballVX *= -0.5; }

                // Landing logic
                if (ballY >= 350) {
                    for (let i = 0; i < buckets.length; i++) {
                        if (ballX >= buckets[i].startX && ballX < buckets[i].endX) {
                            let winnings = 10 * buckets[i].mult;
                            score += winnings;
                            scoreDisplay.innerText = score;
                            statusDisplay.innerText = `Landed in ${buckets[i].label} slot! (+$${winnings}). Press SPACEBAR to play again.`;
                            break;
                        }
                    }
                    state = 1; 
                }
            }

            // Graphic Painter Render Loops
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw prize collection boxes
            buckets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.startX, 350, b.endX - b.startX, 50);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(b.label, b.startX + (b.endX - b.startX) / 2, 380);
            });

            // Draw peg nodes
            ctx.fillStyle = "#ffffff";
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Plinko active matrix ball
            if (state === 0) {
                ctx.fillStyle = "#ff00ff";
                ctx.beginPath();
                ctx.arc(ballX, ballY, 7, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
