<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreezeNova – Complete Moto & Dirt Bike Games Portal</title>
  <style>
    :root {
      --bg-dark: #090e1a;
      --bg-panel: #111827;
      --bg-card: #1a2336;
      --bg-hover: #243049;
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #27344f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.45rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--text-main);
      text-decoration: none;
    }

    .logo span { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 640px;
      justify-content: flex-end;
    }

    .search-box { flex: 1; max-width: 340px; }

    .search-box input {
      width: 100%;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .garage-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .swatch.active { border-color: #fff; transform: scale(1.15); }

    .categories {
      background: var(--bg-panel);
      padding: 11px 24px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .cat-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--accent);
      color: #05101f;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }

    .section-title {
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 20px;
      background: var(--accent);
      border-radius: 2px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
    }

    .thumb {
      height: 138px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.1rem;
      position: relative;
    }

    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(9, 14, 26, 0.85);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--accent);
    }

    .best-tag {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(9, 14, 26, 0.85);
      color: #fde047;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .card-info { padding: 12px; }
    .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .card-meta { font-size: 0.78rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    #player-view { display: none; }

    .player-wrapper {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .canvas-stage {
      width: 100%;
      height: 500px;
      background: #050912;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      background: #090f1e;
      border: 2px solid var(--border);
      border-radius: 8px;
      max-width: 100%;
      max-height: 100%;
    }

    .player-bar {
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--border);
    }

    .player-controls { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); color: #05101f; border-color: var(--accent); }
    .btn-primary:hover { color: #05101f; opacity: 0.9; }

    .game-details {
      padding: 20px;
      background: var(--bg-card);
      border-radius: 12px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" onclick="showHome()">🏍️ FREEZE<span>NOVA</span> MOTO</a>
    <div class="header-actions">
      <div class="garage-picker" title="Select Custom Bike Paint">
        <span>Bike Paint:</span>
        <div class="swatch active" style="background:#00d4ff" onclick="setBikeColor('#00d4ff', this)"></div>
        <div class="swatch" style="background:#f43f5e" onclick="setBikeColor('#f43f5e', this)"></div>
        <div class="swatch" style="background:#22c55e" onclick="setBikeColor('#22c55e', this)"></div>
        <div class="swatch" style="background:#f59e0b" onclick="setBikeColor('#f59e0b', this)"></div>
        <div class="swatch" style="background:#a855f7" onclick="setBikeColor('#a855f7', this)"></div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search 12 moto games..." oninput="renderGrid()" />
      </div>
      <button class="btn btn-primary" onclick="playRandom()">🎲 Random</button>
    </div>
  </header>

  <nav class="categories">
    <button class="cat-btn active" onclick="setCategory('All', this)">All Moto Games (12)</button>
    <button class="cat-btn" onclick="setCategory('Moto X3M & Trials', this)">Moto X3M & Trials</button>
    <button class="cat-btn" onclick="setCategory('Traffic & Highway', this)">Traffic & Highway</button>
    <button class="cat-btn" onclick="setCategory('Supercross & Dirt', this)">Supercross & Dirt</button>
    <button class="cat-btn" onclick="setCategory('Wheelie & Stunt', this)">Wheelie & Balance</button>
  </nav>

  <main>
    <section id="player-view">
      <div class="player-wrapper">
        <div class="canvas-stage" id="canvasStage">
          <canvas id="gameCanvas" width="800" height="450"></canvas>
        </div>
        <div class="player-bar">
          <div>
            <h2 id="activeTitle">Moto Game</h2>
            <small id="activeControls" style="color: var(--text-muted);">Controls</small>
          </div>
          <div class="player-controls">
            <button class="btn" onclick="likeGame()">👍 <span id="likeCount">340</span></button>
            <button class="btn" onclick="restartCurrent()">🔄 Restart</button>
            <button class="btn btn-primary" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button class="btn" onclick="showHome()">✖ Back to Moto Catalog</button>
          </div>
        </div>
      </div>

      <div class="game-details">
        <h3>Game Instructions & Rules</h3>
        <p id="activeDesc" style="color: var(--text-muted); margin-top: 6px;"></p>
      </div>
    </section>

    <section id="catalog-view">
      <h2 class="section-title" id="gridHeading">All Moto & Dirt Bike Games</h2>
      <div class="game-grid" id="gameGrid"></div>
    </section>
  </main>

  <footer>
    FreezeNova Moto Collection • Complete Standalone HTML5 Portal with Saved High Scores
  </footer>

  <script>

        id: 'moto-x3m-1',

        desc: 'Launch off steep ramps, execute full 360-degree backflips and frontflips in mid-air, and land flat on both tires.',
        engine: 'trials',
