<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Terrain Editor</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 1px solid #21262d;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 20px; }
        .ui-panel {
            margin: 10px 0;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }
        #inventory { color: #ff9800; }
        canvas {
            background-color: #1a233a;
            border: 2px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>3D Isometric Sandbox Simulation Workspace</h1>
    </header>

    <div class="ui-panel">
        <div>Placing Block: <span id="inventory">OAK PLANKS</span> (Press 'Q' to swap items)</div>
        <div>W/A/S/D = Walk Selector | CLICK = Mine Block | SHIFT + CLICK = Stack Block</div>
    </div>

    <canvas id="gameCanvas" width="700" height="460"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const invDisplay = document.getElementById('inventory');

        // Grid measurements configurations
        const sizeX = 8;
        const sizeY = 8;
        const sizeZ = 4;
        const tileW = 46;
        const tileH = 24;

        // Base spatial anchoring coordinates
        const originX = 350;
        const originY = 140;

        // Grid Matrix tracking arrays: 0=Air, 1=Grass, 2=Stone, 3=Wood Planks
        let world = [];
        const blockNames = { 1: "GRASS BLOCK", 2: "STONE BLOCK", 3: "OAK PLANKS" };
        let activeSelectionSlot = 1;

        // Active highlighted coordinate locator box vectors
        let cursorX = 3;
        let cursorY = 3;

        function init3DWorld() {
            for (let x = 0; x < sizeX; x++) {
                world[x] = [];
                for (let y = 0; y < sizeY; y++) {
                    world[x][y] = [];
                    for (let z = 0; z < sizeZ; z++) {
                        if (z === 0) {
                            world[x][y][z] = 2; // Bedrock base layers stone
                        } else if (z === 1) {
                            world[x][y][z] = 1; // Surface layers grass
                        } else {
                            world[x][y][z] = 0; // Empty air layout block nodes
                        }
                    }
                }
            }
            // Generate some random structural hills blocks at start
            world[2][2][2] = 1;
            world[2][3][2] = 1;
            world[5][4][2] = 3;
        }

        // Keyboard selectors mapping
        window.addEventListener('keydown', function(e) {
            if (e.code === 'KeyW' && cursorY > 0) cursorY--;
            if (e.code === 'KeyS' && cursorY < sizeY - 1) cursorY++;
            if (e.code === 'KeyA' && cursorX > 0) cursorX--;
            if (e.code === 'KeyD' && cursorX < sizeX - 1) cursorX++;
            
            if (e.code === 'KeyQ') {
                activeSelectionSlot = activeSelectionSlot === 3 ? 1 : activeSelectionSlot + 1;
                invDisplay.innerText = blockNames[activeSelectionSlot];
            }
        });

        // Click mechanics event tracker
        canvas.addEventListener('mousedown', function(e) {
            // Find highest active stack position at the active user map selection node
            let z = sizeZ - 1;
            while (z >= 0 && world[cursorX][cursorY][z] === 0) {
                z--;
            }

            if (e.shiftKey) {
                // Shift + Click: Place / Stack block upwards
                if (z + 1 < sizeZ) {
                    world[cursorX][cursorY][z + 1] = activeSelectionSlot;
                }
            } else {
                // Single Click: Destroy / Mine block down
                if (z >= 0) {
                    world[cursorX][cursorY][z] = 0;
                }
            }
        });

        // Drawing Isometric geometric matrices calculations block drawer
        function drawCube(x, y, z, blockType, isCursor = false) {
            // Map 3D coordinate spaces onto flat 2D layout spacing dimensions
            let isoX = originX + (x - y) * tileW;
            let isoY = originY + (x + y) * tileH - (z * 28);

            // Block face tint hex definitions
            let topColor = "#2ecc71";
            let leftColor = "#8b5a2b";
            let rightColor = "#6e4720";

            if (blockType === 2) { // Stone
                topColor = "#bdc3c7"; leftColor = "#95a5a6"; rightColor = "#7f8c8d";
            } else if (blockType === 3) { // Planks
                topColor = "#f39c12"; leftColor = "#d35400"; rightColor = "#e67e22";
            }

            if (isCursor) {
                topColor = "rgba(255, 235, 59, 0.4)";
                leftColor = "rgba(255, 235, 59, 0.2)";
                rightColor = "rgba(255, 235, 59, 0.2)";
            }

            // A. Draw TOP rhombus face profile
            ctx.fillStyle = topColor;
            ctx.beginPath();
            ctx.moveTo(isoX, isoY);
            ctx.lineTo(isoX + tileW, isoY + tileH);
            ctx.lineTo(isoX, isoY + (tileH * 2));
            ctx.lineTo(isoX - tileW, isoY + tileH);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "rgba(0,0,0,0.12)";
            ctx.stroke();

            if (!isCursor) {
                // B. Draw LEFT structural projection panel side
                ctx.fillStyle = leftColor;
                ctx.beginPath();
                ctx.moveTo(isoX - tileW, isoY + tileH);
                ctx.lineTo(isoX, isoY + (tileH * 2));
                ctx.lineTo(isoX, isoY + (tileH * 2) + 28);
                ctx.lineTo(isoX - tileW, isoY + tileH + 28);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // C. Draw RIGHT structural projection panel side
                ctx.fillStyle = rightColor;
                ctx.beginPath();
                ctx.moveTo(isoX, isoY + (tileH * 2));
                ctx.lineTo(isoX + tileW, isoY + tileH);
                ctx.lineTo(isoX + tileW, isoY + tileH + 28);
                ctx.lineTo(isoX, isoY + (tileH * 2) + 28);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        // Painter loop sorting rendering order from back wall blocks to foreground elements
        function drawWorld() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Layered depth order drawing calculation engine
            for (let z = 0; z < sizeZ; z++) {
                for (let x = 0; x < sizeX; x++) {
                    for (let y = 0; y < sizeY; y++) {
                        let blockType = world[x][y][z];
                        
                        if (blockType > 0) {
                            drawCube(x, y, z, blockType);
                        }

                        // Project and float user crosshair tracker layout target box
                        if (x === cursorX && y === cursorY) {
                            let topZ = z;
                            while(topZ + 1 < sizeZ && world[cursorX][cursorY][topZ + 1] > 0) {
                                topZ++;
                            }
                            if(z === topZ) {
                                drawCube(cursorX, cursorY, topZ, null, true);
                            }
                        }
                    }
                }
            }
        }

        function gameLoop() {
            drawWorld();
            requestAnimationFrame(gameLoop);
        }

        init3DWorld();
        gameLoop();
    </script>
</body>
</html>
