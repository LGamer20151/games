<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Madalin Sandbox</title>
    <style>
        body { 
            background-color: #0b0f17; 
            color: #c9d1d9; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid #24292f;
            width: 100%;
            background: #161b22;
        }
        h1 { margin: 0; color: #58a6ff; font-size: 22px; }
        .ui-panel {
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
        }
        #hud-score { color: #f1c40f; }
        canvas {
            background-color: #000;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <header>
        <h1>3D Madalin Stunt Driving Sandbox</h1>
    </header>

    <div class="ui-panel">
        Coins Collected: <span id="hud-score">0</span> / 6 | W/S = Gas/Reverse | A/D = Steer | Shift = Nitro | R = Reset Car
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('hud-score');

        const fov = 300;
        const cx = 350;
        const cy = 250;

        // 3D Physics Vector Profile
        let car = {
            x: 0,
            y: 0,
            z: 100,
            vx: 0,
            vy: 0,
            vz: 0,
            angle: 0,
            speed: 0,
            maxSpeed: 8,
            accel: 0.15,
            friction: 0.95,
            turnSpeed: 0.045,
            airborne: false
        };

        let coins = [
            {x: -150, z: 400, collected: false},
            {x: 150, z: 400, collected: false},
            {x: 0, z: 600, collected: false},
            {x: -300, z: 800, collected: false},
            {x: 300, z: 800, collected: false},
            {x: 0, z: 1000, collected: false}
        ];

        // 3D Stunt Obstacles (Loops & Launch Ramps)
        let loops = [
            {x: -150, z: 500, size: 40, color: '#bdc3c7'},
            {x: 150, z: 700, size: 50, color: '#95a5a6'}
        ];

        let ramps = [
            {x: 0, z: 450, w: 60, h: 40, depth: 80, color: '#e67e22'}
        ];

        let score = 0;
        let keys = {};

        // Clean Input Buffers to Prevent Sticking Controls
        window.addEventListener('keydown', function(e) {
            keys[e.code] = true;
        });
        window.addEventListener('keyup', function(e) {
            keys[e.code] = false;
        });

        // Hard reset on tab blur to instantly kill stuck inputs
        window.addEventListener('blur', function() {
            keys = {};
            car.speed = 0;
        });

        function update() {
            let currentAccel = car.accel;
            let currentMaxSpeed = car.maxSpeed;
            
            if (keys['ShiftLeft'] || keys['ShiftRight']) {
                currentAccel = car.accel * 1.8;
                currentMaxSpeed = car.maxSpeed * 1.5;
            }

            // Gas and Reverse Mechanics
            if (keys['KeyW'] || keys['ArrowUp']) {
                if (car.speed < currentMaxSpeed) car.speed += currentAccel;
            } else if (keys['KeyS'] || keys['ArrowDown']) {
                if (car.speed > -currentMaxSpeed / 2) car.speed -= currentAccel;
            } else {
                car.speed *= car.friction;
                if (Math.abs(car.speed) < 0.05) car.speed = 0;
            }

            // Clean Turning Calculations
            if (Math.abs(car.speed) > 0.1) {
                let reverseTurn = car.speed < 0 ? -1 : 1;
                if (keys['KeyA'] || keys['ArrowLeft']) car.angle -= car.turnSpeed * reverseTurn;
                if (keys['KeyD'] || keys['ArrowRight']) car.angle += car.turnSpeed * reverseTurn;
            }

            // Ground vs Air Physics
            if (!car.airborne) {
                car.vx = Math.sin(car.angle) * car.speed;
                car.vz = Math.cos(car.angle) * car.speed;
                car.vy = 0;
            } else {
                car.vy += 0.25; // Gravity acceleration
                car.y += car.vy;
                if (car.y >= 0) {
                    car.y = 0;
                    car.vy = 0;
                    car.airborne = false;
                }
            }

            car.x += car.vx;
            car.z += car.vz;

            // Check Ramp Collision
            ramps.forEach(ramp => {
                if (car.x > ramp.x - ramp.w/2 && car.x < ramp.x + ramp.w/2 &&
                    car.z > ramp.z && car.z < ramp.z + ramp.depth && car.y >= -ramp.h) {
                    
                    // Inside ramp boundary: Drive upwards or launch
                    let progress = (car.z - ramp.z) / ramp.depth;
                    car.y = -ramp.h * progress;

                    if (progress >= 0.95 && car.speed > 2) {
                        car.airborne = true;
                        car.vy = -car.speed * 0.7; // Jump force vector
                    }
                }
            });

            // Boundary Walls Box
            if (car.x < -600) { car.x = -600; car.speed *= -0.3; }
            if (car.x > 600) { car.x = 600; car.speed *= -0.3; }
            if (car.z < 50) { car.z = 50; car.speed *= -0.3; }
            if (car.z > 1400) { car.z = 1400; car.speed *= -0.3; }

            // Manual Hard Reset
            if (keys['KeyR']) {
                car.x = 0; car.y = 0; car.z = 100; car.speed = 0; car.angle = 0; car.airborne = false; car.vy = 0;
            }

            // Coin Intersection Loops
            coins.forEach(coin => {
                if (!coin.collected) {
                    let dx = car.x - coin.x;
                    let dz = car.z - coin.z;
                    if (Math.sqrt(dx*dx + dz*dz) < 35 && Math.abs(car.y) < 30) {
                        coin.collected = true;
                        score++;
                        scoreDisplay.innerText = score;
                    }
                }
            });
        }

        function project3D(x, y, z) {
            let relX = x - car.x;
            let relY = y - car.y;
            let relZ = z - car.z;

            let cos = Math.cos(-car.angle);
            let sin = Math.sin(-car.angle);
            
            let rotX = relX * cos - relZ * sin;
            let rotZ = relX * sin + relZ * cos;

            if (rotZ <= 5) return null;

            let scale = fov / rotZ;
            return {
                x: cx + rotX * scale,
                y: cy + (relY - 40) * scale, // Elevated camera position
                size: scale
            };
        }

        function draw() {
            // Draw Sky and Ground Panels
            ctx.fillStyle = '#1a2436'; ctx.fillRect(0, 0, 700, 200);
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, 200, 700, 200);
            ctx.strokeStyle = '#34495e'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, 200); ctx.lineTo(700, 200); ctx.stroke();

            let renderQueue = [];

            // Project Coins
            coins.forEach(coin => {
                if (!coin.collected) {
                    let proj = project3D(coin.x, 0, coin.z);
                    if (proj) renderQueue.push({ z: coin.z - car.z, type: 'coin', p: proj });
                }
            });

            // Project Loops
            loops.forEach(loop => {
                let proj = project3D(loop.x, -loop.size, loop.z);
                if (proj) renderQueue.push({ z: loop.z - car.z, type: 'loop', p: proj, orig: loop });
            });

            // Project Ramps
            ramps.forEach(ramp => {
                let projStart = project3D(ramp.x, 0, ramp.z);
                let projEnd = project3D(ramp.x, -ramp.h, ramp.z + ramp.depth);
                if (projStart && projEnd) {
                    renderQueue.push({ z: ramp.z - car.z, type: 'ramp', p1: projStart, p2: projEnd, orig: ramp });
                }
            });

            // Painters Depth Sorting Loop
            renderQueue.sort((a, b) => b.z - a.z);

            renderQueue.forEach(obj => {
                let p = obj.p;
                if (obj.type === 'coin') {
                    let r = Math.max(2, 6 * p.size * 0.05);
                    ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
                } 
                else if (obj.type === 'loop') {
                    let size = obj.orig.size * p.size * 0.05;
                    ctx.strokeStyle = obj.orig.color; ctx.lineWidth = Math.max(2, p.size * 0.15);
                    ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI * 2); ctx.stroke();
                }
                else if (obj.type === 'ramp') {
                    let w1 = obj.orig.w * obj.p1.size * 0.05;
                    let w2 = obj.orig.w * obj.p2.size * 0.05;
                    ctx.fillStyle = obj.orig.color;
                    ctx.beginPath();
                    ctx.moveTo(obj.p1.x - w1, obj.p1.y);
                    ctx.lineTo(obj.p1.x + w1, obj.p1.y);
                    ctx.lineTo(obj.p2.x + w2, obj.p2.y);
                    ctx.lineTo(obj.p2.x - w2, obj.p2.y);
                    ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.stroke();
                }
            });

            // First Person Hood Overlay
            ctx.fillStyle = '#ff2a2a';
