<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gravity Sandbox</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.ball{position:absolute;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Gravity Sandbox</h2><a href="index.html">← Home</a></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');let ball=null;function spawn(){arena.innerHTML='';ball=document.createElement('div');ball.className='ball';ball.style.left='50%';ball.style.top='10%';arena.appendChild(ball);}document.addEventListener('keydown',e=>{if(!ball)return;let x=parseFloat(ball.style.left);let y=parseFloat(ball.style.top);if(e.key==='ArrowLeft')x=Math.max(4,x-5);if(e.key==='ArrowRight')x=Math.min(92,x+5);if(e.key==='ArrowUp')y=Math.max(6,y-5);if(e.key==='ArrowDown')y=Math.min(86,y+5);ball.style.left=x+'%';ball.style.top=y+'%';});document.getElementById('startBtn').addEventListener('click',spawn);spawn();</script></body></html>
