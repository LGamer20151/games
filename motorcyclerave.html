<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Motorcycle Rave</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.track{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.bike{position:absolute;left:18%;bottom:18px;width:40px;height:20px;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}.cone{position:absolute;width:18px;height:18px;background:linear-gradient(135deg,#fbbf24,#f97316);clip-path:polygon(50% 0,100% 100%,0 100%)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Motorcycle Rave</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Time: <strong id="time">15</strong></span></div><div class="track" id="track"></div><button class="button" id="startBtn">Start</button></div><script>const track=document.getElementById('track');const scoreEl=document.getElementById('score');const timeEl=document.getElementById('time');let score=0,time=15,active=false,bikeX=18,loop=null;function addCone(){const c=document.createElement('div');c.className='cone';c.style.left='100%';c.style.top=(Math.random()*65+15)+'%';track.appendChild(c);const move=setInterval(()=>{if(!active){clearInterval(move);return;}const left=parseFloat(c.style.left)||100;const next=left-2.2;c.style.left=next+'%';const bike=document.querySelector('.bike');const bRect=bike.getBoundingClientRect();const cRect=c.getBoundingClientRect();if(Math.abs(bRect.left-cRect.left)<25&&Math.abs(bRect.top-cRect.top)<18){clearInterval(move);c.remove();score=Math.max(0,score-5);scoreEl.textContent=score;}if(next<-12){clearInterval(move);c.remove();score+=10;scoreEl.textContent=score;}} ,30)}document.addEventListener('keydown',e=>{if(!active)return;if(e.key==='ArrowLeft')bikeX=Math.max(8,bikeX-6);if(e.key==='ArrowRight')bikeX=Math.min(82,bikeX+6);document.querySelector('.bike').style.left=bikeX+'%';});function start(){score=0;time=15;scoreEl.textContent=score;timeEl.textContent=time;active=true;track.innerHTML='';const bike=document.createElement('div');bike.className='bike';bike.style.left='18%';track.appendChild(bike);bikeX=18;clearInterval(loop);loop=setInterval(()=>{if(!active)return;time--;timeEl.textContent=time;if(time<=0){active=false;clearInterval(loop);document.getElementById('startBtn').textContent='Restart';}},1000);setInterval(addCone,700);document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
