<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Space Shooter</title>
<style>body{background:#0d0e12;color:#fff;font-family:Arial,sans-serif;text-align:center;margin:0;padding:20px}a{color:#89b4fa}canvas{background:#05060a;border-radius:8px;max-width:100%}#info{font-size:20px;margin:12px 0;min-height:28px}button{margin-top:12px;padding:10px 22px;font-size:16px;border:none;border-radius:8px;background:#89b4fa;color:#0d0e12;font-weight:bold;cursor:pointer}</style></head><body>
<a href="index.html">&larr; Back to menu</a><h1>Space Shooter</h1><div id="info"></div>
<canvas id="c" width="480" height="420"></canvas><br><button id="btn">Restart</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),info=document.getElementById('info');
const W=480,H=420;
let ship,bullets,rocks,enemies,score,lives,over,frame,keys={l:false,r:false,f:false},lastShot;
function reset(){
  ship={x:W/2,y:H-40,w:36,h:20};
  bullets=[];rocks=[];enemies=[];
  score=0;lives=3;over=false;frame=0;lastShot=-100;
}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();ship.x=(e.clientX-r.left)*W/r.width;});
c.addEventListener('click',()=>{if(over)reset();else keys.f=true;});
document.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){keys.l=true;e.preventDefault();}
  if(e.code==='ArrowRight'){keys.r=true;e.preventDefault();}
  if(e.code==='Space'){e.preventDefault();if(over)reset();else keys.f=true;}
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft')keys.l=false;
  if(e.code==='ArrowRight')keys.r=false;
  if(e.code==='Space')keys.f=false;
});
document.getElementById('btn').onclick=reset;
function speedUp(){return 1+score/400;}
function update(){
  if(over)return;
  frame++;
  if(keys.l)ship.x-=6;
  if(keys.r)ship.x+=6;
  ship.x=Math.max(ship.w/2,Math.min(W-ship.w/2,ship.x));
  if(keys.f&&frame-lastShot>12){bullets.push({x:ship.x,y:ship.y-12,r:3});lastShot=frame;}
  for(const b of bullets)b.y-=9;
  bullets=bullets.filter(b=>b.y>-10);
  if(frame%Math.max(18,Math.floor(55/speedUp()))===0)
    rocks.push({x:Math.random()*(W-30)+15,y:-20,r:12+Math.random()*12,vy:(1.5+Math.random()*1.5)*speedUp()});
  if(frame%Math.max(120,Math.floor(300/speedUp()))===0)
    enemies.push({x:Math.random()*(W-40)+20,y:-20,vx:(Math.random()<0.5?-1:1)*1.5,vy:1*speedUp(),shot:0});
  for(const r of rocks)r.y+=r.vy;
  for(const e of enemies){
    e.x+=e.vx;e.y+=e.vy;
    if(e.x<20||e.x>W-20)e.vx=-e.vx;
    e.shot++;
    if(e.shot>90){e.shot=0;rocks.push({x:e.x,y:e.y+10,r:5,vy:4*speedUp(),bad:true});}
  }
  for(const b of bullets){
    for(const r of rocks){
      if(!r.bad&&Math.hypot(b.x-r.x,b.y-r.y)<r.r+b.r){
        r.dead=true;b.dead=true;score+=5;
      }
    }
    for(const e of enemies){
      if(Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<12){
        e.dead=true;b.dead=true;score+=20;
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  rocks=rocks.filter(r=>!r.dead&&r.y<H+30);
  enemies=enemies.filter(e=>!e.dead&&e.y<H+30);
  for(const r of rocks){
    if(Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+ship.w/2.5){
      r.dead=true;lives--;
    }
  }
  for(const e of enemies){
    if(Math.abs(e.x-ship.x)<22&&Math.abs(e.y-ship.y)<18){e.dead=true;lives--;}
  }
  rocks=rocks.filter(r=>!r.dead);
  enemies=enemies.filter(e=>!e.dead);
  if(lives<=0){lives=0;over=true;}
}

  x.fillStyle='#89b4fa';
  x.beginPath();x.moveTo(ship.x,ship.y-14);x.lineTo(ship.x+18,ship.y+10);x.lineTo
