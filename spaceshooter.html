<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Space Shooter</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.ship{position:absolute;bottom:18px;width:42px;height:18px;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}.enemy{position:absolute;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316)}.bullet{position:absolute;width:5px;height:12px;border-radius:999px;background:#f8fafc}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Space Shooter</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Lives: <strong id="lives">3</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const livesEl=document.getElementById('lives');let score=0,lives=3,x=50,active=false,bullets=[],enemies=[],loop=null;function spawnShip(){const s=document.createElement('div');s.className='ship';s.style.left=x+'%';arena.appendChild(s)}function spawnEnemy(){const e=document.createElement('div');e.className='enemy';e.style.left=(Math.random()*80+10)+'%';e.style.top='-10%';arena.appendChild(e);enemies.push({el:e,y:0})}document.addEventListener('keydown',e=>{if(!active)return;if(e.key==='ArrowLeft')x=Math.max(8,x-6);if(e.key==='ArrowRight')x=Math.min(92,x+6);const ship=document.querySelector('.ship');if(ship)ship.style.left=x+'%';if(e.key===' '){const b=document.createElement('div');b.className='bullet';b.style.left=(x+1.2)+'%';b.style.top='78%';arena.appendChild(b);bullets.push({el:b,y:78})}});function update(){const ship=document.querySelector('.ship');if(!ship)return;ship.style.left=x+'%';for(const b of bullets){b.y-=2.3;b.el.style.top=b.y+'%';for(const e of enemies){const t= e.el.getBoundingClientRect();const bRect=b.el.getBoundingClientRect();if(Math.abs(t.left-bRect.left)<18&&Math.abs(t.top-bRect.top)<20){score+=10;scoreEl.textContent=score; b.el.remove();e.el.remove(); bullets.splice(bullets.indexOf(b),1); enemies.splice(enemies.indexOf(e),1); break;}}}for(const e of enemies){e.y+=1.5;e.el.style.top=e.y+'%';if(e.y>100){e.el.remove();enemies.splice(enemies.indexOf(e),1);lives--;livesEl.textContent=lives;if(lives<=0){active=false;clearInterval(loop);document.getElementById('startBtn').textContent='Restart';}}}}function start(){score=0;lives=3;scoreEl.textContent=score;livesEl.textContent=lives;active=true;arena.innerHTML='';x=50;spawnShip();clearInterval(loop);loop=setInterval(()=>{update();if(Math.random()<0.03)spawnEnemy();},35);document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
