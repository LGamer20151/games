<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 Merge</title>
  <style>
    :root {
      --bg-1: #050b18;
      --bg-2: #0e1b2d;
      --panel: rgba(14, 20, 31, 0.8);
      --panel-strong: rgba(18, 27, 39, 0.96);
      --line: rgba(148, 163, 184, 0.12);
      --text: #edf5ff;
      --muted: #b1bfd9;
      --box: rgba(34, 43, 59, 0.9);
      --accent-1: #87d6ff;
      --accent-2: #c4b5fd;
      --gold: #f8d98d;
      --shadow: rgba(2, 6, 23, 0.58);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 20px 40px;
      background:
        radial-gradient(circle at 15% 15%, rgba(34, 211, 238, 0.14), transparent 18%),
        radial-gradient(circle at 85% 10%, rgba(167, 139, 250, 0.14), transparent 22%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .game {
      width: min(100%, 480px);
      background: rgba(12, 18, 30, 0.78);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 18px 38px var(--shadow);
      padding: 20px 18px 18px;
      backdrop-filter: blur(10px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .score-box {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      padding: 9px 12px;
      text-align: center;
      min-width: 100px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .score-box .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
    }

    .score-box .value {
      margin-top: 4px;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--gold);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: rgba(31, 41, 59, 0.72);
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .tile {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-weight: 800;
      font-size: clamp(1.2rem, 4vw, 2.1rem);
      background: rgba(80, 94, 113, 0.9);
      color: #e6edf8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .empty { opacity: 0.52; }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .menu-btn,
    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      font-size: 1rem;
      color: #0f172a;
      background: linear-gradient(135deg, #8ec5ff, #d7e8ff);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 10px;
      box-shadow: 0 12px 18px rgba(142, 197, 255, 0.2);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .menu-btn:hover,
    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="top">
      <h1>2048 Merge</h1>
      <div class="score-box">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
    </div>
    <div class="board" id="board"></div>
    <div class="controls">
      <button id="newgame">New Game</button>
      <a class="menu-btn" href="index.html">Menu</a>
    </div>
  </div>

  <script>
    const size = 4;
    let board = [];
    let score = 0;

    function emptyBoard() {
      return Array.from({ length: size }, () => Array(size).fill(0));
    }

    function getEmptyCells() {
      const cells = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) cells.push({ r, c });
        }
      }
      return cells;
    }

    function addRandomTile() {
      const empty = getEmptyCells();
      if (!empty.length) return;
      const cell = empty[Math.floor(Math.random() * empty.length)];
      board[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function resetGame() {
      board = emptyBoard();
      score = 0;
      addRandomTile();
      addRandomTile();
      render();
      updateScore();
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    function render() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const tile = document.createElement('div');
          const value = board[r][c];
          tile.className = 'tile' + (value ? '' : ' empty');
          tile.textContent = value || '';
          if (value) {
            const colors = {
              2: '#a5f3fc', 4: '#67e8f9', 8: '#7dd3fc', 16: '#93c5fd', 32: '#c4b5fd',
              64: '#ddd6fe', 128: '#f9a8d4', 256: '#fca5a5', 512: '#fcd34d', 1024: '#fbbf24', 2048: '#fef08a'
            };
            tile.style.background = colors[value] || '#fef3c7';
            tile.style.color = value <= 4 ? '#0f172a' : '#fff';
          }
          boardEl.appendChild(tile);
        }
      }
    }

    function slideLine(line) {
      const filtered = line.filter(v => v !== 0);
      const merged = [];
      for (let i = 0; i < filtered.length; i++) {
        if (filtered[i] === filtered[i + 1]) {
          const mergedValue = filtered[i] * 2;
          merged.push(mergedValue);
          score += mergedValue;
          i++;
        } else {
          merged.push(filtered[i]);
        }
      }
      while (merged.length < size) merged.push(0);
      return merged;
    }

    function move(dir) {
      const oldBoard = JSON.stringify(board);
      const newBoard = emptyBoard();

      if (dir === 'left' || dir === 'right') {
        for (let r = 0; r < size; r++) {
          const row = [...board[r]];
          const line = dir === 'left' ? row : row.slice().reverse();
          const shifted = slideLine(line);
          newBoard[r] = dir === 'left' ? shifted : shifted.slice().reverse();
        }
      } else {
        for (let c = 0; c < size; c++) {
          const column = [];
          for (let r = 0; r < size; r++) column.push(board[r][c]);
          const line = dir === 'up' ? column : column.slice().reverse();
          const shifted = slideLine(line);
          const finalLine = dir === 'up' ? shifted : shifted.slice().reverse();
          for (let r = 0; r < size; r++) newBoard[r][c] = finalLine[r];
        }
      }

      board = newBoard;
      if (JSON.stringify(board) !== oldBoard) {
        addRandomTile();
        render();
        updateScore();
      }
    }

    document.addEventListener('keydown', event => {
      const arrowMap = {
        ArrowLeft: 'left',
        ArrowRight: 'right',
        ArrowUp: 'up',
        ArrowDown: 'down'
      };
      const dir = arrowMap[event.key];
      if (dir) {
        event.preventDefault();
        move(dir);
      }
    });

    document.getElementById('newgame').addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
