<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #111827;
      --panel: #121a2b;
      --panel-2: #182333;
      --line: rgba(148, 163, 184, 0.25);
      --text: #edf6ff;
      --muted: #a7b7cc;
      --accent: #7dd3fc;
      --accent-strong: #3b82f6;
      --assistant: #1f2a3d;
      --user: #0f172a;
      --shadow: rgba(15, 23, 42, 0.6);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(180deg, #081018 0%, #101827 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 22px;
    }

    .app {
      width: min(1100px, 100%);
      height: calc(100vh - 44px);
      background: rgba(9, 15, 25, 0.85);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 20px 50px var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      background: rgba(17, 24, 39, 0.9);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .api-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .api-bar input,
    .api-bar select {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }

    .api-bar input {
      min-width: 260px;
    }

    .api-bar input:focus,
    .api-bar select:focus {
      border-color: rgba(125, 211, 252, 0.9);
      box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.1);
    }

    button {
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #03131d;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 10px;
      background: rgba(8, 13, 20, 0.75);
    }

    .msg {
      display: flex;
      margin-bottom: 14px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .bubble {
      max-width: min(78%, 760px);
      border-radius: 16px;
      padding: 12px 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
    }

    .msg.user .bubble {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(96, 165, 250, 0.28);
      color: var(--text);
    }

    .msg.assistant .bubble {
      background: var(--assistant);
      border: 1px solid var(--line);
      color: var(--text);
    }

    .composer {
      border-top: 1px solid var(--line);
      background: rgba(17, 24, 39, 0.9);
      padding: 12px 14px 16px;
    }

    .composer-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      resize: none;
      flex: 1;
      min-height: 54px;
      max-height: 180px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      line-height: 1.4;
    }

    textarea:focus {
      border-color: rgba(125, 211, 252, 0.9);
      box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.08);
    }

    .send-btn {
      min-width: 118px;
      height: 54px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      padding-left: 4px;
    }

    @media (max-width: 720px) {
      body { padding: 10px; }
      .app { height: calc(100vh - 20px); }
      .api-bar { width: 100%; }
      .api-bar input, .api-bar select { width: 100%; min-width: 0; }
      .composer-row { flex-direction: column; }
      .send-btn { width: 100%; }
      .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">ChatGPT</div>
      <div class="api-bar">
        <input id="apiKeyInput" type="password" placeholder="OpenAI API key" aria-label="OpenAI API key" />
        <select id="modelSelect" aria-label="OpenAI model">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-4o">gpt-4o</option>
          <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        </select>
        <button id="saveKeyBtn" type="button">Save</button>
      </div>
    </div>

    <div class="chat">
      <div id="messages" class="messages" aria-live="polite">
        <div class="msg assistant">
          <div class="bubble">Hello! I’m your chat assistant. Add your OpenAI API key above to enable live GPT responses, or ask a question and I’ll use the built-in fallback answer.</div>
        </div>
      </div>

      <div class="composer">
        <div class="composer-row">
          <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
          <button id="sendBtn" class="send-btn" type="button">Send</button>
        </div>
        <div class="hint">Your API key is saved in this browser only.</div>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const saveKeyBtn = document.getElementById('saveKeyBtn');

    const STORAGE_KEY = 'chatgpt-lite-openai-key';
    const STORAGE_MODEL = 'chatgpt-lite-model';

    function loadConfig() {
      apiKeyInput.value = localStorage.getItem(STORAGE_KEY) || '';
      const model = localStorage.getItem(STORAGE_MODEL) || 'gpt-4o-mini';
      modelSelect.value = model;
    }

    function saveConfig() {
      const key = apiKeyInput.value.trim();
      const model = modelSelect.value || 'gpt-4o-mini';
      if (key) {
        localStorage.setItem(STORAGE_KEY, key);
        localStorage.setItem(STORAGE_MODEL, model);
        addMessage('assistant', 'API key saved. Live OpenAI responses are enabled for this browser.');
      } else {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.setItem(STORAGE_MODEL, model);
        addMessage('assistant', 'No API key saved. The app will use fallback mode unless you add one.');
      }
      scrollToBottom();
    }

    function addMessage(role, text) {
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      scrollToBottom();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    }

    function getFallbackReply(prompt) {
      if (!prompt.trim()) return 'Please type a question first.';
      return `I’m running in fallback mode because no OpenAI key is configured. Your message was: "${prompt}". Add your API key in the box above to get live GPT answers.`;
    }

    async function askOpenAI(prompt) {
      const apiKey = localStorage.getItem(STORAGE_KEY);
      const model = localStorage.getItem(STORAGE_MODEL) || 'gpt-4o-mini';
      if (!apiKey) return getFallbackReply(prompt);

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model,
            temperature: 0.7,
            messages: [
              { role: 'user', content: prompt }
            ]
          })
        });

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const data = await response.json();
        const text = data?.choices?.[0]?.message?.content?.trim();
        if (!text) {
          throw new Error('Empty response from OpenAI');
        }

        return text;
      } catch (error) {
        return `The live API request failed, so I switched to fallback mode. ${getFallbackReply(prompt)}`;
      }
    }

    async function handleSend() {
      const prompt = inputEl.value.trim();
      if (!prompt) return;

      addMessage('user', prompt);
      inputEl.value = '';
      autoResize();

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      const reply = await askOpenAI(prompt);
      addMessage('assistant', reply);

      sendBtn.disabled = false;
      sendBtn.textContent = 'Send';
      inputEl.focus();
    }

    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        handleSend();
      }
    });

    inputEl.addEventListener('input', autoResize);
    sendBtn.addEventListener('click', handleSend);
    saveKeyBtn.addEventListener('click', saveConfig);

    loadConfig();
    autoResize();
  </script>
</body>
</html>
