<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Escape</title>
  <style>
    :root {
      --bg: #040b15;
      --panel: rgba(10, 18, 30, 0.9);
      --line: rgba(126, 233, 255, 0.35);
      --cyan: #7ee9ff;
      --blue: #7aa7ff;
      --green: #9ef7c8;
      --red: #ff6b8a;
      --amber: #ffd166;
      --text: #ebf7ff;
      --muted: rgba(235, 247, 255, 0.72);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(122, 167, 255, 0.18), transparent 34%),
        linear-gradient(180deg, #040b15 0%, #07131f 100%);
      padding: 22px 0;
    }

    .game-shell {
      width: min(920px, calc(100vw - 28px));
      background: rgba(12, 19, 30, 0.9);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 0 28px rgba(122, 167, 255, 0.18);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(14, 24, 35, 0.8);
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--cyan);
      font-size: 12px;
    }

    .stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: radial-gradient(circle at center, rgba(17, 34, 53, 0.8), rgba(4, 11, 21, 1));
    }

    .chat-panel {
      border-top: 1px solid var(--line);
      background: rgba(9, 14, 24, 0.85);
      padding: 14px 16px 12px;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--cyan);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(158, 247, 200, 0.8);
      display: inline-block;
    }

    .chat-log {
      height: 170px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(6, 12, 20, 0.7);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 82%;
      padding: 9px 11px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
      word-wrap: break-word;
    }

    .msg.ai {
      background: rgba(122, 167, 255, 0.12);
      border: 1px solid rgba(122, 167, 255, 0.25);
      color: var(--text);
      align-self: flex-start;
    }

    .msg.user {
      background: rgba(126, 233, 255, 0.12);
      border: 1px solid rgba(126, 233, 255, 0.24);
      color: var(--text);
      align-self: flex-end;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(4, 11, 21, 0.9);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 13px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: rgba(126, 233, 255, 0.7);
      box-shadow: 0 0 0 2px rgba(126, 233, 255, 0.12);
    }

    button {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #03131d;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .help {
      padding: 12px 18px 16px;
      font-size: 12px;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      background: rgba(11, 17, 27, 0.8);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <div class="brand">AI Escape</div>
      <div class="stats">
        <span id="scoreLabel">Cores: 0/5</span>
        <span id="modeLabel">Mode: SCAN</span>
      </div>
    </div>
    <canvas id="game" width="760" height="520"></canvas>

    <div class="chat-panel">
      <div class="chat-header">
        <span>AI Console</span>
        <span><span class="status-dot"></span> Online</span>
      </div>
      <div id="chatLog" class="chat-log" aria-live="polite">
        <div class="msg ai">I am the system AI. Ask me how to win, how the enemy is behaving, or anything about the escape route.</div>
      </div>
      <div class="input-row">
        <input id="aiInput" type="text" maxlength="220" placeholder="Ask the AI a question..." aria-label="Ask the AI a question" />
        <button id="askBtn" type="button">Ask</button>
      </div>
    </div>

    <div class="help">Move with WASD or arrow keys • collect all cores • press R to restart</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreLabel = document.getElementById('scoreLabel');
    const modeLabel = document.getElementById('modeLabel');
    const aiInput = document.getElementById('aiInput');
    const askBtn = document.getElementById('askBtn');
    const chatLog = document.getElementById('chatLog');

    const TILE = 40;
    const COLS = 15;
    const ROWS = 10;
    const keys = {};

    const map = [
      '###############',
      '#.............#',
      '#.###.#.###.#.#',
      '#...#.#...#.#.#',
      '#.#.#.###.#...#',
      '#.#...#...#.#.#',
      '#.###.#.###.#.#',
      '#.............#',
      '#.............#',
      '###############'
    ];

    const pickups = [
      { x: 2, y: 1 },
      { x: 6, y: 3 },
      { x: 11, y: 1 },
      { x: 10, y: 6 },
      { x: 4, y: 7 }
    ];

    const state = {
      status: 'RUNNING',
      score: 0,
      best: Number(localStorage.getItem('ai-escape-best') || 0),
      lastAiStep: 0,
      playerMoveDelay: 0
    };

    const player = { x: 1, y: 1 };
    const enemy = { x: 11, y: 7, path: [], stepDelay: 0 };

    function solidAt(x, y) {
      if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return true;
      return map[y][x] === '#';
    }

    function isSameCell(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function keyFor(x, y) {
      return `${x},${y}`;
    }

    function bfs(start, goal) {
      const queue = [start];
      const visited = new Set([keyFor(start.x, start.y)]);
      const previous = new Map();

      while (queue.length) {
        const current = queue.shift();
        if (current.x === goal.x && current.y === goal.y) {
          const path = [];
          let cursor = current;
          while (cursor) {
            path.push(cursor);
            cursor = previous.get(keyFor(cursor.x, cursor.y));
          }
          return path.reverse();
        }

        const neighbors = [
          { x: current.x + 1, y: current.y },
          { x: current.x - 1, y: current.y },
          { x: current.x, y: current.y + 1 },
          { x: current.x, y: current.y - 1 }
        ];

        for (const next of neighbors) {
          if (solidAt(next.x, next.y)) continue;
          const id = keyFor(next.x, next.y);
          if (visited.has(id)) continue;
          visited.add(id);
          previous.set(id, current);
          queue.push(next);
        }
      }

      return [];
    }

    function resetGame() {
      state.status = 'RUNNING';
      state.score = 0;
      state.lastAiStep = 0;
      state.playerMoveDelay = 0;
      player.x = 1;
      player.y = 1;
      enemy.x = 11;
      enemy.y = 7;
      enemy.path = [];
      enemy.stepDelay = 0;
      pickupState.length = 0;
      pickups.forEach(item => pickupState.push({ ...item, active: true }));
      updateHud();
      addAiSystemMessage('The maze has reset. The enemy is back on patrol and the core route has been refreshed.');
    }

    const pickupState = [];
    resetGame();

    function updateHud() {
      scoreLabel.textContent = `Cores: ${state.score}/${pickups.length}`;
      if (state.status === 'RUNNING') {
        const dist = Math.abs(player.x - enemy.x) + Math.abs(player.y - enemy.y);
        modeLabel.textContent = dist <= 5 ? 'Mode: HUNT' : 'Mode: SCAN';
      } else if (state.status === 'WON') {
        modeLabel.textContent = 'Mode: ESCAPED';
      } else {
        modeLabel.textContent = 'Mode: CAUGHT';
      }
    }

    function collectPickup() {
      for (const item of pickupState) {
        if (!item.active) continue;
        if (item.x === player.x && item.y === player.y) {
          item.active = false;
          state.score += 1;
          if (state.score > state.best) {
            state.best = state.score;
            localStorage.setItem('ai-escape-best', String(state.best));
          }
          updateHud();
          if (state.score === pickups.length) {
            state.status = 'WON';
            addAiSystemMessage('All cores collected. The AI has lost the track. You have escaped the maze.');
          } else {
            addAiSystemMessage(`Core secured. ${pickups.length - state.score} cores remain on the map.`);
          }
          break;
        }
      }
    }

    function updatePlayer(dt) {
      if (state.status !== 'RUNNING') return;

      state.playerMoveDelay -= dt;
      let dx = 0;
      let dy = 0;

      if (keys['ArrowUp'] || keys['w']) dy = -1;
      if (keys['ArrowDown'] || keys['s']) dy = 1;
      if (keys['ArrowLeft'] || keys['a']) dx = -1;
      if (keys['ArrowRight'] || keys['d']) dx = 1;

      if ((dx !== 0 || dy !== 0) && state.playerMoveDelay <= 0) {
        const nx = player.x + dx;
        const ny = player.y + dy;
        if (!solidAt(nx, ny)) {
          player.x = nx;
          player.y = ny;
          collectPickup();
          if (player.x === enemy.x && player.y === enemy.y) {
            state.status = 'LOST';
            addAiSystemMessage('The AI reached your last position. The run failed. Press R to restart.');
          }
        }
        state.playerMoveDelay = 120;
      }
    }

    function updateEnemy(dt) {
      if (state.status !== 'RUNNING') return;

      enemy.stepDelay -= dt;
      if (enemy.stepDelay > 0) return;
      enemy.stepDelay = 180;

      const start = { x: Math.round(enemy.x), y: Math.round(enemy.y) };
      const goal = { x: Math.round(player.x), y: Math.round(player.y) };

      if (!enemy.path.length || isSameCell(start, enemy.path[enemy.path.length - 1])) {
        enemy.path = bfs(start, goal);
      }

      if (enemy.path.length > 1) {
        const next = enemy.path[1];
        if (!solidAt(next.x, next.y)) {
          enemy.x = next.x;
          enemy.y = next.y;
          enemy.path = enemy.path.slice(1);
        }
      }

      if (enemy.x === player.x && enemy.y === player.y) {
        state.status = 'LOST';
        addAiSystemMessage('The AI caught you in the final corridor. Press R to restart.');
      }
    }

    function drawBackground() {
      ctx.fillStyle = '#061521';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const px = x * TILE;
          const py = y * TILE;

          if (map[y][x] === '#') {
            ctx.fillStyle = '#10263d';
            ctx.fillRect(px, py, TILE, TILE);
            ctx.strokeStyle = 'rgba(126, 233, 255, 0.14)';
            ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
          } else {
            ctx.fillStyle = 'rgba(15, 26, 39, 0.5)';
            ctx.fillRect(px, py, TILE, TILE);
          }
        }
      }
    }

    function drawPickups() {
      for (const item of pickupState) {
        if (!item.active) continue;
        const cx = item.x * TILE + TILE / 2;
        const cy = item.y * TILE + TILE / 2;
        ctx.beginPath();
        ctx.fillStyle = '#ffd166';
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 209, 102, 0.7)';
        ctx.lineWidth = 2;
        ctx.arc(cx, cy, 13, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawEntity(entity, color, label) {
      const cx = entity.x * TILE + TILE / 2;
      const cy = entity.y * TILE + TILE / 2;
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(cx, cy, 12, 0, Math.PI * 2);
      ctx.fill();

      if (label) {
        ctx.fillStyle = '#ebf7ff';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(label, cx, cy + 24);
      }
    }

    function drawOverlay() {
      if (state.status === 'RUNNING') return;

      ctx.fillStyle = 'rgba(3, 11, 17, 0.58)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ebf7ff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 42px Arial';
      ctx.fillText(state.status === 'WON' ? 'You escaped!' : 'AI caught you!', canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = '18px Arial';
      ctx.fillStyle = '#9fe7ff';
      ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 30);
    }

    function draw() {
      drawBackground();
      drawPickups();
      drawEntity(player, '#7ee9ff', 'YOU');
      drawEntity(enemy, '#ff6b8a', 'AI');
      drawOverlay();
    }

    let lastTime = 0;

    function tick(timestamp) {
      const dt = timestamp - lastTime || 16;
      lastTime = timestamp;

      updatePlayer(dt);
      updateEnemy(dt);
      updateHud();
      draw();
      requestAnimationFrame(tick);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      keys[event.key] = true;
      keys[key] = true;

      if (event.key === 'r' || key === 'r') {
        resetGame();
      }
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      keys[event.key] = false;
      keys[key] = false;
    });

    function addAiMessage(text, fromUser = false) {
      const message = document.createElement('div');
      message.className = `msg ${fromUser ? 'user' : 'ai'}`;
      message.textContent = text;
      chatLog.appendChild(message);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function addAiSystemMessage(text) {
      addAiMessage(text, false);
    }

    function getGameStatusSummary() {
      const remaining = pickups.length - state.score;
      const dist = Math.abs(player.x - enemy.x) + Math.abs(player.y - enemy.y);
      let statusText = 'The AI is scanning the maze.';
      if (state.status === 'WON') statusText = 'You already escaped.';
      else if (state.status === 'LOST') statusText = 'The AI caught you.';
      else if (dist <= 5) statusText = 'The enemy is in hunt mode and close to your position.';
      else if (dist <= 10) statusText = 'The enemy is nearby but still searching.';

      return {
        remaining,
        dist,
        statusText,
        mode: state.status === 'RUNNING' ? (dist <= 5 ? 'HUNT' : 'SCAN') : (state.status === 'WON' ? 'ESCAPED' : 'CAUGHT')
      };
    }

    function generateAiAnswer(question) {
      const q = question.trim().toLowerCase();
      if (!q) return 'Ask me a question about the game or the AI.';

      if (['hi', 'hello', 'hey', 'good morning', 'good evening'].some(token => q.includes(token))) {
        return 'Hello. I am the AI console for this maze. Ask about the enemy, the cores, or how to escape.';
      }

      if (q.includes('how to win') || q.includes('win') || q.includes('escape')) {
        return 'Collect all 5 cores, avoid the enemy, and keep moving through the safe corridors. Once all cores are gathered, the maze opens and you escape.';
      }

      if (q.includes('how to move') || q.includes('move') || q.includes('controls')) {
        return 'Use WASD or the arrow keys to move one tile at a time. Press R anytime to restart the run.';
      }

      if (q.includes('enemy') || q.includes('ai') || q.includes('chasing') || q.includes('hunt')) {
        const info = getGameStatusSummary();
        return `The enemy is ${info.mode.toLowerCase()} mode. Distance to you is ${info.dist}. ${info.statusText}`;
      }

      if (q.includes('core') || q.includes('score') || q.includes('collect') || q.includes('remaining')) {
        const info = getGameStatusSummary();
        return `You have ${state.score} of 5 cores. ${info.remaining} core${info.remaining === 1 ? '' : 's'} remain. Collect them all to escape.`;
      }

      if (q.includes('status') || q.includes('what is happening') || q.includes('where am i') || q.includes('state')) {
        const info = getGameStatusSummary();
        return `You are in ${info.mode} mode. ${info.statusText} You have ${state.score} of 5 cores, and ${info.remaining} remain.`;
      }

      if (q.includes('restart') || q.includes('reset')) {
        return 'Press R to reset the map and start again. The AI and the cores reset with it.';
      }

      if (q.includes('what are you') || q.includes('who are you')) {
        return 'I am the local AI assistant built into this maze. I can explain the game state, the enemy, and the win condition.';
      }

      if (q.includes('thanks') || q.includes('thank you')) {
        return 'You are welcome. Ask for a hint or status update anytime.';
      }

      return 'I can help with: movement controls, enemy behavior, remaining cores, or how to win. Ask me a more specific question and I will answer based on the current game state.';
    }

    function handleAiQuestion() {
      const question = aiInput.value.trim();
      if (!question) return;

      addAiMessage(question, true);
      aiInput.value = '';

      const answer = generateAiAnswer(question);
      setTimeout(() => addAiMessage(answer, false), 180);
    }

    askBtn.addEventListener('click', handleAiQuestion);
    aiInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        handleAiQuestion();
      }
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
