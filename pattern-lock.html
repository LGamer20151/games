<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pattern Lock</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(620px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    .lock { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
    .pad { aspect-ratio:1; border:none; border-radius:18px; background:linear-gradient(180deg, rgba(75,84,101,0.96), rgba(52,62,77,0.96)); color:white; font-size:2rem; font-weight:900; cursor:pointer; }
    .active { background:linear-gradient(135deg, #a5f3fc, #38bdf8); color:#04131b; }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Pattern Lock</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
    <div class="lock" id="lock"></div>
    <button id="start">Start Sequence</button>
  </div>

  <script>
    const lockEl = document.getElementById('lock');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start');
    let pads = [], pattern = [], round = 0, score = 0, input = [];

    function buildPads() {
      lockEl.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const pad = document.createElement('button');
        pad.type = 'button';
        pad.className = 'pad';
        pad.textContent = i + 1;
        pad.onclick = () => handlePad(i);
        lockEl.appendChild(pad);
      }
      pads = [...lockEl.children];
    }

    function flash(index) {
      const pad = pads[index];
      if (!pad) return;
      pad.classList.add('active');
      setTimeout(() => pad.classList.remove('active'), 350);
    }

    function playPattern() {
      statusEl.textContent = 'Watch closely';
      let i = 0;
      const timer = setInterval(() => {
        if (i >= pattern.length) {
          clearInterval(timer); statusEl.textContent = 'Repeat it';
          input = [];
          return;
        }
        flash(pattern[i]);
        i += 1;
      }, 500);
    }

    function handlePad(index) {
      input.push(index);
      flash(index);
      const pos = input.length - 1;
      if (pattern[pos] !== index) {
        statusEl.textContent = 'Wrong pattern';
        alert('Wrong pattern! Final score: ' + score);
        return;
      }
      if (input.length === pattern.length) {
        score += 10; scoreEl.textContent = 'Score: ' + score; round += 1;
        statusEl.textContent = 'Nice!';
        pattern.push(Math.floor(Math.random() * 9));
        input = [];
        setTimeout(playPattern, 800);
      }
    }

    startBtn.addEventListener('click', () => {
      score = 0; round = 1; scoreEl.textContent = 'Score: 0';
      pattern = [Math.floor(Math.random() * 9)];
      input = [];
      playPattern();
    });

    buildPads();
  </script>
</body>
</html>
