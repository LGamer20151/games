<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Asteroids</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1020,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:320px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.ship,.rock,.bullet{position:absolute;border-radius:50%}.ship{width:24px;height:24px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);clip-path:polygon(50% 0,100% 80%,50% 100%,0 80%)}.rock{background:radial-gradient(circle,#cbd5e1,#475569);opacity:.9}.bullet{width:6px;height:12px;background:#fbbf24;border-radius:6px}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>3D Asteroids</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Lives: <strong id="lives">3</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const livesEl=document.getElementById('lives');let score=0,lives=3,active=false,shipX=50,shipY=80,bullets=[],rocks=[],interval=null;function makeShip(){const s=document.createElement('div');s.className='ship';s.style.left=shipX+'%';s.style.top=shipY+'%';arena.appendChild(s);return s}function spawnRock(){const r=document.createElement('div');r.className='rock';const size=18+Math.random()*26;const x=10+Math.random()*80;const y=-8-Math.random()*20;r.style.width=size+'px';r.style.height=size+'px';r.style.left=x+'%';r.style.top=y+'%';arena.appendChild(r);rocks.push({el:r,x,y,dx:(Math.random()-0.5)*1.2,dy:0.7+Math.random()*1.2,size})}function shoot(){if(!active)return;const b=document.createElement('div');b.className='bullet';b.style.left=(shipX+0.8)+'%';b.style.top=(shipY-6)+'%';arena.appendChild(b);bullets.push({el:b,x:shipX,y:shipY-6,vy:-2.3});}function update(){const ship=document.querySelector('.ship');if(!ship)return;ship.style.left=shipX+'%';ship.style.top=shipY+'%';for(const b of bullets){b.y += b.vy; b.el.style.top=b.y+'%';if(b.y < -5){b.el.remove(); bullets.splice(bullets.indexOf(b),1)}}for(const r of rocks){r.x += r.dx; r.y += r.dy; r.el.style.left=r.x+'%';r.el.style.top=r.y+'%';if(r.y>110){r.el.remove();rocks.splice(rocks.indexOf(r),1);score+=5;scoreEl.textContent=score;}const shipRect=ship.getBoundingClientRect();const rockRect=r.el.getBoundingClientRect();if(Math.abs(shipRect.left-rockRect.left)<26&&Math.abs(shipRect.top-rockRect.top)<26){lives--;livesEl.textContent=lives;if(lives<=0){active=false;clearInterval(interval);document.getElementById('startBtn').textContent='Restart'}}for(const b of bullets){const bRect=b.el.getBoundingClientRect();if(Math.abs(bRect.left-rockRect.left)<26&&Math.abs(bRect.top-rockRect.top)<26){score+=10;scoreEl.textContent=score;b.el.remove();bullets.splice(bullets.indexOf(b),1);r.el.remove();rocks.splice(rocks.indexOf(r),1);break}}}if(active&&Math.random()<0.03)spawnRock()}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')shipX=Math.max(8,shipX-4);if(e.key==='ArrowRight')shipX=Math.min(92,shipX+4);if(e.key==='ArrowUp')shipY=Math.max(12,shipY-4);if(e.key==='ArrowDown')shipY=Math.min(82,shipY+4);if(e.key===' ')shoot()});document.addEventListener('keydown',e=>{if(e.code==='Space')shoot()});function start(){score=0;lives=3;scoreEl.textContent=score;livesEl.textContent=lives;active=true;arena.innerHTML='';shipX=50;shipY=80;makeShip();bullets=[];rocks=[];clearInterval(interval);interval=setInterval(update,50);document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
