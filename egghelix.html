<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Egg Helix | Unblocked Arcade Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0b0c10; color: #c5c6c7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
    
    /* Navigation Bar */
    .nav-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { text-decoration: none; color: #66fcf1; font-weight: 600; padding: 8px 16px; border: 1px solid #66fcf1; border-radius: 6px; transition: 0.2s; }
    .back-btn:hover { background: #66fcf1; color: #0b0c10; box-shadow: 0 0 10px rgba(102, 252, 241, 0.3); }
    h1 { font-size: 1.8rem; color: #fff; font-weight: 700; }
    .fullscreen-btn { background: #66fcf1; color: #0b0c10; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .fullscreen-btn:hover { opacity: 0.9; box-shadow: 0 0 10px rgba(102, 252, 241, 0.4); }

    /* Game Wrapper & Responsive Scaling */
    .game-container { position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 9; background-color: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid #1f2833; }
    .game-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a href="index.html" class="back-btn">⬅ Back to Home</a>
    <h1>Egg Helix</h1>
    <button class="fullscreen-btn" onclick="triggerFullscreen()">Fullscreen 🖥️</button>
  </div>

  <!-- Game Arena Section -->
  <div class="game-container" id="fullscreenArena">
    <iframe id="gamePlayer" src="https://amazonaws.com" scrolling="no" frameborder="0" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
  </div>

  <script>
    // Handles cross-browser desktop fullscreen scaling
    function triggerFullscreen() {
      const arena = document.getElementById('fullscreenArena');
      if (arena.requestFullscreen) { arena.requestFullscreen(); } 
      else if (arena.webkitRequestFullscreen) { arena.webkitRequestFullscreen(); } 
      else if (arena.msRequestFullscreen) { arena.msRequestFullscreen(); }
    }
  </script>

</body>
</html>
