<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lights Out</title>
  <style>
    body {
      margin:0; font-family:Arial,sans-serif; background:linear-gradient(180deg,#08121f,#101b2d);
      color:#eef6ff; display:grid; place-items:center; min-height:100vh;
    }
    .panel {
      background:rgba(15,23,42,0.9); border:1px solid rgba(148,163,184,0.2); border-radius:18px;
      box-shadow:0 20px 40px rgba(0,0,0,0.35); padding:22px; width:min(90vw,440px);
    }
    h1 { margin:0 0 8px; text-align:center; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .score { font-weight:bold; font-size:18px; }
    .board {
      display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; background:rgba(17,24,39,0.9);
      padding:12px; border-radius:14px; border:1px solid rgba(148,163,184,0.15);
    }
    .cell {
      width:100%; aspect-ratio:1; border:none; border-radius:10px; cursor:pointer; background:#1e293b;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04); transition:transform 0.12s ease, background 0.12s ease;
    }
    .cell.on { background:linear-gradient(135deg,#67e8f9,#8b5cf6); box-shadow:0 0 18px rgba(103,232,249,0.5); }
    .cell:active { transform:scale(0.96); }
    .controls { display:flex; justify-content:space-between; gap:10px; margin-top:18px; }
    button {
      flex:1; border:none; border-radius:10px; background:linear-gradient(135deg,#22d3ee,#8b5cf6);
      color:#fff; font-weight:bold; font-size:16px; padding:12px 14px; cursor:pointer;
    }
    a { color:#a5f3fc; text-decoration:none; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Lights Out</h1>
    <div class="topbar">
      <span class="score" id="moves">Moves: 0</span>
      <a href="index.html">&larr; Menu</a>
    </div>
    <div class="board" id="board"></div>
    <div class="controls">
      <button id="newgame">New Game</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <script>
    const size = 5;
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    let board = [];
    let moves = 0;

    function createBoard() {
      board = Array.from({ length: size }, () => Array(size).fill(0));
      for (let i = 0; i < 7; i++) {
        const r = Math.floor(Math.random() * size);
        const c = Math.floor(Math.random() * size);
        toggle(r, c, false);
      }
      if (isSolved()) {
        createBoard();
        return;
      }
      moves = 0;
      updateMoves();
      render();
    }

    function toggle(r, c, countMove = true) {
      const deltas = [[0,0],[1,0],[-1,0],[0,1],[0,-1]];
      for (const [dr, dc] of deltas) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < size && cc >= 0 && cc < size) {
          board[rr][cc] = 1 - board[rr][cc];
        }
      }
      if (countMove) moves++;
    }

    function isSolved() {
      return board.every(row => row.every(cell => cell === 0));
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const btn = document.createElement('button');
          btn.className = 'cell ' + (board[r][c] ? 'on' : '');
          btn.title = `Row ${r + 1}, Col ${c + 1}`;
          btn.addEventListener('click', () => {
            toggle(r, c);
            render();
            updateMoves();
            if (isSolved()) {
              setTimeout(() => alert('You solved it!'), 50);
            }
          });
          boardEl.appendChild(btn);
        }
      }
    }

    function updateMoves() {
      movesEl.textContent = 'Moves: ' + moves;
    }

    document.getElementById('newgame').addEventListener('click', createBoard);
    document.getElementById('reset').addEventListener('click', () => {
      moves = 0;
      board = board.map(row => row.map(() => 0));
      render();
      updateMoves();
    });

    createBoard();
  </script>
</body>
</html>
