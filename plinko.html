<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plinko</title>
  <style>
    body { background:#1e1e2e; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    canvas { background:#11111b; border-radius:8px; display:block; margin:0 auto; }
    button { margin-top:12px; padding:10px 20px; font-size:16px; cursor:pointer; border:none; border-radius:6px; background:#89b4fa; color:#11111b; }
    #score { font-size:22px; margin-top:10px; }
  </style>
</head>
<body>
  <h1>Plinko</h1>
  <canvas id="board" width="480" height="560"></canvas>
  <div id="score">Score: 0</div>
  <button id="drop">Drop Disc</button>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const dropBtn = document.getElementById('drop');

const W = canvas.width, H = canvas.height;
const ROWS = 10, PEG_GAP = 40, RADIUS = 8;
const slotValues = [100, 50, 20, 10, 5, 2, 5, 10, 20, 50, 100];
const slotCount = slotValues.length;
const slotWidth = W / slotCount;

let discs = [];
let score = 0;

function pegs() {
  const list = [];
  for (let r = 0; r < ROWS; r++) {
    const count = r + 3;
    const spacing = W / (count + 1);
    for (let c = 0; c < count; c++) {
      list.push({ x: spacing * (c + 1), y: 70 + r * PEG_GAP });
    }
  }
  return list;
}
const pegList = pegs();

function newDisc() {
  return {
    x: W / 2 + (Math.random() - 0.5) * 10,
    y: 20,
    vx: 0,
    vy: 0,
    done: false,
    slot: null
  };
}

function update(d) {
  d.vy += 0.25;
  d.x += d.vx;
  d.y += d.vy;

  for (const p of pegList) {
    const dx = d.x - p.x, dy = d.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < RADIUS + 4) {
      const nx = dx / dist, ny = dy / dist;
      const dot = d.vx * nx + d.vy * ny;
      d.vx -= 2 * dot * nx;
      d.vy -= 2 * dot * ny;
      d.vx += (Math.random() - 0.5) * 0.6;
      d.x = p.x + nx * (RADIUS + 4);
      d.y = p.y + ny * (RADIUS + 4);
      d.vx *= 0.8;
      d.vy *= 0.8;
    }
  }

  if (d.x < RADIUS) { d.x = RADIUS; d.vx = Math.abs(d.vx); }
  if (d.x > W - RADIUS) { d.x = W - RADIUS; d.vx = -Math.abs(d.vx); }

  if (d.y > H - 40 - RADIUS) {
    d.done = true;
    d.slot = Math.min(slotCount - 1, Math.max(0, Math.floor(d.x / slotWidth)));
    score += slotValues[d.slot];
    scoreEl.textContent = 'Score: ' + score;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#cdd6f4';
  for (const p of pegList) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < slotCount; i++) {
    ctx.fillStyle = slotValues[i] >= 50 ? '#f38ba8' : slotValues[i] >= 20 ? '#fab387' : '#a6e3a1';
    ctx.fillRect(i * slotWidth + 2, H - 40, slotWidth - 4, 40);
    ctx.fillStyle = '#11111b';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(slotValues[i], i * slotWidth + slotWidth / 2, H - 16);
  }

  for (const d of discs) {
    if (d.done) continue;
    ctx.fillStyle = '#f9e2af';
    ctx.beginPath();
    ctx.arc(d.x, d.y, RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  for (const d of discs) if (!d.done) update(d);
  discs = discs.filter(d => !d.done);
  draw();
  requestAnimationFrame(loop);
}

dropBtn.addEventListener('click', () => discs.push(newDisc()));
canvas.addEventListener('click', () => discs.push(newDisc()));

loop();
</script>
</body>
</html>
