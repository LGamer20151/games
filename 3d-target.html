<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Target</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:280px;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2);overflow:hidden}.target{position:absolute;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,#fef3c7,#f59e0b);box-shadow:0 0 18px rgba(251,191,36,.7)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>3D Target</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Time: <strong id="time">15</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const timeEl=document.getElementById('time');let score=0,time=15,active=false,interval=null,target=null;function place(){if(!target){target=document.createElement('div');target.className='target';arena.appendChild(target)}const x=15+Math.random()*70;const y=15+Math.random()*60;target.style.left=x+'%';target.style.top=y+'%'}target=document.createElement('div');target.className='target';arena.appendChild(target);target.addEventListener('click',()=>{if(active){score++;scoreEl.textContent=score;place();}});function tick(){if(!active)return;time--;timeEl.textContent=time;if(time<=0){active=false;clearInterval(interval);document.getElementById('startBtn').textContent='Play Again';}}function start(){score=0;time=15;scoreEl.textContent=score;timeEl.textContent=time;active=true;place();clearInterval(interval);interval=setInterval(tick,1000);document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
