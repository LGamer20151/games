<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spot the Difference</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.panel{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.img{position:relative;height:220px;border-radius:16px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);overflow:hidden}.mark{position:absolute;width:18px;height:18px;border-radius:50%;background:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,.7)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Spot the Difference</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Find: <strong id="find">1</strong></span></div><div class="panel"><div class="img" id="a"></div><div class="img" id="b"></div></div><button class="button" id="startBtn">Start</button></div><script>const a=document.getElementById('a'), b=document.getElementById('b');const scoreEl=document.getElementById('score');const findEl=document.getElementById('find');let score=0,find=1;function drawScene(el){el.innerHTML='';for(let i=0;i<8;i++){const dot=document.createElement('div');dot.className='mark';dot.style.left=(10+Math.random()*70)+'%';dot.style.top=(10+Math.random()*70)+'%';el.appendChild(dot)}}function start(){score=0;find=1;scoreEl.textContent=0;findEl.textContent=find;drawScene(a);drawScene(b);const extra=document.createElement('div');extra.className='mark';extra.style.left=(30+Math.random()*30)+'%';extra.style.top=(20+Math.random()*50)+'%';b.appendChild(extra);b.onclick=()=>{score+=10;scoreEl.textContent=score;find++;findEl.textContent=find;start();};a.onclick=()=>{score=Math.max(0,score-5);scoreEl.textContent=score;}}document.getElementById('startBtn').addEventListener('click',start);start();</script></body></html>
