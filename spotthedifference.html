<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot the Difference</title>
  <style>
    body { background:#0d0e12; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    a { color:#89b4fa; }
    #info { font-size:20px; margin:14px 0; }
    #scenes { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
    .panel { position:relative; }
    .panel h3 { margin:0 0 8px; font-size:16px; color:#a1a1aa; text-transform:uppercase; letter-spacing:1px; }
    svg { width:360px; height:260px; background:#1c1d24; border-radius:12px; display:block; }
    .spot { cursor:pointer; }
    .found { fill:none; stroke:#a6e3a1; stroke-width:4; }
    #start { margin-top:18px; padding:12px 26px; font-size:18px; border:none; border-radius:8px; background:#89b4fa; color:#0d0e12; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Spot the Difference</h1>
  <div id="info">Find all 5 differences. Time: 0</div>
  <div id="scenes">
    <div class="panel">
      <h3>Original</h3>
      <svg viewBox="0 0 360 260">
        <rect x="0" y="0" width="360" height="260" fill="#89b4fa" opacity="0.25"/>
        <circle cx="300" cy="50" r="28" fill="#f9e2af"/>
        <rect x="0" y="200" width="360" height="60" fill="#a6e3a1" opacity="0.6"/>
        <polygon points="60,200 110,110 160,200" fill="#f38ba8"/>
        <rect x="200" y="150" width="50" height="50" fill="#cba6f7"/>
        <circle cx="90" cy="60" r="18" fill="#fab387"/>
        <rect x="250" y="120" width="30" height="30" fill="#94e2d5"/>
        <rect x="150" y="100" width="20" height="20" fill="#f5c2e7"/>
      </svg>
    </div>
    <div class="panel">
      <h3>Find the changes</h3>
      <svg viewBox="0 0 360 260" id="changed">
        <rect x="0" y="0" width="360" height="260" fill="#89b4fa" opacity="0.25"/>
        <circle class="spot" data-id="1" cx="300" cy="50" r="28" fill="#f9e2af"/>
        <rect x="0" y="200" width="360" height="60" fill="#a6e3a1" opacity="0.6"/>
        <polygon points="60,200 110,110 160,200" fill="#f38ba8"/>
        <rect class="spot" data-id="2" x="200" y="150" width="50" height="50" fill="#cba6f7"/>
        <circle class="spot" data-id="3" cx="90" cy="60" r="18" fill="#fab387"/>
        <rect x="250" y="120" width="30" height="30" fill="#94e2d5"/>
        <rect class="spot" data-id="4" x="150" y="100" width="20" height="20" fill="#f5c2e7"/>
        <rect class="spot" data-id="5" x="20" y="20" width="40" height="30" fill="#f2cdcd"/>
      </svg>
    </div>
  </div>
  <button id="start">Start</button>
<script>
const info = document.getElementById('info');
const startBtn = document.getElementById('start');
const changed = document.getElementById('changed');
const TOTAL = 5;
let found = 0, seconds = 0, clock = null, active = false;

// Hidden changes: the right picture has five differences (ids 1 to 5).
// Ids 1 to 4 are shapes that are missing or recoloured; id 5 is an extra shape.
// Shapes with class "spot" are the clickable areas.
const diffNames = {
  1: 'Sun moved',
  2: 'Box colour changed',
  3: 'Head colour changed',
  4: 'Pink block shifted',
  5: 'Extra pink shape'
};

function render() {
  info.textContent = 'Found ' + found + ' of ' + TOTAL + '   |   Time: ' + seconds + 's';
}

function markFound(el) {
  const id = el.dataset.id;
  el.style.opacity = '0.3';
  el.style.pointerEvents = 'none';
  const ring = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  const box = el.getBBox();
  ring.setAttribute('x', box.x - 6);
  ring.setAttribute('y', box.y - 6);
  ring.setAttribute('width', box.width + 12);
  ring.setAttribute('height', box.height + 12);
  ring.setAttribute('class', 'found');
  changed.appendChild(ring);
}

changed.addEventListener('click', e => {
  if (!active) return;
  const el = e.target.closest('.spot');
  if (!el || el.style.pointerEvents === 'none') return;
  found++;
  markFound(el);
  render();
  if (found === TOTAL) {
    active = false;
    clearInterval(clock);
    info.textContent = 'You found all 5 in ' + seconds + ' seconds!';
    startBtn.disabled = false;
    startBtn.textContent = 'Play Again';
  }
});

startBtn.addEventListener('click', () => {
  found = 0;
  seconds = 0;
  active = true;
  startBtn.disabled = true;
  changed.querySelectorAll('.found').forEach(r => r.remove());
  changed.querySelectorAll('.spot').forEach(s => {
    s.style.opacity = '';
    s.style.pointerEvents = '';
  });
  render();
  clearInterval(clock);
  clock = setInterval(() => { seconds++; render(); }, 1000);
});
</script>
</body>
</html>
