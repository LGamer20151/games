<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precision Aim</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background:radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(680px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #stage { position:relative; height:300px; border-radius:18px; background:linear-gradient(180deg, rgba(15,23,42,0.92), rgba(10,15,24,0.8)); border:1px solid var(--line); overflow:hidden; }
    .target { position:absolute; width:56px; height:56px; border-radius:50%; background:radial-gradient(circle, #fff 0 18%, #f59e0b 19% 35%, #ef4444 36% 52%, #111827 53% 100%); cursor:pointer; }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Precision Aim</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="status">Ready</span></div>
    <div id="stage"></div>
    <button id="start">Start</button>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start');
    let score = 0, target = null, started = false, moveTimer;

    function createTarget() {
      if (target) target.remove();
      target = document.createElement('button');
      target.type = 'button';
      target.className = 'target';
      const x = Math.random() * (stage.clientWidth - 56);
      const y = Math.random() * (stage.clientHeight - 56);
      target.style.left = x + 'px';
      target.style.top = y + 'px';
      target.addEventListener('click', () => {
        if (!started) return;
        score += 10; scoreEl.textContent = 'Score: ' + score; statusEl.textContent = 'Bullseye!';
        createTarget();
      });
      stage.appendChild(target);
    }

    startBtn.addEventListener('click', () => {
      score = 0; scoreEl.textContent = 'Score: 0'; statusEl.textContent = 'Aim'; started = true; createTarget();
    });
  </script>
</body>
</html>
