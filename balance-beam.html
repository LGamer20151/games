<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Balance Beam</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.beam{position:absolute;left:10%;right:10%;bottom:20%;height:12px;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}.player{position:absolute;bottom:30%;left:50%;width:18px;height:18px;border-radius:50%;background:#fbbf24;transform:translateX(-50%)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Balance Beam</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span></div><div class="arena" id="arena"></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const bestEl=document.getElementById('best');let score=0,best=0,left=50,active=false;function init(){arena.innerHTML='<div class="beam"></div><div class="player" id="player"></div>';}document.addEventListener('keydown',e=>{if(!active)return;if(e.key==='ArrowLeft')left=Math.max(10,left-6);if(e.key==='ArrowRight')left=Math.min(90,left+6);document.getElementById('player').style.left=left+'%';score++;scoreEl.textContent=score;best=Math.max(best,score);bestEl.textContent=best;});function start(){score=0;scoreEl.textContent=score;active=true;left=50;init();document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);init();</script></body></html>
