<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Switch</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(15,23,42,0.88); --line:rgba(148,163,184,0.22); --text:#edf4ff; --muted:#adc1db; --accent:#22d3ee; --accent-2:#8b5cf6; --good:#34d399; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; color:var(--text); background: radial-gradient(circle at top, rgba(34,211,238,0.18), transparent 30%), linear-gradient(180deg, #050b16 0%, #0d1324 100%); }
    .panel { width:min(680px,92vw); padding:22px 20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,0.3); }
    a { color:#bfe8ff; text-decoration:none; font-weight:700; display:inline-block; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem, 5vw, 3rem); letter-spacing:-0.05em; background:linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hud { display:flex; justify-content:space-between; color:var(--muted); margin:10px 0 16px; font-weight:700; }
    #swatch { width:100%; height:120px; border-radius:18px; border:1px solid var(--line); margin:8px 0 18px; }
    .colors { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
    .color-btn { height:70px; border-radius:16px; border:2px solid rgba(255,255,255,0.3); cursor:pointer; }
    button { margin-top:16px; border:none; border-radius:12px; padding:12px 18px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:white; cursor:pointer; }
  </style>
</head>
<body>
  <div class="panel">
    <a href="index.html">← Back to arcade</a>
    <h1>Color Switch</h1>
    <div class="hud"><span id="score">Score: 0</span><span id="round">Round: 1</span></div>
    <div id="swatch"></div>
    <div class="colors" id="colors"></div>
    <button id="start">Start</button>
  </div>

  <script>
    const colors = ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899', '#f97316', '#14b8a6'];
    const swatch = document.getElementById('swatch');
    const colorsBox = document.getElementById('colors');
    const scoreEl = document.getElementById('score');
    const roundEl = document.getElementById('round');
    const startBtn = document.getElementById('start');
    let score = 0, round = 1, target = '', started = false;

    function randomColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function renderRound() {
      target = randomColor();
      swatch.style.background = target;
      colorsBox.innerHTML = '';
      const arr = [...colors].sort(() => 0.5 - Math.random());
      arr.forEach(color => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'color-btn';
        btn.style.background = color;
        btn.onclick = () => {
          if (!started) return;
          if (color === target) {
            score += 10; scoreEl.textContent = 'Score: ' + score; round += 1; roundEl.textContent = 'Round: ' + round; renderRound();
          } else {
            alert('Wrong color! Final score: ' + score);
            started = false;
          }
        };
        colorsBox.appendChild(btn);
      });
      const targetIndex = Math.floor(Math.random() * arr.length);
      const correctBtn = colorsBox.children[targetIndex];
      if (correctBtn) correctBtn.style.boxShadow = '0 0 0 3px rgba(255,255,255,0.65)';
    }

    startBtn.onclick = () => {
      score = 0; round = 1; started = true; scoreEl.textContent = 'Score: 0'; roundEl.textContent = 'Round: 1'; renderRound();
    };
    renderRound();
  </script>
</body>
</html>
