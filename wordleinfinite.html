<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wordle Infinite</title>
<style>body{background:#0d0e12;color:#fff;font-family:Arial,sans-serif;text-align:center;margin:0;padding:20px}a{color:#89b4fa}h1{margin:10px 0}#info{color:#a1a1aa;font-size:16px;margin:10px 0;min-height:24px}
#grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;justify-content:center;margin:12px auto}
.row{display:grid;grid-template-columns:repeat(5,56px);gap:6px}
.tile{width:56px;height:56px;border:2px solid #3a3b45;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;text-transform:uppercase;background:#1c1d24}
.tile.green{background:#2ecc71;border-color:#2ecc71;color:#0d0e12}.tile.yellow{background:#f1c40f;border-color:#f1c40f;color:#0d0e12}.tile.gray{background:#3a3b45;border-color:#3a3b45}
#kb{margin-top:16px}.krow{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
.key{min-width:34px;height:48px;padding:0 8px;border:none;border-radius:6px;background:#2a2b35;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
.key.wide{min-width:60px;font-size:13px}.key.green{background:#2ecc71;color:#0d0e12}.key.yellow{background:#f1c40f;color:#0d0e12}.key.gray{background:#15161b;color:#55555f}
button#btn{margin-top:14px;padding:10px 22px;font-size:16px;border:none;border-radius:8px;background:#89b4fa;color:#0d0e12;font-weight:bold;cursor:pointer}</style></head><body>
<a href="index.html">&larr; Back to menu</a><h1>Wordle Infinite</h1><div id="info"></div>
<div id="grid"></div>
<div id="kb"></div>
<button id="btn">New Word</button>
<script>
const WORDS=['apple','brave','chair','dream','eagle','flame','ghost','house','irony','joker','knife','lemon','magic','night','ocean','piano','quiet','river','stone','tiger','unity','vivid','whale','youth','zebra','bread','cloud','drive','earth','fruit','grape','happy','light','money','north','paint','queen','route','shine','trail','world','crane','plant','sugar','waste','bench','candy','flood','glass','honey'];
const grid=document.getElementById('grid'),kb=document.getElementById('kb'),info=document.getElementById('info');
const ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
let target,guesses,current,over,keyState;
function pick(){return WORDS[Math.floor(Math.random()*WORDS.length)];}
function buildBoard(){
  grid.innerHTML='';
  for(let r=0;r<6;r++){
    const row=document.createElement('div');row.className='row';
    for(let k=0;k<5;k++){const t=document.createElement('div');t.className='tile';row.appendChild(t);}
    grid.appendChild(row);
  }
}
function buildKb(){
  kb.innerHTML='';
  ROWS.forEach((letters,i)=>{
    const row=document.createElement('div');row.className='krow';
    if(i===2){row.appendChild(makeKey('Enter','wide'));}
    for(const l of letters)row.appendChild(makeKey(l));
    if(i===2){row.appendChild(makeKey('Back','wide'));}
    kb.appendChild(row);
  });
}
function makeKey(label,cls=''){
  const b=document.createElement('button');
  b.className='key '+cls;b.textContent=label;b.dataset.k=label;
  b.onclick=()=>press(label);
  return b;
}
function press(k){
  if(over)return;
  if(k==='Enter')submit();
  else if(k==='Back'||k==='Backspace')current=current.slice(0,-1);
  else if(/^[a-z]$/i.test(k)&&current.length<5)current+=k.toLowerCase();
  render();
}
function score(guess){
  const res=Array(5).fill('gray');const counts={};
  for(let i=0;i<5;i++){
    if(guess[i]===target[i])res[i]='green';
    else counts[target[i]]=(counts[target[i]]||0)+1;
  }
  for(let i=0;i<5;i++){
    if(res[i]==='green')continue;
    if(counts[guess[i]]>0){res[i]='yellow';counts[guess[i]]--;}
  }
  return res;
}
function submit(){
  if(current.length<5){info.textContent='Not enough letters';return;}
  if(!WORDS.includes(current)){info.textContent='Not in word list';return;}
  const res=score(current);
  guesses.push({word:current,res});
  current='';
  if(guesses[guesses.length-1].word===target){over=true;info.textContent='Solved in '+guesses.length+'! Press New Word for another.';}
  else if(guesses.length===6){over=true;info.textContent='The word was '+target.toUpperCase()+'. Press New Word to keep going.';}
  else info.textContent='';
}
function render(){
  const tiles=grid.querySelectorAll('.tile');
  for(let r=0;r<6;r++)for(let k=0;k<5;k++){
    const t=tiles[r*5+k];
    if(r<guesses.length){t.textContent=guesses[r].word[k];t.className='tile '+guesses[r].res[k];}
    else if(r===guesses.length&&!over){t.textContent=current[k]||'';t.className='tile';}
    else{t.textContent='';t.className='tile';}
  }
  for(const btn of kb.querySelectorAll('.key')){
    const l=btn.dataset.k.toLowerCase();
    if(l.length!==1)continue;
    let best='';
    for(const g of guesses)g.word.split('').forEach((ch,i)=>{
      if(ch===l){
        const s=g.res[i];
        if(s==='green')best='green';
        else if(s==='yellow'&&best!=='green')best='yellow';
        else if(s==='gray'&&!best)best='gray';
      }
    });
    btn.className='key'+(best?' '+best:'');
  }
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter')press('Enter');
  else if(e.key==='Backspace')press('Back');
  else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toLowerCase());
});
function newGame(){
  target=pick();guesses=[];current='';over=false;
  info.textContent='';
  render();
}
document.getElementById('btn').onclick=newGame;
buildBoard();buildKb();newGame();
</script></body></html>
