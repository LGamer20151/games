<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wordle Infinite</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.word{display:flex;gap:8px;justify-content:center;margin-top:16px}.letter{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-weight:bold}.input{width:100%;margin-top:16px;padding:12px;border-radius:12px;border:1px solid rgba(148,163,184,.2);background:rgba(15,23,42,.9);color:#fff}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Wordle Infinite</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Word: <strong id="word">-</strong></span></div><div class="word" id="wordDisplay"></div><input class="input" id="guess" type="text" maxlength="5" placeholder="Guess the 5-letter word" /><button class="button" id="startBtn">Guess</button></div><script>const words=['PLANE','ROBOT','RAVEN','PIXEL','NOVA','LASER','QUEST','COMET'];const scoreEl=document.getElementById('score');const wordEl=document.getElementById('word');const display=document.getElementById('wordDisplay');const input=document.getElementById('guess');const startBtn=document.getElementById('startBtn');let score=0,answer='';function choose(){answer=words[Math.floor(Math.random()*words.length)];wordEl.textContent='?';display.innerHTML='';for(let i=0;i<5;i++){const box=document.createElement('div');box.className='letter';display.appendChild(box)}}startBtn.addEventListener('click',()=>{const guess=input.value.trim().toUpperCase();if(!guess||guess.length!==5)return;score+=guess===answer?10:0;scoreEl.textContent=score;wordEl.textContent=answer;input.value='';choose();});choose();</script></body></html>
