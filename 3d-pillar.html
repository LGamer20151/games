<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Pillar Hop</title>
  <style>
    body { margin:0; background:#0a1020; color:#fff; font-family:Arial,sans-serif; text-align:center; }
    a { color:#9ae6b4; }
    canvas { background:linear-gradient(#0a1020,#070b13); border-radius:12px; width:min(92vw,900px); height:auto; display:block; margin:16px auto 0; }
    #hud { margin-top:14px; font-size:20px; }
    button { margin-top:16px; padding:12px 22px; font-size:18px; background:#9ae6b4; border:none; border-radius:10px; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>3D Pillar Hop</h1>
  <div id="hud">Score: 0</div>
  <canvas id="game" width="900" height="520"></canvas>
  <button onclick="resetGame()">Restart</button>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    let player = { x: 0, y: 0, vy: 0 };
    let pillars = [];
    let score = 0;
    let gameOver = false;

    function resetGame() {
      player = { x: 0, y: 0, vy: 0 };
      pillars = [];
      score = 0;
      gameOver = false;
      for (let i = 0; i < 12; i++) {
        pillars.push({ z: 1 + i * 0.8, x: (Math.random() - 0.5) * 3.2, w: 0.9 + Math.random() * 0.7, h: 30 + Math.random() * 30 });
      }
    }

    function update(dt) {
      if (gameOver) return;
      score += dt * 20;
      hud.textContent = 'Score: ' + Math.floor(score);
      player.vy += 0.03;
      player.y += player.vy;
      if (player.y > 1.2) {
        player.y = 1.2;
        player.vy = 0;
      }
      for (const p of pillars) p.z -= dt * 0.9;
      pillars = pillars.filter(p => p.z > -0.3);
      while (pillars.length < 12) {
        pillars.push({ z: 1.8 + Math.random() * 1.5, x: (Math.random() - 0.5) * 3, w: 0.8 + Math.random() * 0.8, h: 30 + Math.random() * 30 });
      }
      for (const p of pillars) {
        if (Math.abs(p.z) < 0.22 && Math.abs(player.x - p.x) < p.w * 0.9 && player.y < 0.6) {
          gameOver = true;
        }
      }
    }

    function project(x, z) {
      const scale = 240 / (z + 6);
      return { x: canvas.width / 2 + x * scale, y: 320, size: scale };
    }

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#050c12';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      for (const p of pillars) {
        const proj = project(p.x, p.z);
        ctx.fillStyle = '#68d391';
        ctx.fillRect(proj.x - p.w * proj.size * 30, proj.y - 80, p.w * proj.size * 60, 80);
      }
      const playerP = project(player.x, 0.6);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(playerP.x - 18, 340 + player.y * 120 - 18, 36, 36);
      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 34px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Pillar Miss!', canvas.width/2, canvas.height/2);
      }
    }

    function loop(ts) {
      if (!loop.last) loop.last = ts;
      const dt = Math.min((ts - loop.last) / 1000, 0.03);
      loop.last = ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') player.x -= 0.35;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') player.x += 0.35;
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
        if (player.y <= 0.4) player.vy = -0.9;
      }
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
