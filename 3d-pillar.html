<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Pillar</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#101827,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(148,163,184,.2)}.pillar{position:absolute;bottom:14px;width:26px;height:70px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);left:50%;transform:translateX(-50%)}.player{position:absolute;bottom:36px;width:18px;height:18px;border-radius:50%;background:#fbbf24;left:50%;transform:translateX(-50%)}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>3D Pillar</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Target: <strong id="target">0</strong></span></div><div class="arena" id="arena"><div class="pillar"></div><div class="player" id="player"></div></div><button class="button" id="startBtn">Start</button></div><script>const arena=document.getElementById('arena');const scoreEl=document.getElementById('score');const targetEl=document.getElementById('target');let score=0,target=1,x=50,active=false;function movePlayer(){const p=document.getElementById('player');p.style.left=x+'%';const pillar=document.querySelector('.pillar');const pRect=p.getBoundingClientRect();const rRect=pillar.getBoundingClientRect();if(Math.abs(pRect.left-rRect.left)<30&&Math.abs(pRect.top-rRect.top)<35){score++;scoreEl.textContent=score;target++;targetEl.textContent=target;x=Math.random()*80+10;movePlayer();}}document.addEventListener('keydown',e=>{if(!active)return;if(e.key==='ArrowLeft')x=Math.max(10,x-6);if(e.key==='ArrowRight')x=Math.min(90,x+6);movePlayer();});function start(){score=0;target=1;scoreEl.textContent=score;targetEl.textContent=target;active=true;x=50;document.getElementById('player').style.left='50%';document.getElementById('startBtn').textContent='Running'}document.getElementById('startBtn').addEventListener('click',start);</script></body></html>
