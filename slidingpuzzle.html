<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sliding Puzzle</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.stats{display:flex;justify-content:space-between;margin:12px 0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{padding:20px 10px;border:none;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#fff;font-size:22px;font-weight:bold;cursor:pointer}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Sliding Puzzle</h2><a href="index.html">← Home</a></div><div class="stats"><span>Score: <strong id="score">0</strong></span><span>Moves: <strong id="moves">0</strong></span></div><div class="board" id="board"></div><button class="button" id="startBtn">Start</button></div><script>const board=document.getElementById('board');const scoreEl=document.getElementById('score');const moveEl=document.getElementById('moves');let tiles=[1,2,3,4,5,6,7,8,0],moves=0,score=0;function render(){board.innerHTML='';tiles.forEach(v=>{const tile=document.createElement('button');tile.className='tile';tile.textContent=v===0?'':v;tile.disabled=v===0;tile.onclick=()=>{const index=tiles.indexOf(v);const empty=tiles.indexOf(0);const row=~~(index/3),erow=~~(empty/3),col=index%3,ecol=empty%3;if(Math.abs(row-erow)+Math.abs(col-ecol)!==1)return;[tiles[index],tiles[empty]]=[tiles[empty],tiles[index]];moves++;moveEl.textContent=moves;if(tiles.every((n,i)=>n===([1,2,3,4,5,6,7,8,0])[i])){score+=10;scoreEl.textContent=score;}};board.appendChild(tile)})}document.getElementById('startBtn').addEventListener('click',()=>{tiles=[1,2,3,4,5,6,7,8,0];moves=0;moveEl.textContent=moves;render();});render();</script></body></html>
