<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe vs AI</title>
  <style>
    :root {
      --bg: #04111d;
      --bg2: #0d1f2d;
      --panel: rgba(11, 20, 32, 0.9);
      --line: rgba(126, 233, 255, 0.4);
      --cyan: #7ee9ff;
      --blue: #7aa7ff;
      --green: #9ef7c8;
      --red: #ff6b8a;
      --text: #ebf7ff;
      --muted: rgba(235, 247, 255, 0.72);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, rgba(122, 167, 255, 0.18), transparent 34%), linear-gradient(180deg, #040b15 0%, #07131f 100%);
      color: var(--text);
    }

    .game-shell {
      width: min(420px, calc(100vw - 30px));
      background: rgba(12, 18, 30, 0.9);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 0 28px rgba(122, 167, 255, 0.18);
      padding: 20px 18px 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .restart {
      border: 1px solid var(--line);
      background: rgba(126, 233, 255, 0.08);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .status {
      text-align: center;
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-bottom: 16px;
      min-height: 24px;
      color: var(--muted);
      text-transform: uppercase;
      font-size: 12px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px;
      border-radius: 18px;
      border: 1px solid rgba(126, 233, 255, 0.18);
    }

    .cell {
      display: grid;
      place-items: center;
      font-size: clamp(2.1rem, 8vw, 3.5rem);
      font-weight: 800;
      background: rgba(19, 29, 43, 0.8);
      border: 1px solid rgba(126, 233, 255, 0.15);
      border-radius: 14px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .cell:hover:not(.filled):not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(126, 233, 255, 0.6);
      background: rgba(21, 36, 52, 0.95);
    }

    .cell.filled {
      cursor: default;
    }

    .cell.x { color: var(--cyan); }
    .cell.o { color: var(--red); }

    .cell:disabled {
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <div class="brand">Tic Tac Toe</div>
      <button class="restart" id="restartBtn" type="button">Restart</button>
    </div>
    <div id="status" class="status">Your turn</div>
    <div id="board" class="board" aria-label="Tic Tac Toe board"></div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');

    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;

    function createBoard() {
      boardEl.innerHTML = '';
      board.forEach((cell, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cell';
        btn.dataset.index = index;
        btn.setAttribute('aria-label', `Cell ${index + 1}`);
        btn.disabled = !!cell || gameOver || currentPlayer !== 'X';

        if (cell) {
          btn.textContent = cell;
          btn.classList.add(cell.toLowerCase());
          btn.classList.add('filled');
        }

        btn.addEventListener('click', () => handleHumanMove(index));
        boardEl.appendChild(btn);
      });
    }

    function getWinner(grid) {
      for (const [a, b, c] of winningLines) {
        if (grid[a] && grid[a] === grid[b] && grid[a] === grid[c]) {
          return grid[a];
        }
      }
      return null;
    }

    function isDraw(grid) {
      return grid.every(Boolean) && !getWinner(grid);
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function endGame(winner) {
      gameOver = true;
      if (winner === 'X') {
        setStatus('You win!');
      } else if (winner === 'O') {
        setStatus('AI wins!');
      } else {
        setStatus('Draw!');
      }
      createBoard();
    }

    function checkBoardState() {
      const winner = getWinner(board);
      if (winner) {
        endGame(winner);
        return true;
      }
      if (isDraw(board)) {
        endGame(null);
        return true;
      }
      return false;
    }

    function handleHumanMove(index) {
      if (board[index] || gameOver || currentPlayer !== 'X') return;

      board[index] = 'X';
      currentPlayer = 'O';
      createBoard();

      if (checkBoardState()) return;

      setStatus('AI is thinking...');
      setTimeout(makeAiMove, 280);
    }

    function minimax(grid, player) {
      const winner = getWinner(grid);
      if (winner === 'O') return 10;
      if (winner === 'X') return -10;
      if (isDraw(grid)) return 0;

      if (player === 'O') {
        let bestScore = -Infinity;
        for (let i = 0; i < grid.length; i++) {
          if (!grid[i]) {
            grid[i] = 'O';
            const score = minimax(grid, 'X');
            grid[i] = '';
            bestScore = Math.max(bestScore, score);
          }
        }
        return bestScore;
      }

      let bestScore = Infinity;
      for (let i = 0; i < grid.length; i++) {
        if (!grid[i]) {
          grid[i] = 'X';
          const score = minimax(grid, 'O');
          grid[i] = '';
          bestScore = Math.min(bestScore, score);
        }
      }
      return bestScore;
    }

    function chooseBestMove() {
      let bestScore = -Infinity;
      let move = null;

      for (let i = 0; i < board.length; i++) {
        if (!board[i]) {
          board[i] = 'O';
          const score = minimax(board, 'X');
          board[i] = '';
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }

      return move;
    }

    function makeAiMove() {
      if (gameOver) return;

      const move = chooseBestMove();
      if (move === null) {
        endGame(null);
        return;
      }

      board[move] = 'O';
      currentPlayer = 'X';
      createBoard();

      if (checkBoardState()) return;
      setStatus('Your turn');
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameOver = false;
      setStatus('Your turn');
      createBoard();
    }

    restartBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
