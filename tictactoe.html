<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe vs Computer</title>
  <style>
    body { background:#1e1e2e; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:20px; }
    a { color:#89b4fa; display:inline-block; margin-top:14px; }
    h1 { margin-bottom:8px; }
    #status { font-size:22px; min-height:32px; margin:12px 0; color:#f9e2af; }
    #board { display:grid; grid-template-columns:repeat(3, 110px); gap:10px; justify-content:center; margin:0 auto; }
    .cell {
      width:110px; height:110px; border:none; border-radius:10px; background:#313244;
      color:#fff; font-size:56px; font-weight:bold; cursor:pointer;
    }
    .cell:hover:not(:disabled) { background:#45475a; }
    .cell:disabled { cursor:default; }
    .cell.x { color:#89b4fa; }
    .cell.o { color:#f38ba8; }
    #scores { margin-top:18px; font-size:18px; color:#a6adc8; }
    #restart {
      margin-top:18px; padding:12px 26px; font-size:18px; border:none; border-radius:8px;
      background:#89b4fa; color:#11111b; cursor:pointer; font-weight:bold;
    }
    #restart:hover { background:#b4befe; }
  </style>
</head>
<body>
  <a href="index.html">&larr; Back to menu</a>
  <h1>Tic-Tac-Toe vs Computer</h1>
  <div id="status">Your turn. You are X.</div>
  <div id="board"></div>
  <div id="scores">You: 0 &nbsp;|&nbsp; Computer: 0 &nbsp;|&nbsp; Draws: 0</div>
  <button id="restart">New Game</button>

<script>
const LINES = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8],
  [0, 3, 6], [1, 4, 7], [2, 5, 8],
  [0, 4, 8], [2, 4, 6]
];

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const scoresEl = document.getElementById('scores');

let board = [];
let gameOver = false;
let stats = { you: 0, computer: 0, draws: 0 };

// Returns 'X', 'O', 'draw', or null if the game is still running
function getWinner(b) {
  for (const [a, c, d] of LINES) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
  }
  return b.every(Boolean) ? 'draw' : null;
}

// Scores a board from the computer's point of view (O)
function minimax(b, depth, isComputer) {
  const w = getWinner(b);
  if (w === 'O') return 10 - depth;
  if (w === 'X') return depth - 10;
  if (w === 'draw') return 0;

  let best = isComputer ? -Infinity : Infinity;
  for (let i = 0; i < 9; i++) {
    if (!b[i]) {
      b[i] = isComputer ? 'O' : 'X';
      const score = minimax(b, depth + 1, !isComputer);
      b[i] = '';
      best = isComputer ? Math.max(best, score) : Math.min(best, score);
    }
  }
  return best;
}

function computerMove() {
  let bestScore = -Infinity;
  let bestMove = -1;
  for (let i = 0; i < 9; i++) {
    if (!board[i]) {
      board[i] = 'O';
      const score = minimax(board, 0, false);
      board[i] = '';
      if (score > bestScore) {
        bestScore = score;
        bestMove = i;
      }
    }
  }
  if (bestMove !== -1) board[bestMove] = 'O';
}

function render() {
  const cells = boardEl.querySelectorAll('.cell');
  cells.forEach((cell, i) => {
    cell.textContent = board[i];
    cell.className = 'cell' + (board[i] ? ' ' + board[i].toLowerCase() : '');
    cell.disabled = gameOver || board[i] !== '';
  });
  scoresEl.innerHTML =
    'You: ' + stats.you + ' &nbsp;|&nbsp; Computer: ' + stats.computer +
    ' &nbsp;|&nbsp; Draws: ' + stats.draws;
}

function finish(result) {
  gameOver = true;
  if (result === 'X') {
    stats.you++;
    statusEl.textContent = 'You win! Nice play.';
  } else if (result === 'O') {
    stats.computer++;
    statusEl.textContent = 'The computer wins this round.';
  } else {
    stats.draws++;
    statusEl.textContent = 'It is a draw.';
  }
  render();
}

function playerClick(i) {
  if (gameOver || board[i]) return;
  board[i] = 'X';

  let result = getWinner(board);
  if (result) return finish(result);

  statusEl.textContent = 'Computer is thinking...';
  render();

  setTimeout(() => {
    computerMove();
    result = getWinner(board);
    if (result) return finish(result);
    statusEl.textContent = 'Your turn. You are X.';
    render();
  }, 400);
}

function newGame() {
  board = ['', '', '', '', '', '', '', '', ''];
  gameOver = false;
  statusEl.textContent = 'Your turn. You are X.';
  render();
}

// Build the 9 cells once
for (let i = 0; i < 9; i++) {
  const btn = document.createElement('button');
  btn.className = 'cell';
  btn.addEventListener('click', () => playerClick(i));
  boardEl.appendChild(btn);
}

document.getElementById('restart').addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
