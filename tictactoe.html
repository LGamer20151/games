<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tic Tac Toe</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#0b1120,#050816);color:#fff;font-family:Arial,sans-serif}.game{width:min(92vw,560px);background:rgba(15,23,42,.9);padding:18px;border-radius:20px;border:1px solid rgba(148,163,184,.2)}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#dfeaff;text-decoration:none}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.cell{aspect-ratio:1;border:none;border-radius:14px;background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#fff;font-size:32px;font-weight:bold;cursor:pointer}.button{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div class="game"><div class="top"><h2>Tic Tac Toe</h2><a href="index.html">← Home</a></div><div class="board" id="board"></div><button class="button" id="startBtn">Restart</button></div><script>const board=document.getElementById('board');let current='X',cells=Array(9).fill('');function render(){board.innerHTML='';cells.forEach((value,index)=>{const cell=document.createElement('button');cell.className='cell';cell.textContent=value;cell.onclick=()=>{if(cells[index]||winner())return;cells[index]=current;render();if(winner()){return;}current=current==='X'?'O':'X';};board.appendChild(cell)})}function winner(){const combo=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return combo.some(c=>cells[c[0]]&&cells[c[0]]===cells[c[1]]&&cells[c[0]]===cells[c[2]])}document.getElementById('startBtn').addEventListener('click',()=>{cells=Array(9).fill('');current='X';render();});render();</script></body></html>
